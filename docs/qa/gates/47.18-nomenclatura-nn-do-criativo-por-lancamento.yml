top_issues:
  - id: REL-001
    severity: low
    category: reliability
    description: 'O AC2(a) depende de um comportamento do drizzle-kit 0.31.9: a introspecção de ÍNDICE não lê `indnullsnotdistinct` (bin.cjs ~19707). O `package.json` da API declara `^0.31.9`. Se um bump passar a ler a cláusula, o `schema.ts` (sem ela) e o banco (com ela) ficam diferentes, e o `push --force` do CMD derruba e recria o índice SEM `NULLS NOT DISTINCT` a cada boot. O índice perde a proteção do `perpetuo` (NULL) sem avisar. O serviço continua recusando a colisão, então sobra só a corrida.'
    recommendation: 'Em todo bump de drizzle-kit/drizzle-orm, re-rodar a prova (S1: "boot seguinte, banco migrado → 0 statements"). Uma linha no comentário do `schema.ts` que aponte para essa verificação já basta. Opcional: fixar a versão exata.'
    status: open

  - id: TEST-001
    severity: low
    category: tests
    description: 'Duas garantias da migration só se sustentam fora da suíte. (a) A prova do drizzle-kit está em `scratchpad/dk-proof/prova.mjs`, fora do repo. (b) A ordem "cria o novo antes de dropar o antigo" não tem guarda: na mutação M5 movi o `DROP INDEX IF EXISTS uq_naming_ads_expert_seq` para antes do `CREATE`, e a prova passou inteira ("TODAS AS EXIGÊNCIAS OK"). Esperado, porque a ordem só importa na janela entre os dois statements. Hoje o arquivo está correto e a garantia é a leitura dele.'
    recommendation: 'Nada a fazer nesta story. Se o padrão "índice com NULLS NOT DISTINCT + push" se repetir, versionar a prova como script de `packages/api/src/scripts/` (PGlite em memória, sem produção).'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: 'A 0159 é a primeira migration do repo com bloco `DO $$ … $$`, que tem `;` internos. O cabeçalho diz QUANDO aplicar, mas não COMO. Há scripts `apply-*-migration.ts` no repo que dividem o arquivo por `;` (ex.: `apply-funnel-mobile-migration.ts:19`). Por esse caminho o bloco quebra em pedaços e dá erro de sintaxe. A falha seria visível, não silenciosa.'
    recommendation: 'Aplicar o arquivo inteiro em uma só chamada: `psql -f` ou `pool.query(conteúdoDoArquivo)`, sem dividir por `;`. Vale anotar no cabeçalho ou no passo do @devops.'
    status: open

  - id: REQ-001
    severity: low
    category: requirements
    description: 'Borda do AC3b. `aoEscolherNoAnuncio` compara o nº do lançamento como TEXTO, e a chave da query usa `String(nnDe(...))`. Trocar "04" por "4" (apagar o zero) limpa o NN, mas a chave não muda, e com ela não mudam `proximo.data` nem o `useEffect`. O campo fica vazio, e a linha abaixo dele mostra "Próximo livre … : 0N". Como a prévia exige o NN, Salvar fica desabilitado até a pessoa digitar. É raro e não grava nada errado. Encontrei lendo o código; não reproduzi na tela.'
    recommendation: 'Opcional: comparar pelo valor (`nnDe`) antes de limpar, ou limpar só quando o escopo calculado (`escopoDoNnDoEstado`) mudar.'
    status: open

