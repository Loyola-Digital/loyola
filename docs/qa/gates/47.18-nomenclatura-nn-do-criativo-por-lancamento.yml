  code_review: 'Li o diff inteiro (21 arquivos). Um só predicado (`predicadoDoEscopoDoNn`) serve `seqsDoEscopo` e `porSeq`; `perpetuo` usa `IS NULL`. Um só decisor do escopo (`escopoDoNnDoCriativo`, no shared) roda na rota, no `montarAnuncio` e no gerador. O `!` em `montarAnuncio:157` é seguro, porque tipo, sigla e nº já foram validados acima. Rota: `launchSeq` com `z.coerce…min(1).max(99)`; o web só o envia quando é válido e a sigla não é `perpetuo`. Removidos sem resto: `seqsDoExpert`, `siglaParaSugestao` e `uq_naming_ads_expert_seq` (git grep: só comentários de teste invertido e a própria migration). Migration: o bloco `DO` confere `indisunique`, `indnullsnotdistinct`, `indpred`/`indexprs` nulos, a tabela e as 5 colunas NA ORDEM (via `indkey WITH ORDINALITY`); `NULL` = não existe, `false` = recria. Depois `CREATE … IF NOT EXISTS … NULLS NOT DISTINCT` e só então o `DROP` do antigo. Cabeçalho com a ordem segura (merge → deploy da API → contract 28 → 0159 → prova no `pg_indexes`), o re-rodar em caso de restart da API antiga, a prova e o rollback.'
