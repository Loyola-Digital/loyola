  autonomous_decisions: '(1) `siglaParaSugestao` removida: CORRETA. Sem chamador depois de o `perpetuo` ir à rota. A sugestão do nº com `perpetuo` segue suspensa na rota (`!siglaSemNumero`) e em `comSugestaoDoLancamento:366`. O teste foi invertido (fio: `not.toMatch(/siglaParaSugestao/)`). (2) Prova do script filtra (dg, adv, perpetuo) SEM `launch_seq`: CORRETA. Um `perpetuo` com nº aparece como divergência em vez de sumir, e o `porSeq` usa o escopo completo do índice. (3) 409 da edição com `sugestao: null` e `campo: creativeSeq`: é o AC5 literal. No web, `!editando &&` antes de aplicar a sugestão. (4) API antiga, sem `escopo`: não rotula E não preenche. Mais conservadora que o AC7, que pedia só "não rotula". O número da API antiga é por expert e preenchê-lo repetiria o sintoma do pedido, então está CORRETA. (5) `carr` por tipo: é o default do PO-09; continua [FALTA — Danilo] não bloqueante. (6) Contrato 28: é o próximo livre (main = 27), com a linha de histórico.'
