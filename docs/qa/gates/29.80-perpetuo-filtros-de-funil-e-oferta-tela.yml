checks:
  code_review: 'Diff lido inteiro. A decisão fica toda em `lib/utils/filtro-funil-oferta.ts`, que é pura: o vazio tem tipo próprio (`{tipo:"vazio"}`) e `idsDaMidia` devolve null, nunca []. `hasCampaigns` vem da lista original; `metaProjectId` e os 6 hooks Meta usam `temMidia`; camadas de vídeo e Top criativos não montam no vazio. Os cards mostram gasto 0 medido, não "carregando". O recorte só vai às 4 leituras de vendas com a rota respondendo (AC7), e o eco `filtro` é conferido (`vendasRespeitaramORecorte`). A queryKey ganha o recorte, e a invalidação por prefixo (use-perpetual-spreadsheet.ts:46) continua valendo. O AC6 segue o padrão da 47.14 (ref por valor aplicado).'
  unit_tests: 'Rodado pelo QA: as 2 suítes da story dão 38/38 e o vitest do web inteiro 109 arquivos, 1.484/1.484. As 97 da 29.79 continuam verdes com os tipos do shared alterados. Mutações do QA: 1/5 caiu (R2); R1, R3, R4 e R5 sobreviveram (TEST-001/TEST-002). As 19 do @dev não foram refeitas.'
  acceptance_criteria: 'AC1 ✓ (dois selects ao lado de "Classificar produtos"; opções com "(inativo)"; combinação E; só com `funnel.type === "perpetual"`). AC2 ✓ no código (lado Meta estreitado, hasCampaigns original, nunca []), mas o fio de 2 consumidores está desprotegido (TEST-001). AC3 ✓ (selo na Ascensão e na seção Vendas; comparativo oculto com aviso no card; dg-a1 sem recorte e com selo, com a ressalva REQ-001). AC4 ✓ (aviso expansível com unidades, motivos, gasto das campanhas sem a dimensão e a regra "tudo separado"). AC5 ✓ (sem expert, sem funis/ofertas, naoCadastrados, Legadas só com `ehCandidataALegada`; guest sem href). AC6 ✓. AC7 ✓ (404 desabilita com a frase, e o recorte só vai com a rota). AC8 ✓. AC9 ✓ (eslint 0 nos 9 arquivos tocados, rodado pelo QA; o next build e o tsc web do @dev não foram refeitos — o briefing dispensou e nada no diff pede).'
  no_regressions: 'Sem filtro, a URL das 4 leituras não muda (`sufixoDoRecorte` devolve ""), a lista de mídia é a original e nenhum selo aparece. A queryKey passa a terminar em null,null, e a invalidação por prefixo continua pegando. O vitest do web está verde.'
  performance: 'A rota funil-oferta é consultada uma vez por janela (staleTime de 2 min, 404 sem retry). Com filtro, as 4 leituras de vendas são refeitas uma vez. O placeholderData evita pedir as vendas duas vezes ao trocar o período.'
  security: 'Guest não recebe link (o Dicionário é rota global e o middleware o devolveria a /projects); o papel vem de useUserRole, e `papel === null` também fica sem link. Sem PII nova na tela.'
  documentation: 'A story traz File List, as decisões autônomas, 19 mutações com as de fio marcadas e a limitação declarada (os testes de fio leem o fonte). Os comentários no painel explicam as duas listas.'
  api_contract: 'O web consome a rota e os campos da 29.79, cujo bump 19 → 20 está no commit 8938318f (um para o par). O front não exige API nova: com 404, os filtros ficam desabilitados e a tela segue como hoje (AC7). A renumeração no merge é do @devops (PO-13).'

notes:
  - 'Decisão 5 — dg-a1 (planilha sem utm_campaign): vendas sem recorte e com selo. APROVADA: é o AC3 literal ("todo o lado de vendas… não filtrado"). A alternativa daria 0 venda, com tudo em "planilha sem UTM", que é número filtrado pela metade. Consequência declarada pelo selo: com filtro, CAC/ROAS do dg-a1 misturam gasto filtrado com vendas sem filtro (hoje o gasto do funil é R$ 0).'
  - 'Decisão 6 — o comparativo some do card de Investimento e o card explica por quê: APROVADA. O comparativo é um número dentro do card, não um bloco; mostrar a variação compararia um recorte com o todo, contra o AC3 ("nunca um número filtrado pela metade calado").'
  - 'Decisão 7 — placeholderData da rota funil-oferta, só do MESMO projeto/funil: APROVADA. A classificação não depende da janela, só o gasto depende. Sem isso o filtro se desligaria durante a troca de período e as vendas seriam pedidas sem e com o recorte. Residual: por um instante, o aviso mostra o gasto das campanhas sem dimensão na janela anterior.'
  - 'Demais decisões do @dev: filtros desabilitados (não ocultos) com a API antiga, previsto no AC7; sem expert, filtros desabilitados (AC5); link de Legadas também para campanha sem funil (a fila classifica os dois); no aviso, só o gasto de campanha que poderia ser do filtro (mesma regra da decisão 3 da 29.79). Todas coerentes.'
  - 'Top criativos: a receita por criativo vem de `useCreativeRevenue`, por anúncio. Como cada anúncio pertence a uma campanha, com a lista estreitada o bloco fica consistente com o filtro, sem precisar do parâmetro da 29.79.'
  - 'CodeRabbit não executado: a skill roda em WSL e este host é macOS.'
  - 'Re-gate, decisão 8 — funil SEM planilha manda o recorte e não mostra selo: APROVADA. AC2 manda o lado de vendas pelo parâmetro da 29.79, e o AC3 põe selo só no que não filtra (dg-a1, planilha sem UTM). Sem planilha, as vendas da tela são do pixel, que já vem das campanhas estreitadas. A API ecoa `filtro` também nesse caminho (`extrasDoRecorte(filtro, null)` em perpetual-sales.ts:272/313/317/338/861), então `vendasRespeitaramORecorte` não acusa falso alarme; o `foraDoFiltro` vem [] e o aviso lida com isso. O AC7 continua valendo: o recorte só vai com a rota da 29.79 respondendo, e essa guarda vem antes.'
  - 'Re-gate, decisão 9 — planilha carregando: filtros desabilitados com "carregando a planilha de vendas…", sem recorte e com a mídia intacta: APROVADA. É o AC3 ("nunca um número filtrado pela metade calado") e o mesmo padrão da frase do AC7. O `usePerpetualSpreadsheet` tem `enabled: !!projectId && !!funnelId`, e o painel recebe `projectId: string` e `funnel`, então o estado "carregando" não fica preso. Durante os retries do react-query o estado segue "carregando"; só vira "erro" depois deles. Um refetch que falha com dado anterior mantém o dado (testado). O pedido começa em SEM_FILTRO e não vem da URL, então não há select mostrando um filtro que não está aplicado.'

