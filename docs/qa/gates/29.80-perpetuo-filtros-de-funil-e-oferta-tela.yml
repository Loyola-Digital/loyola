top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: 'Dois consumidores Meta do painel podem voltar à lista NÃO estreitada sem que nenhum teste caia. (a) `<TopCreativesGallery campaignIds={campaignIdsDaEtapa}>`: o teste de fio só confere a guarda `temMidia && campaignIds &&`, não a prop. (b) `const campaignIdSet = new Set(campaignIdsDaEtapa)`: com filtro, `funnelCampaigns` (Quente/Frio e o overlay da planilha por campanha) mostraria todas as campanhas da etapa. Nos dois casos, 38/38 seguem verdes. É exatamente o defeito "bloco sem o campaignIds estreitado" do AC2.'
    suggested_action: 'No filtro-funil-oferta-fio.test.ts, asserir `campaignIds={campaignIds}` dentro do trecho de `<TopCreativesGallery` e `const campaignIdSet = new Set(campaignIds ?? [])`. Melhor ainda: asserir que `campaignIdsDaEtapa` só aparece nas duas linhas permitidas (plano e hasCampaigns).'
  - id: 'TEST-002'
    severity: medium
    finding: 'Nenhum teste lê `components/funnels/perpetual-filtro-funil-oferta.tsx`. Duas remoções passaram com 38/38 verdes: o parágrafo `{aviso.regra}` (a regra "tudo separado", exigida pelo AC4 e pela decisão (ii)) e o selo `<SeloNaoFiltrado ativo={plano.vendasNaoFiltraveis}>` (AC3, dg-a1). A função pura `montarAvisoDoFiltro` está protegida (R2 caiu), mas o desenho que a mostra não está.'
    suggested_action: 'Estender o teste de fio ao componente (mesmo padrão de readFileSync): `{aviso.regra}`, `{aviso.unidades}`, `ativo={plano.vendasNaoFiltraveis}`, e `s.href ? <Link` com o ramo sem link.'
  - id: 'REQ-001'
    severity: low
    finding: '`planilhaTemUtmCampaign: !!perpetualSpreadsheet?.columnMapping?.utm_campaign` também é falso quando o funil NÃO tem planilha, ou enquanto ela carrega. Aí o painel, com filtro, mostra o selo "a planilha de vendas não tem a coluna utm_campaign — as vendas não têm como ser filtradas", mas as vendas da tela vêm do pixel, que É filtrado pelas campanhas. Durante o carregamento, sales-data também sai uma vez sem o recorte e é pedida de novo quando a planilha chega.'
    suggested_action: 'Distinguir "sem planilha" (sem selo) de "planilha sem utm_campaign" (selo) em `planoDoFiltro`, e só ligar o recorte depois que `usePerpetualSpreadsheet` resolver.'
  - id: 'DOC-001'
    severity: low
    finding: 'A validação visual (DoD) está pendente: depende do deploy da 29.79 e do cadastro 6.6 (os 4 experts sem projeto). Até lá, todo perpétuo mostra os filtros desabilitados com "Vincular o expert".'
    suggested_action: 'Depois do deploy e do vínculo dos experts, o Danilo confere no hambúrguer (a01+of01), no churrasco (of01 = gasto 0, com link para Legadas) e no FZ (a01 inclui [FZA1]).'

