status_reason: 'Re-gate (2026-09-24, a5f891c3): TEST-001, TEST-002 e REQ-001 fechados. As 4 mutações que sobreviviam (R1, R3, R4, R5), refeitas pelo QA, caem agora, e 5 mutações novas do QA também caem (R3b, R6, R7, R8, R10). O estado da planilha em 5 valores e as 2 decisões novas do @dev estão coerentes com AC2, AC3 e AC7. Ficam dois itens de severidade baixa: o estado desabilitado dos selects não tem teste (TEST-003, R9 e R11 sobrevivem; a regra pura já impede o filtro de ligar) e a validação visual (DOC-001). Gate original: o código atende AC1–AC9 e as guardas do vazio (R1) e da API antiga (R2) estão no lugar certo. Há três ressalvas. Quatro das cinco mutações do QA sobreviveram no fio: dois consumidores Meta podem voltar à lista da etapa, e o componente do aviso não tem teste nenhum. O selo "planilha sem UTM" aparece também quando não há planilha. E a validação visual continua pendente.'
