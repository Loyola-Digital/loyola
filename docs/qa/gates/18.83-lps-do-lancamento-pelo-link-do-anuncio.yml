top_issues:
  - id: 'DEPLOY-001'
    severity: medium
    finding: 'Migration `0158_stage_lp_campaign_urls.sql` não aplicada. `schema.ts` declara `lpCampaignUrls` e os `select()` de `funnel_stages` passam a pedir a coluna: sem ela em produção, toda leitura de etapa dá 500. Nada no repositório executa o arquivo .sql (o `_journal.json` do drizzle para no 0007). O boot roda `drizzle-kit push --force` (Dockerfile CMD e `server.ts`), que PODE criar a coluna a partir do `schema.ts` — mas isso já falhou em 10/09 e 16/09 e não é garantia.'
    suggested_action: '@devops: aplicar a 0158 em produção ANTES do merge e provar no `information_schema` (a consulta está no cabeçalho do arquivo). Confirmação verbal não vale.'
  - id: 'REL-001'
    severity: low
    finding: 'Janela entre deploys, web antigo × API nova: o `lp-funnel` passa a devolver chaves por URL, e o card do mini-funil do web antigo (que casa por `lpName.toUpperCase()`) não acha o funil da linha até o web subir. Declarado no Dev Agent Record (D9).'
    suggested_action: 'Declarar na PR; subir web e API no mesmo ciclo.'
  - id: 'SEC-001'
    severity: low
    finding: 'O `href` da linha de URL é o `creative.linkUrl` CRU do cache. `normalizeLpUrl` aceita URL sem esquema (tenta `https://` na frente) e recusa `javascript:`, então não há XSS; mas um `linkUrl` gravado sem esquema viraria link RELATIVO ao painel. A correção manual já trata o caso (`linkDoAnuncio`); o caminho do cache não.'
    suggested_action: 'Opcional: montar o `href` com `https://` quando o `linkUrl` não tiver esquema, como `linkDoAnuncio` já faz para a correção.'

