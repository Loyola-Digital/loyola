checks:
  code_review: 'Cadeia ad_id → URL no back (`services/lp-do-anuncio.ts`: leitura do cache SEMPRE com `project_id`, 3 causas de cache na precedência da 29.43) e agrupamento por URL no front (`lib/utils/lps-do-lancamento.ts`), com um mapa só (`linkDoAnuncio`) para gasto, lead e venda. `montarLpPorAnuncio` separa a 5ª causa (campanha sem dado por anúncio entra inteira; com anúncios, só o GASTO que nenhum anúncio explica — D3, justificado). `linkComCorrecao`/`linkDoAnuncio` só corrigem o que está sem chave. A auto-cura usa `avaliarCura` + `curarCacheDeLpEmSegundoPlano` como o `/ad-link-urls` (teto 100, cooldown 10 min, não aguardada). Fallback para a API antiga preservado (`lpBreakdown` continua; sem `lpPorAnuncio` a tabela é a de antes, com o lápis).'
  unit_tests: 'API: 5 arquivos novos/tocados das três stories 78/78; web: 6 arquivos 61/61. Suíte web 113 arquivos / 1 507 testes verde. API 3 186/3 196 — as 10 falhas são as do baseline (funnel-stages-lead-inputs 3 [data fixa: "Data final não pode ser menor que hoje"], projects 3, schema 2, instagram 1, instagram-routes 1), nenhuma nova. Mutações PRÓPRIAS do QA (todas revertidas, `git diff` vazio): M1 correção move anúncio que JÁ tinha URL — web 3 falhas, API 1; M2 grão campanha (a campanha inteira segue a URL do 1º anúncio) — 10 falhas; M3 cache de volta a `:v2` — 2 falhas (1883 e 1885); M4 campanha sem dado por anúncio some do Total — 1; M5 guest ganha a correção na aba Meta Ads Teste — 1.'
  acceptance_criteria: 'AC1 ✓ (URL por anúncio, `normalizeLpUrl`) · AC2 ✓ (link puro, `target=_blank`, `rel=noopener`) · AC3 ✓ (colunas e fórmulas iguais; imposto uma vez sobre a soma crua da linha — `applyMetaAdsTax` linear; cliques por `inline_link_clicks` nos dois níveis; tooltips por URL; Criativos intocada; Total de Leads medido e registrado) · AC4 ✓ (lead pago por `utm_content`; vendas no universo `campaignByAdId`) · AC5 ✓ (5 causas; correção por campanha; guest sem botão e PUT 403) · AC6 ✓ (lápis só no modo rótulo; `lp_links` intacto) · AC7 ✓ · AC8 ✓ · AC9 ✓ (fonte `anuncio` em `FonteLp`/`cobertura`/`atribuidos`; aplicação só por herança) · AC10 ✓ (cache hoje em `:v4` pela 18.85; contrato 20) · AC11 ✓ · AC12 ✓ (eslint 0 novo — só o herdado `sendflow.ts:39`; tsc shared/api/web 0 depois do `next build`; `next build` EXIT 0).'
  no_regressions: '`fetchAllAdInsights` ganhou `inline_link_clicks` só por acréscimo; `lerVendas` ganhou `content` só por acréscimo (`buyers-origin` e jornada não leem). `useCrossReferenceLeads` extraiu o laço para `contagem-de-leads.ts` sem mudar as saídas antigas (`leadsByLp` continua).'
  performance: 'A URL sai da MESMA leitura do cache de criativos que já buscava o `videoId`; nenhuma chamada nova à Meta. A troca da chave do cache esfria a tabela de Criativos no deploy (primeira abertura paga a Meta) — declarado.'
  security: 'Correção validada nas três camadas (zod: chave só dígitos, URL http(s) até 2048; normalização; `$type`). PUT já devolve 403 para guest; a tela não oferece o botão (`papel !== "guest"` nas duas telas, com teste de fio). Leitura do cache sempre por `project_id` (predicado renderizado no teste).'
  documentation: 'Dev Agent Record com 12 decisões, medições de produção (Total de Investimento Δ 0 em 90 d; Leads 69 = 69 em 90 d, com a explicação das entradas e saídas) e o aviso da migration no topo.'
  api_contract: '19 → 20 com linha de histórico (`lpPorAnuncio`, `cobertura.anuncio`, `lpCampaignUrls`). A `main` pode já estar em 20 por outra story do lote — renumerar no merge é do @devops, não defeito desta story.'

