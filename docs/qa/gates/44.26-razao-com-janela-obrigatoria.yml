summary: >
  O núcleo da story está certo e bem provado: a razão com janela obrigatória
  fecha o defeito que publicou "CPL Real R$ 3,17", o @dev encontrou sozinho que
  o `cplReal` da família gratuita tinha o mesmo problema, e a conferência contra
  produção mostrou o PP subestimando o CPL em 10×. Quatro testes existentes
  quebraram por codificarem o comportamento antigo, e foram atualizados com o
  motivo — conduta correta.

  O gate é FAIL por UM achado, e ele não é de opinião: o ramo de denominador
  zero da família gratuita passou a emitir `message`, o que no Panorama o
  transforma em pendência de configuração. É a reintrodução do QA-4414-02 — o
  mesmo defeito que gerou o chamado de 2026-08-14 e que a Story 36.9 AC5
  fechou. O fix é de uma linha, e o padrão correto está no ramo irmão, 37 linhas
  acima no mesmo arquivo.

achados:
  - id: QA-4426-01
    severidade: ALTA
    categoria: correctness
    titulo: "Zero lead na janela virou pendência de configuração — regressão do QA-4414-02"
    evidencia: >
      `cadeia-cac-payload.ts:893` espalha `motivo` E `message` juntos:

        ...(cplDaJanela.motivo ? { motivo: cplDaJanela.motivo, message: cplDaJanela.message } : {})

      Com zero leads nos dias com mídia, `razaoNaJanela` devolve
      `motivo: "semDados"` COM `message` (é o comportamento correto DELA), e o
      `principal` repassa os dois. Verificado por execução:

        QA>>> motivo: semDados | message presente: true | leadsUnicos: 0

      `panorama-do-projeto.ts:379` desempata pela PRESENÇA de `message`:

        if (motivo && mensagem) { saida.push({ codigo: motivo, ... }) }

      Logo a etapa entra na lista de pendências de configuração.
    porque_importa: >
      Mandar conectar uma fonte que JÁ está conectada é exatamente o chamado de
      2026-08-14 que a Story 36.9 AC5 fechou, e que voltou como QA-4414-02 no
      gate da 44.14. O repo já pagou por ele duas vezes.

      O ramo da família PAGA preserva a regra corretamente, 37 linhas acima no
      mesmo arquivo (`:856`):

        ...(v.vendas === 0 ? { motivo: "semDados" as const } : {})

      — motivo sem `message`. A gratuita passou a divergir do irmão.

      ⚠️ **Hoje é latente, não ativo**: nenhuma das 4 etapas de família gratuita
      tem cache de lead, então nenhuma alcança este ramo. Mas basta o sync
      popular uma delas para o defeito ficar ativo, e aí ele chega como chamado,
      não como teste.
    recomendacao: >
      Distinguir os dois `semDados`: o de CONFIGURAÇÃO (sem cache, sem
      cobertura) mantém `message`; o de DENOMINADOR ZERO manda só o `motivo`,
      como a família paga faz. E um teste no `panorama-do-projeto.test.ts`
      espelhando o "fonte conectada com ZERO venda" que já existe para a paga —
      sem ele, a próxima refatoração repete pela terceira vez.

  - id: QA-4426-02
    severidade: MÉDIA
    categoria: docs
    titulo: "O llms.txt documenta o bloco NOVO e esquece que o `principal` da gratuita mudou"
    evidencia: >
      `cplCaptacao` está muito bem documentado (`:139-145`). Mas o `principal`
      da família gratuita também mudou, e a doc segue descrevendo o antigo:

        :122  "família gratuita → `valor = spend ÷ leadsUnicos`"
        :131  "gratuita | ok | `valor`, `spend`, `leadsUnicos`, `fonteDeLead`"
        :101  "o fato fica visível em `principal.leadsUnicos: 0`"

      Três coisas mudaram e não estão lá: `leadsUnicos` passou a ser **os leads
      da janela** (não o total); nasceu `leadsUnicosDaEtapa`; e existe o motivo
      novo `semCoberturaDiaria`.
    porque_importa: >
      É a **segunda vez na mesma leva** que a doc de um lugar é atualizada e a
      do irmão fica para trás — o QA-4425-05 foi exatamente isto na 44.25. O
      Inácio vai ler que `leadsUnicos` é o total da etapa e receber o da janela;
      no BBE seriam 92 onde a doc promete 218.
    recomendacao: "Atualizar as três entradas do `principal` gratuito no llms.txt."

  - id: QA-4426-03
    severidade: BAIXA
    categoria: docs
    titulo: "A tela mostra `leadsUnicos` sem dizer que agora é da janela"
    evidencia: "`cadeia-cac-stage-tab.tsx:247` — `${p?.leadsUnicos ?? 0} leads`."
    porque_importa: >
      O número mudou de significado sob um rótulo que não mudou. **Sem efeito
      hoje**: as 4 etapas gratuitas não têm cache (o campo sai `0`) e as
      promovidas são família paga (mostram vendas). Fica registrado para quando
      alguma ganhar cache.
    recomendacao: "Aceitar nesta story; tratar junto da tela na 44.28."

