    finding: >-
      `eslint src/` da API sai com 2 errors em `routes/lead-scoring.ts` (`validBandIds` :644,
      `q4Idx` :653, no-unused-vars). Os erros estão em origin/main 56db2af5, vindos de 5058c502
      (#979, Lucas Vital), e o arquivo é idêntico na branch. A main está vermelha no lint, e isso
      bloqueia qualquer PR cujo CI exija lint.
    suggested_owner: 'autor do #979 / @dev numa PR própria'
    action: 'Corrigir na main (remover as 2 variáveis ou usá-las) numa PR separada; depois, atualizar esta branch. Não corrigir dentro da 41.12 (fora do escopo).'
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: >-
      Duas mutações sobrevivem. QR3c: `debriefing-audience-loader` gravando `camada2Vale: true`
      colapsaria recompras de Vendas no motor de público, e nenhum teste do loader de público
      confere o campo. QR8: a contagem "etapa sem planilha tem manual?" (`stage-sales-data.ts:429`)
      contando uma reembolsada muda só `semDados` → resposta zerada.
    suggested_owner: dev
    action: 'Opcional, pode ir em story futura: teste no audience-loader com uma planilha fora do escopo; teste da etapa sem planilha com apenas manual reembolsada.'
  - id: 'UX-002'
    severity: low
    category: ux
    finding: >-
      Nas etapas de Vendas e na `event_capture`, a API devolve `naoAplicadaMotivo: "a regra não
      vale neste tipo de etapa"`. O web (`sales-meta-kpis.tsx:172`, `launch-dashboard.tsx:400`)
      mostra então "Recompra do mesmo produto não deduplicada: a regra não vale neste tipo de etapa".
      O texto é verdadeiro, mas é uma decisão (R7-4/R7-5), não uma lacuna, e pode soar como alerta.
    suggested_owner: dono / @ux
    action: 'Conferir na validação visual do AC8; se incomodar, suprimir a linha quando o motivo é o escopo (ajuste só do helper web).'
  - id: 'AC11'
