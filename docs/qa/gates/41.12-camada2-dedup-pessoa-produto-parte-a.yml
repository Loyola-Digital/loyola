top_issues:
  - id: 'TEST-001'
    severity: medium
    category: tests
    finding: >-
      Quatro decisões corretas do código não têm teste que as segure. Cada mutação abaixo passou
      verde em 169 testes: (a) linha de valor zero ocupando a vaga (o [AUTO-DECISION] "valor zero
      é isenta"); (b) réplica aplicando a camada 2 de lançamento à planilha `perpetual_sales`, que
      contradiz a R6-2 — o fixture devolve `funnel_spreadsheets` vazio; (c) Resumão decidindo por
      planilha em vez de entre planilhas (AC2(a)); (d) o card recortando por `days` as manuais que
      entram na decisão. O fixture tem uma planilha só, então "entre planilhas" não é provado em
      ponta nenhuma, exceto no par manual × planilha.
    suggested_owner: dev
    action: >-
      Acrescentar 4 testes em camada2-paridade: (a) zero-valor primeiro + recompra paga conta 1;
      (b) etapa paid com `perpetual_sales` herdada, recompra na planilha do perpétuo não sai da
      réplica; (c) duas planilhas na etapa, recompra na 2ª sai no Resumão, no card e no diário;
      (d) manual antes do `days` + manual dentro, mesmo e-mail e produto, a de dentro não conta.
      Provar cada um com QA-M4/M5/M6/M9. Pode correr em paralelo à espera do dono.
  - id: 'OWN-001'
    severity: high
    category: owner_decision
    finding: 'FZ-M2 · Vendas perde 5,55 % do faturamento (5 recompras do mesmo produto, R$ 4.591,00); acima do limiar R6-4.'
    suggested_owner: dono
    action: 'Dono responde se a regra vale nessa etapa. BLOQUEIA O MERGE (R6-4). QA não decide.'
  - id: 'OWN-002'
    severity: medium
    category: owner_decision
    finding: 'BBE-PR2 (event_capture, evento presencial): a regra tira 1 linha / R$ 1.347,00 (2,88 %). A segunda compra do mesmo ingresso pela mesma pessoa pode ser ingresso para outra pessoa.'
    suggested_owner: dono
    action: 'Dono decide se a camada 2 vale em captação de evento presencial. QA não decide.'
  - id: 'OWN-003'
    severity: medium
    category: owner_decision
    finding: 'Etapas de Vendas: recompra do principal pela mesma pessoa pode ser 2ª matrícula/renovação — FZ-L2 −R$ 4.197,00 (3,62 %), FZ-M1 −R$ 1.197,00 (2,28 %), PG02 Downsell Vendas −R$ 399,50 (0,72 %), FZ-M2 (OWN-001).'
    suggested_owner: dono
    action: 'Dono decide se a regra vale nas etapas de Vendas. QA não decide.'
  - id: 'PO-001'
    severity: medium
    category: requirements
    finding: >-
      AC1(d): a cópia de `n8n-kiwify-downsell` ligada à Downsell Captação do PG02 não tem ID nem
      produto mapeados. A camada 2 do Debriefing (49.3) colapsa por e-mail qualquer produto dela:
      6 linhas / R$ 1.358,50 / 4 pessoas, segundo a medição do @dev. A saída da 49.3 ficou
      idêntica nesta story (confirmado por SHA).
    suggested_owner: po
    action: '@po decide se a guarda de productName também entra no Debriefing (o número do Debriefing do PG02 mudaria).'
  - id: 'PO-002'
    severity: medium
    category: requirements
    finding: 'AC7: cinco leituras candidatas a "entra" não foram implementadas — creative-sales-metrics, stage-creative-performance, cross-launch-sync, all-sales (manual-sales.ts), public-sales-rows. Sem elas, criativo/LP/lançamento e as listas linha a linha seguem somando a recompra.'
    suggested_owner: po
