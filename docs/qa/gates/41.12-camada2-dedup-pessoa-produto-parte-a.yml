status_reason: >-
  Re-gate (QA fix iteração 1 + Rodada 7). O código está correto e não há trabalho de @dev pendente.
  As 4 mutações que sobreviviam (TEST-001) agora são pegas, e o card filtra a manual reembolsada
  como a réplica (REL-001). A Rodada 7 (R7-4/R7-5) foi implementada no ponto único
  `camada2ValeNaEtapa`: vale em `paid`, `free` e `application`, e fica fora em `event_capture`,
  `sales`, `event` e etapa sem tipo. O Debriefing segue o mesmo ponto (`camada2Vale` por planilha).
  Reproduzi em produção, só leitura, `origin/main` 56db2af5 × HEAD c0219d39. FZ-M2 Vendas não muda
  (70 / R$ 82.702,00, igual no card e na réplica). PG02 Captação Paga: 2.197 → 2.188, −R$ 596,30,
  no card, no diário, na réplica e no Resumão. Mudam só PG02, PG03, PG04 e FZ-L2 Captação Paga,
  todas abaixo de 5 % (a maior é 1,78 %). No Debriefing PG02, o SHA é igual à main sem o downsell;
  com o downsell, só a contagem da camada 2 cai de 14 para 9 e nenhum valor muda. Das minhas 14
  mutações, 12 foram pegas e 2 de baixa severidade sobreviveram (TEST-002). Não é PASS porque o
  lint da API está vermelho, e está vermelho na própria origin/main: são 2 erros em
  `routes/lead-scoring.ts`, vindos de 5058c502 (#979), e o arquivo é idêntico na branch. O merge
  também espera a comunicação do AC11, que ainda não foi enviada, e a validação visual do AC8.
