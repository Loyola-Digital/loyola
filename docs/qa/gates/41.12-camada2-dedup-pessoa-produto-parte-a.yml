story: '41.12'
story_title: 'Camada 2 em todas as pontas — "mesma pessoa (e-mail) + mesmo produto conta uma vez" — PARTE A (lançamento)'
gate: CONCERNS
status_reason: >-
  O código da fatia A está correto. A chave mora numa função só (`deduplicarPorPessoaEProduto`),
  o Debriefing a chama com saída idêntica (SHA do resultado completo do PG02 igual na base e na
  branch, com e sem as etapas de downsell), e o Resumão, os painéis `sales-data`/`sales-data-daily`
  e a réplica `sales-daily-sync` decidem a sobrevivente na planilha inteira, antes do recorte.
  Reproduzi em produção, só leitura e com código independente do @dev: PG02 2.197→2.188 /
  R$ 231.097,94→230.501,64; PG04 −7 / −R$ 284,06; FZ-M2 Vendas 5,55 %. O "velho → novo → velho"
  deu igual em 17/17 painéis, 7/7 diários e 25/25 réplicas, e as 6 etapas de perpétuo ficaram
  inalteradas na réplica. A suíte da API tem as mesmas 10 falhas da origin/main. Fiz 10 mutações
  próprias e 4 sobreviveram — linha de valor zero disputando a vaga, réplica sem a isenção do
  perpétuo, Resumão decidindo por planilha e manuais da decisão recortadas por `days`. O código
  está certo nos quatro casos, mas nenhum teste os segura (TEST-001). Não é PASS porque o merge
  espera a resposta do dono sobre o FZ-M2 (R6-4), a comunicação do AC11 não foi enviada e a
  validação visual do AC8 não foi feita. A regeração dos três relatórios bloqueia o Done.
