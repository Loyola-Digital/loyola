  - id: 'TEST-001'
    severity: low
    finding: 'A contagem da Gratuita no 4º `it` é um proxy estático: todas as células menos as que estão dentro de `{isPaidCapture && …}`. Uma célula num ternário `isPaidCapture ? A : B` conta nas duas variantes. No fonte antigo ela deu `{ paga: 23, gratuita: 20 }`, não os 18 reais. O erro é para o lado seguro: o teste fica vermelho, nunca passa um bug. O 3º `it` também depende da forma `isPaidCapture && (`, então reescrever o código com um ternário que devolve `null` derruba o teste sem que haja bug.'
    suggested_action: 'Aceitar. Se alguém reintroduzir um ternário por variante nesse componente, o número fixado precisa ser revisto junto com o teste.'
  - id: 'DOC-001'
    severity: low
    finding: 'O comentário no topo do teste diz que a reversão "derruba o 1º, o 2º e o 4º `it`". Pela reexecução do @qa, caem os 4: o 3º também cai, porque o fonte antigo usa `isPaidCapture ? (` e não `&&`. O Dev Agent Record está certo (4/4). A story fala em "11 etapas não-Paga". Uma delas, `bbe_churrasco_aquisição`, é de funil `perpetual` e não passa pelo `LaunchDashboard`. Na tela de lançamento são 10.'
    suggested_action: 'Na próxima vez que o arquivo for tocado, corrigir o comentário para "derruba os 4 `it`". O número da story não muda o escopo.'
  - id: 'REQ-001'
    severity: low
    finding: 'Caso latente. `useCrossedFunnelMetrics` cai em `spreadsheets[0]` quando a etapa não tem planilha `leads`. Se a única planilha for `sales`/`custom` com `value` mapeado, `hasLinkedSheet` fica true e a tabela aparece. Antes, nesse caso, a coluna Faturamento mostrava valor real. Agora ela não existe. Em produção não há nenhum caso (consulta só de leitura do @qa, 21/10): as 10 etapas não-Paga de lançamento com planilha têm exatamente 1 `leads`, todas com `value` nulo.'
    suggested_action: 'Nenhuma agora: está no "Fora do escopo" (trazer faturamento para a Gratuita é outra story). Fica registrado para quando aparecer uma etapa não-Paga só com planilha de vendas.'
  - id: 'BUILD-001'
    severity: low
    finding: 'O `next build` não rodou localmente. tsc do web deu 0 e eslint deu 0.'
