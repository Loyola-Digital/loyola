checks:
  code_review: 'Diff de 8 linhas em `debriefing-render.ts`: o `const doAnuncio` lê `tc.adLevel.aplicavel` e só a nota usa. O texto com ad-level saiu byte a byte igual ao anterior. `postDoGrupo`, o motor e o payload não foram tocados. O único chamador do render é `debriefing-generate.ts:297`. Nenhuma outra superfície (web, viewer) repete a nota (grep "maior investimento").'
  fidelidade: 'Sem ad-level, `spendPorAdId` fica vazio (`audience-engine.ts:1219-1220`). Em `postDoGrupo`, `melhorSpend` começa em −1, o primeiro ad_id COM post leva (0 > −1) e os seguintes, com 0, não trocam (`post-do-criativo.ts:55-72`). A entrada vem em `porVolume`, por respondentes decrescente com desempate por ad_id (`:1224`). Portanto "o anúncio com mais respondentes do Ad Name, entre os que têm post publicado" é exato. Isso bate com a 49.6:346 ("sem ad-level no período, desempata pela ordem de volume de respondentes") e mantém a cascata IG → FB → Ads Manager da R7-9 (`linkDoPost ?? linkAdsManager`, `render.ts:1681`). A fixture discrimina os critérios: o de mais respondentes não tem post e tem o maior investimento; o 2º tem IG; o 3º tem FB e o maior investimento entre os com post. O resultado é IG sem ad-level e FB com ad-level. Limite com ad-level: REQ-001.'
  acceptance_criteria: 'AC1 ✓: nota nova nas 3 dimensões sem ad-level, inclusive "nenhuma", que gera desde a 49.15; com ad-level, o texto de antes. AC2 ✓: o href e o `linkDoPost` não mudam, e o payload saiu idêntico nos 12 casos. AC3 ✓ reproduzido (ver ac3_sha). AC4 ✓: (a) a fixture tem criativo na pesquisa; (b) com o render de c73a002c, 6 dos 15 testes falham, conferido pelo QA; (c) coberto; (d) M1/M2 morrem, e o chamador (generate → render) também é coberto pela Q8.'
  ac3_sha: 'O QA rodou o próprio `sha-49-16.mts` do @dev, numa cópia que grava o HTML em `qa-html-49-16/`, em 3 estados: depois (HEAD), antes (o render de c73a002c) e revertido (de volta à HEAD). As 3 saídas batem byte a byte com as do @dev, e depois = revertido. Payload idêntico nos 12 casos. O HTML muda só em fx49.16 ia-humano sem (c61961c9 → 57f393ee), video-estatico sem (65807cf3 → a973eb23) e nenhuma sem (0d7fbbb3 → 15c30b9d). Comparação independente do QA (`qa-cmp-49-16.py`, difflib): nos 3 casos que mudam, só 1 linha difere, o texto novo aparece 1 vez e trocá-lo pelo antigo devolve exatamente o HTML "antes". Nos 3 casos fx49.16 "com", o HTML contém o texto antigo 1 vez e é idêntico, o que prova que a igualdade não vem de nota ausente. Na fixture da 49.15 a nota não aparece (sem criativo), então os 6 casos dela são idênticos trivialmente; o @dev declarou isso. O `cmp-49-16.py` do @dev compara o que diz comparar (`a == b.replace(NEW, OLD)` e `count(NEW) == 1`). Os hrefs no HTML conferem: FB com ad-level e IG sem.'
  unit_tests: 'Arquivo da story: 15/15. Debriefing + post-do-criativo: 26 arquivos, 769/769. As mutações do @dev, reexecutadas, morreram todas (M1–M8: 6, 6, 9, 6, 6, 6, 6, 7 falhas). Mutações do QA (`scratchpad/qa-mutar-49-16.py`, cada uma restaurada, `git status` limpo ao fim): Q1 condição `adLevel.linhas > 0` sobrevive, EQUIVALENTE (`aplicavel = temAdLevel = anuncios.length > 0` e `linhas = anuncios.length` nos dois ramos). Q2 condição `!adLevel.motivo` sobrevive, EQUIVALENTE (o `motivo` existe se e só se `!temAdLevel`). Q3, o render prefere o Ads Manager ao post: morre (5). Q4, o motor chama `postDoGrupo` sem o investimento: morre (4). Q5, o motor passa a ordem de volume invertida: morre (4). Q6, `adLevel.aplicavel` sempre true no motor: morre (21). Q7, a nota sem a cascata IG/FB: morre (9). Q8, o gerador entrega ao render o `adLevel.aplicavel` virado: morre (11).'
  no_regressions: '`node_modules/.bin/tsc --noEmit -p packages/api` com exit 0. `eslint src/` da API: 0 erros e 1 warning que já existia (`lp-campaigns.ts:57`). API inteira: 243 arquivos, 10 falhas e 4.518 passando. São as 10 falhas já conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2); nenhuma nova. Merge simulado com a main nova: ver REL-001.'
  security: 'N/A: muda só um texto estático, sem interpolação nova de dado do usuário. O href continua passando por `esc()`.'
  api_contract: 'N/A: não há contrato, migration nem mudança de payload (SHA idêntico).'
  documentation: 'O Dev Agent Record está completo: os `[AUTO-DECISION]` (de onde ler o ad-level; fixture no próprio arquivo de teste), a tabela de SHA, o diff da nota e as mutações. O limite da nota única está registrado pelo @po nas Dev Notes.'

