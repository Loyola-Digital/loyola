issues:
  - id: REQ-001
    severity: low
    category: requirements
    description: 'O limite das Dev Notes (@po) se confirma na prática, e o texto com ad-level segue com duas imprecisões que já existiam, sem regressão. (1) O QA reproduziu o limite com a fixture da 49.16: ad-level no período só de OUTRO anúncio (`120000000000000002`) e nenhum investimento para os 3 ad_ids do Ad Name. O link sai o IG do 2º em respondentes, pela ordem de volume, e a nota diz "do anúncio de maior investimento do Ad Name", com ia-humano e com nenhuma. A causa é que a nota segue `tipoDeCriativo.adLevel` (o período), enquanto `postDoGrupo` decide grupo a grupo (`utils/post-do-criativo.ts:61,66`). (2) O texto com ad-level não diz "entre os que têm post". Quem lê "…do anúncio de maior investimento; sem post público, o Ads Manager" pode entender que, se o de maior investimento não tem post, o link vai para o Ads Manager. Na verdade vai para o próximo com post. (3) Nos dois textos, "do Ad Name" quer dizer os ad_ids do Ad Name que trouxeram respondente: o grupo só contém ad_ids de `respsPorAdId` (`debriefing-audience-engine.ts:1207-1215`). Um anúncio do Ad Name com o maior investimento e nenhum respondente não concorre. Nenhum desses pontos contradiz o AC1, que congela o texto com ad-level.'
    recommendation: 'Fica como está nesta story. Se alguém pedir, uma story futura pode trocar a nota por uma frase única, verdadeira nos dois casos e sem marcação por linha. Por exemplo: "do anúncio de maior investimento no período entre os que têm post publicado e trouxeram respondentes; no empate, inclusive sem investimento, o com mais respondentes". Essa troca muda o HTML com ad-level, então precisa de AC de SHA próprio.'
    owner: '@po'
    status: open

  - id: REL-001
    severity: low
    category: reliability
    description: 'A main andou durante o gate: c73a002c → ad73b4a7 (#997, 49.14: render +246 linhas, generate, guards, payload, contract). O `git merge-tree` não acusa conflito. O QA montou o merge simulado (commit-tree de HEAD + origin/main, numa worktree temporária já removida): suítes de debriefing + post-do-criativo com 28 arquivos, 815/815, e `tsc --noEmit -p packages/api` com exit 0. Os SHAs do AC3 foram medidos sobre c73a002c. A comparação é relativa (antes × depois na mesma base), então continua válida, mas os hashes absolutos mudam na main nova.'
    recommendation: '@devops faz rebase sobre origin/main antes da PR e roda a suíte de debriefing de novo. Não é preciso refazer o AC3.'
    owner: '@devops'
    status: open

