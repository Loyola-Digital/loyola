  - id: TEST-003
    severity: low
    category: tests
    description: 'Duas mutações do re-gate sobrevivem nos testes de fio (os testes são por leitura de fonte e só pegam a grafia que conhecem). (a) Pôr `.catch(() => null)` na `/players/list` do `overview` faz a falha da lista virar "pitch não configurado no VTurb": vira ausência, que é exatamente o que a AUTO-DECISION do @dev proíbe. Resultado: 60/60 verde, porque a regex do fio não é ancorada no fim da expressão. (b) Trocar `pitchOk &&` por `pitch !== null &&` na linha do pitch da curva de cliques dá 34/34 verde: o teste "nada usa o pitch cru" só barra `pitch != null` e `{pitch ?`. O efeito é pequeno: a API nova já manda `null` para pitch 0, e o impacto fica só na API antiga, onde a cópia pode ser 0 e a linha apareceria em 0:00.'
    recommendation: '(a) Na regex do `overview`, exigir `;` logo depois de `.pitchTime)` (ou `expect(bloco).not.toMatch(/listPlayers[\s\S]*?\.catch\(/)`). (b) Em vez de uma lista de grafias proibidas, exigir que toda `ReferenceLine` do pitch esteja sob `pitchOk &&` (contar ocorrências de `x={mmss(pitch)}` = ocorrências de `pitchOk && (\n…<ReferenceLine x={mmss(pitch)}`). Cabe em uma follow-up XS, ou na story da Análise MVP que vai mexer em `routes/vturb.ts`.'
    status: open

