    resolution: 'Re-gate 24/09: caso `[falhou com pitch, lido sem pitch]` → `MOTIVO_SEM_PITCH`; `lerTabelaDasVsls` sem `concorrencia` tem pico 3 com 7 vídeos, e `CONCORRENCIA_DA_TABELA` = 3 fica travado. O @dev registrou G2c → 1 e G4 → 1. O @qa leu os dois testes e não refez as mutações.'

