issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O fio da rota e o do bloco não têm teste. Mutação do gate no CALL SITE da rota `GET …/funnels/:funnelId/vturb/vsls`: `condicaoDoFunilNoProjeto(...)` trocado por `eq(funnels.id, funnelId)` e `condicaoDosVinculosDoFunil(...)` por `eq(funnelStages.funnelId, funnelId)`. Resultado: `vturb*` 47/47 verde. Os predicados são provados serializados (A6 do @dev), mas nada prova que a rota os usa, e esse é o recorte que impede um `funnelId` de outro projeto de listar os vídeos alheios (e de gastar a cota do VTurb com eles). O mesmo vale para o bloco: `ehPerpetuo = !!funnelId` em `vturb-stage-tab.tsx` mais `funnelType="perpetual"` em `vsl-collapsible-section.tsx` → `lib/utils` 91/1.326 verde. A regra (`estadoDaTabela`) é testada; quem a alimenta não é. Com esse fio regredido, lançamento e mobile passariam a chamar o VTurb (1 + N chamadas por abertura) mesmo com a tabela escondida.'
    recommendation: 'Teste de contrato por leitura de fonte (padrão de `lib/swipe/__tests__/pdf-capa-efeito.test.ts` no web e de `llms-txt-contrato.test.ts` na API): na rota, o bloco `/vturb/vsls` chama `denyGuest`, `condicaoDoFunilNoProjeto(p.data.projectId, p.data.funnelId)` e `condicaoDosVinculosDoFunil(p.data.projectId, p.data.funnelId)`; no bloco, `ehPerpetuo` depende de `funnelType === "perpetual"` e o hook só recebe `projectId` quando `ehPerpetuo`. Cabe numa follow-up XS ou na próxima story que tocar esses arquivos.'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Duas lacunas sem efeito no número. (a) No Total, calcular `semPitchNenhum` sobre TODOS os vídeos em vez dos lidos → 0 falhas. No caso misto (um vídeo falhou e o restante não tem pitch) o "—" da Retenção passaria a dizer "sem dados no período" em vez de "pitch não configurado no VTurb": o número continua ausente, mas o motivo fica errado. (b) `CONCORRENCIA_DA_TABELA = 30` → 0 falhas: o teste prova o MECANISMO do freio com `3` explícito, mas não o valor que a rota usa.'
    recommendation: 'Um caso de Total com [falhou, sem pitch] esperando `MOTIVO_SEM_PITCH`, e uma asserção de que `lerTabelaDasVsls` sem `concorrencia` não passa de 3 em voo.'
    status: open

  - id: DOC-001
    severity: low
    category: docs
    description: 'O cabeçalho da tabela mostra o `range` calculado na tela, não o `dados.range` devolvido pela rota. O comentário da rota diz o oposto ("a tela mostra esta, não a pedida"). Hoje as duas strings são iguais, e a diferença só aparece na troca de período: com `placeholderData`, o cabeçalho já mostra a janela nova enquanto as linhas (esmaecidas) ainda são da janela anterior. É o que o AC6 quer evitar ("o período exibido é o enviado"), só que de forma transitória.'
    recommendation: 'Mostrar `dados.range` quando houver dados e o `range` local só no esqueleto e no erro, ou então corrigir o comentário da rota.'
    status: open

