checks:
  code_review: 'Diff de 12 arquivos contra `5702ee8a` (a própria base; a `origin/main` não andou depois). API: a rota é NOVA e a `/chain` da MVP fica intocada (o diff de `routes/vturb.ts` só acrescenta). A regra do pitch foi extraída para `pitchInvalido` sem mudar `derivarCadeia`, e os testes da cadeia seguem verdes. A rota devolve só brutos, e a conta fica num lugar só (web). `lerTabelaDasVsls` recebe as chamadas por injeção: a falha de um vídeo fica na linha dele, a falha da `/players/list` sobe. As mensagens de erro são de `mensagemDoErro` (sem token; o token vai no header). Web: taxas por `⌊p·10000/t⌋` com texto montado de inteiros; Total por soma de brutos; "—" sempre com motivo. `estadoDaTabela` separa 404 (API antiga → oculta) de outras falhas (erro). O tipo do funil vem de `useFunnel` com a mesma chave da página; o `dias` subiu para o bloco. Nenhum `page.tsx` tocado.'
  unit_tests: 'API `vturb*` 3 arquivos / 47 verdes (`vturb-tabela` 14). Web `vturb-tabela` 20/20; `lib/utils` 91 / 1.326 (+20). A varredura exaustiva p ≤ t ≤ 5.000 leva ~0,7 s. Mutações do gate, diferentes das 18 do @dev: (1a) sem os DOIS laços de correção → 20/20 verde, e isso está certo: com o numerador inteiro, `⌊(p·10000)/t⌋` já é exato nessa faixa (uma divisão corretamente arredondada não atravessa um vão ≥ 1/t), então os laços são rede de segurança e não o que garante o resultado; (1b) estimativa em ponto flutuante (`p/t` primeiro) COM os laços → 20/20 (os laços corrigem; o W3 do @dev, sem laços, derruba 2); (2a) API aceita pitch 0 no call site da tabela → 1 falha, "pitch 0, ausente ou vídeo fora da conta…"; (2b) linha ignora `pitchConfigurado` → 1 falha, "pitch não configurado → Retenção —"; (2c) `semPitchNenhum` sobre todos os vídeos → 0 (TEST-002a); (3) fio do tipo de funil no bloco → 0 (TEST-001); (4) concorrência padrão 30 → 0 (TEST-002b); (5) recorte por projeto cortado na rota → 0 (TEST-001). Tudo restaurado, `shasum -c` OK.'
  acceptance_criteria: 'AC1 ✓ (tabela só com `funnelType === "perpetual"`; tipo e funil via `useParams` + `useFunnel`) · AC2 ✓ (Σ brutos; dica "soma dos vídeos" com o aparelho contado duas vezes) · AC3 ✓ (5,58 · 7,92 · 2,99 · 44,73 · 30,32; 57/100 → 57,00) · AC4 ✓ (pitch da `/players/list`; 0/ausente → "—" com motivo e fora do Σ da Retenção, dentro do Play Rate) · AC5 ✓ (união por `player_id`, ordem por nome pt-BR + `player_id`; `/chain` intocada) · AC6 ✓ (`intervaloDoBloco` no fuso da conexão, um seletor para tabela e painel; ressalva transitória em DOC-001) · AC7 ✓ (1 + N chamadas, 3 em voo, `staleTime` 2 min, só com o bloco aberto e conectado; zero → "sem dados no período") · AC8 ✓ (falha na linha e fora do Total com indicação; falha geral como erro) · AC9 ✓ (404 → bloco como era; contrato 19 → 20) · AC10 ✓ · AC11 ✓ (eslint 0 nos 11 arquivos e `tsc --noEmit` da API 0, no gate; `next build` e `tsc` do web pelo @dev, não refeitos — o review não deu motivo).'
  no_regressions: '`vturb-chain` e `vturb-stats-reconstrucao` verdes com `pitchInvalido` extraído. O painel por vídeo passou a receber `dias`/`range` por prop e mudou só de fuso, também no lançamento e no mobile (PO-03, declarado). A suíte completa da API não foi refeita: o @dev registrou 3.122/3.132, exatamente a baseline de 10 falhas em 5 arquivos alheios.'
  performance: 'Uma `/players/list` mais uma `sessions/stats` por vídeo, no máximo 3 simultâneas; o cliente do VTurb já faz backoff em 429/5xx. Sem cache no servidor: cada abertura do bloco ou troca de período (7/30/90) gasta 1 + N da cota de 60/min da conta. Com 1 vídeo hoje, é irrelevante; com muitos vídeos e vários usuários, vale observar. Nada é pedido com o bloco fechado ou no lançamento/mobile (enquanto o fio de TEST-001 estiver como está).'
  security: '`denyGuest` na rota; funil precisa ser do projeto da URL (404 `FUNNEL_NOT_FOUND`); vínculos recortados por etapa do funil E `vturb_players.project_id`. Predicados provados por serialização (`PgDialect`), mas o uso deles pela rota não tem teste (TEST-001). A resposta leva nomes de player e contadores agregados, sem PII e sem token.'
  documentation: 'Os textos batem com as contas. Play Rate = "plays únicos ÷ carregamentos únicos do player (dispositivo)"; Retenção = "passaram ÷ (passaram + não passaram) — a conta do VTurb, com o pitch cadastrado lá hoje"; o Total diz "soma dos vídeos" e declara a dupla contagem. Os vídeos fora do Total aparecem listados com o motivo. A ressalva é o cabeçalho de período (DOC-001).'
  api_contract: '19 → 20 com linha de histórico (rota nova, ADITIVA; `packages/mcp` não afetado). ATENÇÃO @devops: a 48.13 também sobe 19 → 20. A segunda a mergear rebaseia e sobe para 21, com a própria linha de histórico. Não é FAIL desta story.'

