checks:
  code_review: 'Re-gate, ciclo 2 (`9e8fb4eb`), diff contra a base rebaseada `15093c2f`. `overview`: uma `/players/list` com o fuso da conexão, depois `pitchDoPainel(link, daConta).pitchTime`, que é o atual, com `null` para 0, ausente ou vídeo fora da conta. `sessionStats` e `sessionStatsByDay` esperam a lista; curva e cliques seguem em paralelo. As 3 segundas tentativas usam `comPitchAtual(pitchTime)` e `player.pitchTime` é o atual. `link.pitchTime` não aparece mais no bloco da rota. A falha da lista rejeita o `Promise.all` e cai em `replyVturbError`, sem rejeição solta: todas as derivadas estão no mesmo `Promise.all`. `pitchAtualDoPlayer` foi extraída de `lerTabelaDasVsls` sem mudança de comportamento (A8r do @dev), então a tabela e o painel usam a mesma regra (`pitchInvalido`). `/chain` (linhas 395–492) sem hunk no diff. No web, `pitchConfiguradoNoPainel` (número finito > 0) governa o cartão ("—" + `MOTIVO_SEM_PITCH` + série vazia), o rótulo, o subtítulo de "Assistiram até o fim" e as duas `ReferenceLine`, e também protege a API antiga, que manda a cópia. `periodoDoCabecalho` fecha o DOC-001.'
  unit_tests: 'Suítes re-rodadas pelo @qa: API `src/__tests__/vturb*` 4 arquivos, **60/60**; web `lib/utils/__tests__/vturb*` 2 arquivos, **34/34**. Mutações do re-gate: runner aplica, roda a suíte-alvo, restaura; `shasum -c` OK nos 5 arquivos; `git diff` vazio fora de `.claude/agent-memory/**`. **Pedidas:** G3 (gate #3, fio do bloco) → 2 falhas · G5 (gate #5, fio da rota) → 2 · A12a (`pitchDoPainel` devolve a cópia) → 4 · A12b (`overview` com `.then(() => link.pitchTime)`) → 2. **Próprias:** Q2 (cópia sem o texto literal, `?? link["pitchTime"]`) → 1, porque a regex do fio exige `.pitchTime)` · Q4 (`pitchAtualDoPlayer` sem `Number()`, pitch em texto) → 2 · **Q1 (`.catch(() => null)` na lista do `overview`) → 0** (TEST-003a) · **Q3 (`pitch !== null` na curva de cliques) → 0** (TEST-003b).'
  acceptance_criteria: 'AC1–AC11: sem mudança desde o gate de 23/09 (✓), e o DOC-001 fechou a ressalva transitória do AC6. **AC12 ✓**: o `overview` usa o `pitch_time` atual da `/players/list` e não a cópia (`:264-265/303/308/341` do AC viraram `comPitchAtual`). `player.pitchTime` é o atual e marca a curva e os rótulos. Com pitch 0 ou ausente o cartão mostra "—" com "pitch não configurado no VTurb", o mesmo texto da tabela. A mudança vale para lançamento e mobile (painel compartilhado, declarado). Custo de +1 `/players/list` por abertura. `/chain` intocada. A escolha do pitch é função pura com prova diferencial: A12a derruba 4.'
  no_regressions: '`vturb-chain` e `vturb-stats-reconstrucao` seguem verdes (dentro dos 60). A suíte completa da API e do web não foi refeita pelo @qa por causa do I/O do iCloud. O @dev registrou a API = baseline (10 falhas alheias, mais 7 timeouts sob carga que passam sozinhos: 193/193) e o web 1.489/1.489, com os 4 `.test.tsx` jsdom em rodada separada. Tudo sobre a árvore rebaseada.'
  performance: 'Painel: +1 `/players/list` por abertura (`useVturbOverview` segura 30 s), e `sessions/stats`/`stats_by_day` passam a esperar uma ida a mais. Com o bloco do perpétuo aberto são 2 `/players/list` (tabela e painel), sem compartilhamento, o que não foi pedido. Irrelevante hoje, com 1 vídeo; vale observar com a cota de 60/min da conta.'
  security: 'Sem mudança no recorte: `denyGuest`, funil do projeto da URL e vínculos por etapa E `project_id`, agora com o fio travado por teste (TEST-001 resolvido). O `overview` segue exigindo o vínculo na etapa da URL. Sem PII nem token na resposta.'
  documentation: 'Dev Agent Record do ciclo 2 completo (decisões, provas, gates). Linha de histórico do contrato atualizada com o AC12 ("mesma forma, sem campo novo; muda o significado de `player.pitchTime`"). O cartão e a tabela usam o mesmo texto de motivo.'
  api_contract: 'Branch em **v21** (a 29.78 nasceu v20 e subiu no rebase sobre a 48.13), com a linha de histórico da rota nova e do AC12. A `main` já está em **v22**. **ATENÇÃO @devops:** no merge, a 29.78 rebaseia e sobe para a próxima versão livre, com a própria linha. É renumeração de merge, não FAIL desta story.'
  lint: 'eslint re-rodado pelo @qa: API 5 arquivos (rota, `vturb-tabela`, `vturb-chain`, 2 testes) com EXIT 0; web 7 arquivos (3 componentes, `lib/utils/vturb-tabela`, `use-vturb`, 2 testes) com EXIT 0, conferido com `--format json` (0/0) e 88 regras ativas.'
  build_typecheck: '`next build` e `tsc` do web e da API não foram refeitos (instrução: I/O do iCloud; o @dev rodou depois do rebase: api 0, web 0 depois do build, build EXIT 0). `shared build` re-rodado: EXIT 0.'

