status_reason: 'Os ACs estão atendidos e a matemática está bem travada: truncamento exato, Total pela soma dos brutos, pitch atual e pitch 0 fora do Σ, cada um com o teste dedicado caindo. O que fica como concern é o fio: cortar no call site o recorte por projeto da rota nova, ou a guarda de tipo de funil no bloco, não derruba teste nenhum. O código que está lá hoje está certo; o que falta é a rede de proteção.'
