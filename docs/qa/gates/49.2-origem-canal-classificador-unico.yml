checks:
  code_review: 'Módulo folha (`grep import` = 0, travado por teste). Função pura: sem I/O, sem relógio, sem `Math.random`, sem estado global, e não muta a entrada. O sinal de closer é apagado campo a campo antes das regras 1–7. A UTM efetiva é a do lead quando ele tem UTM de aquisição; senão, a da venda. As regras 8 e 9 dependem de `temAlgumCampo`, que IGNORA `campaignName` e `sellerName`: Netão = Sem track real + closer. O fechamento lê o lead, a venda e o `sellerName` (este só com a flag). Os helpers são um por eixo, e a superfície exportada é travada por teste no web: nenhum soma aquisição com fechamento. Valor fora da união lança, em vez de cair num balde. Nenhum nome ou medium de closer no código.'
  unit_tests: 'API: 159/159 do arquivo novo. Suíte completa: 3.575 verdes e 10 falhas em 5 arquivos (`funnel-stages-lead-inputs`, `instagram-routes`, `instagram`, `projects`, `schema`). O QA reproduziu essas mesmas 10 na BASE, com o módulo e o re-export removidos e o dist reconstruído: são pré-existentes. Web: 2/2. Mutações do QA, com o dist reconstruído a cada uma: Q1 Pago N/D antes da temperatura → 42 falhas; Q2 lead só com UTM de closer bloqueando o fallback para a venda → 1; Q3 Sem track real olhando só o lead → 4; Q4 `sellerName` tirando da regra 9 → 4; Q5 `sellerName` sem a flag → 1; Q6 `campaignName` antes do `utm_term` → 1; Q7 rótulo `temperaturaDecididaPor` trocado → 24; Q8 `campaignName` contando como UTM → 1; Q9 `_` deixando de separar token → 1; Q10 `\bhot\b` no lugar de substring → 2; Q11 temperatura exigindo token pago → 6; Q12 só-closer engolido por Sem track no segmento → 1; Q13 fechamento ignorando o lead → 9; Q14 `fonteUtm` = venda na regra 8 → 1. Resultado: 14/14 mortas.'
  acceptance_criteria: 'AC1 ✓ (assinaturas, união `Canal` sem Closer, `CLASSIFICADOR_VERSAO = "49.2-v1"`, re-export + subpath) · AC2 ✓ (9 regras na ordem; eixo de fechamento à parte) · AC3 ✓ · AC4 ✓ (testes nomeados: Closer 22/R2-5, config vazia → Outros orgânicos, decisão 3) · AC5 ✓ (Netão nomeado, nos dois valores da flag) · AC6 ✓ (Σ por eixo = total, ordem fixa, segmento próprio do só-closer) · AC7 ✓ (2.000 combinações sujas; `utm_content` não entra) · AC8 ✓ (17 coincidem e 22 divergem, com 9 motivos fechados; divergência fora da lista falha, e a listada que volta a coincidir também; Quente/Frio ≡ `temperaturaDoNome` ≡ `classifyTemperatura` em 20 textos pelos dois campos) · AC9 ✓ (`lead-origin.ts`, rotas e telas intocados).'
  no_regressions: 'Diff com 5 arquivos: módulo novo, re-export aditivo, 2 testes e a story. Nenhum consumidor existente muda. `next build` verde (3,1 min). `tsc --noEmit` verde no web (depois do build), na API e no shared. ESLint limpo no shared e no teste novo da API.'
  performance: 'O(campos) por chamada, com o Set de closers montado por chamada. Irrelevante perto do I/O do loader. Se a 49.3 classificar dezenas de milhares de linhas, dá para pré-montar os Sets, mas não é necessário agora.'
  security: 'Sem I/O, PII ou rede. A consulta de quantificação do QA rodou em transação `BEGIN READ ONLY` + `ROLLBACK`, só com SELECT.'
  documentation: 'O cabeçalho do módulo explica o porquê (armadilhas #5 e #9, decisão 3) e o que a função NÃO faz. O Dev Agent Record traz as AUTO-DECISIONs e as 3 perguntas ao dono.'
  skill_conformance: '`data/classificador-unico.md`: "Sem track real = sem UTM no lead E na venda" ✓; Pago N/D com `cbo/abo/meta/fb` ✓; ig → whatsapp → manychat → demais ✓; mutuamente exclusivos por eixo ✓; Comunidade/Front fora ✓. As diferenças em relação à skill vêm das decisões do dono e estão documentadas: Closer saiu da 1ª linha e virou eixo (decisão 3); "Campaign com hot" virou `utm_term` + fallback em `campaignName` (decisão 4); balde próprio do só-closer (R2-5). Rodada 3: sem impacto nesta story (R3-1..R3-5 são 41.10/41.11/49.10).'

data_evidence:
  - 'Campo de casamento (R2 da story) medido nos snapshots da skill: das linhas que o novo classificador mandaria para um canal orgânico, só 8 carregam sinal de pago (7 `google-ads` do BBE + 1 `ig/paid` com id Meta). As 177 linhas com source orgânico (`ig`) e `utm_term` hot/cold são, na verdade, anúncios: o term é o nome do conjunto (`..._hot_cbo_...`). Por isso, temperatura antes do canal (regras 1–2 antes da 4) é o comportamento CERTO no dado real.'

notes:
  - 'As três perguntas do @dev ficam com o DONO. O QA não decidiu nenhuma; a recomendação sobre a 3 vem só dos dados.'
  - 'Se a pergunta 2 virar "só closer", a mudança provável é um campo novo na config da 49.1, algo como "ferramentas que contam como closer só junto com o medium". O `CLASSIFICADOR_VERSAO` sobe para 49.2-v2.'
  - 'Os snapshots locais da skill são uma amostra (DG, FZ, Netão, Pacheco) e não as planilhas vivas. A conferência de verdade fica na 49.5, contra DG-PG02.'
