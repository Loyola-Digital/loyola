    finding: 'Pergunta 2 (pendência do DONO, não decidida pelo QA): no FZ, a ferramenta (`letalk`/`chatwoot`) combinada com medium de closer (`x1`/`comercial`) dá hoje aquisição "Outros orgânicos" + fechamento closer. É a leitura literal do AC2: só o campo que é sinal de closer é apagado. Pelo snapshot da skill (`dados/fernanda-zapparolli/FZ-L1-FEV26 - n8n-tmb-produto.csv`), 88 dos 107 compradores do produto têm `letalk + x1` na venda. Desses, 72 não têm UTM de aquisição em nenhuma planilha de lead do FZ-L1, e só esses 72 mudam de balde: "Outros orgânicos" passa a ser o maior canal de aquisição do principal, quando pela leitura do perfil seria "Aquisição não rastreada (só closer)". Os outros 16 têm lead com UTM (`ig` 8, `meta` 5, `manychat` 3) e não mudam. Dado útil para a decisão: nos snapshots, TODAS as 131 linhas com source `letalk` têm medium `x1`, então pôr `letalk` em `closerNomes` (via config da 49.1, sem mudar código) seria equivalente para o `letalk`. Para o `chatwoot` não: só 54 das 331 linhas têm `x1`.'
    suggested_owner: dono (Danilo) → @po
