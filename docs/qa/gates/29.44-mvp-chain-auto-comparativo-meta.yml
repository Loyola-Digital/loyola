schema: 1
story: '29.44'
gate: FAIL
status_reason: >-
  O entregavel da story esta correto e bem testado — a troca de CPM para CPC foi
  o achado certo e destravou uma cadeia que nunca calculou desde a 29.36. Mas ela
  quebrou a secao de Ranking na MESMA aba: PerpetualRankingSection tem "CPM"
  cravado no rotulo e na chave de teto (perpetual-ranking-section.tsx:63-66), e
  agora exibe um valor de CPC rotulado como CPM. Para um gestor de trafego, CPC
  R$ 2,50 e CPM R$ 2,50 sao realidades opostas. Com teto salvo, a comparacao
  CPC-contra-teto-de-CPM tambem produz ranking errado. Fix de poucas linhas, mas
  nao pode ir para producao assim.
reviewer: 'Quinn'
updated: '2026-08-07T00:00:00Z'

top_issues:
  - id: 'QA-04'
    severity: high
    finding: >-
      A troca de entryCost (CPM -> CPC) nao foi propagada ao consumidor vizinho.
      PerpetualRankingSection monta a linha de entrada com label "CPM", key "CPM"
      e ceilings["CPM"] cravados, alimentada por `entryCostValue={entryCost?.value}`
      — que agora e CPC.
    impact: >-
      (a) Rotulo errado sempre: a aba exibe "CPM R$ X" com o valor do clique.
      (b) Com teto salvo sob a chave "CPM", `rank()` compara um CPC contra um teto
      de CPM e devolve posicao sem significado. Sem teto salvo, a linha e filtrada
      do ranking e so o rotulo mente — que ja basta.
    suggested_action: >-
      Passar `entryCost` inteiro (kind + value) ao PerpetualRankingSection e usar
      `entryCost.kind` como label e como chave de teto. Migracao de tetos salvos
      sob "CPM" nao e necessaria: a chave nunca correspondeu a um CPC real, entao
      nao ha historico valido a preservar — mas convem NAO ler ceilings["CPM"]
      para um CPC, que e o defeito.
    ac_violated: 'AC4 da 29.36 por tabela; regressao introduzida pela 29.44'

  - id: 'QA-05'
    severity: low
    finding: >-
      A cor do delta de "vs Periodo anterior" assume que subir e sempre melhorar.
      O proprio AC5 pediu que, nao havendo hoje etapa onde subir e piorar, isso
      fosse REGISTRADO no codigo. Nao foi.
    suggested_action: 'Comentario de uma linha. Nao bloqueante.'
    ac_violated: 'AC5 (parte final)'

  - id: 'QA-06'
    severity: low
    finding: >-
      A troca para CPC nao esta refletida nas ressalvas visiveis da aba. A secao
      "Ressalvas" segue sem mencionar que o custo de entrada da cadeia e o clique,
      nem que por isso o CTR fica FORA da cadeia (ST-06). Quem conferir a conta na
      mao vai procurar o CTR e nao achar.
    suggested_action: >-
      Um item na lista de Ressalvas. O comentario de codigo esta excelente — falta
      a versao para quem le a tela, nao o fonte.

