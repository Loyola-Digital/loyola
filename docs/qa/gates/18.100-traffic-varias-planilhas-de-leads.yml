top_issues:
  - id: 'REL-001'
    severity: low
    status: 'aceito (decisão registrada do @dev)'
    finding: >-
      A união é tudo ou nada: `unirPlanilhasDeLeads` (`packages/web/lib/utils/planilhas-de-leads.ts`) devolve
      `undefined` se alguma planilha não carregou, e `useCrossReferenceLeads` faz o mesmo com as abas cruas. Se a
      leitura da segunda planilha (o Lead Form) der erro, o card, o Top Criativos e o Desempenho por LP da etapa
      ficam sem número, e o `error` de `useDadosDasPlanilhasDeLeads` não é lido por `use-crossed-funnel-metrics.ts`.
      Antes, uma planilha só com erro também ficava sem número; a diferença é que agora há mais um ponto de falha.
    recommendation: 'Se aparecer em produção, mostrar o erro da planilha que falhou (story própria). Não bloqueia: é o `[AUTO-DECISION]` "número parcial sem aviso é pior" do Dev Agent Record.'
  - id: 'MNT-001'
    severity: low
    status: 'aberto (sem bloqueio)'
    finding: >-
      O `useMemo` de `leadsUnidos` em `packages/web/lib/hooks/useCrossReferenceLeads.ts` depende de
      `[abasDeLeads.versao, idsDasPlanilhas, semPlanilhaDeLeads]`, mas usa o `columnMapping` de cada planilha. Se o
      gestor editar o mapeamento de uma planilha, a lista de planilhas recarrega e a aba crua não (a chave
      `google-sheets-data` não é invalidada), então o ponto 4 segue com o remapeamento antigo até a aba recarregar
      (staleTime de 30 s, foco na janela ou recarga da página). Antes, a coluna de data vinha direto de
      `leadsSheet.columnMapping.date` e reagia na hora.
    recommendation: 'Incluir uma assinatura do `columnMapping` (por exemplo `JSON.stringify` dos mapeamentos) em `idsDasPlanilhas`. Cosmético e autocorrigível; fica para uma próxima mexida no arquivo.'
  - id: 'TST-001'
    severity: low
    status: 'aceito'
    finding: >-
      Os pontos 6 e 7 da API são cobertos pelo util (`unirPlanilhasDeLeadsLidas`, `lerPlanilhasDeLeads`, SQL com
      `ORDER BY` pelo `drizzle.mock()`) e por testes de fio sobre o texto das rotas; não há teste que chame as rotas
      (`inject`) com duas planilhas. O risco é baixo porque o `findCol` das rotas não mudou e o util devolve o
      mapeamento canônico, conferido pelo teste "uma planilha só: as mesmas colunas que o findCol de hoje achava".
    recommendation: 'Teste de rota com duas planilhas quando a rota for mexida de novo.'
  - id: 'TEST-WEB-INHERITED'
    severity: low
    status: 'herdado'
    finding: 'Hooks e componentes de `components/funnels/` não são coletados pelo vitest do web; a fiação é provada por testes de fio sobre o texto (padrão do repo).'

