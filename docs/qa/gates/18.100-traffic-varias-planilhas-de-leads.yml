quality_checks:
  code_review: 'OK. Módulos pequenos, comentados, com a regra num lugar só. O `columnMapping` canônico da API mantém o `findCol` das rotas sem mudança. `leadsSheet` virou booleano no ponto 6 e o `_debug.leadsSheetExists` continua booleano. Observações REL-001 e MNT-001 (low).'
  unit_tests: 'OK. Web 176 arquivos, 2602/2602. API 5451/5461 (as 10 falhas são as da linha de base, ver no_regressions). Testes da story: web 78, API 25, todos verdes.'
  acceptance_criteria: 'AC1–AC8 ✓ (AC4c retirado) · AC9 ⏳ depois do deploy.'
  no_regressions: 'OK. As 10 falhas da API (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2) se repetem IGUAIS rodando os mesmos 5 arquivos num worktree descartável da `origin/main` 8a154a08 (62 testes, 10 falhas, mesmos nomes). Nenhum desses arquivos nem o código que testam está no diff. Nesta rodada não houve timeout na suíte da API. No web, um timeout em `dados-diarios-lyrio.test.ts` (não tocado) apareceu só quando a suíte do web rodou junto com a da API; na suíte cheia isolada, 2602/2602.'
  performance: 'OK. Uma leitura a mais por planilha `leads` extra (etapas têm 1 ou 2); na API as leituras rodam em `Promise.all`; o cache do ponto 6 segue (chave v7).'
  security: 'OK. Nenhuma rota nova; a consulta nova é Drizzle parametrizado (`eq` em `stage_id` e `type`), dentro das rotas que já validam params e acesso. A regex de instante é ancorada, sem quantificador aninhado (sem ReDoS). O log novo (`leadsSheets`) traz id, label e contagem, sem dado pessoal. URLs do web reutilizam as rotas existentes, com `encodeURIComponent` no nome da aba como em `useSheetData`.'
  documentation: 'OK. Comentários nos módulos novos e nos campos com sentido estreitado (`leadsPagosPorAnuncio`); Dev Agent Record com a T0, as reversões, os resultados e as decisões; File List confere com o diff (28 arquivos).'
  api_contract: 'OK (check 8). Nenhuma rota, parâmetro, campo de resposta ou snapshot novo: o diff da API não adiciona handler nem campo no payload (o `_debug.leadsSheetExists` segue booleano; `leadsSheets` vai só para o log). `packages/shared/src/contract.ts` sem diff, `API_CONTRACT_VERSION` = 64 na branch e na `origin/main` atual (`ade52a3a`). Sem bump, como a story declara.'

