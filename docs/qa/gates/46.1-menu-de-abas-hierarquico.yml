  AC2: "ENTREGUE — os 14 `value` sobrevivem literalmente; `ga4` continua `ga4` com rótulo 'Analytics'; único novo é `panorama`. Travado por teste de contrato E conferido 1:1 contra os `TabsContent` de `page.tsx`."
  AC3: "ENTREGUE — pai com aba própria carrega o próprio conteúdo; Dados abre em `surveys`, Inácio em `cadeia-cac`; submenu visível só enquanto o grupo está ativo, sem hover. A decisão 3 do @dev (pai com aba própria sempre volta para ela) é melhoria sobre a story, não desvio: sem ela quem entra em Meta Ads TESTE fica sem rota de volta."
  AC4: "ENTREGUE — launch sem captação paga deixa o grupo Meta Ads com 0 filhos, sem `▾` (`ehGrupoExpansivel` false, `ChevronDown` condicionado); família `null` faz o grupo Inácio sair do menu inteiro pelo filtro final. Provado por reversão (4 falhas)."
  AC5: "ENTREGUE COM RESSALVA — `?tab=` governa a aba, um parâmetro só, pai derivado do filho, `history.replaceState` (não empilha histórico), fallback silencioso para `meta-ads`. A ressalva é QA-451-01: em navegação client-side entre etapas o `?tab=` não é relido e a URL passa a discordar da tela."
  AC6: "ENTREGUE — `onOpenSpreadsheets={() => trocarAba('spreadsheets')}`; como o grupo é derivado do filho por `grupoDaAba`, o salto abre 'Dados', ativa 'Planilhas' e escreve na URL como qualquer outra troca. Nenhuma referência a `setActiveTab` sobrou no arquivo."
  AC7: "ENTREGUE — `<TabsContent value=\"panorama\">` novo em `page.tsx:785`, com as mesmas props (`projectId`, `stageId`). Nenhuma regra de cálculo tocada: é movimentação de árvore de componentes."
  AC7.1: "ENTREGUE — conferido linha a linha, que era o pedido. O `<PanoramaDoProjeto>` de `:212` permanece dentro do `if (data.semDados)`, com o comentário da 44.21 intacto; só o render normal migrou. Sem cobertura automatizada — QA-451-04."
  AC7.2: "ENTREGUE — `CHAVE`, `usePreferenciaDeAbertura`, o botão e o render condicional saíram de `panorama-do-projeto.tsx`; `git grep` confirma zero referência órfã a `panorama-cac:aberto` em `packages/`."
  AC8: "ENTREGUE — `overflow-x-auto` nas duas fileiras, sem `flex-wrap`; é o padrão de `event-stage-view.tsx:341`, um dos dois que a AC autorizava. A justificativa da escolha está no Dev Record, como a AC exigia."
  AC9: "ENTREGUE — badge de Meta preservado e o de YouTube junto; `iconClassName` idêntico item a item ao `className` do JSX antigo; nenhum arquivo de early-return tocado no diff."

