issues:
  - id: QA-451-01
    severity: medium
    category: contrato-de-url
    title: "A aba ativa sobrevive à troca de etapa, mas o `?tab=` não é relido — a URL passa a descrever outra tela"
    file: "packages/web/app/(app)/projects/[id]/funnels/[funnelId]/stages/[stageId]/page.tsx:78-89"
    story: "46.1 (AC5)"
    reproduced: false
    blocking: false
    description: >
      A aba ativa virou dois estados — `abaEscolhida` (clique) e `abaSolicitada`
      (link) — e o `?tab=` é lido **uma única vez**, num `useEffect` com deps
      `[]`.

      No App Router, ir de `/stages/A` para `/stages/B` não troca o segmento de
      rota, só o valor do param: o componente é reconciliado na mesma posição e
      o estado do `useState` sobrevive. O efeito de deps `[]` não roda de novo.

      Duas consequências, e a segunda é a que importa:

      1. O usuário cai na etapa B na mesma aba em que estava na A. Isso é o
         comportamento de antes (`useState("meta-ads")` também sobrevivia), não
         é regressão — e é até defensável.
      2. **A URL de B não tem `?tab=`, mas a tela mostra a aba antiga.** Copiar
         essa URL e mandar para um colega entrega Meta Ads, não o que estava na
         tela. É exatamente a promessa que a AC5 acabou de criar ("consiga
         mandar um link direto para a aba certa") falhando no caminho mais
         percorrido do app — a navegação entre etapas pela sidebar
         (`components/layout/project-folder.tsx:173` e `:945`, `router.push` e
         `<Link>` client-side).

      E o inverso também fica travado: um link interno que carregue `?tab=` é
      ignorado em navegação client-side, porque o efeito não relê.

      ⚠️ **Não reproduzido em navegador.** A conclusão vem de leitura de código
      + do comportamento de reconciliação do App Router. Se o Next remontar o
      componente na troca de `stageId`, o achado é nulo. É verificável em 30
      segundos na validação visual que já está pendente no DoD — por isso está
      registrado como item dela, e não como bloqueio.
    suggestedFix: >
      Trocar as deps do efeito de `[]` para `[params.stageId]` e, no mesmo
      efeito, zerar `abaEscolhida` — assim cada etapa relê o próprio `?tab=` e
      não herda o clique da anterior. Alternativa equivalente e mais barata de
      raciocinar: derivar a aba direto de `window.location` a cada troca, sem
      guardar `abaEscolhida`. Não mexe em AC nenhuma.
    verificarNaValidacaoVisual: >
      Abrir a etapa A, clicar em "NPS" (URL vira `?tab=nps`), e ir para a etapa
      B pela sidebar. Se a tela continuar em NPS com a URL sem `?tab=`, o
      achado procede.

  - id: QA-451-02
    severity: low
    category: acessibilidade
    title: "O `aria-labelledby` do painel aponta para um gatilho que não existe, e as setas do teclado deixaram de navegar entre abas"
    file: packages/web/components/funnels/stage-tabs-nav.tsx:20
    story: "46.1 (AC3, débito declarado pelo @dev)"
    reproduced: false
    blocking: false
    description: >
      **A justificativa técnica do @dev procede.** Dois grupos ("Dados",
      "Inácio") não têm aba própria; dar ao gatilho do pai o `value` do primeiro
      filho colocaria o mesmo `value` em dois `TabsTrigger` do mesmo `<Tabs>`, e
      o Radix deriva os `id` do DOM a partir do `value` — sairiam ids
      duplicados. E misturar `<button>` com `TabsTrigger` dentro de um
      `TabsPrimitive.List` de fato quebra o roving focus, que assume que todo
      filho é item. A decisão 2 está certa.

      **A avaliação de custo do conserto, não.** O @dev escreveu que corrigir
      exigiria "voltar ao Radix (impossível) ou trocar `<Tabs>` por render
      condicional, que é reescrever os 14 `TabsContent`". Há um terceiro
      caminho, de uma linha por elemento: com o IDREF do `aria-labelledby`
      quebrado, o cálculo do nome acessível cai no `aria-label` — então
      `<TabsContent value="nps" aria-label="NPS">` devolve o nome do painel sem
      tocar em arquitetura nenhuma. É atributo, não reescrita.

      Fica registrado também o que o débito não mencionou: a navegação perdeu o
      roving tabindex do Radix. Antes, 1 parada de Tab e as setas trocavam de
      aba; agora são até 14 paradas de Tab e as setas não fazem nada. Funcional,
      mas mais caro no teclado.

      Severidade `low` porque a navegação continua operável (botões reais,
      `aria-current`, `<nav aria-label>`), o painel continua alcançável, e este
      é um painel interno de operação.
    suggestedFix: >
      `aria-label` em cada `<TabsContent>` com o rótulo da aba (o `label` já
      está na config, dá para passar pelo mesmo mapa). As setas ficam como
      débito de uma story de a11y própria, se alguém pedir.

  - id: QA-451-03
    severity: low
    category: teste
    title: "O teste 'nunca devolve uma aba que o menu não renderiza' não cobre o caminho em que isso pode acontecer"
    file: packages/web/lib/utils/menu-de-abas.ts:253
    story: "46.1 (AC5)"
    reproduced: false
    blocking: false
    description: >
      `resolverAbaAtiva` abre com `if (abas.length === 0) return ABA_PADRAO;` —
      um caminho que devolve `"meta-ads"` justamente quando o menu está vazio,
      isto é, quando `"meta-ads"` **não** é renderizado. É a única linha do
      arquivo que contradiz o nome do teste que a protege.

      Hoje é inalcançável: `montarMenuDeAbas` sempre inclui o grupo `meta-ads`
      com `proprio` preenchido, então `abasDoMenu` nunca volta vazio. Por isso
      `low`, e não um defeito ativo.

      O que registro é o teste, não a linha: o caso "nunca devolve uma aba que o
      menu não renderiza" itera **quatro contextos fixos**, e os quatro contêm
      `meta-ads`. Ele afirma um invariante universal medindo quatro pontos onde
      o invariante não pode falhar. Se uma story futura tornar `meta-ads`
      condicional — que é o tipo de coisa que esta story acabou de tornar fácil
      —, o teste continua verde e a função passa a devolver um `value` sem
      `TabsContent`.
    suggestedFix: >
      Fazer o último `return abas[0].value` valer também para o caso vazio
      (devolver `""` ou lançar seria pior; o mais honesto é o próprio guard
      sumir, já que `abas` nunca é vazio), ou cobrir o invariante com um caso
      que monte um menu vazio à mão em vez de depender dos quatro contextos.

  - id: QA-451-04
    severity: low
    category: teste
    title: "A AC7.1 — o achado bloqueador do @po — não tem teste nenhum, só comentário"
    file: packages/web/components/funnels/cadeia-cac-stage-tab.tsx:206
    story: "46.1 (AC7.1)"
    reproduced: false
    blocking: false
    description: >
      O comportamento que o @po pegou como bloqueador (o Panorama que fica no
      early-return de `data.semDados`) está correto no código, mas é o único AC
      desta story sem cobertura automatizada. O runner do web coleta apenas
      `lib/utils/**/*.test.ts` — `.tsx` de componente não roda, e isso é
      deliberado (Story 29.35), não débito desta story.

      Resultado: um comportamento que **já foi quebrado uma vez no papel** (a
      AC7 original, antes do @po) fica protegido por dois comentários. Bons
      comentários — o de `:206-208` explica a decisão da 44.21 e o do ponto de
      remoção aponta de volta para ele —, mas comentário não falha em CI.

      `low` porque não há caminho barato: a lógica é de render, não é extraível
      para função pura sem inventar indireção, e ligar jsdom vale story própria.
      Fica declarado para que a próxima story que "limpar" o Panorama duplicado
      encontre este registro antes de apagar a linha.
    suggestedFix: >
      Nenhuma ação nesta story. Se a story de jsdom/testing-library acontecer,
      este é o primeiro caso a escrever.

