summary: >
  As nove ACs estão entregues, incluindo as duas que o @po criou na validação.
  O achado bloqueador dele (F1 → AC7.1) foi conferido linha a linha e está
  correto: o `<PanoramaDoProjeto>` do early-return de `data.semDados`
  permanece em `cadeia-cac-stage-tab.tsx:212`, com o comentário da 44.21 ainda
  no lugar, e só o render normal (`:224`) migrou para a sub-aba nova. Não é
  "os dois saíram" nem "os dois ficaram" — é exatamente o recorte que a AC
  pedia, e o @dev ainda deixou um comentário no ponto da remoção apontando de
  volta para a decisão.

  A armadilha F3 do @po (o teste que nasceria morto em `.test.tsx`) também foi
  fechada: o módulo é `.ts` sem JSX, o ícone é referência de componente, e a
  suíte do web foi de 642 para **662 testes em 40 arquivos** — reconferido
  nesta revisão, não aceito da declaração.

  **Os testes não são decorativos.** Duas reversões independentes foram
  executadas aqui: a do @dev (remover a regra da família em `montarMenuDeAbas`)
  derruba 4 testes, como ele declarou; e uma nova, que o @dev não fez — apagar
  a validação do `?tab=` em `resolverAbaAtiva`, deixando-a aceitar qualquer
  string — derruba outros 3, entre eles justamente o "nunca devolve uma aba que
  o menu não renderiza". O arquivo foi restaurado por `git checkout` e a árvore
  voltou limpa.

  Conferência que nem o @po nem o @dev registraram: o conjunto de `value` que o
  menu pode devolver e o conjunto de `<TabsContent value=...>` de `page.tsx`
  batem **1:1, nos 15 valores**. Não sobra aba sem conteúdo nem conteúdo sem
  aba — que é a metade do risco da AC5 que a função pura sozinha não cobre.

  **O que segura o gate não é um defeito de cálculo, é um buraco no contrato
  novo:** a aba ativa vive em dois `useState` que sobrevivem à navegação
  client-side entre etapas, enquanto o `?tab=` da URL não é relido. O usuário
  que troca de etapa pela sidebar continua vendo a aba antiga com uma URL que
  não a descreve — e URL que não descreve a tela é o inverso do que a AC5
  entrega. Ver QA-451-01. Some-se a isso o item de DoD nunca executado (a
  validação visual em 3 configurações e o teste do link `?tab=`), e o veredito
  é CONCERNS, não PASS.

