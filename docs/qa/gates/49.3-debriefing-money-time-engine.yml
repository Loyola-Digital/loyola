    tabela1: 'Pago Quente 606, Pago Frio 469, Pago N/D 36, Instagram orgânico 448, WhatsApp 141, ManyChat 36, Outros orgânicos 48, Sem track real 23 = 1.807; fechamento closer 13 + sem-closer 1.794 = 1.807'
