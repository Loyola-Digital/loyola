issues:
  - id: TEST-006
    severity: low
    category: tests
    description: 'Três mutações próprias sobreviveram. QA2-M6: tirar o unwrap só da classificação do comprador de CAPTAÇÃO (`classificar(..., utmLimpa(rep.v.utm), ...)`) passa, porque os testes de UTM em array só olham `auditoriaDeVendas` (principal). QA2-M8: no desempate, com dois ou mais `vendas-*` empatados e um `leads-*` com o mesmo mapeamento antes deles, a escolha pode cair no `leads-*`; o caso testado tem o `leads-*` com mapping vazio, então o mutante é equivalente ali. QA2-M10: `linhasNaoRelidas` só difere com 3+ vínculos e o teste tem 2. Nenhuma tem efeito no PG02: os arrays estão só no principal, e há 2 vínculos com mapeamentos diferentes.'
    recommendation: 'Na 49.5 (fixtures/guardas) ou num follow-up: (a) ingresso com `{"facebook","facebook"}` sem lead, afirmando o canal em `captacao.compradores`/`tabela1.canais[].ingressos`; (b) `escolherVinculoDaFonte([leads completo, vendas-a completo, vendas-b completo])` → índice 1, `empate-ordem-da-config`; (c) aba em 3 etapas → `linhasNaoRelidas = 2 × linhas`.'
    owner: '@dev'
    status: open

  - id: PO-001
    severity: low
    category: requirements
    description: 'Registro para o @po decidir (QA não decide): uma etapa `leads-*` contribui VENDAS quando a aba de venda está ligada só a ela. Medido no PG02, com config captação + principal + `leads-downsell` (sem `vendas-downsell`): o downsell sai com 34 vendas e R$ 20.714,40, vindos da cópia em `funnel_spreadsheets` (tipo `sales`, plataforma `sales`, mapping SEM `transactionId`/`productName`). Só a camada 2 roda, e a lacuna é a genérica `DEDUP_POR_ID_NAO_APLICADA`, sem dizer que veio de uma etapa de leads. Vem de `GRUPO_DO_PAPEL` (leads-downsell → downsell; leads-captacao → captacao) + `resolveSalesSheetsForStage`, que também devolve `funnel_spreadsheets` tipo `sales`. As campanhas dela também entram no grupo downsell: R$ 7.863,26 c/ imposto sozinha; R$ 11.885,55 junto com a `vendas-downsell` (R$ 4.022,29). O @dev registrou a mesma pergunta como AUTO-DECISION ("continua podendo contribuir").'
    recommendation: '@po: decidir se `leads-*` contribui só mídia/leads (e as vendas exigem um vínculo `vendas-*`) ou também vendas. Se decidir pelo primeiro, o loader passa a ignorar as abas de venda de etapas `leads-*`, com uma lacuna própria.'
    owner: '@po'
    status: open

  - id: INFO-001
    severity: low
    category: data
    description: 'Para a 49.5 classificar: closer no principal 56 × 22 da skill (eixo de fechamento da 49.2); Gravação = `order_bump` no `product_types` move ROAS só ingresso e tier. A parte "6 vendas com array em Outros orgânicos" do INFO-001 anterior NÃO se confirmou: só 1 das 6 está lá, e ficaria lá com ou sem array.'
    owner: '@po (49.5)'
    status: open

