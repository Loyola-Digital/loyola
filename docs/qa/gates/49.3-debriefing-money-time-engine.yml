    finding: 'A mesma aba ligada a duas etapas da config é lida duas vezes. No PG02, com a Downsell Captação como `leads-downsell`, o downsell dobra (R$ 20.714,40 → R$ 41.428,80).'
    suggested_action: '@dev: deduplicar a aba entre etapas no loader + diagnóstico + teste PGlite (iteração 2 curta).'
