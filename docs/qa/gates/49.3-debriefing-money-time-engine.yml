issues:
  - id: MNT-001
    severity: medium
    category: docs/contract
    description: 'A memória do `ticketCaptacao` formata o DENOMINADOR como dinheiro. `razao()` usa um único `formatar` para os dois lados, e o ticket passa `fmtReais`. Em produção sai "faturamento da captação R$ 230.501,64 ÷ compradores de captação R$ 1.807,00 = R$ 127,56". A memória é o texto que a 49.6 renderiza e que a 49.7 não pode contradizer (AC1). É a única razão com unidades mistas (ROAS = dinheiro÷dinheiro; conversões e % = contagem÷contagem).'
    recommendation: '`razao` passa a aceitar `formatarDen`, ou o ticket monta a memória à mão, com o denominador em `fmtInt`. Incluir um teste que afirme a memória exata do ticket ("÷ compradores de captação 5 =").'
    owner: '@dev'
    status: open

  - id: CONTRACT-001
    severity: medium
    category: contract
    description: '`captacao.compradoresUnicos.{porEmail,porEmailOuTelefone}` conta TODOS os compradores da etapa de captação, avulsos de order bump incluídos (o teste afirma 6 contra 5 ingressos). No PG02 isso dá 1.901/1.897, contra 1.807/1.806 do "comprador de captação = ingresso OU combo" (R2-1). O AC7 chama de "compradores únicos em dois critérios lado a lado" exatamente a comparação com a skill (1.845 × 1.807), e os números certos dela estão em `compradoresCaptacao.*.length`. Um consumidor (49.5 R6/49.6) que leia o campo pelo nome mostra 1.897 como a comparação com a skill. Nenhuma story consumidora cita `compradoresUnicos` hoje (grep).'
    recommendation: 'Renomear para algo explícito (`compradoresDaEtapaInclusiveAvulsos`) ou fazer `compradoresUnicos` = `compradoresCaptacao[crit].length`, mantendo o total com avulsos em `avulsos`. JSDoc no tipo. Ajustar o teste do AC7.'
    owner: '@dev'
    status: open

  - id: CONTRACT-003
    severity: low
    category: contract
    description: 'A 49.5 AC9 diz que o teste estático lê "como texto" os arquivos de engine/loader das 49.3/49.4/49.5 e exige que nenhum contenha `1.13`/`1,13`. Três comentários desta story têm `× 1,13` (`debriefing-hygiene.ts:32,123`; `debriefing-money-time-engine.ts:18`). O teste da própria 49.3 descarta comentários; o da 49.5, lido ao pé da letra, falharia.'
    recommendation: 'Reescrever os 3 comentários como "nunca o fator da skill" (fica sem o literal), ou a 49.5 declara que descarta comentários. Mais barato do lado da 49.3.'
    owner: '@dev (ou @po na 49.5)'
    status: open

  - id: TEST-001
    severity: low
    category: tests
    description: 'Q21 sobreviveu: o ROAS diário e o pico-artefato podem usar o investimento SEM imposto e a suíte não percebe, porque o cenário do AC11 roda com `imposto = 0`. A armadilha #10 só está travada sem imposto. Em produção o ROAS diário ficaria cerca de 14% alto, e o limiar seria comparado contra uma média com imposto.'
    recommendation: 'Um caso do AC11 com `imposto 0,1215` e datas ≥ 2026-01-01, afirmando `investimento` do dia = bruto ÷ (1 − pct).'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Q17 sobreviveu: `pctCompradoresPorCliques` com avulsos no numerador (no PG02 seria 5,30% em vez de 5,04%) passa. O teste do AC10 não tem avulso.'
    recommendation: 'Fixture do AC10 com 1 avulso, afirmando o numerador = `ingressosUnicos`.'
    status: open

  - id: TEST-003
    severity: low
    category: tests
    description: 'Q22 sobreviveu: o valor do TMB NA CAPTAÇÃO entrando no faturamento/ticket passa. O AC4 diz "TMB na captação segue a mesma regra", mas só o principal é testado.'
    recommendation: 'Planilha `tmb` na etapa de captação: a venda conta como comprador e o valor fica fora de `faturamentoCaptacao` e do ticket.'
    status: open

  - id: TEST-004
    severity: low
    category: tests
    description: 'Mutações sobreviventes de menor impacto: Q23 (UTM do lead por telefone antes do e-mail), Q24 (data do lead ignorando `mapping.timestamp`; a memória da 44.12 registra que as fontes de lead mapeiam `timestamp`, e o apelido só salva quando o cabeçalho se chama "timestamp"/"Data"), Q8b (`semIdentificador` da fonte não chega ao `diagnostico`).'
    recommendation: 'Um caso por item: lead com e-mail e telefone em registros diferentes; `mapping.timestamp` apontando para um cabeçalho fora dos apelidos; fonte sem e-mail nem telefone no teste do loader com PGlite.'
    status: open

  - id: DEC-OWNER-1
    severity: medium
    category: product
    description: 'Camada 2 (e-mail, produto) contra o número governante. No PG02 o Debriefing sai −R$ 596,30 do Resumão corrigido (R$ 230.501,64 × R$ 231.097,94), com os mesmos 1.807 compradores. As 9 linhas são recompras em outro dia, não evento duplicado. Duas pontas estruturais a decidir junto: (a) a camada 2 roda ANTES do corte de janela, então uma recompra dentro da janela cuja primeira compra está fora é removida, e a sobrevivente é cortada (medido no PG02: 0 casos); (b) a camada 2 roda sobre TODAS as planilhas e grupos (o mesmo produto na reabertura e no principal colapsaria).'
    recommendation: 'DONO decide: manter a regra da skill (a 49.5 classifica a diferença como `definicao`) ou colapsar só no mesmo pedido/dia. Se mantiver, decidir também se a camada 2 roda depois do corte de janela e por grupo.'
    owner: 'dono'
    status: pending_decision

  - id: DEC-OWNER-2
    severity: medium
    category: product
    description: 'Janela do debriefing: nenhuma story fixa o `periodo` que corta vendas e mídia. O motor exige `periodo`; a 49.6 (orquestrador) não o define (grep: nenhuma ocorrência de período/janela na 49.6).'
    recommendation: 'DONO decide. Sugestão do @dev: de `inicioCaptacao` até o maior entre `fimCarrinho`, `reabertura.fim` e `downsell.fim`. Registrar na 49.6.'
    owner: 'dono → @po (49.6)'
    status: pending_decision

  - id: DEC-OWNER-3
    severity: medium
    category: product
    description: '`manual_sales` fora do motor: o AC12 lista só planilhas. Em produção o PG02 tem 9 vendas manuais na etapa Vendas (principal) que o painel soma e o Debriefing não. No Netão, o closer por `seller_name` pode morar nelas.'
    recommendation: 'DONO decide se as vendas manuais entram (principal e/ou closer). Se entrarem, é AC novo, com loader e teste.'
    owner: 'dono'
    status: pending_decision

  - id: DATA-001
    severity: medium
    category: data
    description: 'O `product_types` da Captação Paga do PG02 não classifica "Imersão Equipe de Agentes Claude" (1.311 vendas, R$ 58.562,90). Hoje o número sai certo pelo default `ingresso` da etapa paga, mas o motor a lista em `produtosNaoClassificados`, e o F14 da 49.5 bloquearia o PG02, como foi desenhado.'
    recommendation: 'Alguém do time marca "Imersão Equipe de Agentes Claude" = `ingresso` pela UI de planilhas da etapa, antes da conferência da 49.5. É dado, não código, e não bloqueia o merge desta story.'
    owner: 'dono/time de tráfego'
    status: open

