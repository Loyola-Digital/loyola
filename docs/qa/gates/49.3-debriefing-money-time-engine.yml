    midia: 'bruto R$ 111.232,49 / c/ imposto R$ 126.616,38; impressões 2.397.701; link_click 35.882 (62 campanha×dia sem link_click, que não entram na soma); Quente 58,0% / Frio 42,0% / Indefinido 0'
