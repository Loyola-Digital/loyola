status_reason: 'Re-gate da iteração 1: tudo o que o gate de 2026-10-01 pediu foi corrigido e conferido. MNT-001 e CONTRACT-001 foram lidos no payload REAL do PG02 (memória "÷ compradores de captação 1.807 = R$ 127,56"; `compradoresUnicos` 1.807/1.806; avulsos em `compradoresDaEtapaInclusiveAvulsos` 1.901/1.897). CONTRACT-003 fechado, TEST-001..004 escritos e as 19 mutações do @dev morrem também na rodada do QA. As decisões 1A, 2A e 3A estão implementadas: 7 das 10 mutações próprias do QA morrem, e as 3 sobreviventes são low. A conferência do PG02 foi refeita com as datas REAIS do perfil §1b (janela 16/04 → 13/06): o faturamento do principal s/ TMB dá R$ 245.800,00, exatamente o §8, com as 9 vendas manuais; 0 vendas excluídas por serem anteriores à abertura; 71 × 70 vendas é o mesmo comprador com 2 produtos TMB em 03/06, R$ 0. O que segura o PASS é um achado NOVO (REL-001, medium): a mesma aba de planilha ligada a duas etapas da config é lida duas vezes. No PG02 isso acontece quando a "Downsell Captação" entra como `leads-downsell`, e o faturamento do downsell dobra de R$ 20.714,40 para R$ 41.428,80. Recomendo corrigir antes do merge, numa iteração 2 curta.'
