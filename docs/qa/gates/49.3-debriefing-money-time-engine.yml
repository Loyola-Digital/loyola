  4_security_pii: 'PASS — o payload do PG02 tem 0 "@" nas 5 configs rodadas. `fontesDuplicadas` leva o nome da aba e ids de etapa e de planilha, sem dado de cliente.'
  5_performance: 'PASS — a mudança REDUZ leitura de planilha (a aba repetida não é relida). O unwrap é O(tamanho da célula) por campo.'
  6_regression: 'PASS — 808/808. Captação, principal e Tabela 1 do PG02 ficam idênticos aos do re-gate anterior.'
