status_reason: 'O código está correto e bem protegido. Os 13 ACs foram implementados, as 130 suítes da story passam, o tsc e o eslint estão limpos e o Epic 41 segue intacto (768/768). Das 32 mutações do QA, 26 foram mortas. Refiz em produção, só leitura, a conferência do PG02 e cheguei aos mesmos números do @dev, sem PII no payload. Dois achados médios de contrato pedem um ajuste pequeno do @dev antes do merge: a memória do ticket mostra os compradores como "R$ 1.807,00" (MNT-001); o campo `captacao.compradoresUnicos` traz 1.901 compradores, avulsos incluídos, e não o comprador de captação da R2-1, que são 1.807 (CONTRACT-001). Ficam ainda três decisões do DONO que mudam número (camada 2, janela, `manual_sales`) e uma pendência de DADO: a Imersão do PG02 não tem `product_types`.'
