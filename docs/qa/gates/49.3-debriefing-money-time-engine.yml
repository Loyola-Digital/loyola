issues:
  - id: REL-001
    severity: medium
    category: reliability/data
    description: 'O loader lê as planilhas de venda de CADA etapa da config (`resolveSalesSheetsForStage` por etapa) e não deduplica entre etapas a mesma aba (`spreadsheetId` + `sheetName`). No PG02, a aba `n8n-kiwify-downsell` está ligada à "Downsell Vendas" (`stage_sales_spreadsheets`, subtype main_product, com `transactionId`/`productName` mapeados) E à "Downsell Captação" (`funnel_spreadsheets` tipo `sales`, SEM `transactionId`/`productName`). Com a config natural (Downsell Captação = `leads-downsell`, Downsell Vendas = `vendas-downsell`), as 83 linhas entram duas vezes: a camada 1 é por planilha e não pega; a camada 2 não colapsa porque o produto da cópia sai nulo. Resultado medido em produção: faturamento do downsell R$ 20.714,40 → R$ 41.428,80 (2×). A única pista no payload é a lacuna genérica `DEDUP_POR_ID_NAO_APLICADA` ("falta transactionId e productName"), que não diz que a aba já foi lida em outra etapa. O mesmo pode acontecer (hipótese, não medida) numa captação gratuita (`leads-captacao`) que tenha a planilha do principal ligada para medir conversão: as vendas do principal entrariam também no grupo captação. O defeito existe desde a38d381a, mas a 2A o tornou alcançável no PG02, porque a janela agora vai até o fim do downsell.'
    recommendation: 'No loader: deduplicar as abas por `spreadsheetId|sheetName` entre as etapas, mantendo a da etapa `vendas-*` (ou a de mapeamento com ID + produto), e registrar `diagnostico.planilhaEmMaisDeUmaEtapa` (como já existe `campanhasEmMaisDeUmaEtapa`), com lacuna própria no motor. Teste no PGlite com a mesma aba em duas etapas, afirmando o faturamento simples. Discutir com o @po se uma etapa `leads-*` deve contribuir VENDAS (a resolução 10 só agrupa os papéis).'
    owner: '@dev'
    status: open

  - id: TEST-005
    severity: low
    category: tests
    description: 'Três mutações próprias sobreviveram: QA-M2 (empate do downsell com o carrinho vira `fimPor: downsell.fim`; o JSDoc diz que o empate fica com o carrinho e só o empate da reabertura é testado); QA-M5 (venda manual com produto marcado no `product_types`, por exemplo como combo, cai no default da etapa; o teste usa "Imersão" = ingresso numa etapa paga, onde o default também é ingresso); QA-M9 (manual fora de `vendasGrupo`: muda a contagem de vendas do downsell e da reabertura e o "N vendas" da nota de TMB; nenhum teste tem manual nesses grupos).'
    recommendation: 'Três casos: empate downsell × carrinho; manual com produto classificado diferente do default da etapa; manual no downsell afirmando `apendiceReabertura.vendas`/vendas do downsell.'
    owner: '@dev'
    status: open

  - id: INFO-001
    severity: low
    category: data
    description: 'Para a 49.5 classificar, não é código desta story: closer no principal 56 × 22 da skill (eixo de fechamento da 49.2: 47 por `utm_medium=x1` + 9 manuais por `seller_name`); 6 vendas do principal com UTM em formato de array do Postgres (`m={"emailm","emailm"}`, `s={"qr","qr"}`) vindas da planilha n8n e classificadas como "Outros orgânicos"; Gravação = `order_bump` no `product_types`, o que move ROAS só ingresso e tier contra o §8.'
    owner: '@po (49.5)'
    status: open

