status_reason: 'Re-gate da iteração 2: REL-001 (medium) fechado e conferido em produção. Com `--downsell --leads-downsell`, o PG02 dá downsell de R$ 20.714,40 (34 vendas). A aba `n8n-kiwify-downsell` é lida uma vez, vale a Downsell Vendas pelo critério `mapeamento-id-e-produto`, e a lacuna `FONTE_EM_MAIS_DE_UMA_ETAPA` aparece. Com a Downsell Captação ANTES na config, o resultado é o mesmo. Sem as flags, o downsell dá R$ 0, e só com `--downsell` dá R$ 20.714,40. Captação (R$ 230.501,64) e principal (71, R$ 245.800,00) não mudam em nenhuma das 5 configs. O unwrap de UTM em array foi conferido venda a venda contra um motor sem unwrap, rodado sobre o mesmo input carregado (com o nome da campanha também revertido): 0 de 71 vendas do principal e 0 de 1.807 compradores de captação mudam de canal ou de fechamento. As únicas diferenças no payload são os campos de UTM exibidos (`utmVenda`/`tuplas`). TEST-005 está fechado. As 4 mutações pedidas morrem: escolha do vínculo cortada no fio, dedup da aba desligada, unwrap escolhendo um valor, unwrap só no lead. No total, 9 de 12 mutações próprias morrem, e as 3 sobreviventes são low. Suítes 177/177; regressão 808/808; `tsc` e `eslint` limpos. Não resta nada médio ou alto.'
