checks:
  code_review: 'OK com ressalvas (ARCH-001). Tabela própria: a 41.1 está intocada (git diff origin/main vazio em service, rota e teste da 41.1). O gate mora numa função só (aplicarGateDebriefing: tipo → sem config → combinação → completude), usada pelo carregador e pelo bloqueio do GET. O carregador checa o tipo antes de ler a config. A rota resolve guest → 400 → 404 (etapa inexistente, de outro funil ou projeto, ou que não é Debriefing). Perpétuo aceita só corpo {}, mobile dá 422 no PUT e no validate, e a falha da planilha dá 503 no PUT e "falha" (≠ sem-pesquisa) no GET. premissaMudou compara JSON estável e ignora ordem de chaves e listas. Contrato DebriefingConfig em união por tipoDeFunil, com os nomes da seção "Contrato exportado".'
  unit_tests: 'OK — debriefing-config 43 + routes 30 + launch-report-config 12 = 85/85 (vitest 4.1, 3,2 s). Mutações do @qa (15, cada uma restaurada com git checkout). Mortas: M1 (&& → || na combinação), M2 (chave só por funnelId), M3 (IDOR projeto), M4 (IDOR funil), M5 (guest liberado), M7/M8/M9 (perguntas/comparação/closerPorSellerName fora da premissa), M14 (validate aceita mobile), M15 (faixa não exigida). Sobreviveram: M6 e M10 (TEST-002); M11, M12 e M13 no store Drizzle (TEST-001), com o comportamento real provado em PGlite (19/19).'
  acceptance_criteria: 'AC1 ✓ (PGlite; 41.1 intacta) · AC2 ✓ · AC3 ✓ · AC4 ✓ · AC5 ✓ (faixa null explícita chega ao contrato; chave inexistente → 400; planilha fora → 503 sem gravar) · AC6 ✓ corpo exato; lista = constante única, 17 pares conferidos em produção · AC7 ✓ com ressalva ARCH-001 · AC8 ✓ (3 rotas, guest 403, 404 de tipo/IDOR, imposto com procedência, contrato 29→30 com histórico) · AC9 ⚠ tsc/testes/41.1 ✓; "em dev" = PGlite (REQ-001); prova em produção pendente pós-deploy · AC10 ✓ (zod enum + $type + CHECK; mediums trim/lower/dedup; [] ≠ ausente) · AC11 ✓ (perpetual corpo exato; mobile com o tipo no detalhe; antes do gate de combinação).'
  no_regressions: 'OK — tsc --noEmit da API (binário direto, 36 s) e do shared: 0 erros. eslint (binário da raiz) nos 7 arquivos da API: 0. As 10 falhas pré-existentes da suíte completa (relato do @dev, iguais às da origin/main) não foram re-rodadas pelo @qa: nenhum arquivo delas é tocado pelo diff.'
  performance: 'OK para o escopo (PERF-001 low para a 49.6).'
  security: 'OK — guest 403 nos 3 endpoints, antes de qualquer leitura. IDOR: a etapa precisa pertencer ao funil e ao projeto da URL, provado com o join real em PGlite. validado_por = request.userId (FK users SET NULL). Corpo .strict() em todos os níveis. Nenhuma escrita em produção: o @qa só fez SELECT com default_transaction_read_only = on (conferido com show).'
  migration: 'OK em PGlite — aditiva, IF NOT EXISTS, rollback documentado no topo. 0160 livre: origin/main e todas as branches locais e remotas param em 0159; o worktree do outro agente (feat/49.2) também. Nomes de constraint no padrão das 0086/0087. FK stage CASCADE coerente (config sem etapa não tem sentido), enquanto debriefings.stage_id é SET NULL (os documentos sobrevivem): desenhos diferentes e corretos. NÃO aplicada em produção (REQ-001).'
  three_layers: 'OK — dimensaoDeCriativo: z.enum(DIMENSOES_DE_CRIATIVO) → $type<DimensaoDeCriativo> → CHECK no banco. papel: z.enum(DEBRIEFING_PAPEIS) (derivado de LAUNCH_REPORT_ETAPAS por spread) → jsonb $type<EtapaDoLancamento[]>, e o gate re-checa o enum na leitura. faixa null: zod nullable → jsonb → contrato (provado ponta a ponta em PGlite). closerMediums: zod trim/min(1) → normalizarCloserMediums → jsonb. Datas: regex + dataExiste no zod; o date do banco volta como string (o parser do node-postgres no drizzle sobrescreve DATE; o harness usou o mesmo).'
  api_contract: 'OK — API_CONTRACT_VERSION 29 → 30 com histórico. Nenhuma outra branch reserva o 30. O web NÃO quebra: ninguém consome as rotas novas, e o bump só aciona o banner (web-atras/api-atras) na janela entre os deploys Railway/Vercel, que é o comportamento desenhado na 29.46. O único outro uso, em gerador-de-anuncio, troca a mensagem de erro ao salvar. O histórico já manda a 49.6 tratar 404 como "API atrás". packages/mcp não é afetado.'
  downstream_contract: 'OK — 49.6 AC1 passo 3: ordem tipo → combinação/incompleta e rotas …/debriefing/config(/validate) batem. 49.10: o ramo perpetual de montarDebriefingConfig existe; a remoção do bloqueio é 1 linha em assertTipoDeFunilSuportado. 49.4: perguntasConfirmadas {[stageId]:{faixa:string|null,…}} e dimensaoDeCriativo batem. 49.3: datasChave.inicioCaptacao e aberturaCarrinho batem (DOC-001 é o texto da 49.3). 49.2: closerMediums e closerPorSellerName batem; closerNomes não é desta config (decisão da story).'

