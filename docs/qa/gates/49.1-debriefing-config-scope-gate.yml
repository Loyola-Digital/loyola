top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'Inalterado. O AC9 pede a migration "aplicada em dev e revertida ao menos uma vez"; foi feito em PGlite (não há banco de dev; o .env local é produção). O @qa re-provou a 0160 de c1822b0b em PGlite (18 colunas, idempotente, 2 FKs + CHECK + pkey, stage_uniq, rollback → 0, reaplicada → 18). Em produção, to_regclass(debriefing_configs) = null em 01/10 (SELECT com default_transaction_read_only = on). Sem a tabela, as 3 rotas dão 500. A consulta de prova do topo do .sql agora espera "pkey, 2 FKs, 1 CHECK".'
    suggested_action: 'Dono ou @devops: aplicar a 0160 à mão ANTES de qualquer consumidor das rotas (49.6) ir ao ar e colar a prova por information_schema/pg_constraint na story; ou registrar WAIVED aceitando PGlite como "dev". O @qa não decide.'
  - id: 'INFRA-001'
    severity: low
    finding: '@electric-sql/pglite@0.5.8 entra como devDependency da API (25 MB em node_modules/.pnpm). Conferido: (1) pnpm install --frozen-lockfile passa ("Lockfile is up to date"; o CI usa o mesmo comando); (2) o único importador é src/__tests__/debriefing-config-store.test.ts, nenhum código de produção; (3) o lockfile só muda o id do snapshot do drizzle-orm (peer opcional) e não há outro importador do drizzle-orm com o id antigo; (4) o drizzle-kit do CMD só usa pglite com driver: "pglite", que o drizzle.config.ts não declara, então o push do boot continua no pg. Custo: o Dockerfile instala sem --prod e o estágio runtime copia /app/node_modules inteiro, então a imagem cresce ~25 MB. A imagem já carrega todas as devDependencies (typescript, vitest, eslint…), então o padrão é anterior à story. Também o tsc do build compila src/__tests__ para dist/ (dist/__tests__ existe), e por isso o build precisa dos tipos do pglite: um --prod no estágio de build quebraria (como já quebraria por causa do vitest).'
    suggested_action: 'Classificação: aceitável, low, não bloqueia. Alternativa para o @devops avaliar (fora desta story): estágio runtime com node_modules de "pnpm install --prod --frozen-lockfile" (ou pnpm deploy --prod), mantendo drizzle-kit (é dependency) — isso tira pglite E as demais devDeps da imagem; e/ou excluir src/__tests__ do tsconfig de build. O @qa não muda o Dockerfile.'
  - id: 'DEC-001'
    severity: low
    finding: 'Remover a FK da comparação é coerente com o AC1 (que só exige FK de stage CASCADE e de validado_por SET NULL) e com o princípio do epic "premissa mudou → reconferir"; o SET NULL anterior tornava "comparação apagada" indistinguível de "sem comparação" e deixava a config validada. Integridade: o PUT continua exigindo funil do mesmo projeto e o carregador re-confere a cada leitura; o id órfão fica como rastro. O efeito colateral é de produto: numa combinação LIBERADA, apagar o funil de comparação (que é OPCIONAL, AC3) passa a bloquear o debriefing inteiro com CONFIG_INCOMPLETA até alguém trocar ou remover a comparação. O AC3 diz "ausência nunca bloqueia o gate"; aqui não é ausência, é premissa quebrada, mas o nome comparacaoAusente convida à leitura contrária.'
    suggested_action: '@po confirma que bloquear (em vez de gerar sem comparação com aviso) é o comportamento desejado. Se sim, nada a fazer; opcionalmente renomear para comparacaoOrfa numa story futura.'
  - id: 'UX-001'
    severity: low
    finding: 'Com a comparação órfã, a leitura derruba validado mas o GET continua devolvendo validadoEm, validadoPor e validadoPorNome da conferência antiga, e o POST /validate responde 200 sem que a leitura volte a valer (validado sai false de novo). Numa combinação fora da lista, o bloqueio é COMBINACAO_NAO_VALIDADA com o detalhe "ainda não foi conferido para esta combinação", que manda conferir de novo em vez de trocar a comparação. O caminho certo está em camposFaltantes. Lido no código (montarConfigBruta e rota validate); não há defeito de dado.'
    suggested_action: 'Na 49.6 (formulário): exibir camposFaltantes junto do bloqueio e não mostrar "validado por X" quando validado = false; opcionalmente o /validate recusar com 409 enquanto comparacaoAusente.'
  - id: 'TEST-003'
    severity: low
    finding: 'O scanner do R1 percorre só packages/api/src (sem __tests__). packages/api/scripts/*.ts já importam services de src/ (confere-contagem-perpetuo.ts, confere-db-first-ads.ts, mede-panorama.ts…), e um script ali que importe loadDebriefingConfigRaw não seria pego. São scripts de diagnóstico, não geradores, por isso o risco é baixo. Limites conhecidos do regex (import com especificador montado em runtime) são aceitáveis.'
    suggested_action: 'Opcional, na 49.3: incluir ../scripts na varredura.'
  - id: 'PERF-001'
    severity: low
    finding: 'Inalterado: cada GET abre a planilha de todas as etapas do funil com pesquisa. Agora o GET também lê o contexto da etapa duas vezes (resolver + porta crua), por PK, custo aceito pelo @dev para ter uma porta crua só.'
    suggested_action: 'Na 49.6: cache ou ?perguntas=1.'
  - id: 'DOC-001'
    severity: low
    finding: 'Inalterado: a 49.3 (linha ~143) fala em "etapas com papel = captacao"; o vocabulário é leads-captacao | vendas-captacao | … Não é defeito da 49.1.'
    suggested_action: '@po ajusta o texto da 49.3.'

