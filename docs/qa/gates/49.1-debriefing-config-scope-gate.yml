top_issues:
  - id: 'REQ-001'
    severity: medium
    finding: 'O AC9 pede a migration "aplicada em dev e revertida ao menos uma vez". A aplicação e a reversão foram feitas em PGlite (Postgres 16 em WASM) porque não existe banco de dev: o .env local aponta para produção. O @qa reproduziu a prova em PGlite: 18 colunas; reaplicação idempotente; índices pkey e stage_uniq; FKs stage→CASCADE, comparação→SET NULL e validado_por→SET NULL; CHECK barra "carrossel"; UNIQUE barra duplicata; rollback do topo do .sql deixa 0 colunas; reaplicada depois do rollback. A DDL é simples, e o padrão inline REFERENCES é o mesmo das 0086/0087. O risco residual não está na DDL. Está na aplicação manual em produção: to_regclass(debriefing_configs) = null em 01/10, e sem a tabela as 3 rotas dão 500.'
    suggested_action: 'Classificação do @qa: CONCERNS, aceitável como prova de DDL. Não equivale ao texto do AC9. WAIVED só com o dono. O dono ou o @devops aplica a 0160 à mão ANTES de qualquer consumidor das rotas (a 49.6) ir ao ar, e registra a prova por information_schema na story (consultas no topo do .sql). Se o dono aceitar PGlite como "dev", basta registrar o waiver.'
  - id: 'TEST-001'
    severity: medium
    finding: 'Nenhum teste exercita o store Drizzle real (criarDebriefingConfigStore). As rotas e o carregador são testados só com o store em memória. Mutações do @qa que sobreviveram (73/73 verdes): M11, gravar() deixa de zerar validado no UPDATE (o reset de premissa vira decorativo no banco); M12, etapasComPesquisa ignora funnel_surveys; M13, contextoDaEtapa troca projects.id por funnels.id (a checagem de IDOR da rota passa a comparar o id errado). O comportamento real foi provado pelo @qa num harness PGlite com drizzle pg-proxy, parsers iguais aos do node-postgres e Fastify inject. Resultado 19/19: IDOR 404 por projeto e funil da URL; guest 403; sem config → COMBINACAO_NAO_VALIDADA; validate sem config → 404; PUT grava mediums normalizados e validado=false; validate grava validado_por; o load real devolve o contrato launch com faixa:null e imposto de origem project; PUT reordenado não reseta; PUT trocando papel reseta no banco; faixa ausente em etapa com funnel_surveys → CONFIG_INCOMPLETA; comparação de outro projeto → 400; mobile → 422; CASCADE e SET NULL. O código está correto hoje. O que falta é a rede de regressão.'
    suggested_action: 'Transformar o harness em teste. Opção 1: @electric-sql/pglite como devDependency da API e um debriefing-config-store.test.ts que aplica a 0160 + DDL mínima. Opção 2: no mínimo, um teste que prenda o reset no UPDATE e o join do contexto. Ver [[feedback-sql-mais-funcao-pura]].'
  - id: 'TEST-002'
    severity: medium
    finding: 'M6 sobreviveu. A mutação faz o gate checar a completude ANTES da combinação: config fora da lista, sem validado e incompleta passa a devolver CONFIG_INCOMPLETA em vez de COMBINACAO_NAO_VALIDADA. O AC6 fixa a semântica: CONFIG_INCOMPLETA só "quando a combinação está liberada". O código está certo, mas nenhum teste combina "fora da lista + sem validado + incompleta". M10 também sobreviveu: trocar só o papel de uma etapa (stageId igual) não reseta validado. O código reseta (provado no harness PGlite), mas nenhum teste cobre. O papel decide headline × apêndice na 49.3.'
    suggested_action: 'Adicionar 2 casos em debriefing-config.test.ts: (a) incompleta + fora da lista + validado=false ⇒ erro COMBINACAO_NAO_VALIDADA; (b) premissaMudou com a mesma lista de stageIds e um papel trocado ⇒ true. Reverter M6 e M10 para provar.'
  - id: 'ARCH-001'
    severity: medium
    finding: 'Existe uma segunda porta crua exportada. A rota de leitura usa montarConfigBruta(store, ctx), que devolve DebriefingConfigRaw com todas as datas, etapas e perguntas sem gate, e não usa loadDebriefingConfigRaw. Esta só é chamada pelos testes: é código morto em produção. O teste do R1 filtra as exportações por /^load/ e por isso não enxerga montarConfigBruta nem criarDebriefingConfigStore().linhaDaConfig. Um gerador da 49.3+ que importe montarConfigBruta pula o gate sem quebrar teste. Isso enfraquece o AC7 ("essa é a única porta") e a mitigação do R1, que é risco alto na story.'
    suggested_action: 'A rota de leitura passa a usar loadDebriefingConfigRaw (ou essa função é renomeada para ser a única variante crua), e montarConfigBruta deixa de ser exportada (teste via loadDebriefingConfigRaw). Além disso, um teste de superfície que lê src/ e falha se algum arquivo fora de routes/debriefing-config.ts importar a variante crua ou o store. Ver [[feedback-runner-que-enxerga-o-arquivo]].'
  - id: 'REL-001'
    severity: low
    finding: 'O PUT faz select-then-insert. Dois "salvar" simultâneos na primeira gravação de uma etapa batem no UNIQUE debriefing_configs_stage_uniq e o segundo recebe 500. A 41.1 tem o mesmo padrão.'
    suggested_action: 'insert … onConflictDoUpdate(target: stageId) no store, mantendo o cálculo de resetarValidado a partir da linha lida. Pode ficar para a 49.6, que traz o formulário.'
  - id: 'REL-002'
    severity: low
    finding: 'Apagar o funil de comparação faz a FK zerar lancamento_comparacao_funnel_id (SET NULL), comprovado em PGlite. Isso muda uma premissa sem resetar validado: a 49.6 passa a gerar edição única numa config "validada" com comparação.'
    suggested_action: 'Aceitável (apagar funil é raro e a comparação é opcional). Se quiser fechar: o carregador trata "comparação apagada" como campo a reconfirmar, ou a 49.6 avisa. Decisão do @po.'
  - id: 'PERF-001'
    severity: low
    finding: 'Cada GET da config abre a planilha de TODAS as etapas do funil que têm pesquisa (computeSurveyForStage em Promise.all), inclusive quando o formulário só precisa do estado do gate.'
    suggested_action: 'Na 49.6, avaliar cache ou um parâmetro ?perguntas=1. Não bloqueia: hoje nenhuma tela consome a rota.'
  - id: 'DOC-001'
    severity: low
    finding: 'Inconsistência entre stories: a 49.3 (linha ~143) fala em "etapas com papel = captacao", mas o vocabulário fixado pela 49.1 é DEBRIEFING_PAPEIS = leads-captacao | vendas-captacao | vendas-principal | leads-downsell | vendas-downsell | reabertura. Não há defeito na 49.1.'
    suggested_action: '@po ajusta o texto da 49.3 para o papel exato (provavelmente vendas-captacao).'

