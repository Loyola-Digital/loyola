summary: >
  AC1 a AC4 estão entregues e eu as conferi contra o código, não contra a
  story. O repasse existe de verdade (a armadilha clássica desta mudança);
  `offset: 0` **é enviado** (verificado empiricamente, não deduzido do tipo);
  o teto de 500 iguala a rota sem tocar no default; e os cinco trechos de doc
  foram reescritos com texto factualmente correto — checado campo a campo
  contra `public-meta.ts`.

  A afirmação mais importante da story também confere, e é a que mais importa
  para o veredito: **o detector da 44.22 é cego a esta mudança**. Ele compara
  nomes de tool como conjunto e esta story não adiciona nem remove nome nenhum.
  Num gateway com bundle velho, `faltando` e `sobrando` ficam vazios, o aviso
  não é registrado, e o roster fica idêntico ao de um gateway em dia. A story
  não está sendo pessimista — o código confirma.

  Dois achados novos, nenhum introduzido por esta story, ambos `medium`:

  1. **O desempate por `adId` NÃO acontece quando a métrica de ordenação é
     `null`** — e é `null` em 6 dos 10 `orderBy`. A story declara este risco
     como "não se aplica"; a rota só o resolve para as 4 métricas que nunca
     são nulas. É a única garantia de segurança da paginação por offset, e ela
     é parcial. Ver QA-4424-01.

  2. **"Não dá para ter teste neste setup" é falso.** `packages/api` tem
     `"test": "vitest run"`, e o teste de contrato que o próprio @dev rodou já
     lê `packages/mcp/src/tools.ts`. A asserção que travaria esta classe de
     defasagem cabia no arquivo que já existe, com zero infra nova — e é
     exatamente a defasagem que a story existe para consertar. Ver QA-4424-02.

