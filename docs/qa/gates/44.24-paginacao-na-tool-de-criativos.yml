    (`:132`) e no objeto de query (`:138`). O repasse foi verificado nas três
    pontas, e `offset: 0` foi verificado CHEGANDO na URL, não deduzido do tipo.
  AC2: >
    ENTREGUE — `.max(500)` igual à rota; default intocado (a tool segue sem
    `.default()`, quem decide é o `.default(50)` da rota). Nada acima de 500.
  AC3: >
    ENTREGUE — a `description` (`:109`) traz os quatro campos da resposta, o
    laço (`somar limit ao offset`), a condição de parada (`truncated` false) e
    a proibição de concluir contagem a partir de resposta truncada.
  AC4: >
    ENTREGUE — os 5 trechos reescritos e fact-checados contra a rota, mais 2
    linhas aditivas corretas. Doc viva sem menção sobrevivente à limitação
    removida. Nit `low` em QA-4424-04.
  AC5: >
    ⛔ **PENDENTE** — exige rebuild e restart do gateway (@devops) e o probe de
    verificação. Nada disso está ao meu alcance nesta sessão, e o @dev declarou
    a pendência com evidência em vez de silêncio, que é o comportamento certo.
    Enquanto não for feita, **a tool alterada não existe para o Inácio**: o
    arquivo mudou na `main`, o bundle do gateway não.
    E o detector da 44.22 **não vai avisar** — confirmado no código (V8).

