achados:
  - id: QA-4424-01
    severidade: medium
    titulo: "O desempate por `adId` não dispara quando a métrica é `null` — e é `null` em 6 dos 10 `orderBy`"
    onde: "packages/api/src/routes/public-meta.ts:392-403 (rota, herdado da Story 43.4)"
    evidencia: >
      `orderVal` devolve `-Infinity` para valor não-numérico (`:394`). Quando os
      DOIS lados são `null`, `d = orderVal(b) - orderVal(a)` = `-Infinity -
      (-Infinity)` = **NaN**. A guarda é `d !== 0`, e `NaN !== 0` é `true` — o
      comparador **retorna NaN e nunca chega ao `localeCompare(b.adId)`**.
      Pela ECMA-262 (SortCompare), comparador que devolve NaN é tratado como
      `+0`; `Array.prototype.sort` é estável desde ES2019, então a ordem que
      sobra é a de ENTRADA.
      A ordem de entrada é a de inserção do `Map byAd` (`:325-345`), que é a
      ordem das linhas de um `SELECT` **sem `ORDER BY`** (`:298-314`).
      Reproduzido com o comparador literal da rota: `[z,a,m]` todos com
      `roas: null` saem `z,a,m` (ordem de entrada) em vez de `a,m,z`.
      Nulos vêm de `safeDiv` (`meta-metrics.ts:55`, `den > 0 ? … : null`) e das
      guardas `impressions > 0`: são `ctr`, `cpc`, `cpm`, `cpl`, `cpa` e
      `roas` — 6 dos 10 valores do enum. Seguras: `spend`, `impressions`,
      `clicks`, `leads`.
    impacto: >
      A rota comenta o desempate como "OBRIGATÓRIO... senão paginar por offset
      pula ou repete criativo" (`:396-399`). A garantia vale para o default
      (`spend`) e falha justamente no caso mais comum de empate em massa: num
      projeto de geração de leads, `purchases = 0` em todo criativo, então
      `cpa` e `roas` são `null` em TODOS — e a ordenação inteira vira a ordem
      do banco. Aí paginar depende de o Postgres devolver as linhas na mesma
      ordem em duas requisições, o que ele não garante (seq scan sincronizado,
      plano paralelo, ou sync concorrente gravando linhas no meio).
      E a descrição da tool convida exatamente a isso: "Use orderBy para
      rankear (ex.: 'ctr', 'cpa', 'roas'...)".
    nao_e_regressao: >
      Nasceu com a Story 43.4, não com esta. Mas esta é a story que torna o
      caminho de offset alcançável pelo agente, e a que afirma na tabela de
      riscos: "Paginação pular ou repetir criativo → **Não se aplica**: a rota
      já desempata por `adId`". A afirmação é verdadeira pela metade e foi
      feita sem qualificação.
    atencao_ao_probe: >
      ⚠️ O probe da AC5 (duas páginas, conferir que os `adId` não se repetem)
      **provavelmente PASSA mesmo com este defeito**: duas chamadas seguidas
      costumam trazer a mesma ordem do banco. Ele confirma a presença do
      `offset`, não a estabilidade da ordenação. Não leia um probe verde como
      refutação deste achado.
    suggestedFix: >
      Story de follow-up em `public-meta.ts`: `const d = orderVal(b) -
      orderVal(a); return Number.isFinite(d) && d !== 0 ? d :
      a.adId.localeCompare(b.adId);` — uma linha, e o desempate passa a valer
      para os 10 `orderBy`. Vale um teste que ordene por `roas` com todos os
      valores nulos e exija ordem por `adId`, provado por reversão.
    dono: "@sm/@po — abrir follow-up. Fora do escopo desta story (é a rota)."

  - id: QA-4424-02
    severidade: medium
    titulo: "O teste era possível, e no arquivo que o @dev já rodou"
    onde: "packages/api/package.json · packages/api/src/__tests__/llms-txt-contrato.test.ts:41"
    evidencia: >
      A story conclui "não há runner" e o Dev Record escreve "não dá para ter
      neste setup". O que foi verificado é que **`packages/mcp`** não tem
      script `test` — verdade. Mas `packages/api` tem `"test": "vitest run"`,
      e o teste de contrato que o próprio @dev executou já faz
      `readFileSync(resolve(raiz, "packages/mcp/src/tools.ts"))` (`:41`) e
      afirma coisas sobre esse arquivo cruzando-o com a fonte da rota e com
      `docs/llms.txt`. A infraestrutura existe, já está apontada para os três
      arquivos certos, e já rodava.
    impacto: >
      Esta story existe porque a rota foi a 500 + `offset` na 43.4 e a tool e a
      doc ficaram em 200 por meses, em silêncio. Uma asserção no arquivo que já
      existe — o `.max(N)` da tool igual ao `.max(N)` da rota, e `offset`
      presente tanto no `inputSchema` quanto no objeto de query — teria pegado
      exatamente essa defasagem, e pegaria a próxima. Sem ela, a única coisa
      entre os dois lados volta a ser revisão humana.
      Vale também para a lição já registrada no projeto ("testar o corpo
      enviado, não o tipo"): a asserção sobre o objeto de query é o que prova o
      repasse, e é escrevível hoje.
    a_pergunta_errada: >
      A pergunta feita foi "`packages/mcp` tem runner?". A pergunta que
      discrimina é "algum runner já enxerga este arquivo?" — e a resposta é
      sim, e estava rodando na mesma sessão.
    suggestedFix: >
      Acrescentar ao `llms-txt-contrato.test.ts` (ou irmão) três asserções, sem
      infra nova: (a) o `.max(N)` do `limit` da tool == o `.max(N)` da rota,
      ambos extraídos por regex do fonte, como o teste já faz com o path;
      (b) `offset` presente no `inputSchema` **e** no objeto de query da
      chamada da tool; (c) o `limit (1–N` do `llms.txt` == o mesmo N.
    dono: "@sm/@po — follow-up. Não bloqueia esta story."

  - id: QA-4424-03
    severidade: low
    titulo: "O detector da 44.22 já calcula `diasDeAtraso` e joga fora"
    onde: "packages/mcp/src/defasagem.ts:75, :97 · index.ts:53"
    evidencia: >
      `diasEntre(bundleBuiltAt, manifesto.builtAt)` é calculado e vai para o
      `Diagnostico`, e o manifesto ainda publica `contract`
      (`public-mcp-manifest.ts:42`) — mas o registro do aviso é decidido só por
      `d.atrasado || d.sobrando.length > 0`, ou seja, só por diferença de
      NOMES. Um bundle 60 dias atrás com o mesmo roster fica silencioso, que é
      precisamente o caso desta story.
    suggestedFix: >
      Na AC3/AC4 da 44.22: registrar o aviso também quando
      `(d.diasDeAtraso ?? 0) > N` ou quando o `contract` do bundle divergir do
      publicado. Os dois sinais já chegam ao ponto de decisão — falta a
      condição usá-los.
    dono: "@devops / a própria 44.22. Colateral, fora do escopo daqui."

  - id: QA-4424-04
    severidade: low
    titulo: "`count` está documentado sem o aviso de `@deprecated`"
    onde: "docs/llms.txt:49 · public-meta.ts:417-418"
    evidencia: >
      A rota marca `count` como `@deprecated — use total`. A linha `Resposta:`
      lista `count` primeiro e `total` depois, sem distinguir. Também omite
      `spendIncludesMetaTax`, que a rota devolve (omissão anterior a esta
      story).
    impacto: >
      Inofensivo hoje — `count` e `total` são o mesmo valor (`:418`, `:421`).
      Fica registrado porque o leitor é literal e a linha é contrato: se algum
      dia `count` virar "itens desta página", quem seguiu a doc lê errado.
    suggestedFix: "`\"count\" (legado — use `total`)` na mesma linha."
    dono: "qualquer story que encoste no llms.txt."

