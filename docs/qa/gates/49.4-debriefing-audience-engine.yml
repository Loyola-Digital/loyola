checks:
  1_requirements: 'PASS — AC1–AC12 atendidos (rastreio abaixo). Desvio declarado no AC11: conta do Ads Manager cai para a única conta ativa do projeto (0/19 funis têm `meta_account_id`) — ratificação do @po.'
  2_tests: 'CONCERNS — 62/62 nas 2 suítes da story; regressão `debriefing-*`, `survey*`, `launch-report-*`, `classificador*`, `dedup*`: 23 arquivos, 860/860 (uma rodada com load average 13 teve timeout de `beforeAll` do PGlite nas duas suítes de loader — REL-001). Mutações: 22/22 do @dev mortas; 11/18 próprias mortas — TEST-001.'
  3_lint_typecheck: 'PASS — `tsc --noEmit` da API (binário direto) exit 0; `eslint` nos 5 arquivos exit 0.'
  4_security_pii: 'PASS — PG02 em produção: varredura de TODAS as folhas string do payload contra os e-mails e os 8 últimos dígitos dos telefones da própria entrada: 0 ocorrências; 0 "@"; chaves de comprador `x:` + sha256 (66 caracteres); `tuplasClassificadas` sem `sellerName` preenchido no DG (0 distintos). O loader não seleciona nome do cliente de `manual_sales`.'
  5_performance: 'PASS — sem chamada à Meta e sem fan-out por criativo (nenhum import de cliente Meta); leitura de planilha memoizada (o loader da 49.3 recebe o mesmo leitor); ad-level e nomes de anúncio em 2 consultas com `inArray`.'
  6_regression: 'PASS — a única linha fora de arquivo novo é `export` em `resolveColumnIndexes` (diff de 1 linha); `computeSurveyForStage` inalterado, com snapshot gravado antes do export. Nenhum número do Resumão muda.'
  7_docs: 'PASS — Dev Agent Record com as AUTO-DECISIONs, File List e Change Log completos. Uma correção de número para a pergunta 1 ao dono (abaixo: sem a "Alunos" o Loyola dá 13,92%, não 13,8%).'
  8_api_contract: 'N/A — sem rota, sem migration, sem bump de `API_CONTRACT_VERSION` (AC12c).'

rastreio_ac:
  AC1: 'PASS — determinismo provado em produção (2 execuções, JSON idêntico); `razao` devolve null + motivo com denominador 0; entrada congelada no teste.'
  AC2: 'PASS — identidade `linhasLidas − vazias − duplicadasRemovidas = respondentes` no PG02: 1.669 − 0 − 64 = 1.605; "mais recente" por dia e depois posição (mutação M02 do @dev morre).'
  AC3: 'PASS — gate por `perguntasConfirmadas[stage]`; `faixa: null` explícito vira `aplicavel = false`; série histórica no PG04 (comparação PG02): faixa/renda/profissão = true.'
  AC4: 'PASS no código — origem só por `classificador.classificar` injetado (o mesmo `ClassificadorInjetado` do loader da 49.3: `CLASSIFICADOR_VERSAO = "49.2-v2"` + `montarConfigClassificador`); `SEGMENTO_DE_QUALIFICACAO[canal]`; sem `PAID_*` (teste de superfície). PG02: segmentos 308/246/21/699/0/331 = 1.605; fechamento 40/1.565 = 1.605. Ressalva: o fio `sellerName` não tem teste (TEST-001).'
  AC5: 'PASS — PG02 distribuição A97 B264 C463 D781; cobertura 1.212 ÷ 1.807 = 67,07% sobre as MESMAS chaves `compradoresCaptacao` da 49.3 (1.807/1.806 nos dois motores). PG04: semFaixa 13 mantido.'
  AC6: 'PASS — taxa de resposta com os dois números na memória.'
  AC7: 'PASS — denominador = compradores de captação (ingresso ∪ combo) do recorte. Ressalva de contrato: CONTRACT-001. O telefone no casamento do principal não tem teste (TEST-001).'
  AC8: 'PASS — só `^\d{10,}$`; `semCriativo` 1.068 = 413 vazio + 655 rótulo/macro no PG02; nome cache > utm_term > Ad ID; proporção; 40/40 criativos com link (conta do projeto).'
  AC9: 'PASS — IA × Humano PG02: 15,3% × 0,0% (skill 15,5% × 0%); `SEM_AD_LEVEL` no PG02; PG04 com 1.524 linhas de ad-level; `COPY_NAO_PAREADA` (mutação própria QA-M16 morre).'
  AC10: 'PASS — e-mail ∪ telefone; `tipo` da base declarado; PG04: leads+compradores, retorno 172 ÷ 3.120 = 5,51%, já na base 182 ÷ 1.067 = 17,06%. A base de "leads" do PG02 inclui a planilha de venda cadastrada como `leads` (achado do QA na 49.3) — a 49.5 classifica.'
  AC11: 'PASS — DB-first; `DADO_INDISPONIVEL` para falha de leitura (teste); conta pelo funil, senão a única ativa do projeto (desvio para o @po).'
  AC12: 'PASS — tsc verde; diff de 1 linha em `survey-aggregation.ts`; check 8 N/A.'

verificacao_producao:
  ambiente: 'banco de produção com `default_transaction_read_only = on`; Google só leitura; loader + motor da branch (74af63a5); script do QA em scratchpad/qa494/conf.mts e pii.mts'
  config_usada: 'DG; PG02 com as datas REAIS do perfil §1b (16/04, abertura 09/05, fim 27/05, downsell 03/06 → 13/06 — o @dev rodou sem o downsell, o que não mudou nenhum número); PG04 09/07, 01/08, 15/08, comparação PG02; `dimensaoDeCriativo = ia-humano`; perguntas confirmadas = faixa + as chaves reais da pesquisa.'
  pg02: 'pesquisa 1.669 → 1.605 (−64); A+B 361 / 1.605 = 22,49%; D 781; compradores de captação 1.807/1.806 (= 49.3); cobertura e taxa de resposta 67,07%; casamento 1.260 e-mail / 35 telefone / 310 sem; IA 15,3% (366 resp.) · Humano 0,0% (59) · card 16,1% (112)'
  pg04: 'pesquisa 699 → 604 (−95); A+B 246 / 604 = 40,73%; D 117; 13 sem faixa; compradores 1.067/1.064; cobertura 52,20%; taxa 53,23%'
  alunos_pg02: 'As duas pesquisas da Captação Paga: "Pesquisa-Captação" (1.281 linhas → 1.272 e-mails) e "Pesquisa-Captação - Alunos" (388 → 356). 23 e-mails estão nas duas (a dedup atravessa as planilhas: 1.272 + 356 − 23 = 1.605). SEM a "Alunos": 1.272 respondentes, A+B 177 / 1.272 = 13,92% (skill 176 / 13,8%), D 744 (skill 745), cobertura 66,80%, IA 15,2% · Humano 0%. Só a "Alunos": 356 respondentes, A+B 52,25%, e só 9 deles são compradores de captação (0,50% dos 1.807). Ou seja: a "Alunos" quase não toca a cobertura e a taxa de resposta, mas leva o A+B de 13,9% para 22,5% e infla o Orgânico.'

