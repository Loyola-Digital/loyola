issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'Três fios fixados por AC ou decisão não têm teste — a mutação que corta o ARGUMENTO no call site passa verde: (a) QA-M15, `sellerName` da venda casada não chega a `classificar` — é o caso Netão da R2-5 (só `sellerName` → `Sem track` + fechamento `closer`); o helper do teste aceita `sellerName`, mas nenhum caso o preenche; (b) QA-M1, `c.principal` só por e-mail — o AC7 manda casar e-mail → telefone; (c) QA-M12, a dedup por e-mail que atravessa as planilhas da etapa (AUTO-DECISION do @dev) — no PG02 são 23 e-mails nas duas pesquisas e é o cenário da pergunta 1 ao dono.'
    recommendation: 'Três casos no `debriefing-audience-engine.test.ts`: venda casada só com `sellerName` (closerPorSellerName = true) → segmento `Sem track` + fechamento `closer`; comprador de captação cujo principal só casa pelo telefone → `comprouPrincipal` 1; mesmo e-mail em duas `PesquisaInput` da etapa → 1 respondente, a mais recente.'
    owner: '@dev'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Sobreviventes sem impacto medido: QA-M5 (Ad ID de maior volume no link — o teste com esse nome não tem grupo de 2 IDs), QA-M8 (prioridade da venda representativa: captação antes do principal), QA-M14 (pesquisa de etapa fora da config), QA-M17 (grupo com tipos distintos).'
    recommendation: 'Casos de 1 linha cada quando a iteração de TEST-001 abrir o arquivo.'
    owner: '@dev'
    status: open

  - id: REL-001
    severity: low
    category: reliability/tests
    description: 'Com load average 13 (outro @dev na máquina), as duas suítes de loader sobre PGlite (49.4 e 49.3) falharam por `Hook timed out in 10000ms` no `beforeAll`; passam na rodada seguinte e isoladas. O timeout é o default do vitest.'
    recommendation: 'Timeout explícito no `beforeAll` do PGlite (ex.: 60 s) nas duas suítes.'
    owner: '@dev'
    status: open

  - id: CONTRACT-001
    severity: low
    category: contract
    description: 'AC7 pede a "mesma definição" de `conversaoIngressoPrincipal` da 49.3. A 49.3 divide VENDAS do principal (71 no PG02) por compradores de captação; a 49.4, por recorte, conta PESSOAS (comprador de captação do recorte com venda do principal) — e só os que responderam a pesquisa entram num recorte. No PG02 a Σ dos numeradores por faixa e por segmento é 23. A memória de cada linha declara a definição, então não é erro, mas a 49.5 não pode esperar que os recortes fechem com o headline da 49.3.'
    recommendation: '@po registrar na 49.5 (F3/F6) que Σ recortes ≠ headline por definição (pessoa × venda, e só respondentes).'
    owner: '@po (49.5)'
    status: open

