    item: 'Fallback da conta do Ads Manager: `funnels.metaAccountId` → a ÚNICA conta ativa de `meta_ads_account_projects`; duas ou mais → `null` + `contaDeAnuncios: "ambigua"`. O texto do AC11 cita só `funnels.metaAccountId`; em produção 0/19 funis têm conta, então sem o fallback todo link sairia `null`. No DG a conta resolvida é a do link da skill.'

dependencias:
