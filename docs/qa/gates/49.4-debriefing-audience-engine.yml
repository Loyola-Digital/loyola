issues:
  - id: TEST-003
    severity: low
    category: tests
    description: 'Sobreviventes nos fios novos. QA-N1 e QA-N3: o teste de UTM em array cobre `source` e `term`, mas não `medium` (é dele que sai o closer `x1`) nem `campaign`. QA-N5: o teste de `pesquisasExcluidas` zera `leituras`, mas não afirma que a pesquisa excluída deixou de ser lida. A doc diz "não é lida"; se ela fosse lida e falhasse, uma pesquisa excluída de propósito derrubaria a carga com DADO_INDISPONIVEL.'
    recommendation: 'Mais um caso no teste de UTM em array, com `{"x1","x1"}` no medium (deve sair fechamento closer) e array no campaign. No teste DEC-OWNER-1, `expect(leituras).not.toContain(<aba da pesquisa>)`.'
    owner: '@dev'
    status: open

  - id: DATA-002
    severity: low
    category: data/definition
    description: 'No PG02, nenhuma das duas pesquisas da Captação Paga tem data de resposta legível (0/1.281 e 0/388). Para os 23 e-mails presentes nas duas, a "mais recente" (decisão 8) cai na posição. Entre planilhas diferentes, essa posição é a ordem do loader (stageId, spreadsheetId, sheetName, id), ou seja, a ordem ALFABÉTICA do nome da aba, e não a ordem de chegada. Hoje a "Alunos" vence os 23. Com a ordem invertida (QA-N9, simulado sobre a entrada de produção), A+B cai de 361 para 352 (22,49% → 21,93%), D sobe de 781 para 789 e os segmentos mudam em 1–2. A regra está documentada no Dev Agent Record e o resultado é determinístico; o problema é que ela é arbitrária entre planilhas. Só pesa se a "Alunos" ficar na qualificação.'
    recommendation: 'Junto com a DEC-OWNER-1: se a "Alunos" ficar, o dono (via @po) define qual pesquisa vence quando nenhuma das duas tem data. Mapear a coluna de data das pesquisas do PG02 também resolve. Se ela sair, o caso some no PG02.'
    owner: 'dono via @po'
    status: open

  - id: CONTRACT-001
    severity: low
    category: contract
    description: 'Mantido como NOTA PARA A 49.5. Os recortes de conversão por faixa e por segmento contam PESSOAS, e só entre os compradores de captação que RESPONDERAM a pesquisa. O headline da 49.3 conta VENDAS do principal sobre todos os compradores de captação. No PG02 a soma dos recortes é 23, contra 71 vendas na 49.3. A memória declara a definição, então não é erro.'
    recommendation: '@po registrar na 49.5 (F3/F6) que Σ recortes ≠ headline por definição (pessoa × venda e só respondentes). A F3 não deve comparar esses números.'
    owner: '@po (49.5)'
    status: open

