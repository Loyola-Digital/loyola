status_reason: 'Re-gate da iteração 1 (c1ebeb18 + merge d2e49400). Fechados: TEST-001 (medium), TEST-002 e REL-001 (low). O merge da 49.3 iteração 2 está adaptado: a aba ligada a duas etapas é lida uma vez, e a UTM em array é desembrulhada antes do classificador e no nome do criativo. 72/72 na story, regressão 890/890, tsc e eslint limpos. Das 28 mutações do QA, 23 morrem; as 18 do gate anterior morrem todas. O PG02 em produção (só leitura, COM o downsell) reproduz o relato do @dev: 1.807/1.806 compradores com as chaves iguais às da 49.3, 1.605 respondentes, A97 B264 C463 D781, IA × Humano 15,3% × 0%. O downsell da 49.3 fica em R$ 20.714,40. Sem `pesquisasExcluidas`, a saída é idêntica à de `[]` (entrada, payload e diagnóstico). Não resta medium nem high no código. RESSALVA: o merge aguarda a decisão do dono sobre a "Pesquisa-Captação - Alunos", que muda o número da qualificação (22,49% × 13,92%).'
