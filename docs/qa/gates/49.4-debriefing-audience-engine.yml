story_title: 'Motor II do Debriefing — público (qualificação por origem, faixa × criativo, tipo de criativo, cross-launch)'
verdict: CONCERNS
gate: CONCERNS
status_reason: 'O código atende o AC1–AC12 e as decisões do dono (3, 4, 8, 9, 11, R2-1, R2-5); 62/62 testes, `tsc` e `eslint` limpos, as 22 mutações do @dev morrem também na rodada do QA. A conferência em produção (só leitura) reproduz os números do @dev, agora com as datas REAIS do PG02 (janela 2A até 13/06, com o downsell): 1.605 respondentes, 1.807/1.806 compradores de captação (= 49.3), PG04 faixa D 117 e 13 sem faixa; payload sem e-mail e sem telefone (varredura por valor, não só por "@"), determinístico. O que segura o PASS é TEST-001 (medium): 7 de 18 mutações próprias sobrevivem, e três delas cortam um FIO que um AC ou uma decisão fixa — o `sellerName` que vai ao classificador (caso Netão, R2-5), o casamento do principal pelo telefone (AC7) e a dedup que atravessa as pesquisas da etapa (é exatamente o caso da pesquisa "Alunos", pergunta aberta ao dono). São três testes curtos. Há duas pendências do dono e uma ratificação do @po, que não bloqueiam o código.'
