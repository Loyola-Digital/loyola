summary: >
  O código está certo e o helper é a decisão acertada — a régua virou função com
  nome, com a medição do defeito no comentário, e não sobrou nenhum
  `shiftDayKey(hoje, -days)` no arquivo. A prova de reversão derruba 6 testes.

  O CONCERNS é pelo **AC6**, que é o teste de regressão desta story: ele está
  escrito de forma que não pode passar, **não tem teste**, e a medição do
  próprio @dev o contradiz sem que a contradição tenha sido sinalizada. É a
  mesma classe do que o gate da 44.25 pegou — um critério de conferência que,
  se seguido ao pé da letra, faria alguém concluir regressão onde há correção.

achados:
  - id: QA-4427-01
    severidade: ALTA
    categoria: requirements
    titulo: "O AC6 afirma que 30d e 90d não mudam — e a medição do @dev mostra que mudam"
    evidencia: >
      AC6: *"Seletores de 30d e 90d continuam com os mesmos números — eles já
      emitiam 1.36x. Teste diferencial."*

      A T5 do próprio @dev mediu o contrário:

        bbe-fc1  30d: sai o dia 09/08 — 1 venda,  R$ 347,00
        pps1     30d: sai o dia 09/08 — 8 vendas, R$ 456,00
        fz-a1    90d: sai o dia 10/06 — 6 vendas, R$ 354,00

      E **não existe teste do AC6**: `grep` por "30d|90d|idêntic" em
      `janela-do-seletor.test.ts` não encontra nada, e o `perpetual-tendencia`
      só tem um AC6 de outra story (29.57). A T4 foi marcada como feita.
    porque_importa: >
      O AC6 é a rede de regressão desta story. Como está:

      1. **Não pode passar.** Os cards de 30d e 90d mudam — e devem mudar, era
         esse o defeito: somavam faturamento de N+1 dias contra investimento de
         N. A mudança é a correção.
      2. **Induz erro na conferência.** Quem abrir produção esperando "números
         idênticos" em 30d/90d vai ver o faturamento cair e concluir regressão.
         É exatamente o que o gate da 44.25 pegou no Testing daquela story
         ("nenhuma outra etapa mudou de família", quando três mudavam).
      3. **A intenção real ficou sem cobertura.** O que o AC6 queria dizer é que
         a *Tendência 7D vista nos seletores de 30d/90d* continua 1.36x — isso
         sim precisa de teste, e não tem.
    recomendacao: >
      Reescrever o AC6 separando as duas coisas (é do @po): a **Tendência 7D**
      nos seletores 30d/90d continua 1.36x; os **cards** de 30d/90d MUDAM, e a
      mudança é a entrega. Depois, o teste que falta (@dev).

  - id: QA-4427-02
    severidade: BAIXA
    categoria: docs
    titulo: "A queda no card do BBE precisa de aviso, e o texto do aviso não existe"
    evidencia: >
      O @dev registrou que o card de 7 dias do BBE perde R$ 2.032 (7 vendas) —
      cerca de um terço do que exibe — e escreveu "isto precisa ser avisado
      antes do merge". O DoD tem a linha "Aviso a quem lê o Resumão", sem texto.
    porque_importa: >
      É a terceira story da leva que muda número em produção sem rota nova, e
      `packages/mcp` não tem checagem de contrato. Uma queda de um terço no
      faturamento do card, sem aviso, chega como bug reportado.
    recomendacao: "Redigir o aviso antes do merge, não depois. Uma linha basta, mas precisa existir."

  - id: QA-4427-03
    severidade: BAIXA
    categoria: efficiency
    titulo: "A mesma régua `-days` existe em outros arquivos — fora do escopo, registrado"
    evidencia: >
      `stage-sales-journey.ts:515,1332` e `google-ads.ts` (6 ocorrências) usam
      `setDate(getDate() - days)`, o mesmo padrão que esta story corrigiu.
    porque_importa: >
      O helper `inicioDaJanela` agora existe e é o lugar certo. Não investiguei
      se esses pontos cruzam com uma régua diferente do outro lado — que é o que
      transforma o padrão em defeito. Pode ser inofensivo; pode ser o mesmo bug
      em outra tela.
    recomendacao: "Fora do escopo da 44.27. Vale uma investigação própria."

