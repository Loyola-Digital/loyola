achados:
  - id: QA-472-01
    severidade: medium
    status: corrigido-no-gate
    o_que: >
      `experts.filhosAtivos` fazia quatro `select` em `Promise.all` — e é
      chamada DENTRO da transação da cascata, onde há uma conexão só. O `pg`
      avisou ("Calling client.query() when the client is already executing a
      query is deprecated and will be removed in pg@9.0") ao rodar a cascata no
      banco real. Hoje funciona por enfileiramento; no pg@9 quebra a cascata.
    correcao: "Quatro leituras em série. Sem teste automatizado possível para 'paralelo na mesma conexão'; provado no banco real (cascata verde, sem aviso após a mudança seria o ideal — reexecutar no próximo teste real)."
  - id: QA-472-02
    severidade: low
    status: corrigido-no-gate
    o_que: "`id=\"busca\"` fixo na tabela genérica: Valores fixos renderiza quatro tabelas na mesma página → ids duplicados (a11y)."
    correcao: "`useId()`."
  - id: QA-472-03
    severidade: medium
    status: resolvido
    o_que: "AC18 — validação visual executada pelo dono do produto em produção; DV1/DV2 corrigidos na #829."

