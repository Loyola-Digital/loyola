issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'AC8 pede verificação visual da página de detalhe no app, e ela não foi feita: o stack local aponta para o banco de PRODUÇÃO e salvar gravaria lá. O harness em Chrome real usa o código REAL de `debriefing-frame.ts` (agente, sandbox, clamp), mas o pai é uma página reimplementada. O fio da `page.tsx` (`sandbox={DEBRIEFING_IFRAME_SANDBOX}`, `clampFrameHeight` → `setTruncada`, o aviso `role="alert"`, `toast.error(mensagemDeErroAoSalvar(e))` e a recriação do iframe por `key`) só foi conferido por leitura, `tsc` e `next build`. A página é client component e não roda no vitest. Este gate NÃO pode ser WAIVED por evidência: o harness não exercita o React da página, e WAIVED exige quem aprove (@po/dono), não o @qa.'
    recommendation: 'Danilo, no app (sem salvar em produção, ou num debriefing de teste): (1) clicar o link do Ads Manager no DG; (2) Editar → mudar o título → Salvar → reabrir e conferir 17/17 gráficos e a largura com a janela mais estreita; (3) pins/comentários; (4) "Abrir em nova aba"; (5) lista da etapa. Registrar na story. Isso fecha TEST-001 e também deixa visível o REL-001.'
    status: open

  - id: REL-001
    severity: medium
    category: reliability
    description: 'Defeito antigo (`30ed8dcf8`, 2026-07-29), achado no gate e não introduzido pela story. O `handleOpenExternal` chama `window.open(url, "_blank", "noopener,noreferrer")`, e com `noopener` o `window.open` devolve `null` POR ESPECIFICAÇÃO. Por isso a função SEMPRE cai no ramo "pop-up bloqueado": revoga o blob na hora e mostra o toast de erro "Permita pop-ups para abrir o documento em nova aba." mesmo quando a aba abriu. O ramo do `revokeObjectURL` em 60 s (citado no AC7) nunca roda. Provado no Chrome 154: `__popupBloqueado: true` e a nova aba com o documento inteiro (26.130 px, `FIM-DO-DOC`). O harness do @dev gravava essa flag mas não a reportava. Pesa nesta story porque o aviso novo do AC6 aponta justamente para esse botão, como saída para documentos acima de 20.000 px. No Chrome o blob carrega antes da revogação; em navegadores que resolvem o blob depois, a aba pode abrir vazia.'
    recommendation: 'Correção pequena, em arquivo do escopo: não tratar `null` como bloqueio quando se usa `noopener`. Opções: abrir sem `noopener` e anular `win.opener`, ou manter `noopener` e revogar só pelo `setTimeout`. Pode entrar nesta story antes do merge (preferível, porque o aviso novo depende dele) ou numa story curta logo depois. Não bloqueia: o documento abre.'
    status: open

  - id: REL-002
    severity: medium
    category: reliability
    description: 'Limitação antiga, registrada pelo próprio @dev e reproduzida por ele no DG (`#chTable`). Texto editado dentro de conteúdo montado por script (tabelas geradas com `innerHTML` a partir do `const D`) é gravado no HTML salvo, mas some na reabertura, porque o script do documento remonta a tabela. Para o usuário isso é perda silenciosa da edição. O AC3(b) é atendido (o texto está no HTML salvo), mas os documentos do Epic 49 montam muitas tabelas assim.'
    recommendation: 'Decisão de produto do @po / insumo da 49.6: o gerador escreve as tabelas como HTML estático, ou o viewer/skill avisa que aquelas tabelas não são editáveis. Não bloqueia esta story; precisa entrar na 49.6 antes de o gerador ir para produção.'
    status: open

  - id: SEC-001
    severity: low
    category: security
    description: 'Antigo, do Epic 37. "Abrir em nova aba" cria o blob na origem do app, então o documento enviado roda SEM sandbox e COM a origem do app. Provado no Chrome com servidor local: a nova aba leu `location.origin` = origem do app e `localStorage` do app (`SEGREDO_LS`); `document.cookie` veio vazio. O comentário da `page.tsx` assume isso ("dá ao doc uma origem real"). Mitigação existente: upload restrito à equipe (guest-guard). A story não cria esse caminho, mas o aviso do AC6 passa a recomendá-lo.'
    recommendation: 'Story futura, fora do escopo: abrir a nova aba numa página que embrulhe o documento no mesmo sandbox (iframe de altura livre com `DEBRIEFING_IFRAME_SANDBOX`), em vez do blob cru. Enquanto isso, o risco é o mesmo de hoje.'
    status: open

