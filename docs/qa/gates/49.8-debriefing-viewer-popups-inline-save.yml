issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'AC8 pede verificação visual da página de detalhe no app, e ela continua não feita. Localmente é impossível: o stack aponta para o banco de PRODUÇÃO, e salvar gravaria lá. As sondas em Chrome real usam o código REAL de `debriefing-frame.ts`, mas o pai é uma página reimplementada. O fio da `page.tsx` (`handleOpenExternal` → `abrirDebriefingEmNovaAba` → toast só em "bloqueada", nos 3 botões; `sandbox`, aviso `role="alert"`, toast do 413, recriação do iframe por `key`) só foi conferido por leitura, `tsc` e `eslint`. A página é client component e não roda no vitest.'
    recommendation: 'O DONO faz no PREVIEW da PR (não no local), num debriefing de teste: (1) clicar o link do Ads Manager no DG; (2) Editar → mudar o título → Salvar → reabrir e conferir 17/17 gráficos e a largura com a janela mais estreita; (3) pins/comentários; (4) "Abrir em nova aba" pelos 3 botões (cabeçalho, aviso de 20.000 px, texto sob o viewer): abre SEM toast, mostra o documento inteiro e a aba do app não muda; (5) lista da etapa. Registrar na story.'
    status: open

  - id: REL-001
    severity: medium
    category: reliability
    description: 'Toast falso "Permita pop-ups" causado por `noopener` (window.open devolve null por especificação).'
    resolution: 'CORRIGIDO em ce0a7d86 e conferido no re-review. `abrirDebriefingEmNovaAba` abre sem features, anula `opener` na hora, só trata `null` como bloqueio e revoga o blob após 60 s. Chrome 154 real: clique → "aberta", 1 aba nova, sem toast; bloqueador real ligado e chamada sem gesto → "bloqueada", 0 abas (sonda `dev-bloqueio.mts` refeita no re-review). Mutações "noopener de volta" (3 falhas), "revoga na hora" (2) e "opener não anulado" (1) derrubam os testes.'
    status: resolved

  - id: REL-002
    severity: medium
    category: reliability
    description: 'Edição dentro de tabela montada por script some ao reabrir (o documento remonta a partir do `const D`). Inalterado nesta iteração.'
    recommendation: 'Decisão de produto do @po / insumo da 49.6: tabelas estáticas no gerador ou aviso de não editável. Não bloqueia esta story.'
    status: open

  - id: SEC-001
    severity: low
    category: security
    description: 'A nova aba rodava o documento cru num blob com a origem do app.'
    resolution: 'CORRIGIDO em ce0a7d86 e conferido no re-review com sonda própria (`qa-novaaba.mts`, código novo transpilado, servidor local no papel do app com cookie e localStorage). A moldura tem a origem do app, mas 0 scripts e 1 só iframe com `allow-scripts allow-popups allow-popups-to-escape-sandbox`. Dentro do documento: origem `null`; localStorage, cookie, `parent.document` e `top.location = …` → SecurityError; `top.opener` = null. Popup aberto pelo documento: origem `null`, localStorage → SecurityError, `opener.top.opener` = null, `opener.top.location = …` → SecurityError. URL do app inalterada; o servidor não recebeu nenhum `/pwned`. `qa-sec.mts` refeito contra a constante atual: mesmo resultado do gate anterior.'
    status: resolved

  - id: DEC-001
    severity: low
    category: product
    description: 'Efeito colateral declarado pelo @dev e confirmado: com o isolamento, a nova aba deixa de ser o fallback para documentos que dependem de `localStorage`/`sessionStorage`/`history.pushState` (SecurityError nos dois lugares; `location.hash` funciona). Classificação do QA: regressão funcional de baixo impacto e risco conhecido. Nenhum template da skill `loyola-debriefing` (`apresentacao-html`, `relatorio-html`, `referencia-relatorio-dg`) usa storage ou history, então os documentos do Epic 49 não são afetados. O impacto possível fica nos HTMLs antigos do Epic 37, que estão no banco de produção e não foram inspecionados. Consequência de texto: sob o viewer, "Documento com várias páginas ou etapas não carregou aqui? Abra em uma nova aba" passa a prometer um fallback que não existe para esse tipo de documento.'
    recommendation: 'DECISÃO DO DONO/@po, não do QA. Opções: (a) aceitar o isolamento e ajustar o texto sob o viewer (sugestão: nova aba = documento inteiro, sem limite de altura); (b) reabrir um fallback sem sandbox, explícito e com aceite formal do risco do SEC-001. Se (a), vale conferir com uma consulta só de leitura se algum HTML salvo em `debriefings` contém `localStorage`/`pushState`.'
    status: pending_decision

  - id: TEST-002
    severity: low
    category: tests
    description: 'Mutação sobrevivente: trocar `const t = escaparHtml(titulo)` por `const t = titulo` mantém 26/26. O teste do título confere só `document.title` e a ausência de `<b>`; como `<title>` é RCDATA, o título hostil passa sem escape. O ponto frágil é o atributo `title="…"` do iframe e um `</title><script>` no nome da campanha, que viraria script na moldura, que tem a ORIGEM DO APP. O código está correto, e isso foi provado no Chrome com o título `</title><script>…</script>"><script>…</script>&amp;`: 0 scripts e o título chega literal à aba e ao atributo. Falta só o teste travar isso.'
    recommendation: 'No teste do título, usar `</title><script>x</script>"><script>y</script>` e afirmar: 0 `script`, `iframe.getAttribute("title")` igual ao título cru e `srcdoc` ainda igual ao documento. Pode entrar junto com qualquer ajuste do DEC-001. Não bloqueia.'
    status: open

