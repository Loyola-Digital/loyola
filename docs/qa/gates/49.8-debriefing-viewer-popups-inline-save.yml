checks:
  code_review: 'Diff de 3 pontos com 6 arquivos. Constante `DEBRIEFING_IFRAME_SANDBOX` usada em `page.tsx:378`, sem nenhum literal restante no viewer do debriefing; os outros iframes do web (`ab-tests`, `pdi-viewer`, `swipe-files`, relatórios do funil) seguem com `allow-scripts`, fora do escopo. `clampFrameHeight` repete a fórmula antiga (margem 24, mínimo 400, teto 20.000), devolve `truncada` só quando passa do teto e trata não finito/negativo como o mínimo. `restaurarCanvas` age só no CLONE, casando canvas por índice (o clone é do mesmo DOM no mesmo instante), lê `canvas.$chartjs.initial` e fica dentro de `try/catch` para nunca impedir o salvar. API: `bodyLimit` de 11 MiB declarado na rota; 413 conferido por BYTES (`Buffer.byteLength`) com a mesma mensagem do upload, agora numa constante; `errorHandler` da rota só intercepta `FST_ERR_CTP_BODY_TOO_LARGE` e relança o resto. Aviso de altura sem dado do usuário: só texto fixo e `DEBRIEFING_FRAME_MAX_HEIGHT.toLocaleString` dentro de JSX, sem `dangerouslySetInnerHTML`, portanto sem vetor de XSS. `API_CONTRACT_VERSION` sem bump é correto: nenhuma rota ou campo novo, e o web funciona com a API antiga.'
  unit_tests: 'Rodados no gate: web `debriefing-frame.test.ts` 17/17; api `debriefings-put-limite.test.ts` 7/7. Oito mutações do gate, todas restauradas com `git checkout` e `git status` limpo: (M1) remoção do agente comentada → 1 falha ("devolve o DOCTYPE e NÃO leva o script-agente"); (M2) `restaurarCanvas` desligado → 1 falha ("desfaz no HTML salvo o tamanho…"); (M6) `>` → `>=` no teto → 1 falha (19.976); (M8) `allow-same-origin` na constante → 2 falhas; (M3) sem `bodyLimit` → 2 falhas (~2 MB e 5 MB exatos); (M4) sem checagem de tamanho → 2 falhas; (M7) caracteres em vez de bytes (`.length`) → 1 falha ("conta BYTES… é"); (M5) sem o 413 do `errorHandler` → 1 falha. Teste temporário do gate (criado e apagado): com um handler global igual ao de `app.ts`, um erro de banco no PUT sobe para ele e devolve 500 "Erro interno" SEM "Failed query" (o `throw` do errorHandler da rota chega ao pai, então não abre vazamento de SQL); JSON inválido → 400 `{error}`; `POST /api/debriefings/:id/comments` e `POST /api/debriefings` com 2 MB seguem 413 pelo default de 1 MiB (o bodyLimit não vazou para outras rotas).'
  browser_real: 'Refeito no gate com o harness do @dev (`run.sh` copia o `debriefing-frame.ts` REAL), Chrome/154.0.8037.92 headless. DG salvo a 1.400 px e reaberto a 1.000: 17/17 → 17/17 gráficos, 0 erros, altura 7.643 → 7.643, documento a 1.000 px, 0 canvas com largura diferente, agente fora, DOCTYPE, marca editada presente, 0 PNG, `const D` presente; link do Ads Manager abriu (`business.facebook.com/…adsmanager…`), 0 erros "allow-popups", `localStorage` e `document.cookie` → SecurityError, `window.origin` = null. Netão 1.400 → 1.000: 22/22, Δ0, documento a 1.000 px, 0 canvas errados. Netão com `restaurarCanvas` DESLIGADO: documento a 1.138 px, 16 canvas errados, Δ −37 px, que é exatamente o defeito descrito pelo @dev. AC6 refeito (`teto.mts`): 26.130 → `{20000, truncada}`, aviso visível, nova aba com o documento inteiro, mas com `__popupBloqueado: true` (REL-001).'
  security: 'Sonda própria do gate (`qa-sec.mts`, servidor HTTP local fazendo papel do app, com cookie e localStorage). Dentro do documento: cookie, localStorage, `parent.document` e `top.location` → SecurityError. `window.open` agora abre o popup (com o sandbox antigo devolvia null). DENTRO do popup que escapou do sandbox: `window.origin` = null (opaca, herdada do criador), cookie e localStorage → SecurityError, `opener.top.document` → SecurityError, e `opener.top.location = …` foi BLOQUEADO pelo Chrome ("Unsafe attempt to initiate navigation"). A URL do app não mudou e o servidor não recebeu o `/pwned`. Conclusão: `allow-popups-to-escape-sandbox` sem `allow-same-origin` não dá ao documento acesso a cookie, storage, DOM nem navegação do app. O que sobra é abrir abas arbitrárias, inerente a `allow-popups` e aceito no R-49-8 (upload só da equipe). Os links `target=_blank` saem com `noopener` implícito. SEC-001 trata da OUTRA saída (blob na nova aba), que é antiga.'
  acceptance_criteria: 'AC1 ✓ (constante exata, `page.tsx` a usa, teste falha com `allow-same-origin`). AC2 ✓ (refeito no gate). AC3 ✓ (refeito no DG e no Netão; defeito real corrigido e provado nos dois sentidos; REL-002 é limitação registrada). AC4 ✓ (jsdom com `runScripts`, prova de mutação refeita). AC5 ✓ (11 MiB, 413 por bytes, teste de ~2 MB falha sem o bodyLimit, toast do 413 com o limite. Os bytes dos 3 docs ficaram registrados pelo @dev e não foram remedidos no gate, salvo o DG: 274.365 / 293.360 B, que bate). AC6 ✓ na função e no harness; o botão do aviso cai no REL-001. AC7 ✓ no código; o "revoke em 60 s" citado nunca roda (REL-001, antigo). AC8 parcial: `tsc` api 0, `next build` web verde refeito no gate (`/debriefings/[id]` 14,3 kB), `tsc --noEmit` web 0 depois do build, `next lint` 0 nos 3 arquivos do web, `eslint` 0 nos 2 arquivos da api (o `eslint src/` acusa só `sendflow.ts:43`, que é igual na `origin/main`). Falta a verificação visual (TEST-001).'
  no_regressions: 'PUT multipart, PUT só de nome e JSON inválido seguem iguais (testes). Erro não tratado continua saneado pelo handler global (sonda do gate). Outras rotas mantêm o limite default. Serializar não altera o DOM vivo (teste). A suíte completa do web não foi refeita no gate; o @dev registrou 1.723/1.725 com 2 timeouts em arquivos não tocados.'
  performance: 'Restaurar o canvas é O(n canvas) só no salvar. O HTML salvo cresce (DG +81%) porque leva as tabelas já montadas, e cabe com folga no novo teto.'
  documentation: 'Dev Agent Record detalhado, com a tabela antes/depois do defeito, as mutações e as pendências declaradas. Faltou reportar a flag `__popupBloqueado` que o próprio harness media (REL-001).'

