checks:
  code_review: 'Diff de ce0a7d86: 4 arquivos (story, `page.tsx`, `debriefing-frame.ts`, teste). `handleOpenExternal` agora só delega e traduz "bloqueada" em toast. Os 3 pontos de chamada (cabeçalho, aviso de 20.000 px, texto sob o viewer) usam a mesma função. `escaparHtml` troca `&` primeiro e depois `" apóstrofo < >`, e o resultado vai em atributo entre aspas duplas, então o `srcdoc` não fecha nem abre markup. O título é escapado do mesmo jeito para `<title>` e para `title="…"`. `aba.opener = null` roda na mesma tarefa do `window.open`, antes de o blob carregar. A moldura não tem script, então não há janela de corrida. O web não envia CSP nem COOP (`next.config.ts`/`middleware.ts`), então o blob não herda política que barre o `srcdoc`. Observação sem severidade: se `open` lançar exceção depois do `createObjectURL`, a URL não é revogada até a aba do app fechar (vazamento só de memória, caminho de exceção).'
  unit_tests: 'Re-review: `debriefing-frame.test.ts` 26/26. Dez mutações próprias, aplicadas a partir de cópia e restauradas (`git status` limpo): (M1) sem escape de `&` → 1 falha; (M2) sem escape de `"` → 1; (M3) `&` escapado por último (escape duplo) → 2; (M5) `allow-same-origin` no iframe da moldura → 1; (M6) `noopener,noreferrer` de volta → 3; (M7) sem `aba.opener = null` → 1; (M9) HTML cru no blob → 1; (M10) revoga na hora → 2. (M4) sem escape de `apóstrofo` → sobrevive, mutante EQUIVALENTE (o atributo usa aspas duplas). (M8) título sem escape → SOBREVIVE (TEST-002). Suíte completa do web refeita no re-review: 1.734/1.734 (124 arquivos), igual ao relato do @dev.'
  browser_real: 'Chrome/154.0.8037.92. Sonda própria `qa-novaaba.mts` com documento hostil (`"></iframe></body></html><script>…`, `<!-- </iframe><script> -->`, `&amp; &quot; &#x27; &nbsp;`, atributo com aspas, CRLF) e título hostil. Retorno "aberta"; moldura: protocolo `blob:`, origem do app, 0 scripts, 1 iframe, 1 filho no body, título literal na aba e no atributo, `opener` = null, nenhuma flag de injeção setada (`__xssTitulo`, `__xssAttr`, `__fugiuMoldura`, `__fugiu2`, `__pwn` = null). `srcdoc` igual ao documento exceto CRLF→LF (normalização do parser HTML, também aplicada a qualquer documento parseado; sem efeito no conteúdo). Texto e atributo do `<h1>` chegaram decodificados certo. `dev-novaaba.mts` refeito: documento de 26.130 px inteiro (scrollHeight 26.148, FIM visível), DG 17/17, link do Ads Manager abre, `pushState` → SecurityError e `location.hash` funciona; o código antigo, em contraste, deu "bloqueada (toast)" com a aba aberta e leu `SEGREDO_LS`. `dev-bloqueio.mts` refeito (headful, bloqueador real): sem gesto → "bloqueada" e 0 abas; com clique → "aberta" e 1 aba. Nota: o cenário 3 do `dev-novaaba.mts` (`--block-new-web-contents`) NÃO bloqueia no Chrome 154 (deu "aberta" e aba criada). Não é citado na story; a prova de bloqueio é o `dev-bloqueio.mts`.'
  security: 'SEC-001 fechado (ver issue). Escape do `srcdoc` resistente a `"`, `&`, `</iframe>`, `<script>` e comentário, no teste (jsdom) e no Chrome. O título com `</title>` e `"` também não injeta (Chrome; o teste não trava, TEST-002). O residual é o mesmo do viewer: o documento abre abas arbitrárias (`allow-popups`), já aceito no R-49-8 (upload só da equipe).'
  acceptance_criteria: 'Inalterados desde o gate anterior: AC1–AC5 ✓. AC6 ✓, agora com o botão do aviso funcionando (REL-001 fechado). AC7 ✓, com o "revoke em 60 s" rodando de fato. AC8 ✓: tsc, next build, lint e vitest verdes (re-review) e verificação visual feita pelo dono em 2026-10-01 (TEST-001). O AC8 pedia a verificação "pelo @dev"; a do dono é evidência mais forte e foi aceita.'
  no_regressions: 'Viewer inalterado (`DEBRIEFING_IFRAME_SANDBOX`, agente e clamp sem diff nesta iteração). Mudança de comportamento intencional na nova aba (DEC-001). `tsc --noEmit` do web: 0 erros. `eslint` nos 3 arquivos do web: 0.'
  visual_owner: 'Danilo, 2026-10-01, localhost (`pnpm dev` na branch, HEAD e3029ae3), web+API locais sobre o banco de produção: "visual ok" — link do Ads Manager abre; editar → salvar → recarregar mantém a edição e os gráficos normais; "Abrir em nova aba" abre o documento inteiro sem aviso de pop-up.'
  api_contract: 'N/A. Nenhuma rota, campo de resposta ou snapshot novo: o PUT existente ganhou `bodyLimit` e um 413 com a mesma mensagem do upload. Sem bump de `API_CONTRACT_VERSION` necessário.'
  performance: 'O documento é escapado uma vez por clique (O(n) no tamanho do HTML, ≤ 5 MB). O blob passa a ter o documento escapado (um pouco maior). Irrelevante.'
  documentation: 'Dev Agent Record da iteração detalhado, com as mutações, os cenários de Chrome e o efeito colateral declarado ao @po. Desta vez o harness reporta o que mede (`resultadoNoApp`, `abaCriada`).'

