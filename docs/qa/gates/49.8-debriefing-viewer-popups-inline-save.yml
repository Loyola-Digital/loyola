status_reason: 'Código, testes e segurança do sandbox conferidos de verdade: 24/24 testes, 8 mutações próprias derrubam o teste certo, o defeito do canvas reaparece no Chrome com o fix revertido, o popup que escapa do sandbox não lê cookie nem storage do app e não navega a aba do app, e o bodyLimit fica só no PUT. Fica CONCERNS porque a verificação visual do AC8 na página do app não foi feita, e o gate achou um defeito antigo no "Abrir em nova aba": é o botão que o aviso novo oferece e ele mostra um toast falso de "Permita pop-ups".'
