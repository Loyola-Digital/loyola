status_reason: 'Re-review do QA Loop (iteração 1). REL-001 e SEC-001 FECHADOS, conferidos de verdade: 26/26 testes, 10 mutações próprias (8 mortas, 1 equivalente, 1 sobrevivente que expõe lacuna de teste e não defeito), Chrome 154 real com o código novo, bloqueador de pop-up real distingue bloqueio de aba aberta, e um documento hostil (aspas, &, </iframe>, <script>, comentário) mais um título hostil (</title><script>, "><script>) não injetam nada na moldura, que tem a origem do app. Segue CONCERNS porque a verificação visual na página do app (TEST-001) continua por fazer e só o dono pode fazê-la no preview da PR; WAIVED não cabe sem aprovação do dono. Há ainda uma decisão do @po pendente sobre o efeito colateral do isolamento (DEC-001) e um teste fraco no escape do título (TEST-002, low).'
