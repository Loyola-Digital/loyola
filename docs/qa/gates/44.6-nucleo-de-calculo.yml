issues:
  - id: QA-446-01
    severity: high
    category: correctness
    title: "Etapa gratuita sem dado de lead vira Conv. LP = 0 e LIDERA o ranking com 100% de queda falsa"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.6 (AC11, AC3)"
    description: >
      `DiaBruto.leadsAtribuidos` é opcional, mas `agregar()` faz
      `a.leadsAtribuidos += d.leadsAtribuidos ?? 0`. Campo ausente e zero
      legítimo colapsam no mesmo valor. Depois, `calcularMetricas` para a
      família gratuita divide `0 / landingPageViews` e devolve `convLP: 0` — um
      número, não `null`.
    proof: |
      Executado contra o módulo compilado:

        CASO A — etapa gratuita SEM dado de lead (campo ausente)
          convLP = 0    custoPorLead = null
        CASO B — etapa gratuita COM dado, zero lead de verdade
          convLP = 0    custoPorLead = null
          distinguíveis? NÃO — mesmo valor

    consequence: |
      O custo sai `null` nos dois casos, então o dinheiro não fica errado. O
      RANKING fica:

        convLP       100.0%   <- etapa sem dado de lead
        cpc           50.0%
        connectRate   11.1%

      `quedaReal("convLP", 0, 0.05)` = `1 − 0/0.05` = **1,0**. Uma etapa que só
      não teve a planilha de leads ligada aparece em primeiro lugar prometendo
      eliminar 100% do custo — e manda o time reescrever uma página que não tem
      problema medido. O ranking é o produto inteiro desta aba.
    whyItMatters: >
      É a MESMA classe de erro que a QA-26 da Story 43.3 estabeleceu
      (`undefined` ≠ `0` em `p25`/`p100`) e que a Story 44.1 respeitou com
      rigor — o gate da Fase 1 elogiou justamente isso. A lição foi aprendida
      num lugar do epic e perdida no outro.
      Viola a AC11 e a regra 7.4 da spec: *"dado ausente vira indisponível com
      motivo, nunca 0, nunca estimativa"*.
    scopeIsPrecise: >
      Só a família GRATUITA. Na paga, `checkouts` é obrigatório no tipo
      `DiaBruto`, então ausência não é representável e um `0` ali é zero
      legítimo. Conferido, não presumido por simetria.
    recommendation: >
      `agregar()` deve preservar a ausência — por exemplo `leadsAtribuidos:
      number | null`, somando só quando ALGUM dia trouxe o campo (é exatamente o
      padrão que a 44.1 usou em `videoViews25`/`videoViews100`). Com isso
      `calcularMetricas` devolve `convLP: null` e o motivo `semDados`, e o item
      não entra no ranking.
    testGap: >
      Existe teste de "gratuita usa leads atribuídos no numerador", mas nenhum
      para o campo AUSENTE. Os 41 testes passam com o defeito presente.

  - id: QA-446-02
    severity: low
    category: efficiency
    title: "janelasDe7Dias é O(n²) — filtra a série inteira a cada dia"
    file: packages/shared/src/cadeia-cac.ts
    description: >
      Para cada dia da série, `filter` varre todos os dias. Medido: 90 dias →
      2ms, 365 → 30ms, 730 → 101ms.
    impact: >
      O teto roda sobre todas as campanhas do grupo. Com ~90 campanhas de um ano
      dá ~3 segundos por grupo, server-side. Não é fatal e é cacheável, mas
      cresce com o histórico — e o histórico só aumenta.
    recommendation: "Dois ponteiros sobre a série ordenada resolve em O(n)."

  - id: QA-446-03
    severity: low
    category: correctness
    title: "`agregado.dias` conta LINHAS, não datas distintas"
    file: packages/shared/src/cadeia-cac.ts
    description: >
      `agregar()` faz `a.dias += 1` por linha. Se a entrada trouxer duas linhas
      para a mesma data, `dias` fica maior que o número de dias reais.
    note: >
      Hoje inofensivo: o endpoint da 44.1 já agrega por (campanha, dia), então a
      entrada não tem repetição. Vira problema se alguém alimentar o módulo com
      grão de anúncio. `dias` é usado só para diagnóstico, não entra em conta.

  - id: QA-446-04
    severity: low
    category: process
    title: "CodeRabbit não rodou"
    description: "WSL/macOS. Segurança e qualidade avaliadas manualmente."

