summary: >
  O módulo é bom e a disciplina de verificação é a melhor da sequência: os 12
  valores dourados batem contra recálculo independente, a prova de runtime da
  AC1 foi feita (é o único gate que pega a armadilha da 19.14), e o @dev achou e
