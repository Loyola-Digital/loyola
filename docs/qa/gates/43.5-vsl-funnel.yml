status_reason: >-
  Iteracao 2 — PASS. QA-32 e QA-33 resolvidos.
  A montagem saiu para `services/vsl-funnel.ts` e os testes passaram a chamar as
  MESMAS funcoes que a rota chama. Nao aceitei a prova do @dev: rodei duas
  mutacoes proprias, em pontos que ele nao testou — `pitchTimeUtil` passando a
  aceitar zero (que reintroduziria o defeito medido na 29.41) e
  `consultasRestantes` pegando a primeira janela em vez da mais apertada.
  Cada uma derrubou exatamente um teste, e o codigo restaurado volta a 14/14.
  A cobertura agora e real.
  A quota passou a ser consultada antes do lote, com duas decisoes bem
  fundamentadas. Nao paralelizar foi registrado como escolha, com o motivo — que
  e a forma certa de deixar um risco aceito.
