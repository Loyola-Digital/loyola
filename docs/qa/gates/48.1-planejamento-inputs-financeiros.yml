  - id: 'REL-001'
    severity: high
    status: resolved
    finding: '`planejamento-inputs-financeiros.tsx:134-149`: o primeiro `return` é `if (query.isLoading || !form || …) return <Skeleton/>`; o `if (query.isError)` vem DEPOIS. Em erro, `query.data` é `undefined`, o `useEffect` nunca chama `setForm`, `form` fica `null` e a condição do skeleton é verdadeira para sempre — o ramo `role="alert"` nunca renderiza. Efeito: API fora, 404 (guest sem membership no projeto; funil de outro projeto), 500, ou API atrás do painel (contrato 13 vs 14 — exatamente o cenário da 47.15) aparecem como "carregando…" eterno. É a classe "erro virando ausência na tela" (3 casos em 26/08; regra do repo: testar a falha).'
    suggested_action: 'RESOLVIDO em 551b1832: `estadoDaTela({ isLoading, isError, temForm })` em `lib/utils/planejamento-inputs-form.ts`, erro antes de carregando; o componente ramifica por ela (linhas 144-152, erro primeiro — conferido). Teste com o cenário do defeito; QA re-mutou a ordem: 1 falha.'
  - id: 'MNT-001'
    severity: low
    status: resolved
    finding: '`planejamento/page.tsx:115`: `podeEditar={role !== "guest"}` com `useUserRole()` devolvendo `null` enquanto `/api/me` carrega → guest vê o botão Salvar por um instante e depois ele some. A API barra (403), então é só cosmético.'
    suggested_action: 'RESOLVIDO em 551b1832: `podeEditar={role !== null && role !== "guest"}`.'
  - id: 'MNT-002'
    severity: low
    status: resolved
    finding: 'Percentuais voltam para o campo com PONTO decimal (`paraFormulario` → "12.5") enquanto o usuário pt-BR digita VÍRGULA (e `lerNumero` aceita as duas). Funciona, mas o mesmo campo mostra "12.5" e aceita "12,5".'
    suggested_action: 'RESOLVIDO em 551b1832: `paraFormulario` devolve vírgula; teste de ida-e-volta ajustado (`12,5`, `1200,5`).'
  - id: 'MNT-003'
    severity: low
    status: resolved
    finding: 'Na tabela de canais orgânicos os inputs de % são renderizados com `campo(c.pct, "")` — `<Label>` vazio. Leitor de tela não sabe que campo é.'
    suggested_action: 'RESOLVIDO em 551b1832: `aria-label="% da meta — {canal}"` quando o rótulo visível está vazio; `<Label>` só renderiza com texto.'

