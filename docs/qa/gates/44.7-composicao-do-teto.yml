summary: >
  A composição está bem construída e a ordem que a AC2 exige — filtrar o piso
  ANTES de escolher o melhor — está correta e testada. A verificação por
  reversão do @dev pegou seis regras. O que segura o gate são dois defeitos que
  a bateria de testes era estruturalmente incapaz de ver: a reescrita O(n) da
  AC8 mudou o comportamento para séries com mais de uma linha por data, e
  `montarRanking` devolve cinco itens onde a spec §8 exige três. O desempate por
  maior base — a regra que a story sinaliza como a mais frágil — está correto na
  intenção e cobre o modo de falha que motivou sua criação; degrada por ruído de
  ponto flutuante, mas nunca de volta ao caso de um dia.

issues:
  - id: QA-447-01
    severity: high
    category: correctness
    title: "A reescrita O(n) da AC8 mudou o comportamento: duas linhas na mesma data produzem uma janela PARCIAL, e o teto sai até 4,6× inflado"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.7 (AC8)"
    description: >
      A AC8 é explícita: "trocar a implementação SEM mudar o comportamento". A
      versão antiga montava a janela com `ordenados.filter(t >= inicio && t <= fim)`,
      que inclui TODAS as linhas da data final. A nova usa `slice(inicio, fim + 1)`,
      que para no índice corrente. Com duas linhas na mesma data, a primeira
      janela agrega só um pedaço do dia e concorre ao teto com esse pedaço.

      O comentário no próprio código afirma o contrário: "duas linhas na mesma
      data emitem duas janelas iguais, como antes". Isso é o agravante — quem
      escrever a 44.8 vai ler essa garantia e passar a série ad-level sem
      agregar por dia, que é exatamente a fonte declarada na spec §2.6.
    proof: |
      Teste diferencial contra a implementação de 067faa27, 28 séries
      (com/sem gap, com/sem duplicata, n de 1 a 365):

        17/28 idênticas — TODAS as 11 divergências têm data duplicada.

      Caso mínimo — 2 linhas em 2026-05-10 (spend 100 e 300):
        janela 1: 2026-05-04..2026-05-10  linhas=1  spend=100   <- parcial
        janela 2: 2026-05-04..2026-05-10  linhas=2  spend=400   <- completa
        A implementação antiga emitia spend=400 nas duas.

      Impacto no número — campanha de 7 dias com 2 anúncios por dia
      (A: CPC 0,20 pequeno · B: CPC 1,00 grande):
        CPC verdadeiro da campanha na semana ... 6440/7000 = 0,9200
        teto de cpc que sai hoje ............... 0,2000  base=12.000  selo=baixa
        controle (mesma campanha agregada/dia) . 0,9200  base=504.000

      O teto vem de um anúncio num dia, rotulado como janela 04–10/mai.
      4,6× inflado — o modo de falha que a spec §4 descreve como
      "máximo de estimativa ruidosa infla sozinho".
    whyTestsMissed: >
      Nenhum teste do módulo passa duas linhas com a mesma data. As duas
      ocorrências de "2026-05-01" na suíte estão em testes diferentes, com uma
      linha cada. Os 47 testes da 44.6 continuaram verdes como a AC8 pedia — mas
      verdes por não cobrirem o caso que diverge, não por equivalência.
    suggestedAction: >
      Duas saídas. (a) Preservar o comportamento antigo: avançar `fim` até a
      última linha da mesma data antes de emitir a janela. (b) Decidir que a
      entrada é uma linha por data — e então VALIDAR isso na fronteira de
      `calcularTetos`, documentar no contrato de `SerieDeCampanha`, e corrigir o
      comentário que hoje promete o oposto. A opção (b) é mais barata e mais
      honesta, mas só vale se a 44.8 agregar por dia no SQL.

  - id: QA-447-02
    severity: high
    category: correctness
    title: "montarRanking devolve 5 itens onde a spec §8 exige 3 — CPM e CTR viram linhas próprias e empurram o Connect Rate para último"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.7 (AC7) · spec §2.4, §3, §8"
    description: >
      `montarRanking` itera sobre `tetosResolvidos`, que traz as cinco métricas.
      CPM e CTR entram no ranking como oportunidades independentes. A spec §2.4
      proíbe exatamente isso: "o mesmo ganho seria contado duas vezes — CPM
      caindo 25% arrasta o CPC junto, e o ranking listaria duas oportunidades
      onde há uma só". `compostoNoTeto` está protegido (usa `custoDaCadeia`, que
      só olha CPC/Connect/Conv.LP); o ranking não.
    proof: |
      Cenário dourado da spec §8, entrada exata:

        convLP       queda=54,82%  posicao=3
        cpc          queda=50,00%  posicao=1
        ctr          queda=33,33%  posicao=0   <- mesma alavanca do CPC
        cpm          queda=25,00%  posicao=0   <- mesma alavanca do CPC
        connectRate  queda=11,11%  posicao=2

      spec §8: "Ordem do ranking: Conv. LP › CPC › Connect" — 3 itens.
      montarRanking devolve 5, e o Connect Rate cai de 3º para 5º.

      CPC = (CPM/1000)/CTR, então os −50% do CPC JÁ contêm os −25% do CPM e os
      −33,33% do CTR. São três linhas para uma alavanca só.
    whyTestsMissed: >
      O teste dourado da ordem (cadeia-cac.test.ts:99-103) monta três
      `ItemRanking` à mão e chama `ranquear` — primitiva da 44.6 — nunca
      `montarRanking`. Os testes da AC7 verificam `r.length > 0` e
      `r.every(i => i.queda > 0)`: passam com 5 itens tanto quanto com 3.
    suggestedAction: >
      Restringir `montarRanking` a cpc/connectRate/convLP. CPM e CTR continuam
      com teto calculado — `decomporCPC` precisa deles — mas como decomposição
      do CPC, que é o papel que a spec §2.4 lhes dá. Depois, um teste que rode o
      cenário da §8 por `montarRanking` e afirme a lista de três.

  - id: QA-447-03
    severity: medium
    category: correctness
    title: "O desempate por maior base compara float com ===; em campanha constante o teto cai para 3-6 dias em ~34% dos casos"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.7 (regra sem AC — introduzida por dois testes que falharam)"
    description: >
      A regra é `valor === melhor.valor && base > melhor.base`. A igualdade é
      exata em IEEE754. Numa campanha de desempenho constante — o cenário que
      motivou a regra — as janelas de tamanhos diferentes produzem o mesmo valor
      matemático com representações diferentes, e o desempate simplesmente não
      roda: a janela "melhor" por 1 ULP vence sozinha.

      O módulo já sabe disso e resolve em `coberturaAtipica`, que arredonda
      antes de comparar com um comentário explicando `0.9 - 0.7 =
      0.20000000000000007`. A mesma disciplina não foi aplicada aqui.
    proof: |
      Campanha PERFEITAMENTE constante, 8 dias, spend 12,07 e 37 linkClicks/dia:

        janelas de 1 a 6 dias ... cpc = 0.3262162162162162
        janelas de 7 dias ....... cpc = 0.32621621621621627   <- pior por 1 ULP

      CPC é "menor vence", então as janelas de 7 dias são DESCARTADAS e o
      desempate por base escolhe a melhor entre as curtas:

        teto escolhido: janela 2026-05-09..2026-05-15, base 90.000, 6 dias de dado.

      Varredura de 17.083 campanhas constantes (spend R$1,00-300,00 × 4 volumes
      de clique), medindo o tamanho da janela vencedora:

        7 dias .. 65,8%   (correto)
        6 dias ..  8,6%
        5 dias ..  8,9%
        4 dias ..  8,8%
        3 dias ..  7,9%
        1-2 dias.. 0,0%   <- o modo de falha original NÃO reaparece
    assessment: >
      A regra está certa na intenção e cobre o que foi criada para cobrir: o
      teto nunca volta a ser "melhor valor visto num dia". O valor do teto é
      idêntico até a 15ª casa, então ranking, composto e sinalização não mudam.
      O que degrada são os metadados que a spec §4 manda exibir — `base`, `de` e
      `ate` — e, quando a base de 7 dias cruzaria o piso alto e a de 5 não, o
      SELO cai de 🟩 alta para 🟨 baixa. Com a §4.1 dizendo que "a maior parte
      dos tetos nasce em confiança baixa", degradar selo por ruído de float
      importa.
    suggestedAction: >
      Tratar como empate o que difere por tolerância relativa, como
      `coberturaAtipica` já faz. Um teste com a série constante de 12,07/37
      falha hoje e passa depois — e falha de novo se a tolerância for removida.

  - id: QA-447-04
    severity: low
    category: determinism
    title: "Empate total entre campanhas resolve pela ordem do array de entrada"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.7 (AC4)"
    description: >
      Quando duas campanhas empatam em valor E em base, fica a primeira do
      array. `campaignId`, `fonte` e as datas exibidas passam a depender da ordem
      em que a 44.8 montar a lista — e uma query sem `ORDER BY` não garante ordem
      estável entre execuções.
    proof: |
      Duas campanhas idênticas, ALFA (ad-level) e BETA (campaign-level):
        ordem [A,B] -> teto.campaignId = ALFA
        ordem [B,A] -> teto.campaignId = BETA

      A spec §4 manda exibir origem e fonte no rótulo do teto. Os dois rótulos
      estão corretos; qual aparece é sorteio.
    suggestedAction: >
      Desempate final estável — `campaignId` crescente resolve e é trivial.

  - id: QA-447-05
    severity: low
    category: correctness
    title: "Família gratuita sem lead na janela devolve motivo `baseInsuficiente`, que descreve algo que não aconteceu"
    file: packages/shared/src/cadeia-cac.ts
    story: "44.7 (AC5)"
    description: >
      Quando a guarda de cobertura roda e `coberturaDaJanela` devolve `null`
      (nenhum lead no período), o `continue` cai no ramo final e o motivo sai
      `baseInsuficiente`. Mas a base pode estar folgada — o que faltou foi lead
      para julgar a cobertura, não LP view.

      A AC5 lista três motivos e nenhum cobre "não deu para julgar". A lacuna é
      da AC, não da implementação.
    proof: |
      Etapa gratuita, 350 LP views na janela (piso baixo é 150), cobertura da
      etapa existente mas em datas fora da janela:
        convLP -> valor=null  motivo=baseInsuficiente
      A regra 7.4 da spec exige motivo que descreva o que aconteceu.
    suggestedAction: >
      Levar ao @po: ou um quarto motivo, ou a decisão explícita de que este caso
      cai em `semDados`. Não inferir (regra 7.5).

observations:
