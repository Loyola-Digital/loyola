decision: >
  FAIL. Não por bloqueio arbitrário: a AC8 diz textualmente "sem mudar o
  comportamento" e o comportamento mudou, com 4,6× de inflação medida no caso
  reproduzido; e o ranking diverge incondicionalmente do teste dourado da §8 —
  toda chamada de `montarRanking` devolve cinco itens.

  As duas correções são pequenas e localizadas. O QA-447-03 pode ir junto ou
  virar follow-up: ele degrada metadados, não o número.

  Nada disso está em produção nem tem consumidor — o custo de corrigir agora é o
  menor que vai existir. Depois da 44.8 o `montarRanking` já estará sendo servido.

