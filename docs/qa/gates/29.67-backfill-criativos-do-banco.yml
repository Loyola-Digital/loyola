status_reason: >-
  PASS — os sete ACs cumpridos, e o desenho do AC3 resolve a causa raiz em vez do
  caso. `CREATIVE_RESOLVERS` transforma "adicionar campo novo" em "adicionar uma
  linha", que era exatamente o passo esquecido nas duas falhas anteriores (36.8
  e 29.63).
  Verifiquei a seleção **executando contra o banco de producao**, nao lendo o
  codigo: a query devolve numeros coerentes, o teto corta, e o filtro discrimina
  em dia de desatualizado. O DG & CPDF dar **zero candidatos** e a prova de que o
  jsonb chega como objeto — se viesse como string, `precisaRecarimbar` acusaria
  os 252 anuncios como desatualizados.
  Uma observacao low e uma pendencia que so producao fecha.
