porQueCONCERNSeNaoFAIL: >
  Considerei FAIL. O QA-4410-01 é `high`, está presente no comportamento
  entregue, e foi medido em produção — não é risco futuro.

  Três coisas seguraram. **(1)** A arquitetura está certa: as duas saídas
  convivem, a proteção da 44.12 está travada por teste, e o defeito é de
  agregação num ponto só, não de desenho. **(2)** O numerador correto **já
  existe** no mesmo payload (`coberturaDiaria.leadsAtribuidos`) — a correção é
  trocar a fonte de uma linha, não redesenhar. **(3)** O teto, que é o número
  que a story existe para produzir, está **correto**; o defeito está no lado
  "Atual" da comparação.

  Mas ele é obrigatório antes do merge, e por um motivo específico: o viés anda
  sempre na mesma direção. Um erro de 2% que às vezes sobe e às vezes desce se
  dilui; um que sempre infla o Atual contra o teto se acumula na decisão de
  onde atacar — que é a única coisa que esta aba existe para responder.

