top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O ramo do Google na expansão (D22, AC2e/AC3f) só está provado na função pura. No componente, nenhum teste renderiza uma linha do Google: o teste jsdom monta com `googleTrafego = { tipo: "sem_campanha" }`. Duas mutações minhas SOBREVIVEM às 8 suítes que alcançam o código (todas as que importam o componente, o módulo da expansão ou leem o arquivo). Q23 (`lyrio-detail-table.tsx:279`): `r.platform === "google"` → nunca verdadeiro. A linha do Google passa a usar `expansaoDaMeta`, e os dias mostram mídia zerada pela regra da Meta e venda "0", em vez de "—" com a dica de que o Google não informa a campanha. Q24 (`:562`): o estado da linha do Google passa a depender da série da Meta. Aberta sozinha, ela mostra o skeleton para sempre, porque `precisaDaSerieDaMeta` não pede a série para linha do Google. Hoje o código está certo nos dois pontos. A regra está nos testes da biblioteca, mas falta o fio do chamador.'
    recommendation: 'No `lyrio-detail-table-42-19.test.tsx`, um caso com `googleTrafego` pronto e uma campanha Google vinculada. Abrir só a linha do Google e afirmar: (a) nenhuma requisição ao `entity-daily`; (b) as sub-linhas sem skeleton, com o gasto do `/daily` sem imposto; (c) "—" nas colunas de venda, com o `title` = `DICA_GOOGLE_SEM_VENDA`.'
    owner: '@dev'
    status: resolved

  - id: TEST-002
    severity: low
    category: tests
    description: 'O AC1c (trocar de plataforma ou de janela fecha todas) só tem fio para a DIMENSÃO. Q21 (`lyrio-detail-table.tsx:233`): `contextoDaAbertura(plataforma, dimensao, days)` → `(..., 0)`. Q22: → `("todas", dimensao, days)`. As duas SOBREVIVEM. O teste unitário prova que `contextoDaAbertura` muda com os três argumentos, mas não que o componente passa `days` e `plataforma`. A Q30 (o reset só esconde, sem zerar) CAI, então o mecanismo está protegido. A lacuna é só a entrada.'
    recommendation: 'No teste jsdom, depois de abrir uma linha: `rerender` com `days={7}` → nenhuma "Σ dos dias"; e trocar o select Plataforma para "Meta" → nenhuma "Σ dos dias".'
    owner: '@dev'
    status: resolved

  - id: TEST-003
    severity: low
    category: tests
    description: 'O dia de SP no componente. Q20 (`lyrio-detail-table.tsx:240`): `hojeNoNegocio()` → `new Date().toISOString().slice(0, 10)` SOBREVIVE, porque o teste jsdom fixa o relógio em 15:00Z (12:00 de SP), quando os dois dias coincidem. Das 21h às 24h de SP, a expansão começaria em amanhã: a marca "dia em andamento" iria para um dia vazio, e o `startDate`/`endDate` da série andaria um dia. É exatamente o problema que o desvio 4 do @dev existe para evitar. A função pura e a API estão protegidas (Q1 e Q19 caem).'
    recommendation: 'Um caso no teste jsdom com `vi.setSystemTime(new Date("2026-10-29T02:30:00Z"))`, afirmando a primeira sub-linha "28/10/2026" e `endDate=2026-10-28` no pedido.'
    owner: '@dev'
    status: resolved

  - id: TEST-004
    severity: low
    category: tests
    description: 'Q2 (`packages/api/src/utils/vendas-por-canal-lyrio.ts:378`): o dia da venda pelo `event_at` em vez de `purchased_at` SOBREVIVE. O seed do PGlite grava o mesmo instante nas duas colunas (`inserir`, `e.em`). A janela e o card de `/sales` cortam por `purchased_at` (PO-02 da 42.12). Um evento entregue depois da meia-noite de SP cairia em outro dia, e a paridade por entidade não pegaria isso, porque continua valendo.'
    recommendation: 'Um evento com `purchased_at` às 23:50 de SP e `event_at` 20 minutos depois (já no dia seguinte), esperando o dia de `purchased_at`.'
    owner: '@dev'
    status: resolved

  - id: TEST-005
    severity: low
    category: tests
    description: 'Duas bordas sem teste. Q27 (`lyrio-detail-table.tsx:751`): o "Δ … vs. linha" do investimento nunca aparece, e SOBREVIVE. A função pura devolve a diferença, mas nenhum render tem diferença, então o AC4c só está provado até o dado. Q12 (`lyrio-detalhamento-diario.ts:340`): o imposto pela data de hoje em vez da data do dia SOBREVIVE. Na prática é equivalente até 90 dias. Com o DayRangePicker em 365 dias (`maxDays = 365`), a janela cruza 2026-01-01 (`VIGENCIA` de `meta-tax.ts`), e os dias de 2025 seriam tributados sem imposto vigente.'
