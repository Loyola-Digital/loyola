    category: tests
    description: 'Loop 1, Q33 (`lyrio-detail-table.tsx`, o span do Δ das IMPRESSÕES na Σ): `{false && d && d.impressions !== 0 && …}` SOBREVIVE. O teste novo do Δ só tem diferença no investimento e afirma exatamente um "Δ". A regra de impressões e cliques está provada na função pura (`diferencaDaMidia`: 1 impressão aparece), mas não no render. Os dois spans são iguais ao do investimento, que agora tem fio (Q27 cai).'
