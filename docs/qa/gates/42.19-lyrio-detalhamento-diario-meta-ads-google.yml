deviations_reviewed:
  - '1 (UNION ALL numa leitura): ACEITO. As linhas `grao = comprador` são as da consulta antiga, coluna a coluna (teste no PGlite). A rota continua com 3 `execute`. Q5 (a rota sem separar o grão) cai. A `ev` agora tem dois leitores, e o Postgres a materializa. Isso confere com a medição do @dev, que é uma só e sem plano.'
  - '2 (centavo do acumulado): ACEITO. A soma telescopa no `round(total)` do comprador, que é o centavo da linha. Q3 (arredondar o dia sozinho) e Q4 (acumulado sem ORDER BY) caem.'
  - '3 (`compradores` por dia não soma a linha): ACEITO. Está declarado no contrato v62 e testado. A tela não mostra compradores.'
  - '4 (startDate/endDate da régua de SP): ACEITO e necessário. A rota `entity-daily` calcula o `since` com `toISOString`. Q19 e Q29 caem. O fio no componente é a TEST-003.'
  - '5 (só Vendas e Receita): ACEITO. Ver REQ-001.'
  - '6 (mídia sem linha numa nota abaixo da tabela): ACEITO. O AC2f diz "dentro da Σ, declarada", mas não existe Σ de "sem linha". A nota declara o valor com o imposto (Q17 cai), cita "Sem linha nesta tabela" e só aparece com a série carregada.'
  - '7 (tolerância de 1 centavo): ACEITO. "Passa de R$ 0,01" lido como estritamente maior, em centavos inteiros. Testado nas duas bordas.'
  - '8 (a Σ da venda inclui os dias "—"): ACEITO. A paridade com a linha (AC4b) vale mais que fechar a coluna (AC4e) quando há venda antes de `atributosDesde`. A dica diz quantas vendas são. Em produção, o @dev não achou nenhum caso.'
  - '9 (`diasPorCampanha` do Google): ACEITO. É a mesma consulta, recortada por `linhasNaRegua`, e `trafegoNaRegua(diasG1) == porCampanha` está testado.'
  - '10 (ClickUp e CodeRabbit não feitos): registrado como pendência, não é achado.'

