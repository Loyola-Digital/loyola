checks:
  code_review: 'Li o diff inteiro (15 arquivos). API: `ctesDosCompradores` e `colunasDoComprador` são o texto SQL de antes, só extraído, e `consultaDeVendasPorCanal` continua igual. `consultaDeVendasPorCanalComDias` agrupa `u` (o comprador, com a atribuição `maisRecente` e os sinais da série inteira) e `dias` (comprador × `diaNoFusoDoNegocio(purchased_at)`, só eventos pagos na janela), acumula por comprador em ordem de dia e junta pelo id, que nunca vira coluna. `montarVendasPorDiaDaMeta` usa `canalDaVenda` e as mesmas chaves de `montarVendasPorCanal`: id da campanha e nome aparado pelo `atributo()` do SQL. WEB: `indiceDaMidiaDaMeta` soma todos os ids do mesmo `entityName.trim()` em Público e Criativo, e pelo id em Campanha. O imposto entra uma vez, por dia, com a data do dia (`comImpostoMeta(m.spendBruto, dia)`), antes do `metaRow`. `lyrio-detail-rows.ts` não foi tocado. O Google não leva imposto. Na Σ, `metaRow` roda sobre as somas: cliques no link para o CTR e o CPC, e cliques totais à parte. A diferença é calculada em centavos inteiros. `fecharEmCentavos` vale para o investimento e para a receita. Estados: o erro é testado antes do carregando (Q28 cai). A venda carregando, em erro ou com API antiga vira "—". O dono da chave segue a regra de `vendasDoDetalhamento` (a primeira linha). A abertura é zerada na própria renderização em que o contexto muda (Q30 cai). O `<button type="button">` tem `aria-expanded` e `aria-controls` para o `<tbody>` dos dias, que existe também fechado (`hidden`).'
