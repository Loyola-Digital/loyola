decisoes_do_dev:
  vinculo_a_etapa_de_captacao: 'ACEITO, e é ele que neutraliza o caso de borda do código contido em outro. Pela regra do nome (substring, a do `effectiveMatchCode`), `dg-pg05` está contido em `dg-pg050-…`, e `ehCampanhaDeTestePreLancamento("dg-pg050-x--vendas-captacao…", dg-pg05)` dá true. Mas uma campanha do PG050 só entraria se estivesse vinculada a uma etapa de captação do PG05, e aí o erro seria do vínculo, não da regra. O vínculo também cumpre o AC5 aceito pelo @po ("as campanhas que o loader já associa às etapas"). A R12-2 trocou só o limite de data pelo filtro do nome. No PG05 não muda o número.'
  serie_diaria_em_d_menos_n: 'Respeita o AC10 no que o AC10 protege. SEM testes, o HTML e o payload são idênticos à main nos 4 casos medidos, inclusive "linhas que não se qualificam". COM testes, a mudança é consequência da R11-1 com a F12, e o @dev a listou. A forma (eixo D−n) e o limiar de pico-artefato vão além dos "números de investimento, CAC e ROAS" do texto do AC10. Por isso: ratificável, não defeito (REQ-001).'
  atribuicao_pela_utm_campaign: 'É a convenção do Motor I: `utm.campaign` é o campaign_id (o loader resolve ids de `utm_campaign` para nomes em `meta_ad_insights_daily`, `debriefing-money-time-loader.ts:900-920`; o `c=` do n8n no passo 4 do método). A 49.18 usa o `co=` (ad_id) porque atribui por anúncio; aqui a atribuição é por campanha, granularidade diferente e compatível. A conta é de VENDAS (linhas pagas e deduplicadas), não de compradores, e a story diz "vendas atribuídas". Aceito. A K9, que troca o id pelo nome da campanha, morre.'

checks:
  fidelidade_match_code: 'Comparei linha a linha com `routes/funnel-stages.ts:226-231` e `routes/funnels.ts:783-785`: mesma ordem (match_code aparado e minúsculo; senão nome aparado e minúsculo; senão null). A origem vai para o payload. Casos de borda: maiúsculas e travessão normalizados (K3 morre); `match_code` com espaços (K2 morre); funil sem `match_code` usa o nome (testado só com nome de 2 segmentos, K1 viva); nome com espaços não casa, em silêncio (REL-001); código contido em outro é neutralizado pelo vínculo à etapa.'
  imposto_uma_vez: 'A consulta normal de mídia do loader lê só os dias da janela (`gte inicio`, `lte fim`), e a de testes só os dias antes do início (`lt inicio`). A linha não aparece duas vezes, e o motor ainda confere `m.dia < inicio` (a K5, linha do D0 contada como teste, morre). As linhas de teste entram em `midiaComImposto` uma vez, com `aplicarImposto` por dia; a K6 (imposto 2×) morre com 6 falhas. O resumo à parte recalcula com a MESMA função sobre o bruto, então o valor bate e não há segundo gross-up. A K7 (resumo com o bruto) morre. No PG05: 1.262,41 ÷ (1 − 0,1215) = 1.437,01, e a soma confere.'
  paridade: 'A comparação recalculada passa pelo mesmo loader, com o código e o início DELA. As mutações C16 (config do atual na comparação), C12, K12 (seção 07 sem a comparação) e K14 (resumo sem os testes da comparação) morrem. Ressalva: comparação a partir de payload salvo antigo (REQ-002).'
  ac10_sha: 'Montei uma base independente (`git archive 0f237e62 packages/api/src`, com o shared ligado; o shared e o web não mudaram) e rodei o `sha-4917c.mts` do @dev, trocando só o caminho da base (`scratchpad/qa-sha-4917c.mts`). Os 7 casos batem com os do @dev. Sem testes, iguais à main: final edição única html 3777ae436071ea5b / payload 3a0082822cdd5364; final × comp ed385b6658da5ee3 / e816db5ec4472869; parcial × comp ccf16d03bb15fec3 / 4bd875c3ae038e35; linhas que não se qualificam ed385b6658da5ee3 / e816db5ec4472869. Com testes, diferentes e listados: atual 68b62d351c2cdfd6 / e7bfd2d78ee0c5e1; comparação 3bee58245d681fbe / ca709d52f5c1297f; os dois, parcial dbee7f88ea833720 / 7acab7045a2b2e6a. Confere com a lista do Dev Agent Record, inclusive o limiar de pico-artefato (REQ-001).'
  mutacoes: 'Do QA: 15 mutações, 12 mortas (K2, K3, K5–K10, K12–K15) e 3 vivas (K1, K4, K11 — TEST-001), cobrindo o código, a regra, o motor (janela, imposto, resumo, atribuição, curva) e os chamadores (loader, render da seção 07 e do resumo, resumo-macro). Do @dev: as 16 do `mutar-4917c.py`, reexecutadas, morrem todas. Rodei as 15 do QA duas vezes (antes e depois da pausa), com o mesmo resultado.'
  suites: 'Com a máquina sob carga (load average 100–250, outras worktrees rodando vitest em paralelo), a rodada com timeout padrão de 5 s deu falsos timeouts. Com `--testTimeout=120000 --hookTimeout=240000`, a API inteira dá 4.608 passando e 10 falhas, as 10 pré-existentes conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2). Todas as suítes de debriefing passam. `tsc --noEmit` da API: exit 0. `eslint src/`: 0 erros e 1 warning que já existia. Web e shared: sem diff (N/A).'
  caso_real_pg05: 'Conferido só pelo registro (`ac12-4917c.mts`/`.out`), sem rodar de novo. O pool usa `-c default_transaction_read_only=on`, e o `.out` traz `"sessao_read_only": "on"`. O `gravar` é no-op e não há nenhum "@" no `.out`. A config foi simulada e rotulada. Resultado: 15 campanhas `dg-pg05-out-26--vendas-captacao--…` de 27/09 a 29/09, R$ 1.262,41 brutos = R$ 1.437,01 com imposto, 0 venda; o método dá R$ 1,4k e 0 venda. Código `dg-pg05` (origem `match_code`). CAC de 51,51 para 58,20 (12.512,68 ÷ 215). O D0 da curva sai com R$ 1.449,88. As 2 lead-form ficam fora pela fase, como no método.'
  security: 'Sem rota nova. Nomes de campanha e o código passam por `esc()` no render. O payload ganhou ids, nomes e números, sem PII.'
  api_contract: 'Sem rota nova e sem mudança de resposta de rota. `testesPreLancamento` é aditivo e opcional no payload gravado, lido só pelo render do servidor. `API_CONTRACT_VERSION` e `DEBRIEFING_PAYLOAD_VERSAO` não sobem, a mesma regra das fatias A e B. Sem migration (o loader só passa a ler `funnels.name` e `funnels.match_code`, que já existem).'
  performance: 'Uma consulta a mais em `funnels`, por id, e uma em `meta_campaign_insights_daily`, só para as campanhas de teste e só antes do início. Desprezível.'

