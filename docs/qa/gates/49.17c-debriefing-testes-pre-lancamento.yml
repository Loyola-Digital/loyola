story: '49.17'
story_title: 'Resumo macro no topo do Debriefing — fatia C: testes pré-lançamento (AC5, R11-1 opção B + R12-2)'
scope_do_gate: 'Fatia C: o AC5 e as provas dele no AC10 e no AC12 (inclui o caso real do PG05). As fatias A e B já passaram pelo gate `49.17-debriefing-resumo-macro.yml` (PASS, iteração 2) e estão na main (#1001, 0f237e62).'
arquivo_do_gate: 'Arquivo separado: `49.17c-…`. Motivo: o gate das fatias A e B registra um PASS de código que já está na main, e reescrevê-lo misturaria dois escopos e dois commits revisados. O precedente no repo é `48.15-pr1-extracao.yml`, gate de uma fatia em arquivo próprio.'
verdict: CONCERNS
gate: CONCERNS
status_reason: 'O AC5 está atendido, fiel à R11-1 (B) e à R12-2. O PG05 deu R$ 1.437,01 com imposto e 0 vendas, igual ao método. Sem testes, o HTML e o payload saem iguais à main (SHA reproduzido em base independente), e o imposto entra uma vez só. Ficam só lows: 3 mutações sobreviventes (uma é o fallback do código, a fidelidade que mais importava provar), a ratificação do @po para a série diária em D−n e cópias divergentes da regra do código no repo.'
reviewer: 'Quinn'
updated: '2026-10-08T12:30:00-03:00'
