base: 'origin/main @ 0f237e62, com as fatias A+B. No `git fetch` do gate, a main estava em 106a4470 (#1002): um commit só de docs (story 49.21 e rodada 12 no epic), que não toca arquivo desta branch. Não há conflito; o rebase é opcional.'

issues:
  - id: TEST-001
    severity: low
    category: tests
    description: 'De 15 mutações do QA, 12 morrem e 3 sobrevivem (`scratchpad/qa-mut-4917c.py`, contra as suítes de debriefing com timeout de 60–120 s; cada uma restaurada, `git status` limpo no fim). (K1) Trocar o fallback do código, de "nome do funil inteiro" para "2 primeiros segmentos" (a regra `tokenDoFunil` do SendFlow/Mautic/campaign-log), não derruba nenhum teste. O único caso de fallback usa o nome "DG-PG02", que tem 2 segmentos. É justamente a fidelidade ao `effectiveMatchCode` que não está presa. (K4) Exigir o código só como PREFIXO do nome passa: nenhum teste tem o código no meio, embora a regra original seja substring. (K11) Linha com impressão e gasto zero deixar de qualificar passa: ela não muda o investimento, mas muda o período e a contagem de campanhas.'
    recommendation: 'No teste `o código: o match_code do funil…`: `codigoDoLancamentoDoFunil({ name: "dg-pg05-out-26", matchCode: null })` deve dar `"dg-pg05-out-26"` (mata a K1). Na regra do nome: um caso com o código no meio (`"teste--dg-pg05--vendas-captacao"`), que mata a K4. No motor: uma linha com gasto 0 e impressões > 0 antes do início, conferindo o período e as campanhas (mata a K11).'
    owner: '@dev'
    status: open

  - id: MNT-001
    severity: low
    category: code
    description: 'A regra do código do lançamento passa a ter 3 cópias idênticas: `effectiveMatchCode` em closure dentro do plugin de `routes/funnel-stages.ts:226`, inline em `routes/funnels.ts:783-785` e agora `codigoDoLancamentoDoFunil` no loader. A reprodução é FIEL: trim, minúsculas, `match_code` antes do nome e `null` sem nenhum dos dois; o casamento é por substring, como `findMatchingCampaignsForStage` (`services/stage-phase.ts:65`). A única diferença é o `normalizarNome`, que troca travessão por `--` antes do `includes`, e isso só amplia o casamento. Reaproveitar direto não dava: a original é closure não exportada. Há também uma família DIVERGENTE no repo: `tokenDoFunil` (2 segmentos, em `services/sendflow-casamento.ts:34`) e `funnelMatchToken` (`routes/campaign-log.ts:75`, `routes/mautic.ts:51`). Uma 4ª cópia que alguém "alinhe" com essa família muda quais campanhas são teste. A K1 (TEST-001) é a prova de que nada impede isso hoje.'
    recommendation: 'Story futura (ou nesta PR, se o @po quiser): extrair `effectiveMatchCode` para `services/` (por exemplo, junto de `stage-phase.ts`) e reaproveitar nas 2 rotas e no loader, mais o teste da K1. Não bloqueia.'
    owner: '@po → @dev'
    status: open

  - id: REQ-001
    severity: low
    category: requirements
    description: 'Decisão 2 do @dev: os testes entram na série diária para a F12 fechar. Com isso, quando HÁ testes, mudam também `midiaDiariaPorEtapa`, `roasDiarioCaptacao` (os gráficos começam no D−n, com ROAS 0 nos dias de teste) e o `limiarPicoArtefato`: o `investimentoMedioDiarioCaptacao` e os `diasDoDenominador` passam a contar os dias de teste, e a lista de picos da seção "Evolução Diária" pode mudar. O AC10 exige identidade só SEM testes, e isso está provado. COM testes, ele diz que "os números de investimento, CAC e ROAS mudam pela R11-1 e o @dev lista as diferenças". O @dev listou tudo, inclusive a Evolução Diária, mas a mudança de forma (eixo começando no D−n) e o limiar dos picos vão além dos três números citados. Não é defeito: é consequência direta da R11-1 com a invariante F12, e a alternativa (testes fora da série) quebraria a F12.'
    recommendation: '@po ratificar no AC10 como 3ª exceção ("com testes, a série diária e o limiar de pico-artefato incluem os dias D−n"), ou pedir ao @dev o limiar só sobre os dias da janela.'
    owner: '@po'
    status: open

  - id: REL-001
    severity: low
    category: reliability
    description: 'Sem `match_code`, o código é o nome INTEIRO do funil (regra herdada do `effectiveMatchCode`). Funil com nome longo ou com espaços, como "Lançamento DG-PG02 Abril" (o exemplo do próprio comentário em `routes/funnels.ts:781-782`), não casa nenhuma campanha. Os testes somem EM SILÊNCIO: o campo `testesPreLancamento` só existe quando há testes, a `origem` do código só é gravada nesse caso, e o documento não diz que procurou e não achou. Não é regressão (antes da fatia C nenhum teste entrava), e o PG05 tem `match_code` e funil `dg-pg05-out-26`, que casaria até pelo nome.'
    recommendation: 'Quando o código vier do nome do funil e nenhuma campanha de captação o contiver, gravar uma nota ou alerta ("código do lançamento = nome do funil; nenhuma campanha de captação tem esse código: confira o match_code"). Decisão do @po; não bloqueia.'
    owner: '@po'
    status: open

  - id: REQ-002
    severity: low
    category: requirements
    description: 'Paridade com uma comparação vinda do PAYLOAD SALVO, gerado antes da fatia C. Esse payload não tem `testesPreLancamento`, e o resumo mostra "nenhum" e a tabela da seção 07 mostra "0" campanhas desse lado. Mas o valor real é "não calculado": isso é indistinguível de "sem testes". Na comparação recalculada pelo loader, a paridade vale e está provada (C12, C16, K12 e K14 morrem).'
    recommendation: 'Mostrar "—" com "não calculado (relatório anterior)" quando a comparação vier de payload salvo sem o campo. Não bloqueia.'
    owner: '@po'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: 'Validação visual do dono pendente (DoD).'
    owner: 'Danilo'
    status: pending

