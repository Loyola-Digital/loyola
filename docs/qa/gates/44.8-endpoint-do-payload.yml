porQueFailENaoConcerns_primeiraPassada: >
  A AC8 é textual: "nunca troca silenciosa de fonte". O QA-448-01 devolve 200
  com uma afirmação FALSA sobre a causa, e a ação que ela induz é a errada — é o
  chamado de 2026-08-14 acontecendo de novo, num endpoint novo, contra o
  precedente que já está no repo. A rota irmã trata o mesmo caso com 502.

  FAIL não é bloqueio arbitrário: o conserto são ~6 linhas mais um teste com
  `mockRejectedValue`, nada está em produção e o endpoint ainda não tem
  consumidor. Corrigir agora custa o mínimo que vai custar — depois da 44.9, a
  mensagem falsa já estará na tela do Inácio.

  O QA-448-02 e o QA-448-03 são da mesma família e valem a mesma passada.
  O QA-448-04 e o QA-448-05 podem ir para o backlog.

