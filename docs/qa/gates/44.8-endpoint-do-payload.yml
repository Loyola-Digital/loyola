summary: >
  A implementação é sólida no que o epic mais protege: a regra 7.6 está
  respeitada de forma verificável (não existe uma única divisão no arquivo da
  rota), a extração da AC2 é uma movimentação pura provada pelos 14 testes da
  44.1 sem alteração, e a `referenciasDoGrupo` resolve o problema real que a
  AC11 tinha — expor a elegibilidade por campanha que `TetosDoGrupo` escondia.
  A verificação por reversão do @dev é o padrão mais alto do epic até aqui: 8
  defeitos reintroduzidos, 8 pegos, incluindo o conserto do próprio teste de
  IDOR, que era decorativo com o banco mockado.

  [1ª passada] O que segurou o gate foi um defeito que a bateria não podia ver
  porque nenhum teste exercitava falha de leitura: com a planilha inacessível, a
  rota devolvia 200 afirmando "A etapa não tem nenhuma fonte de vendas
  conectada" — frase falsa, mandando o operador configurar uma planilha já
  configurada.

  [2ª passada, 3d643df0] Os 5 achados resolvidos, e o conserto do bloqueante
  ficou melhor que a correção que eu sugeri. Restam dois resíduos reproduzidos
  (QA-448-06 e QA-448-07), nenhum deles bloqueante. Gate FAIL → CONCERNS.

  O escopo parcial da AC4 NÃO é defeito: o @dev parou numa decisão de produto
  legítima (a chave de dedup de venda), declarou `naoAtribuivel` como a regra
  7.4 manda, e provou que `cacReal`/`cplReal` não são afetados.

issues:
  - id: QA-448-01
    status: RESOLVIDO (3d643df0)
    severity: high
    category: correctness
    title: "Falha de leitura da planilha vira \"a etapa não tem fonte de vendas conectada\" — afirmação falsa, com 200"
    file: packages/api/src/routes/public-cadeia-cac.ts:287
    story: "44.8 (AC8 / regra 7.4)"
    reproduced: true
    description: >
      `getFreshSalesDaily(...).catch(() => null)` engole QUALQUER erro e cai no
      mesmo ramo do payload que representa "não há fonte conectada". Reproduzido
      em teste: com `getFreshSalesDaily` rejeitando `Error("Google Sheets: 403
      PERMISSION_DENIED")`, a rota devolve

        status 200 · principal.motivo "semDados"
        principal.message "A etapa não tem nenhuma fonte de vendas conectada
                           (nem planilha, nem venda manual)."

      O valor (`cacReal: null`) está certo. A CAUSA está errada, e é a causa que
      determina a ação: "conectar planilha" e "a leitura falhou, tente de novo /
      cheque a permissão" são ações opostas.

      Precedente no próprio repo: a Story 36.9 AC5 separou exatamente essas duas
      causas em `public-leads.ts:47-68` (`motivo: "sync_pendente"` vs
      `motivo: "etapa_sem_fonte"`), porque a mensagem que as fundia fez o chamado
      de 2026-08-14 pedir "rodar o sync" para um problema que rodar o sync não
      resolvia.

      A rota irmã `public-funnel-sales.ts:141-148` trata o mesmo caso com
      `502 SALES_COMPUTE_FAILED`. Duas rotas, dois comportamentos, para a mesma
      falha da mesma fonte.
    suggestedFix: >
      Trocar o `.catch(() => null)` por `try/catch` que distinga os dois casos:
      erro → `motivo: "leituraFalhou"` (ou 502, como a irmã) com a mensagem do
      erro; `payload === null` → o `semDados` atual. Um teste com
      `mockRejectedValue` fecha.
    blocking: false   # resolvido na 2ª passada

  - id: QA-448-02
    status: RESOLVIDO (3d643df0)
    severity: medium
    category: correctness
    title: "Família gratuita funde de volta as duas causas que a Story 36.9 separou"
    file: packages/api/src/routes/public-cadeia-cac.ts:330
    story: "44.8 (AC8)"
    description: >
      Sem linha no cache, a rota devolve "A etapa não tem cache de leads
      computado (nenhuma planilha de leads ou pesquisa conectada, OU o sync ainda
      não rodou)". A mensagem não é falsa — ela nomeia as duas causas — mas é
      exatamente a ambiguidade que a 36.9 AC5 removeu, e as duas causas pedem
      ações opostas.

      `resolveLeadSource(db, stageId)` já existe (`lead-origin-sync.ts:122`) e é
      o desempate que a 36.9 usa. Custo: uma query no ramo de ausência.
    suggestedFix: "Espelhar `public-leads.ts:47-68`: `sync_pendente` vs `etapa_sem_fonte`."
    blocking: false

  - id: QA-448-03
    status: RESOLVIDO (3d643df0)
    severity: medium
    category: consistency
    title: "`SALES_PUBLIC_MAX_AGE_SEC` é silenciosamente ignorado nesta rota"
    file: packages/api/src/routes/public-cadeia-cac.ts:287
    story: "44.8"
    description: >
      A rota chama `getFreshSalesDaily(db, projectId, stageId)` sem `opts`, então
      cai no `DEFAULT_MAX_AGE_MS = 120_000` fixo. A rota irmã honra
      `fastify.config.SALES_PUBLIC_MAX_AGE_SEC` e aceita `?fresh=1`
      (`public-funnel-sales.ts:59-62, 118`).

      Quem ajustar a variável de ambiente vai ver o efeito numa rota e não na
      outra, sem nada avisando. É a mesma classe de divergência que a AC2 existe
      para impedir — só que na política de frescor em vez de no cálculo.
    suggestedFix: "Passar `{ maxAgeMs: maxAgeFrom(query.fresh, fastify.config.SALES_PUBLIC_MAX_AGE_SEC) }` e extrair `maxAgeFrom` para um util compartilhado."
    blocking: false

  - id: QA-448-04
    status: RESOLVIDO (3d643df0)
    severity: low
    category: clarity
    title: "`vendasSemData` descreve o período inteiro, mas viaja ao lado de um número filtrado por range"
    file: packages/api/src/routes/public-cadeia-cac.ts:110
    story: "44.8 (AC4)"
    description: >
      `vendasSemData` é calculado sobre TODO o `byDay` contra `totalVendas`,
      enquanto `principal.vendasReais` é filtrado pelo range. Com
      `?from=2026-08-01&to=2026-08-05`, o payload mostra um `vendasSemData` de
      toda a história ao lado de um `vendasReais` de 5 dias, e nada diz que os
      dois falam de janelas diferentes.

      Não é corrigível de outro jeito — venda sem data não pertence a range
      nenhum, por definição. O que falta é dizer isso: o campo é agnóstico de
      período e o payload não declara.
    suggestedFix: "Renomear para `vendasSemDataNoTotal` ou documentar no payload que o diagnóstico é do total da etapa, não do range."
    blocking: false

  - id: QA-448-05
    status: RESOLVIDO (3d643df0)
    severity: low
    category: test-quality
    title: "O teste \"ranking sem CPM e CTR\" passaria com ranking vazio"
    file: packages/api/src/__tests__/public-cadeia-cac.test.ts
    story: "44.8 (AC10)"
    description: >
      `expect(metricas).not.toContain("cpm")` é vácuo se `ranking` for `[]`.
      Verifiquei o cenário: hoje o ranking traz `['cpc','convLP','connectRate']`,
      então a asserção é real — mas não está guardada, e uma mudança futura que
      esvaziasse o ranking manteria o teste verde.

      Pelo padrão que o próprio epic estabeleceu, é uma linha.
    suggestedFix: "Adicionar `expect(metricas.length).toBeGreaterThan(0);` antes dos `not.toContain`."
    blocking: false

  - id: QA-448-06
    severity: medium
    category: correctness
    title: "O conserto do QA-448-02 reintroduz o padrão do QA-448-01: `.catch(() => null)` vira afirmação categórica"
    file: packages/api/src/routes/public-cadeia-cac.ts:385
    story: "44.8 (AC8 / regra 7.4)"
    reproduced: true
    description: >
      `resolveLeadSource(fastify.db, stageId).catch(() => null)` trata falha e
      ausência como a mesma coisa — exatamente o que o gate anterior pegou, no
      código escrito para consertá-lo. Reproduzido: com `resolveLeadSource`
      rejeitando `Error("connection terminated unexpectedly")`, a rota devolve

        principal.motivo  "semDados"
        principal.message "A etapa não tem planilha de leads nem pesquisa
                           conectada. Rodar o sync não muda isso — é preciso
                           conectar uma fonte à etapa."

      A frase é categórica sobre um fato que a rota falhou em estabelecer.

      ATENUANTE REAL, e é o que separa isto de um FAIL: neste ponto do handler
      TRÊS queries ao banco já tiveram sucesso (vínculo, insights, cache de
      lead). Um erro aqui é falha transitória, não indisponibilidade — ordens de
      grandeza menos provável que a falha do Google Sheets do QA-448-01, que é
      externa, com cota, permissão revogável e histórico de chamado.
    suggestedFix: "Mesmo padrão do conserto anterior: try/catch com um terceiro motivo (`indeterminado`), em vez de assumir ausência."
    blocking: false

  - id: QA-448-07
    severity: low
    category: clarity
    title: "`vendasSemDataNoTotal: 0` é servido mesmo quando a leitura de venda falhou"
    file: packages/api/src/routes/public-cadeia-cac.ts:297
    story: "44.8 (AC4)"
    reproduced: true
    description: >
      `let vendasSemDataNoTotal = 0` só é atribuído no ramo de sucesso (`:339`).
      Reproduzido: com a leitura falhando, o payload sai com
      `principal.motivo: "leituraFalhou"` E `vendasSemDataNoTotal: 0` — ou seja,
      afirma "nenhuma venda sem data" sobre dado que não foi lido.

      Mesma coisa na família gratuita, onde o campo é sempre `0` e não significa
      nada.

      Baixa porque o `motivo` está do lado e um consumidor atento não lê o
      diagnóstico de um bloco que declarou falha. Mas é a mesma regra 7.4: zero
      é uma afirmação.
    suggestedFix: "`vendasSemDataNoTotal: number | null`, com `null` fora do ramo de sucesso."
    blocking: false

