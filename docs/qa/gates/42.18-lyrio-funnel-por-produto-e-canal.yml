top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O fio entre as duas medidas não tem teste na montagem nem na rota. Em `packages/api/src/utils/jornada-por-produto-lyrio.ts:236`, `if (u.iniciouTeste) contar(canal, u.produtoTeste, u.classeTeste, "iniciouTeste")`, a mutação Q1 troca para `u.produtoIniciou, u.classeIniciou` e SOBREVIVE: 117/117 em jornada-por-produto-lyrio, jornada-lyrio e pagantes-lyrio. O motivo é que, nos testes, nenhum usuário tem produtos diferentes no primeiro "iniciou" e no primeiro "iniciou teste". Na montagem, o helper `iniciou(id, teste)` (test.ts:133-138) usa o MESMO id nas duas medidas. Na rota (test.ts:347-366), cada usuário tem um evento de início só. A regra "cada medida tem o seu primeiro evento" só está provada em `produtoDoUsuario` e no SQL (caso 2 do it.each), e não no ponto que monta a resposta. Cenário concreto: um usuário orgânico faz `NON_RENEWING_PURCHASE rc_promo_Lyrio Pro_monthly` em 01/10 e `INITIAL_PURCHASE premium_yearly_100:base TRIAL` em 03/10. Hoje ele conta Mensal em "→ Iniciou" e Anual em "→ Trial", o que está certo. Com a mutação, conta Mensal em "→ Trial", e a linha Anual perde o trial sem nenhum teste avisar.'
    recommendation: 'No teste da montagem, um usuário com `produtoIniciou` ≠ `produtoTeste` (a promoção mensal + o trial anual), conferindo Mensal 1/0 e Anual 0/1 no canal. Na rota sobre o PGlite, o mesmo usuário em dois eventos (NON_RENEWING mensal e, dias depois, INITIAL_PURCHASE TRIAL anual), conferindo as duas células. Depois, reaplicar a Q1 e ver o teste cair.'
    owner: '@dev'
    status: resolved
    resolved_in: '1b4ca343'
    note_iteracao_1: 'Conferido. Montagem: um usuário orgânico com `produtoIniciou` = `rc_promo_Lyrio Pro_monthly` e `produtoTeste` = `premium_yearly_100:base`; o teste confere Mensal {1,0}, Anual {0,1} e os `produtos` de cada linha com a medida certa. Rota sobre o PGlite (`user-o3`): NON_RENEWING mensal em 01/10 e INITIAL_PURCHASE TRIAL anual em 03/10; o Orgânico vai a 3 novos, com Anual {1,2} e Mensal {1,0}, e o laço de paridade sobre a resposta continua. A Q1 cai nos DOIS testes (2 failed). A Q16 (`chave_teste` com a condição do Iniciou) cai em 7.'

