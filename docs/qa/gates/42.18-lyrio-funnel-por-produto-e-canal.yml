  - id: REL-001
    severity: low
    category: reliability
    description: 'O oráculo TS (`produtoDoUsuario`, `jornada-por-produto-lyrio.ts:79-87`) e o SQL da chave (`:122`) divergem em dois domínios, ambos inalcançáveis hoje. Confirmei os dois no PGlite (`scratchpad/qa-42.18/probe-chave.mts`). (1) Dois inícios no mesmo milissegundo, com µs diferentes: `z_cedo` às 10:00:00.000100 e `a_tarde` às 10:00:00.000900. O TS escolhe `a_tarde` (empate em ms, menor id em bytes) e o SQL escolhe `z_cedo`. O ingestor grava `event_at` a partir de `event_timestamp_ms` (`services/revenuecat.ts:431`), e o backfill 0102 também parte de ms, então o µs é sempre 000. (2) Dois instantes ANTES de 1970 com o mesmo número de dígitos, como 23:59:58 e 23:59:59 de 31/12/1969: o SQL escolhe o mais tarde, porque `-1000000` < `-2000000` em texto. Ao contrário do que diz o comentário (`:120`, "instante antes de 1970 não ordenaria"), pré-1970 contra pós-1970 ordena certo, e dois pré-1970 com tamanhos diferentes também. Só erra o par pré-1970 de mesmo comprimento. Instantes de comprimentos diferentes depois de 1970 ordenam certo: 15 × 16 dígitos (2001) e 1 dígito (epoch + 1 µs), ambos IGUAL. O `produtoDoUsuario` não roda em produção: só os testes o chamam.'
    recommendation: 'Nenhuma ação de código. Opcional: corrigir o comentário `:118-120` ("só dois instantes pré-1970 de mesmo comprimento se invertem; pré × pós-1970 ordena certo") e citar que o `event_at` vem em ms.'
    owner: '@dev'
    status: resolved
    resolved_in: '1b4ca343'
    note_iteracao_1: 'Só o comentário (`jornada-por-produto-lyrio.ts:118-127`), agora com os limites exatos, conferidos contra a minha sonda: o mesmo ms com µs diferentes, e dois instantes pré-1970 de mesmo comprimento. Também diz que pré × pós-1970 e dois pré-1970 de tamanhos diferentes ordenam certo, e que o dado é gravado em ms. A sonda, rodada de novo sobre o SQL com os parênteses, dá 14/16 iguais, com os mesmos 2 divergentes. Aceito sem mudança de lógica.'

  - id: MNT-001
    severity: low
    category: code
    description: 'Em `packages/api/src/utils/jornada-por-produto-lyrio.ts:125`, `min(${chaveDoInicio} COLLATE "C")` interpola a chave SEM parênteses. O `COLLATE` liga-se só ao `CASE … END` final, e não ao `lpad(…) || CASE … END` inteiro. O resultado está correto: pela regra de derivação de collation do Postgres, a collation explícita de um operando sobe para o `||`. Conferi no PGlite com `pg_collation_for(lpad(…) || CASE … END COLLATE "C")` = `"C"`. O PGlite usa C por padrão, então ele não distinguiria uma regressão. Quem ler a linha supõe que o COLLATE cobre a chave toda, e qualquer refatoração que mude a forma (por exemplo, `concat()` no lugar de `||`) continua dependendo dessa regra. O único guarda é o regex do texto do SQL (test.ts:274).'
    recommendation: 'Envolver em parênteses: `min((${chaveDoInicio}) COLLATE "C")`, ajustando o regex do teste. O comportamento não muda, e a intenção fica explícita.'
    owner: '@dev'
    status: resolved
    resolved_in: '1b4ca343'
    note_iteracao_1: 'O SQL agora é `min((lpad(…) || CASE … END) COLLATE "C")`, e o regex do teste exige os parênteses: a Q17, que volta à forma antiga, cai. A sonda confirma `pg_collation_for` = `"C"`, e os 11 casos TS = SQL passam.'

