  code_review: 'Li o diff `1158c44f..a6fdfdb9` inteiro: 10 arquivos, 1.171+/13−. API: `consultaDaJornada` ganha `extras`, com a guarda de nome (lança na colisão, conferido à mão). `consultaDaJornadaPorProduto` embrulha a MESMA redução por usuário em dois SELECTs externos, que extraem o id da chave (`substr(…, 21, 1) = ''0''` → `substr(…, 22)`) e classificam com `classeDoProdutoNoSql` (AC2c, sem segunda regra), com a guarda do nulo antes. `montarPorProduto` repete o recorte e o canal de `montarJornada` (o mesmo `canalDoUsuario`, o conflito fora dos 8 e dentro do Total) e ordena os `produtos` de forma determinística. Na rota, o MESMO array `linhas` alimenta `montarJornada` e `montarPorProduto`, então a paridade das contagens vale por construção. Web: as funções puras ficam em `lib/utils/jornada-lyrio.ts` (colunas, taxas contra os novos DO CANAL, dica, paridade, frase de arredondamento); o `.tsx` só desenha. O header tem duas linhas (`rowSpan`/`colSpan`), a coluna Plano é `sticky left-0 bg-background`, e há `overflow-x-auto`. A frase de arredondamento está correta: cada célula erra no máximo 0,05 p.p. CHAVE (pedido especial): instante em µs, `lpad` 20, sentinela de 20 noves para o nulo, `0`+id ou `1`. Com `COLLATE "C"`, isso equivale a (instante, com produto antes de sem, bytes do id), que é a ordem de `antes()`. O `0`/`1` antes do id impede que um id comece a competir com o marcador, e o id inteiro no fim preserva o prefixo (`premium_yearly_15` < `premium_yearly_150`, IGUAL). O bigint tem no máximo 19 dígitos mais o sinal, então o `lpad` nunca trunca. O `extract(epoch)` devolve numeric (PG ≥ 14; produção 17.11, PGlite 18.3), sem perda de precisão. EMPATE (AUTO-DECISION): implementado igual no TS e no SQL e testado nos dois sentidos da lista e com caixa (`Zeta` < `alpha`).'
  equivalencia_ts_sql: 'Sonda própria em `scratchpad/qa-42.18/probe-chave.mts` (PGlite, código da worktree, saída em `saida-probe-chave.txt`), com 16 casos. IGUAL em 14: pré × pós-1970; dois pré-1970 de tamanhos diferentes; pré-1970 × 1980; 15 × 16 dígitos (2001 × 2026); 1 dígito (epoch + 1 µs) × 2026; `event_at` nulo × com instante; dois nulos de instante; nulo sem produto × nulo com; id vazio × nulo (o vazio vence: tem produto); id prefixo de outro; multibyte (`é`) × ASCII; U+FFFD × emoji (surrogate: UTF-8 do Buffer = bytes do PG); ids `0` × `1`; Trial só com `TRIAL`. DIVERGE em 2, ambos fora do dado real: o mesmo ms com µs diferentes e dois pré-1970 de mesmo comprimento (REL-001).'
