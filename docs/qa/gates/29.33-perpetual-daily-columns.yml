issues:
  - id: QA-01
    severity: medium
    category: tests
    description: >-
      A mudança reorganiza TRÊS listas posicionais acopladas (array de colunas,
      células do corpo, células do rodapé) cujo desalinhamento não produz erro
      de tipo nem de runtime — só valor sob o título errado. Hoje esse
      acoplamento é protegido por um comentário e por revisão humana. Um teste
      que afirmasse `PERPETUAL_DAILY_COLUMNS.length + 1 === células do corpo ===
      células do rodapé` travaria a regressão permanentemente.
    recommendation: >-
      Ao instalar vitest na 29.35 (decisão do @po), incluir este teste de
      alinhamento como primeiro caso. Custo baixo, cobre o modo de falha mais
      caro deste componente.
    blocking: false

  - id: QA-02
    severity: low
    category: code
    description: >-
      `totalsMarginTone` é declarado antes do early return `if (rows.length === 0)
      return null`, na zona dos hooks/memos, enquanto as demais derivações do
      componente (totalPages, safePage, pageStart, pageRows) vivem depois dele.
      Não é violação de Rules of Hooks — é const derivada, não hook — mas quebra
      a organização interna do componente.
    recommendation: >-
      Mover para junto de totalPages/safePage. Não bloqueia; pode entrar como
      limpeza na 29.34, que toca o mesmo arquivo.
    blocking: false

waived: []

notes: >-
  Verdict CONCERNS, não PASS, por causa de QA-01: o check de testes não pode
  ser marcado OK quando não existe cobertura alguma sobre o ponto mais frágil
  da mudança. Nenhum dos dois issues bloqueia o merge — ambos são follow-up.

  Registro do que a implementação fez de melhor: o dev encontrou no pré-voo que
  o rodapé NÃO iterava o array de colunas (a story previa a possibilidade, mas
  não a confirmara) e tratou as três listas como uma edição atômica. Sem isso, o
  PR teria passado em tsc, em next build e neste gate, e quebrado só no olho de
  quem abrisse o dashboard.
