top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: '`paraCima` arredonda a 6 casas antes do `Math.ceil` para não inventar um lead por ruído de IEEE-754. A guarda é necessária (`11 ÷ 0,011 = 1000,0000000000001` → `Math.ceil` cru dá 1001), mas (a) o comentário cita `68 ÷ 0,04 = 1700,0000000000002`, que é FALSO neste motor (V8 dá 1700 exato), e (b) nenhum teste exercita a guarda: a mutação `return Math.ceil(x)` passa 54/54. Pela regra do repo, teste que não cai com o bug de volta é decorativo — e um "simplify" futuro removeria a guarda sem a suíte reclamar.'
    suggested_action: 'Corrigir o exemplo do comentário para `11 ÷ 0,011` e acrescentar um teste diferencial em `planejamento-cenarios-organicos.test.ts`: bloco com `vendas = 11` (ex.: metaReceita que dê `c1 ÷ ticket` entre 10 e 11) e nível `0,011` → `leads` deve ser **1 000**, não 1 001. Provar que a mutação `Math.ceil(x)` derruba o teste.'
  - id: 'MNT-001'
    severity: low
    finding: '`serieDeReceita(meta, null, v)` trata a fração vazia como ZERO (série toda zero — o teste "meta vazia → dez zeros" não cobre esse caso), enquanto `gradeOrganica`/`gradePaga` tratam a mesma ausência como 0,70 (`fracaoDe`). Quem chamar `serieDeReceita` direto na 48.3/48.4 com o campo vazio verá zeros; quem chamar a grade verá 70 %.'
    suggested_action: 'Uma regra só: `serieDeReceita` também cai para `FRACAO_CENARIO_1_PADRAO` quando a fração é `null`/`undefined` (zero explícito continua zero), com um teste; ou documentar no JSDoc que a função exige a fração resolvida. Recomendo a primeira — é o que o AC3 diz ("valor inicial 0,70").'

