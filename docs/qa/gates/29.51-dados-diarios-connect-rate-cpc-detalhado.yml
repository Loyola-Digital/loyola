testes_criados_no_gate:
  - arquivo: 'packages/web/lib/utils/__tests__/perpetual-daily-detail-parity.test.ts'
    casos: 8
    motivo: >-
      O AC4 AFIRMA que "os numeros do dia batem com os da entidade para o mesmo
      recorte", e usa isso para justificar a base de cliques compartilhada. A
      afirmacao estava CORRETA na implementacao, mas nenhum teste a travava: os
      dois modulos calculam CPC/CPM/ROAS/CAC em arquivos separados, e nada
      impediria uma refatoracao futura de mudar a regra em um so. A divergencia
      apareceria em producao como "o CPC do dia nao bate com o do criativo" — o
      tipo de defeito que o gestor descobre antes do time.
    resultado: >-
      Paridade CONFIRMADA para CPC, CPM, ROAS, CAC, Margem % e para o fallback
      da base de cliques. A divergencia no caso-zero (Detalhamento devolve 0,
      Quadro Diario devolve null) e DELIBERADA — AC5 — e ficou documentada em
      teste proprio para que ninguem a "conserte" achando que e descuido.

verificacoes_manuais_executadas:
  - o: 'Ordem e contagem das colunas'
    como: 'Extracao do array via awk; comparacao com o pedido literal do gestor'
    resultado: >-
      9 metricas no Simplificado (+ Dia = 10) e 13 no Detalhado (+ Dia = 14).
      Sequencia identica a pedida, com Connect Rate e CPC a esquerda de ROAS.
  - o: 'Rules of Hooks'
    como: 'Leitura da ordem de declaracao ate o early-return'
    resultado: >-
      Os 8 hooks (2 useState novos incluidos) estao antes de
      `if (rows.length === 0) return null`. Sem hook condicional.
  - o: 'AC1 — trocar de modo nao reseta pagina nem ordenacao'
    como: 'Deps dos hooks: o useEffect de reset depende de [rows], nao de [modo]'
    resultado: 'Confirmado por construcao — os estados sao independentes.'
  - o: 'Regressao de estilo'
    como: 'Diff do JSX antigo contra o novo, celula a celula'
    resultado: >-
      O `font-medium` exclusivo do ROAS havia se perdido na troca das celulas
      posicionais; o @dev pegou relendo o proprio diff e restaurou via campo
      `emphasis`. Confirmado no codigo entregue. Cores condicionais de
      Margem/Margem % preservadas em linha e rodape.
  - o: 'Guarda de imposto (regressao 29.24)'
    como: 'Leitura do modulo + teste dedicado do @dev'
    resultado: >-
      `spend` entra tributado e sai sem fator. `margin` entra pronta e nao e
      recalculada — o que impede o prejuizo inventado da 29.10 em projeto sem
      planilha. Ambos travados em teste.

