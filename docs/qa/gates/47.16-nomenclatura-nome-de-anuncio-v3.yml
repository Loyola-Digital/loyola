top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O corpo que o gerador manda no PATCH (`gerador-de-anuncio.tsx`: `launchSeq: corpo.launchSeq`, que é `null` com `perpetuo`) não tem teste de rota. Mutação M4 tirou `.nullable()` do `launchSeq` do zod do PATCH (`routes/nomenclatura.ts:1193`) e as três suítes da story passaram (94/94). Em produção, essa regressão devolve 400 do zod a toda edição de anúncio de `perpetuo`, inclusive trocar só a descrição de um dos 6 do dg. Os testes de PATCH da 47.16 omitem o campo (`{ launchType: "perpetuo" }`, `{ notes }`, `{ date }`), e é justamente o caminho que a tela NÃO usa.'
    recommendation: 'Um teste em `nomenclatura-rotas.test.ts` com o corpo que o gerador monta: PATCH num registro de `perpetuo` com `{ launchType: "perpetuo", launchSeq: null, date, description, notes }` → 200, `launchSeq: null` e nome sem número. Melhor ainda: montar o corpo com `corpoDoAnuncio` e não à mão.'
    status: resolved
    resolution: 'fechado em 49484365: `corpoDaEdicaoDoAnuncio` testado no JSON enviado + teste de rota com o mesmo corpo; M4 → 1 falha (rota)'

  - id: TEST-002
    severity: low
    category: tests
    description: 'Mutação M2: `numeroDoLancamentoNoPatch` passou a tratar `null` explícito como "não veio" (`b.launchSeq !== undefined && b.launchSeq !== null`), e 0 testes caíram. Com essa mudança, um PATCH `{ launchSeq: null }` num registro `pg04` mantém o 4 calado, quando deveria dar 400 em `launchSeq`. Pela tela não dá para chegar lá: sem número numa sigla que exige número, a prévia fica incompleta e o Salvar desabilitado. Pela API direta, dá.'
    recommendation: 'Uma linha no teste da função: `numeroDoLancamentoNoPatch({ launchSeq: null }, pg04)` → `null` (e a rota dá 400 com `campo: "launchSeq"`).'
    status: resolved
    resolution: 'fechado em 49484365: função e rota (`{ launchSeq: null }` num pg04 → 400); não refeito nesta rodada (o @dev registra M2 → 2 falhas)'

  - id: TEST-003
    severity: low
    category: tests
    description: 'Mutação M7 (24/09): em `registrar-anuncios-no-ar-do-dg.ts`, `const aplicar = process.argv.includes("--aplicar") || !process.argv.includes("--plano")`. Com isso o script GRAVA quando roda sem argumento, que é o "modo planejamento". As 94 passam. O teste de fio só confere que o trecho `process.argv.includes("--aplicar")` aparece no fonte, e o texto mutado ainda o contém. O script roda uma vez só, à mão e depois da 0157 (a guarda do `information_schema` segue ativa). Mas a promessa "sem --aplicar só faz SELECT" é justamente a que autoriza qualquer um a rodar o plano em produção.'
    recommendation: 'Ancorar a atribuição inteira no teste de fio: `/const aplicar = process\.argv\.includes\("--aplicar"\);/`. Melhor ainda: extrair `modoDoScript(argv)` e testar `[]` → plano e `["--aplicar"]` → grava.'
    status: resolved
    resolution: 'fechado em 49484365: `modoDoRegistro(argv)` testado + fio ancorado; M7 (linha do gate) → 1 falha; M7q/M7r/M7s → 1 falha cada'

  - id: MNT-001
    severity: low
    category: code
    description: '`gerador-de-anuncio.tsx:149`: o botão "Copiar nome completo" tem `disabled={!previa.nome || previa.nome === previa.estrutura}`. Com a opção (B), a `structure` sempre termina em `--` e o `name` nunca termina, então a segunda condição virou código morto. O comportamento está certo (é a decisão autônoma aprovada); o problema é que a condição engana quem lê.'
    recommendation: 'Simplificar para `disabled={!previa.nome}`, com um comentário citando a opção (B). Não bloqueia.'
    status: resolved
    resolution: 'fechado em 49484365: `disabled={!previa.nome}`, com a prova de que nome ≠ estrutura em 6 estados'

