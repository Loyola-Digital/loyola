checks:
  code_review: 'Diff de 22 arquivos lido inteiro. Regra do número em um lugar só por camada: `validarLancamento` (build), regex `^([a-z]+)(\d{2})?$` com a regra depois (parse) e 400 com `campo: "launchSeq"` no serviço, antes do build. `numeroDoLancamentoNoPatch` cobre PO-03/PO-04. O formato do vídeo é lido do `name` gravado (`formatoDoVideoGravado`: 7 = v2, 4 = antigo, resto = v3), o que resolve o AC8 sem coluna nova, e o serviço ainda força `v3` fora do vídeo (defesa em profundidade). `SIGLA_SEM_NUMERO` foi redeclarada no módulo folha, com teste que a iguala a `PERPETUO` (PO-09); não há import de valor entre módulos do shared. O script do AC9 não passa por `montarAnuncio` (usa os 6 literais), confere o `information_schema` antes de tudo, faz o plano (inserir / já registrado / colisão → para) e grava numa transação, pelo `inserir` do repositório, que registra changelog. Modo planejamento conferido no código: só SELECTs. Não rodei: não há `DATABASE_URL` na worktree e, com a 0157 ainda não aplicada, a guarda sairia com código 1 antes de planejar. Decisões das 5.x conferidas: 5.1 (número proibido só em `perpetuo`) ✓ · 5.2 (constante fixa, não atributo do dicionário) ✓ · 5.3 (hook/body escolhidos, obrigatórios, gravados, fora do nome; origem fica) ✓ · 5.5 (`--` opcional no parse) ✓ · opção (B) (`name` sem descrição termina na data, `structure` mantém o `--`) ✓.'
  autonomous_decisions: '(1) "Opção B vale para todo tipo": CORRETA. O AC2 dá `ad07_dg_perpetuo_09-2026` como exemplo, um `ad` sem `--`, e nem o AC4 nem a 5.5 restringem ao vídeo. Aplicar só ao `adv` criaria duas regras para o mesmo separador. (2) "Copiar nome completo" habilitado sem descrição: é a consequência NECESSÁRIA da opção B. O nome gravado deixou de ser igual à estrutura, e o botão é o único jeito de copiar o nome exato que o registro e o parse consideram o nome; desabilitado, esconderia justamente isso. (3) AC11 por dois sinais (veredito do contrato OU assinatura em inglês do zod 4 em `launchSeq`), excluindo as recusas em português da própria API nova: correto, e a assinatura do zod 4.3.6 está fixada por teste na API. (4) Migration sem CHECK `perpetuo ↔ NULL`: coerente com a 5.2, porque a regra é da constante no código.'
  unit_tests: 'Suítes da story: API 94/94 (nome 32 · rotas 53 · registro 9), web 35/35 (nomenclatura-anuncio 18 · fio 8 · mensagem-de-api-atras 9; o Dev Record fala em "web 34"). Suítes completas: web 1464/1464 (108 arquivos); API 3135 passando / 10 falhando, as 10 do baseline em 5 arquivos (funnel-stages-lead-inputs 3, projects 3, schema 2, instagram-routes 1, instagram 1). Mutações próprias, cada uma aplicada, rodada e revertida com `git checkout` (`git status` vazio depois de cada uma): M1 `structure` perde o `--` no `buildAdName` → 13 falhas na API + 6 no web · M2 `null` explícito no PATCH tratado como "não veio" → SOBREVIVEU (TEST-002) · M3 `formatoDoAnuncioGravado` sem a guarda `ehVideo` (um `ad` seria editado como "antigo" e o build lançaria) → 1 falha · M4 zod do PATCH sem `.nullable()` → SOBREVIVEU (TEST-001). RE-GATE 24/09, mesmo commit: suítes da story 94/94 + 35/35; completas web 1464/1464, API 3135/10, com as mesmas 10 do baseline nos mesmos 5 arquivos. Mutações de 24/09, cada uma revertida com `git checkout` e `git status` vazio depois: M4 de novo (zod do PATCH sem `.nullable()`) → SOBREVIVE (TEST-001 segue aberto) · M5 REGRA em duas camadas: `validarLancamento` do shared E o 400 do serviço aceitam `perpetuo` com número → 3 falhas (build, POST, PATCH) · M6 FIO web: `formato` herdado também ao DUPLICAR (`modo.tipo !== "novo"`), de modo que duplicar um dos 6 mostraria prévia v2 e a API gravaria v3 → 1 falha (fio AC8) · M7 FIO do script: grava sem `--aplicar` → SOBREVIVEU (TEST-003) · M8 REGRA do registro: colisão de NN ignorada em silêncio (`ON CONFLICT DO NOTHING`) → 1 falha.'
  regate_2026_09_24_qa_fix: 'Commit 49484365, diff de 10 arquivos lido inteiro. EQUIVALÊNCIA: `corpoDaEdicaoDoAnuncio(estado, { padraoAntigo })` monta os mesmos 5 campos a partir de `corpoDoAnuncio`, e origem/hook/body sob a mesma condição (`ehVideo(estado.creativeType)` é exatamente o `video` do componente, linha 182; `padraoAntigo` é passado). O POST continua com `corpoDoAnuncio(estado)`. `modoDoRegistro(argv)` = `argv.includes("--aplicar")`, a mesma expressão de antes. O "Copiar nome completo" perdeu só a condição provadamente morta. Comportamento idêntico. MUTAÇÕES (aplicar → suíte → `git checkout`, `git status` vazio depois de cada uma): M4 zod do PATCH sem `.nullable()` → 1 falha (rota TEST-001) · M7 a linha do gate (`includes("--aplicar") || !includes("--plano")`) → 1 falha (fio) · M7q script lê `process.env.APLICAR` antes do argv → 1 falha (fio) · M7r `{ aplicar: true }` na transação → 1 falha (fio) · M7s `modoDoRegistro` aceita `--APLICAR`/`--aplicar=…` (startsWith, case-insensitive) → 1 falha (unidade) · Q1 extração com `padraoAntigo` invertido → 2 falhas (web) · Q2 extração espalha o `corpo` inteiro (manda tipo e NN, D23) → 2 falhas · Q3 `notes: corpo.notes || undefined` (o PATCH deixaria de limpar as notas) → 2 falhas · Q4 componente passa `{ padraoAntigo: false }` fixo → 1 falha (fio). GATES: suítes da story API 98/98, web 39/39 (30 + mensagem-de-api-atras 9); web completo 1468/1468 (108 arquivos); API completa 3139 passando / 10 falhando, as mesmas 10 do baseline nos mesmos 5 arquivos; eslint dos 9 arquivos tocados 0 (`--max-warnings 0`); tsc API 0; `next build` do web pelo script do package (`pnpm run build`) EXIT 0 em 1m27; tsc do web depois do build 0 (incremental; conferido que acusa um erro injetado no arquivo extraído).'
  acceptance_criteria: 'AC1 ✓ · AC2 ✓ · AC3 ✓ (422 no v3 sem hook/body; `faltaForaDoNome` bloqueia o Salvar) · AC4 ✓ opção B · AC5 ✓ (5/7/4 campos, aviso próprio do v2) · AC6 ✓ no código (ver TEST-001: o PATCH com `null` é o caminho da tela e não tem teste) · AC7 ✓ · AC8 ✓ · AC9 ✓ no código (script e lógica testados; execução pendente, DoD) · AC10 ✓ (§ 11.1 reescrita; a linha do "Copiar estrutura (até o `--`)" não mudou, como pede o PO-06) · AC11 ✓ · AC12 ✓ · AC13 ✓ (eslint dos 19 arquivos tocados: 0; tsc da API rodado aqui: 0; tsc e `next build` do web conforme o Dev Record, não refeitos). 24/09: eslint dos 19 arquivos de novo com 0; tsc da API 0; tsc do web 0 (binário direto, com o `.next/types` do build de 23/09 na worktree); `next build` não foi refeito.'
