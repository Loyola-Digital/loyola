top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O corpo que o gerador manda no PATCH (`gerador-de-anuncio.tsx`: `launchSeq: corpo.launchSeq`, que é `null` com `perpetuo`) não tem teste de rota. Mutação M4 tirou `.nullable()` do `launchSeq` do zod do PATCH (`routes/nomenclatura.ts:1193`) e as três suítes da story passaram (94/94). Em produção, essa regressão devolve 400 do zod a toda edição de anúncio de `perpetuo`, inclusive trocar só a descrição de um dos 6 do dg. Os testes de PATCH da 47.16 omitem o campo (`{ launchType: "perpetuo" }`, `{ notes }`, `{ date }`), e é justamente o caminho que a tela NÃO usa.'
    recommendation: 'Um teste em `nomenclatura-rotas.test.ts` com o corpo que o gerador monta: PATCH num registro de `perpetuo` com `{ launchType: "perpetuo", launchSeq: null, date, description, notes }` → 200, `launchSeq: null` e nome sem número. Melhor ainda: montar o corpo com `corpoDoAnuncio` e não à mão.'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Mutação M2: `numeroDoLancamentoNoPatch` passou a tratar `null` explícito como "não veio" (`b.launchSeq !== undefined && b.launchSeq !== null`), e 0 testes caíram. Com essa mudança, um PATCH `{ launchSeq: null }` num registro `pg04` mantém o 4 calado, quando deveria dar 400 em `launchSeq`. Pela tela não dá para chegar lá: sem número numa sigla que exige número, a prévia fica incompleta e o Salvar desabilitado. Pela API direta, dá.'
    recommendation: 'Uma linha no teste da função: `numeroDoLancamentoNoPatch({ launchSeq: null }, pg04)` → `null` (e a rota dá 400 com `campo: "launchSeq"`).'
    status: open

