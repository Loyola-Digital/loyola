checks:
  code_review: 'Diff `origin/main...1c9c64ea`: 10 arquivos, +933/−42. API: `brutosDaVsl` ganha `viewed`/`started`/`clicked` (o `total_clicked`, não o `_device_uniq`) e `engagementRate`. `duracaoDoPlayer` é a MESMA duração mandada como `videoDuration` e devolvida em `duracao`, inclusive na linha que falhou. A rota devolve as linhas sem remontar. Nenhuma chamada nova ao VTurb. Web: `engajamentoDoTotal` em racionais exatos (BigInt). Conferi a escala: o numerador eng.m·plays·dur.m·10^(K−ke−kd) e o denominador plays·dur.m·10^(K−kd) estão na mesma base 10^K. O vídeo sem duração sai do numerador e do denominador e vai para `fora`. `centesimosDeDecimal` lê a representação decimal (`String(x)`, inclusive notação científica) e trunca sem float. As células de contagem usam `Intl` pt-BR. O componente tem uma lista `COLUNAS` só, percorrida 3× (cabeçalho, linhas, Total), com coluna Nome sticky e `min-w-[960px]` em `overflow-x-auto`. Achado sem impacto: um termo com `engagementRate` inválido seria pulado sem entrar em `fora`, mas `num()` de `services/vturb.ts` garante número finito, então é inalcançável.'
  auto_decisions: '(1) Nome `duracao`: o AC2/PO-01 deixa o nome com o @dev. ✓ (2) Com a v36, as colunas cujos brutos já vêm mostram número: REQ-001, low, a ratificar. (3) 0 plays → "—" "sem dados no período": coerente com o AC4 (ausência não vira zero), já que o VTurb devolve 0 sem plays; no Total o peso é 0. ✓'
  unit_tests: 'Re-rodado pelo @qa. **Web inteiro** (`--pool=forks --no-file-parallelism`): 132 arquivos, 1.866/1.866. Os 3 jsdom de `components/instagram` não subiram o worker por timeout de I/O (máquina) e foram re-rodados à parte: 11/11. Total 135 arquivos, **1.877/1.877**. API-alvo (`vturb-tabela`, `vturb-rotas-fio`, `vturb-chain`, `vturb-stats-reconstrucao`): **65/65**. O Engajamento do Total foi recalculado pelo @qa em float independente: A 15,6803 %, B 15,5672 %, sem o V5 14,9480 %, média simples 37,77 %. Bate com os oráculos 15,68 / 14,94 do teste. **Mutações próprias**, todas mortas e com o diff restaurado: API Q1 `started` = únicos (1 falha), Q2 `duracao: null` no sucesso (1), Q3 duração 0/negativa aceita (1), Q4 `engagementRate: 0` (1). Web W1 linha sem duração vira 0 % (1), W2 escala errada no numerador do Total (4), W3 Audiência do Total = over+under (2), W4 `novas` com `some` em vez de `every` (1), W5 componente com Plays apontando para `playsUnicos` (1), W6 peso do Total por `viewed` (3). **Reversões:** `services/vturb-tabela.ts` voltando ao da `main` derruba 3 testes; `web/lib/utils/vturb-tabela.ts` voltando ao da `main` derruba 16. `git status` vazio no fim.'
  acceptance_criteria: '**AC1** ✓: 10 colunas na ordem, travada pelo fio do `.tsx`; Cliques como número. **AC2** ✓: Σ das 6 contagens; Play Rate e Retenção pela soma; Engajamento pela fórmula do dono; nota "aparelho conta nos dois"; `duracao` no payload (PO-01). **AC3** ✓ pela definição do dono (opção A), com a prova do @dev de que nenhuma contagem reproduz o N do VTurb. O texto da AC está desatualizado (DOC-002). **AC4** ✓: falha "—" e fora; sem pitch "—" e fora do Σ da Audiência; sem duração "—" e fora do numerador e do denominador; v36 ver REQ-001. **AC5** ✓: milhar pt-BR; 0,29 → 0,29 % e 16,1 → 16,10 % na linha e no Total. **AC6** ✓: sem chamada nova; front contra a v36 sem erro (testes); contrato 36→37 com histórico. **AC7** ✓: `vturb-stage-tab.tsx`, `mvp-vsl-somada*` e `vsl-funnel.ts` sem hunk; `somaDasVsls`/`SomaDasVsls` idênticos byte a byte; `pitchAtualDoPlayer` idêntico; os testes da MVP passam com o util novo E com o util da `main`. **AC8** ✓.'
  no_regressions: 'Web 1.877/1.877. `BrutosDaVsl` do web estendido só com campos opcionais. A suíte completa da API não foi refeita pelo @qa; o @dev registrou 4.673/4.683, com as mesmas 10 falhas da base. Os módulos tocados não são importados por elas.'
  performance: 'Nenhuma chamada nova ao VTurb: o mesmo `sessions/stats` por vídeo. O BigInt corre sobre N vídeos de um funil, custo desprezível.'
