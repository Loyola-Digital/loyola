sondas_qa:
  - '(1) AC9(b) pelos motores diretos, sem o orquestrador, com lead, venda e mídia DEPOIS do fim: com corte 30/06 e 15/07, o payload sem a janela fica idêntico ao final, todos os INDICADORES iguais e 0 guardas falhando. Controle com corte 29/06 (carrinho em curso, coorte incompleta) diverge. PASS.'
  - '(2) Fronteiras do AC2 pela `janelaDaGeracao`: corte 11/05 (= abertura) dá em curso; 30/06 (= fim) dá concluída, todas concluídas e janela 2A; 10/05 dá não começou; carrinho concluído com o downsell "ainda não aconteceu" faz a janela voltar ao corte. PASS.'
  - '(3) SEM_AD_LEVEL no encerrado com convenção "nenhuma": F11 failed. Confirma o achado fora do escopo.'

top_issues:
  - id: 'REQ-001'
    severity: low
    finding: 'O AC8 diz que `DEBRIEFING_PAYLOAD_VERSAO` "sobe", e não subiu. É a mesma incompatibilidade com o AC9(a) já ratificada na 49.12, mas aqui a letra é explícita.'
    suggested_action: 'O @po ajusta o AC8 para a regra ratificada na 49.12 (campo aditivo e opcional não sobe a versão) ou registra a ratificação.'
    owner: po
  - id: 'REQ-002'
    severity: low
    finding: 'O AC2 prevê em curso com o fim "ainda não aconteceu" para as três fases, mas a config só tem isso para o carrinho. Reabertura ou downsell que já abriram e não têm data de fim precisam de um fim previsto. Quem marcar "ainda não aconteceu" num downsell rodando o vê fora do ROAS total, como se não tivesse começado.'
    suggested_action: 'O @po decide entre (a) aceitar e pôr no formulário a dica "fase aberta sem data de fim: informe o fim previsto" e (b) uma story nova com "fim ainda não aconteceu" para reabertura e downsell.'
    owner: po
  - id: 'REQ-003'
    severity: low
    finding: 'No R9-5 (todas as fases concluídas), os números do lançamento atual são os do final, mas a comparação continua cortada em D+N, inclusive os leads (49.12 AC8). Por isso o Δ da parcial R9-5 pode diferir do Δ do relatório final. O controle do próprio @dev prova que o corte de lead muda a coorte. O AC9(b) foi provado só sem comparação.'
    suggested_action: 'O @po decide se, no R9-5, a comparação também usa a janela do final (sem corte), para a promessa "números iguais ao final" valer no documento inteiro, ou se o Δ em D+N fica e o aviso do topo diz isso.'
    owner: po
  - id: 'TEST-001'
    severity: low
    finding: 'A mutação B5 sobrevive: cortar as respostas da pesquisa no corte durante o R9-5, no chamador do Motor II (`debriefing-audience-engine.ts:712`), passa na suíte. A fixture do AC9(b) não tem resposta de pesquisa depois do fim da janela.'
    suggested_action: 'No AC9(b), acrescentar um respondente com data entre o fim da regra 2A e o corte, e afirmar a igualdade com o final.'
    owner: dev
  - id: 'MNT-001'
    severity: low
    finding: 'Com o downsell que não começou, a venda da etapa de downsell datada antes do início fica em `faturamentoTotal` (KPI "Fat. Total s/ TMB") e na tabela por etapa. Ao mesmo tempo, "Vendas Downsell" mostra a lacuna "ainda não começou" e o ROAS total a exclui. No documento, Fat. Total ÷ investimento ≠ ROAS total.'
    suggested_action: 'Nota no KPI Fat. Total ("inclui R$ X de venda da etapa de downsell anterior ao início dele, fora do ROAS total") ou tirar a parcela do total, de forma coerente com o ROAS.'
    owner: dev
  - id: 'FE-001'
    severity: low
    finding: '`avisoDoBotaoDeGerar` e o formulário mostram "todas as fases terminaram: a parcial sai com os números do relatório final" sem olhar o contrato. Contra a API v35, essa geração responde 422 CARRINHO_JA_ABERTO.'
    suggested_action: 'Mostrar `fasesConcluidas` só com a API ≥ 36, como já faz `rotuloDoEmAndamento`.'
    owner: dev

