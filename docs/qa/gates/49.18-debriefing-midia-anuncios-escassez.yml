decisoes_do_dev:
  separador_como_espaco: 'ACEITO. O hífen, o underline, o ponto, o pipe e a barra viram espaço, e o termo casa como palavra inteira. Nenhum termo novo entra: são os 3 do dono. A regra R11-5 ("só no nome do anuncio") continua inteira, e a mudança é só de comparação, como já era com maiúsculas e acentos. A palavra inteira evita falso positivo (`faltamento` e `ultimo-diario` ficam fora; a E3, casamento por substring, morre). Sem a normalização, 2 das 5 peças reais do PG05 sumiriam.'
  tabela_por_publico: 'ACEITO. O AC4 manda separar o ADV+ "nas análises desta story", e a tabela "Por público" e a coluna "Público" do ranking são exatamente isso. O classificador compartilhado e a Tabela 1 não mudam: um teste verifica que `classificarOrigem` não conhece ADV+. A P-23 (ADV+ na Tabela 1 do Debriefing) segue aberta.'
  demais: 'Concordo com os outros AUTO-DECISIONs: ranking ordenado por investimento (não escolhe "melhor" antes da P-22); % da verba sobre o ad-level (difere R$ 0,06 do Motor I no PG05, e a diferença está declarada); comprador ancorado no ingresso/combo; numerador da compra por visita só com Ad IDs que têm a medida; escassez fora só do ranking (com nota nas outras tabelas); nenhuma lacuna nova em `lacunas[]` (o bloco escreve a dele, e isso mantém a seção 17 congelada); `API_CONTRACT_VERSION` em 36 e `DEBRIEFING_PAYLOAD_VERSAO` em 1 (campo aditivo e opcional, a mesma regra ratificada na 49.12 e na 49.17).'

checks:
  fidelidade_ao_metodo: 'Passo 3: o investimento usa o imposto do Loyola por dia (R11-0c), e testes pré-lançamento ficam com a 49.17. Passo 4: o comprador é atribuído pelo `co=` (Ad ID) do utm_content, somado por nome de anúncio, com o público vindo do nome da campanha e `cold-adv` separado. Passo 5: o formato sai do nome da campanha, independente da dimensão da config; a conversão do clique é compradores ÷ link_click; o ranking traz investimento, compradores, CPA, ROAS, tier e compra por visita; as peças de escassez saem pelo nome, por dia de veiculação, só de ingresso; a copy compara title e body. R11-0g: vale no parcial e no final. R11-5: a escassez sai só pelo nome do anúncio, com os termos do método.'
  acceptance_criteria: 'AC1 ✓: soma por nome (M2 morre), "—" com motivo sem landing_page_view (M3 no motor e E13 no loader morrem). CTR e CPC não aparecem; a conversão do clique usa link_click. AC3 ✓: "não identificado" não é descartado (E7 morre). AC4 ✓, com a tabela por público. AC5 ✓: a constante é única, cada termo é testado (E1 e E2 morrem) e a parcela só de ingresso é testada (E15 morre). AC6 ✓: copy igual, diferente, indisponível, um só texto e não lido (E4 e E16 morrem). AC7 ✓: total da comparação no ranking e formatos da comparação, no mesmo D+N na parcial; "—" com nota para payload antigo ou comparação sem ad-level; nota de sem-D+N (E11 e E12 morrem). AC8 ✓ (ver ac8_sha). AC9 ✓: testes que falham com o código de hoje, o orquestrador de ponta a ponta e o render a partir do payload. AC2: pendente.'
  ac8_sha: 'O QA montou uma base independente (`git archive c0a63eb4`, mais só a fixture nova) e rodou o `ac8-4918.mts` do @dev nas duas árvores. Os 7 cenários dão o MESMO SHA: HTML inteiro sem o bloco (cabeçalho, avisos, banner, resumo macro, as 18 seções, rodapé e `const D`) e payload sem `publico.midiaPorAnuncio`. Os 7 pares de SHA também batem com `SHA_DO_BASE`, gravados no teste. A cópia `base-4918/` do @dev é idêntica a `c0a63eb4` mais a fixture (`diff -rq`). O `semO4918` corta de `<section data-midia-por-anuncio>` até o primeiro `</section>`, e o bloco não tem `<section>` aninhada. A igualdade de SHA prova que o corte é exato.'
  unit_tests: 'Suítes de debriefing + post-do-criativo da API: 30 arquivos, 896/896. As 36 mutações do @dev, reexecutadas: 36 morrem. Das 16 mutações do QA (`scratchpad/qa-mutar-4918.py`, contra as suítes de debriefing inteiras, cada uma restaurada, com `git status` limpo ao fim), 13 morrem: E1 e E2 (cada termo), E3 (substring), E4 (um só texto), E5 (balde da atribuição), E6 (conta da atribuição some do documento), E7 ("não identificado"), E9 (chamador: `vendasComConteudo` sempre true), E11 (render sem a comparação), E12 (render sem a nota de sem-D+N), E13 (loader: `landing_page_view` ausente vira 0), E15 (só ingresso) e E16 (copy só pelo title). Sobrevivem E8, E10 e E14 (TEST-001).'
  no_regressions: 'API: `node_modules/.bin/tsc --noEmit -p packages/api` com exit 0; `eslint src/` com 0 erros e 1 warning que já existia. A suíte inteira da API dá 4.645 passando e 10 falhas, as 10 pré-existentes conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2). Web: `next build` exit 0, depois `tsc --noEmit -p .` exit 0, `next lint` limpo e debriefing 95/95. O web e o shared não mudam.'
  caso_real_pg05: 'Conferido no registro (`prod-4918.mts`/`.out`), sem rodar de novo. A sessão saiu com `default_transaction_read_only=on`, e o `.out` traz `"sessao_read_only": "on"`. O `gravar` é no-op e devolve `"nao-gravado"`. A saída só tem agregados: nomes de anúncio, contagens e valores, e nenhum "@" no `.out`. A config foi simulada e rotulada como simulada. Os números estão no Dev Agent Record, inclusive a medição do R1: 146 de 146 Ad IDs com texto, uma só copy.'
  security: 'Os nomes e os links passam por `esc()`, e os links abrem com `noopener noreferrer`. O payload ganhou só Ad IDs, nomes de anúncio e números, sem PII. Nenhuma rota nova.'
  contrato: 'Sem rota nova, sem mudança de forma e sem migration. O campo é aditivo e opcional, o payload antigo mostra "não calculada" e a comparação antiga sai com "—" e nota.'

  r12_3: 'Fiel à resposta literal. "menor cpa" → `ordemDaMelhorVersao`, menor CPA primeiro. "com maior roas" + "ROAS desempata" → maior ROAS só no empate de CPA (lexicográfico, sem fórmula combinada). "mínimo de 5% do valor total investido" + "captação do lançamento" → elegível com investimento ≥ 5% de `dinheiroTempo.midia.porGrupo.captacao.investimentoComImposto` (Motor I, c/ imposto, a base do CAC e do ROAS), escolhido em `montarPayloadDebriefing`; a base NÃO é o investimento do nome (A2 morre) nem o total do lançamento (G4, do QA, morre). Versão = Ad ID (na Meta, um anúncio pertence a um só conjunto), com o conjunto lido de `adset_id/adset_name` (A11 e A12 morrem). A linha "↳ melhor versão isolada" fica logo abaixo do nome (G5 morre), com os números da versão (A10 morre) e o conjunto pelo nome (G6 morre).'
  r12_5: '"falta" entra em `TERMOS_DE_ESCASSEZ` como palavra inteira: "faltam" e "falta" são termos separados; "faltas-de-tempo" e "faltamento" ficam fora. A F1 do @dev morre, e a G10 do QA (casar "falta" por prefixo) também. No PG05, a peça `--falta-1-dia` saiu do ranking (8 nomes) e foi para a escassez (6 peças).'
  regate_iteracao_2: 'AC8: o QA conferiu, blob a blob (821 blobs), que `qa-base2-4918` é idêntica a 0f237e62, acrescida só da fixture atual. Na base (`git archive`) e na story, o `ac8-4918.mts` dá os mesmos SHA de HTML inteiro e de payload nos 7 cenários, iguais aos do 1º gate e aos 7 pares do `SHA_DO_BASE`. As 14 mutações do @dev (`mut-4918-ac2.py`), reexecutadas com testTimeout de 60 s, morrem todas. Mutações do QA (`qa-mutar3-4918.py`; suítes de debriefing sem a debriefing-config, testTimeout de 60 s; cada uma restaurada, `git status` limpo): das 10, morrem 5 (G1, limiar de 4%; G4, chamador `montarPayloadDebriefing` com o investimento total; G5 e G6 no render; G10 no "falta" por prefixo) e sobrevivem 5 (G2, G3, G7, G8 e G9, o TEST-003). O E8, o E10 e o E14 do 1º gate morrem. API: debriefing e post-do-criativo 908/908 (30 arquivos); `tsc --noEmit -p packages/api` com exit 0; `eslint` com 0 erros; API inteira com 4.657 passando e as 10 falhas já conhecidas. Web, no mesmo HEAD f2cf6f1e: `next build` 0, depois `tsc` 0, `next lint` limpo e debriefing 95/95. PG05: o registro (`prod-4918b.mts`/`.out`) mostra `"sessao_read_only": "on"`, `gravar` no-op, só agregados e nenhum "@". A base do AC2 é R$ 11.075,67, com mínimo de R$ 553,78; só 2 dos 8 nomes têm versão elegível.'

notes:
  - '[AUTO-DECISION] Re-gate → CONCERNS (razão: a implementação está fiel e sem defeito, mas 3 AUTO-DECISIONs do AC2 que o @po vai ratificar e 2 textos do documento estão sem teste; é o mesmo critério do 1º gate da 49.17, e o conserto, 4 testes, já está provado).'
  - '[AUTO-DECISION] PASS ou CONCERNS? → PASS (razão: os ACs do escopo foram atendidos e reproduzidos, com o SHA do HTML inteiro provado contra uma base independente; as 3 mutações sobreviventes são lacunas de fixture de severidade baixa, com rascunho pronto; o chamador do Motor II está preso por M15–M23 e E9, e a E10 depende de dado de identidade unida que a fixture não tem).'
  - '[AUTO-DECISION] Os 111 sem Ad ID somem em silêncio? → Não: estão na nota do ranking (a E6 morre). Falta destaque e a ressalva sobre o CPA (REQ-001, low).'
  - 'A pergunta da `falta-1-dia` fica registrada para o dono, sem decisão do QA.'
  - 'CodeRabbit não executado (CLI ausente no macOS). No lugar: revisão manual, SHAs e mutações.'
  - 'Próximo: @devops *push / PR empilhada (ou depois do merge da 49.17, com rebase).'
