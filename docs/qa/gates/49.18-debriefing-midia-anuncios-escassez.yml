issues:
  - id: TEST-001
    severity: low
    category: tests
    description: 'Três mutações não equivalentes sobrevivem às 30 suítes de debriefing (884/884). (E8) Tirar "Indefinido" de `PUBLICOS_DA_MIDIA`: a linha some da tabela por público e o investimento das campanhas sem temperatura deixa de aparecer. Nenhum teste fixa a lista e a fixture não tem campanha sem temperatura (é a lição do TEST-002 da 49.17: um teste por item). (E14) Trocar a regra do ADV+ para qualquer "adv" no nome da campanha, mesmo fora do frio: nenhum teste prende a fronteira (`hot-adv`, `--adv--`). (E10) No chamador do Motor II, `compradoresDaMidia(…, chaves.porEmailOuTelefone)` no lugar de `chaves.porEmail`: a fixture não tem comprador com identidade unida (dois e-mails com o mesmo telefone, ou linha sem e-mail). Por isso as chaves dos dois critérios coincidem e a troca não aparece. Em dado real com uniões, o faturamento desse comprador viraria `null`, e o ROAS do grupo e do total sairia "—" com o motivo errado (SEM_VALOR_DA_VENDA). O Motor I da 49.17 tem o critério configurável, então a troca é uma refatoração plausível.'
    recommendation: 'Rascunho do QA em `scratchpad/qa-rascunho-teste-4918.ts`. Ele derruba E8 e E14 e passa sem mutação; foi provado na worktree e removido. Para a E10: na fixture, um comprador de captação com dois e-mails que dividem o telefone, conferindo o faturamento e o ROAS da linha dele. Nada disso bloqueia.'
    owner: '@dev'
    resolution: 'FECHADO em 941d3f4b (antes a1d8d121) e conferido no re-gate: E8, E10 e E14 reaplicadas pelo QA, cada uma derruba 1 teste (59/60).'
    status: resolved

  - id: REQ-001
    severity: low
    category: requirements
    description: 'Atribuição sem Ad ID. No PG05, 111 dos 215 compradores (52%) não têm Ad ID no utm_content. O caso NÃO some em silêncio: `atribuicao.memoria` ("compradores de captação 215 = no ranking 90 + peças de escassez 14 + ad_id fora do ad-level 0 + sem ad_id no utm_content 111") sai na nota do ranking. A mutação E6, que apaga essa conta do documento, morre. O `utmContentEfetivo` já lê o `co=` em JSON (`{"co":…}`), então os 111 não vêm de formato mal lido: são compradores sem Ad ID (orgânico, `co=org`, ou sem rastreio). Duas ressalvas de leitura. (1) A informação está numa nota de rodapé, não em destaque. (2) O documento não diz que o CPA e o ROAS por anúncio cobrem só os compradores atribuídos. No PG05, o CPA do 1º nome (R$ 108) fica muito acima do CAC do resumo da 49.17 (R$ 46), e quem lê os dois blocos pode estranhar a diferença.'
    recommendation: 'Story futura ou ajuste do @po: quando a parcela sem Ad ID for relevante, um aviso visível no bloco (por exemplo "52% dos compradores não têm Ad ID na UTM — o CPA por anúncio cobre só os atribuídos e não se compara com o CAC do resumo"), separando, se possível, orgânico × sem rastreio. Fica fora desta story e não bloqueia.'
    owner: '@po'
    resolution: 'ENCAMINHADO: virou a Story 49.21 (aviso CPA × CAC, na main em 106a4470). Fora desta story.'
    status: resolved

  - id: PEND-AC2
    severity: low
    category: requirements
    description: 'PENDENTE, não é defeito: o AC2 (melhor versão isolada, ad_id + conjunto) espera a P-22, que define o critério de "melhor" e a amostra mínima. O @dev não escolheu critério e deixou registrado o caminho (carregar `adset_id/adset_name` no loader).'
    owner: 'dono → @dev'
    resolution: 'IMPLEMENTADO pela R12-3 (1ca799e8). Ver checks.r12_3 e TEST-003.'
    status: resolved

  - id: PERG-FALTA-1-DIA
    severity: low
    category: requirements
    description: 'Registrado sem decisão do QA. A peça do PG05 `ad02-dg-pg05-out26--lote-promo--falta-1-dia` usa "falta" no singular, que não está entre os termos do dono ("faltam", "último dia", "últimas horas"). Por isso ela FICA no ranking (R$ 99 e 0 compradores até 07/10). O teste fixa o comportamento atual. A pergunta é do dono, via @po.'
    owner: 'dono via @po'
    resolution: 'DECIDIDO pela R12-5 ("falta" entra como termo) e implementado em 1ca799e8. A peça do PG05 saiu do ranking.'
    status: resolved

  - id: TEST-003
    severity: medium
    category: tests
    description: 'Das 10 mutações do QA no AC2 e na R12-5, 5 sobrevivem às suítes de debriefing (838/838). Para isolar a flutuação, rodei sem a debriefing-config.test.ts e com testTimeout de 60 s; ver REL-001. (G2) O empate de CPA passa a ser comparado no float, não em centavos: o AUTO-DECISION "CPA em centavos" fica sem teste, porque os testes de empate usam CPAs iguais no float. (G3) O ROAS "—" passa a vencer o desempate: o AUTO-DECISION "ROAS — perde" fica sem teste. (G8) O conjunto da versão passa a vir da PRIMEIRA linha do Ad ID, não da mais recente: o AUTO-DECISION "Ad ID em dois conjuntos = o conjunto da linha mais recente" fica sem teste. (G7) O documento passa a mostrar, para SEM_COMPRADOR_NAS_ELEGIVEIS, o texto do SEM_VERSAO_ELEGIVEL. O motivo é testado no payload, não no documento. (G9) A nota do ranking com a base e o mínimo da R12-3 ("investimento de captação do lançamento c/ imposto R$ X × 5% = R$ Y") some do documento sem nenhum teste falhar. São justamente as regras que o @po vai ratificar e que hoje nada prende.'
    recommendation: 'Acrescentar os 4 testes do rascunho do QA (`scratchpad/qa-rascunho-teste-4918-it2-final.ts`) ao fim de `debriefing-midia-anuncios-49-18.test.ts`. Eles importam também `escolherMelhorVersao` e reaproveitam `final`, `linha`, `midia`, `bloco`, `ROT` e `NOME_A`. O QA os rodou na worktree e depois os removeu: passam sem mutação e derrubam G2, G3, G7, G8 e G9 (cada uma com 1 falha).'
    owner: '@dev'
    status: open

  - id: REQ-002
    severity: low
    category: requirements
    description: 'Para o @po ratificar. (1) No AC2, a R12-3 entrou como nota registrada pelo @dev para ratificação, mas o corpo continua dizendo que o critério de "melhor" virou a P-22. Ratificar o texto final: elegível = investimento ≥ 5% do investimento de captação do lançamento, c/ imposto, o mesmo do CAC e do ROAS (Motor I), com o ≥ inclusivo; melhor = menor CPA; CPA empatado → maior ROAS; versão sem comprador (CPA "—") nunca é a melhor; sem versão elegível, a frase explícita, com dois textos: "nenhuma versão com ≥ 5%…" e "…tem comprador". (2) Os AUTO-DECISIONs: empate final pelo menor Ad ID; empate de CPA medido em centavos; ROAS "—" perde o desempate; Ad ID em dois conjuntos = o conjunto da linha mais recente. (3) O corpo do AC5 ainda lista só "faltam", "último dia" e "últimas horas". A R12-5 está registrada à parte e o corpo precisa ganhar o "falta", por palavra inteira. (4) Efeito da regra no PG05, para o dono saber: com 11 a 19 Ad IDs por nome, só 2 dos 8 nomes têm versão com ≥ 5% (R$ 553,78). Os outros 6 mostram "nenhuma versão com ≥ 5%…". É fiel à R12-3 ("captação do lançamento", não o investimento do nome).'
    owner: '@po'
    status: open

  - id: REL-001
    severity: low
    category: reliability
    description: 'Fora desta story e anterior a ela. O teste "R1 — superfície exportada do service" de `debriefing-config.test.ts` varre `src/` inteiro e estoura o timeout de 5 s quando a máquina está com I/O lento (outro `tsc` rodando e o iCloud). No re-gate ele falhou sem nenhuma mutação aplicada (BASE e FINAL) e passou na rodada seguinte. Com `--testTimeout=60000`, a suíte de debriefing dá 908/908. Esta story não toca nesse arquivo.'
    recommendation: 'Story de manutenção: um timeout próprio nesse teste ou uma varredura mais leve. Não bloqueia.'
    status: open

