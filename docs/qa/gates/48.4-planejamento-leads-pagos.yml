top_issues:
  - id: 'TEST-001'
    severity: medium
    status: open
    finding: 'AC2 fixa nível 1…10 nos pagos (a escada tem dez níveis, contra oito nos orgânicos). O `payloadValido()` do teste de rotas usa níveis 4, 3, 5 e 2, e o caso de 400 testa só 11 e 0 — nenhum caminho exercita 9 ou 10 como VÁLIDOS. A mutação `nivelPago = …max(NIVEIS_ORGANICOS)` (o copy-paste mais provável entre as duas rotas, que devolveria 400 para um nível legítimo) passa **7/7**. A tela oferece os dez radios, então o usuário marcaria 10, clicaria Salvar e receberia "Dados inválidos".'
    suggested_action: 'No `payloadValido()`, usar nível 10 numa fonte (e 9 noutra) — ida-e-volta passa a cobrir o limite; e um caso explícito "nível 10 aceito (200)". Re-mutar `max(NIVEIS_ORGANICOS)` e ver a suíte cair.'
  - id: 'REQ-001'
    severity: low
    status: open
    finding: '`resumoDaFonte` com seleção vazia devolve `cpl: 0` e `cplBruto: 0`; a tabela de combinações mostra "R$ 0,00" no CPL máximo da fonte que não participa. CPL é uma RAZÃO (captação ÷ leads), como a conversão — e a conversão, na mesma situação, devolve `null` ("—", D3). Vendas e leads a 0 fazem sentido (somam nos totais); um CPL de zero reais lê como "lead de graça". O teste `fonte com seleção vazia contribui 0 em vendas, leads e CPL` fixa o comportamento errado.'
    suggested_action: 'Seleção vazia → `cpl: null`, `cplBruto: null` (como `conversao`); ajustar o teste para afirmar `cpl: null` e manter vendas/leads 0. Mutação "cpl 0" tem de cair.'

