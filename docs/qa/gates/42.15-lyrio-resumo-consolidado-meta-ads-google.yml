loop_1_review:
  commit: '8a643ba9'
  production_files_changed: 'web: `lib/utils/resumo-mobile-lyrio.ts`, `lib/utils/ltv-por-churn-lyrio.ts`, `lib/utils/vendas-por-canal-lyrio.ts` e `components/funnels/lyrio-stage-view.tsx`. Na API, só o teste. Nenhuma rota, migration ou contrato mudou (continua v63).'
  code_review: >-
    REL-001: `percentuaisDaConfig` lê a consulta pelo `estadoDaFonte`, e cada estado tem a sua saída: carregando →
    carregando; oculto (API antiga) → indisponível; erro (o 500 de hoje) → indisponível com a mensagem; pronto sem
    os três números finitos → indisponível; pronto → os percentuais DA config. `margemDosPercentuais` repassa o
    estado ao LTV. `cardsDoLtvPorChurn` trata a margem como o ARPU e o churn: causa → "—" no LTV, no LTV/CAC e no CAC
    máximo; carregando → skeleton. Na Margem, a causa dos percentuais entra junto das outras, e `linhasDoResumoPorCanal`
    aceita `percentuais: null` (margem do canal desconhecida; ROAS igual). Procurei caminhos que ainda usam os padrões:
    `MARGEM_DEFAULTS` só sobra em `lyrio-stage-view.tsx:237-239`, e esses valores só chegam ao formulário de
    Configurar (`:430`). `calcularMargemContribuicao` só é chamada em `resumo-mobile-lyrio.ts` e
    `vendas-por-canal-lyrio.ts`, as duas pelo estado. O `LyrioResumoPorCanal`, que não aparece na tela, também
    compila com o tipo novo. DOC-001: `serieCarregando` segura a Receita, as Vendas, o ROAS e a Margem em skeleton
    enquanto os pagantes carregam. Sem RevenueCat conectado, a venda é `oculto` e o skeleton não fica preso. Com os
    pagantes em ERRO, a cobertura fica desconhecida, a etiqueta continua a do filtro, e o `role="alert"` dos pagantes
    aparece. É o que o @dev registrou; aceito como nota.
  tests_reviewed: 'Nenhum dos testes novos é tautológico: os valores esperados são literais, e cada um cai com a mutação dele. REL-001: o 500 real passa pelo `estadoDaFonte` e o memorial nunca cita "15,00%" nem "percentuais da etapa"; pronto 20/5/5 dá LTV R$ 700,00 e Margem −312,50 (não os padrões); oculto, número ausente e NaN dão indisponível; zeros valem como número; o jsdom desenha o "—" e abre o memorial com a causa; o skeleton fica sem foco; o fio afirma que nenhum construtor lê `platformFeePct` ou `MARGEM_DEFAULTS`. TEST-001: `{mrr: 1887, active_trials: 30, active_subscriptions: 865}` → 865. TEST-002: guest sem vínculo → 404, sem chamar o RevenueCat; com vínculo → 200; projeto inexistente → 404. TEST-003 a TEST-006: os casos que eu recomendei, com as bordas nos dois lados.'
  mutations: 'Rodei de novo o meu `scratchpad/qa-gate-4215/mut.py` inteiro sobre 8a643ba9: as 62 do gate CAEM, inclusive as 10 que sobreviviam (Q04, Q07, Q10, Q13, Q16, Q48, Q50, Q65, Q66, Q77). Acrescentei 12 sobre o estado novo, todas CAEM: S01 (erro vira 15/5/1), S02 (oculto vira os padrões), S03 (carregando vira os padrões), S04 (sem conferir os números finitos), S05 (`margemDosPercentuais` com padrão), S06 (LTV ignora a causa da margem), S07 (Margem sem a causa), S08 (linhas da Margem com os padrões), S09 (a tela passa a config como pronta, no fio), S10 (`serieCarregando` ignorado), S11 (margem do canal sem a guarda do null) e S12 (Margem carregando sem skeleton). Total: 74/74. `git status` ficou limpo depois. O log está em `mut-loop1.out`.'
  gates: 'Rodados por mim sobre 8a643ba9. shared build EXIT 0. API tsc EXIT 0; API vitest 5.416/5.426, e as 10 falhas são exatamente a baseline, sem timeout. Web tsc EXIT 0 (depois do build); eslint `components lib app` EXIT 0; web vitest `--testTimeout=60000` 2.467/2.467, em 169 arquivos; `pnpm build` (next build) EXIT 0, compilado em 17,6 s.'
  auto_decision: 'ACEITA. Os motivos e o que o dono decide estão na REL-002.'
  process_note: 'O registro do loop 1 do @dev está no Dev Agent Record, como combinado, e não na seção QA Results.'

margin_config_assessment: >-
  A resposta ao lead: a 42.15 não mostra um número ERRADO, mas mostra um número com a fonte errada, e passa a fazer
  isso em três KPIs de decisão. O estado de produção hoje: as colunas da 0103 faltam, o GET e o PUT da config dão 500,
  e a tela cai nos `MARGEM_DEFAULTS` = 15/5/1 (79%). Para uma etapa sem configuração, a rota devolveria esses mesmos
  valores, que também são os defaults da própria 0103. Por isso a Margem e o LTV (margem) têm hoje o mesmo valor que
  teriam com a migration aplicada. O problema é outro: o memorial diz "percentuais da etapa (Configurar)", o gestor não
  consegue mudar os percentuais (o PUT falha), e o AC10a manda "—" quando o insumo falta. Classifiquei como REL-001
  medium: não bloqueia por número errado, mas o AC10a não é atendido no estado real. Recomendo aplicar a 0103 antes do
  deploy, com @devops/@data-engineer, e o @dev parar de calar o erro da config no LTV.

