    description: >-
      O ARPU, primeiro fator do LTV, não tem teste no caminho pronto. Q48 (`ltv-por-churn-lyrio.ts:185`):
      `v("active_subscriptions")` → `v("active_trials")` SOBREVIVE às 10 suítes que alcançam o código. O único teste
      de `arpuDoOverview` é o do overview em erro (`ltv-por-churn-lyrio.test.ts:180`). Os testes do LTV montam o ARPU
      à mão, e o fio da tela só confere que a chamada existe (`arpuDoOverview(overviewEstado)`). Trocar o MRR ou o
      denominador do ARPU daria um LTV errado com todos os testes verdes. Hoje o código está certo: são os ids usados
      por `cardsDoResumo` (`metrica(overview, "active_subscriptions")`) e citados no P-7. É o padrão de testar a biblioteca e não o fio
      do chamador.
