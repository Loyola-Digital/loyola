top_issues:
  - id: REL-001
    severity: medium
    category: reliability
    description: >-
      Em produção, a configuração da etapa não carrega. Por isso, o LTV (margem) e o LTV/CAC usam a margem padrão e
      dizem que ela veio da etapa. Evidência:
      (1) Sonda read-only (`default_transaction_read_only=on`, só agregados, em `scratchpad/probe/qa-gate-4215-colunas.mjs`).
      O banco do `.env` é o de produção: ele tem vendas de hoje, 112 nos últimos 2 dias. Nele, `revenuecat_stage_config`
      só tem `id, stage_id, project_id, rc_project_id, label, webhook_token, created_at, updated_at`. Um SELECT com
      `platform_fee_pct` dá erro 42703.
      (2) O GET `/revenuecat/config` (`routes/revenuecat.ts:250`) faz `.select()`, e o drizzle lista todas as colunas
      do schema, então a rota responde 500. O PUT (`:291`) falha igual, e o gestor não consegue salvar outros percentuais.
      (3) No web, `lyrio-stage-view.tsx:234-236` faz `config.data?.platformFeePct ?? MARGEM_DEFAULTS…`. Com a consulta
      em erro (ou carregando), a tela usa 15/5/1 sem avisar, e `:309` passa isso como `margem` para o LTV.
      (4) `ltv-por-churn-lyrio.ts:247/304` cita a fonte "percentuais da etapa (Configurar)". O card Margem faz o mesmo
      (`resumo-mobile-lyrio.ts:466-468`, "configurável na etapa"), mas isso já existia antes desta story.
      Esta story piora a situação: ela acrescenta três números de decisão em cima do fallback (LTV, LTV/CAC e "pode pagar
      até R$ X"), e o AC10a manda "nada é estimado. Insumo ausente → \"—\" e o memorial diz qual faltou".
      O número exibido NÃO está errado em relação ao desenho: os defaults da 0103 são os mesmos 15/5/1 (79%), e a rota
      devolve esses valores para uma etapa sem configuração. O erro é a fonte declarada, o caminho de erro e o
      carregamento, porque nesse estado o AC10a manda "—".
    recommendation: >-
      Antes do deploy, um dos dois caminhos:
      (a) @devops/@data-engineer aplicam a 0103 em produção. Ela é idempotente (`ADD COLUMN IF NOT EXISTS … DEFAULT`)
      e torna a fonte verdadeira. Isso corrige também o card Margem e o PUT. O @qa não escreveu no banco.
      (b) @dev passa o estado da config ao `cardsDoLtvPorChurn`: em erro, "—" com a causa "percentuais da etapa
      indisponíveis"; carregando, skeleton. No card Margem, no mínimo declarar o padrão.
      O ideal é fazer os dois: (a) corrige o dado, e (b) impede que a próxima falha volte a ficar calada.
    owner: '@devops / @data-engineer (0103) + @dev (web)'
    status: resolved

  - id: TEST-001
