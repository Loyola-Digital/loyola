status_reason: 'Os 5 ACs estão implementados e provados. Em utm-term.ts o diff é só o `export` de limparSufixoCopia. utm-term-lp.test.ts e routes/ estão intocados. Com o lpDaCampanha da base, 5 testes novos falham, os mesmos 5 que o @dev reportou. Os 14 SHA do AC5 foram remedidos pelo QA com o código da d10258cb e batem com SHA_DA_49_22, então a constante é mesmo da base. LP, LPA e LPAA somam uma LPA só (porLp com 3 campanhas e R$ 90) e não formam par. As 22 bordas sondadas pelo QA dão o resultado esperado. O AC3 está fechado por decisão do dono, registrada na story, e o raciocínio vale para o código: o ramo novo só dispara com `doBloco === "LP" && temBlocoLpPuro(nome)`, e fora disso o caminho é o da base, byte a byte. Ficam só lows.'
