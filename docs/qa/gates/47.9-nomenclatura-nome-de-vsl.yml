corrigido_no_gate:
  - id: QA-479-01
    severidade: medium
    o_que: >
      O slug do PRODUTO entra no nome da VSL (posição 3), mas só a oferta
      passou a contar VSL como uso. Um produto usado apenas em VSLs mostrava
      "usado em 0" e deixava trocar o slug — o `name` gravado ficaria
      inconsistente com o dicionário. (A exclusão já era bloqueada: o
      `referenciasDe` conta VSLs para produto.)
    correcao: "GET /produtos soma usoEmVsls('productId'); PATCH do slug exige campanhas + VSLs = 0. Asserção no teste AC3; reversão coberta pelo mesmo caso."

achados_abertos:
  - id: QA-479-02
    severidade: low
    o_que: >
      Editar uma VSL cuja variável foi desativada depois: o select só lista
      ativas, o estado guarda o id antigo, a prévia fica incompleta e o
      Salvar trava até trocar a variável. Comportamento coerente com o
      gerador de campanha (regra 8), mas sem mensagem explicando por quê.
    recomendacao: "no modo editar, mostrar '{tipo} desativado — escolha outro' quando o id do estado não está na lista."
  - id: QA-479-03
    severidade: info
    o_que: "Não há DELETE de VSL (não pedido); D18 sem publicar/sufixo. Validador de nome de VSL existe na API, não na tela (pergunta 2 do @sm, aberta)."
  - id: QA-479-04
    severidade: info
    o_que: "AC7, AC8 (tela), AC10 e AC12 só têm prova pelo roteiro visual — componente .tsx sem runner."

