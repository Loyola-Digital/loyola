corrigido_no_gate:
  - id: QA-478-01
    severidade: medium
    o_que: >
      A dica "parece o padrão anterior" disparava para QUALQUER nome com 9
      pedaços — inclusive um v2 ao qual falta um campo
      (`bbe_a01_churrasco_of01_perpetuo_2026_hot_cbo_videos`), que não é v1
      nenhum. O teste do @dev fixava esse comportamento como esperado.
    correcao: "dica só quando o 5º pedaço NÃO é `perpetuo`; teste novo (QA-478-01) e o antigo apontado para um nome v1 de verdade."

achados_abertos:
  - id: QA-478-02
    severidade: low
    o_que: >
      `recalcularNomesNaoPublicados` não chama `invalidarMapa()`. Uma campanha
      não publicada mas com id da Meta colado (possível: AC5 da 47.6 deixa
      colar antes de publicar) fica com `name` velho no mapa da 47.6 por até
      60 s depois do recálculo. Só afeta o rótulo `name`; as dimensões vêm das
      colunas.
    recomendacao: "chamar invalidarMapa() ao fim do recálculo (uma linha) — ou aceitar os 60 s, já que o script roda uma vez."
  - id: QA-478-03
    severidade: info
    o_que: >
      Contrato 10 não é aditivo. Web novo + API velha: `partes` vem com 9 e o
      validador cai no texto plano (`partes.join`) — degrada sem quebrar. API
      nova + web velho: dez pedaços em nove rótulos — o banner da 29.45 avisa.
      Ordem de deploy: API antes do web, como sempre.
  - id: QA-478-04
    severidade: info
    o_que: "AC3/AC9/AC11 (tela) só têm prova pelo roteiro visual — componente .tsx sem runner."

