  code_review: 'Diff de 8 arquivos contra `ff1fa772` (a `origin/main` só avançou com docs, #934). API: sai o `.filter(temSimulador)`, cada item ganha `temSimulador: porId.get(a.id)?.temSimulador ?? false`, `tipo = identificarLancamento(alvo.nome).tipo` — a MESMA leitura que `lancamentosAnteriores` já faz do alvo, então tipo e lista não podem divergir — e `incluiSemSimulador: true` no topo, também no ramo defensivo `!alvo`. Web: a regra saiu da página para cinco funções puras em `planejamento-referencia.ts`; `baseTemSimulador` trata o campo ausente como "com simulador" (API antiga só devolvia esses); `montarReferencia` devolve referência EXISTENTE com as três leituras `null` (evita a armadilha do cabeçalho, PO-06). O realizado da 48.11 continua pedido com `baseId`, não com `simuladorDaBase` — base sem simulador segue com `real:`. `rotuloDoTipoDeLancamento` importado por subpath do módulo folha (import de valor do barrel quebraria o `next build`). Sem PII nem token na resposta.'
  unit_tests: 'API `planejamento-*` 14 arquivos / 231 testes verdes (`planejamento-rotas-bases` 8/8); web `lib/utils` 90 / 1.315 (+9 desta story). Mutações do gate, diferentes das oito do @dev: (A) `incluiSemSimulador: anteriores.length > 0` — o sinal some justo na lista vazia, que é o caso para o qual ele existe → 1 falha, "primeiro do tipo… tipo do PRÓPRIO funil"; (B) `montarReferencia` sem simulador vazando SÓ `pagos` → 1 falha, "base SEM simulador → nenhuma referência `base:`…" (cada uma das três leituras tem asserção própria); (C) `fraseSemBase` com `incluiSemSimulador !== false` (ausência lida como API nova) → 1 falha, "API ANTIGA (PO-03)… NUNCA primeiro"; (D) fio da página → 0 falhas (TEST-001). Restauração conferida com `shasum -c` e `git status` limpo.'
