summary: >
  A feature funciona e a engenharia é boa — a extração de `resolverAbas` evita
  duas verdades sobre "o que conta como aplicação", e a escolha por coluna
  preenchida está certa. O que reprova é o endpoint novo não repetir as duas
  verificações de acesso que o endpoint irmão faz, num payload que expõe nome e
  e-mail de pessoas reais.

issues:
  - id: QA-43.7-01
    severity: critical
    category: security
    title: "applications-list sem validação de vínculo (IDOR) e sem bloqueio de guest — expondo PII"
    file: packages/api/src/routes/stage-applications.ts
    description: >
      O handler lê `funnelId` dos params e chama `resolverAbas(funnelId)`
      direto. Não usa `projectId` nem `stageId` para nada, e não checa
      `request.userRole`.
    comparison: |
      applications-daily (o endpoint irmão, mesmo arquivo) faz DUAS coisas que
      este não faz:

        if (request.userRole === "guest") return reply.code(403)...

        const [ctx] = await db.select(...)
          .from(funnelStages)
          .innerJoin(funnels, eq(funnels.id, funnelStages.funnelId))
          .where(and(
            eq(funnelStages.id, stageId),
            eq(funnelStages.funnelId, funnelId),
            eq(funnels.projectId, projectId),   // <- o vínculo
          ));
        if (!ctx) return reply.code(404)...
    exploit: >
      Usuário autenticado do projeto A chama
      /api/projects/{A}/funnels/{funil-do-projeto-B}/stages/{qualquer}/applications-list
      e recebe nome + e-mail de todas as aplicações do projeto B. O guest-guard
      global valida a membership dele em A — que ele tem — e nada valida que o
      funil B pertence a A. Para usuários não-guest o guard nem roda
      (`if (request.userRole !== "guest") return`).
    guestGap: >
      Segundo problema, independente: applications-daily bloqueia guest por
      completo. Este não. Um guest membro do projeto, com a permissão de módulo,
      leria a lista com PII enquanto continua barrado no agregado — o dado mais
      sensível ficou menos protegido que o menos sensível.
    dataAtRisk: "Nome e e-mail de pessoas reais (70 linhas no dg-pg04)."
    recommendation: >
      Copiar as duas verificações do applications-daily. É o padrão do
      repositório: 56 dos 75 arquivos de rota checam `userRole === "guest"`, e a
      validação de vínculo por query é como toda rota project-scoped resolve
      autorização aqui.
    verification: >
      Depois do fix: chamar com um funnelId de outro projeto deve devolver 404,
      e com userRole=guest deve devolver 403.

  - id: QA-43.7-02
    severity: low
    category: requirements
    title: "Não existe story file para a 43.7"
    description: >
      A feature foi pedida direto ao @dev e implementada sem passar por @sm/@po.
      Não há AC escrito, então não há contra o que validar a implementação além
      do enunciado do pedido ("nome / email / utm_term / LP, paginada de 6,
      mais recentes primeiro") — que está atendido, com a troca posterior de
      utm_term por utm_source.
    note: >
      Registrado como fato de processo, não como bloqueio. O pedido era claro e
      a entrega corresponde a ele.

  - id: QA-43.7-03
    severity: low
    category: requirements
    title: "Validação visual não executada"
    description: >
      É uma tabela nova: layout, truncamento, paginação e tooltips são
      exatamente o que os testes não alcançam. O @dev registrou.

positives:
  - "resolverAbas() extraída em vez de duplicada: a tabela e o gráfico leem o MESMO conjunto de abas. Duplicar produziria duas verdades sobre 'o que conta como aplicação', e a divergência só apareceria como número que não bate entre seções vizinhas."
  - "Ordem das séries preservada na refatoração de rawFormsFor — conferido por leitura: abas = [cadastradas..., descobertas...], igual ao [...cadastradas, ...descobertas] anterior."
  - "acharColunaPreenchida generaliza corretamente; as âncoras (^...$) impedem 'Nome do produto' e 'email de cobrança' de entrarem como coluna da pessoa."
  - "A LP continua saindo do utm_term mesmo com a coluna exibida sendo utm_source — e o teste que impede confundir os dois está escrito. Extrair a LP do utm_source faria toda aplicação vinda do Meta virar a mesma página."
  - "O utm_term foi para o tooltip da LP em vez de sumir: sem ele a coluna LP seria um rótulo inauditável."
  - "Performance verificada e OK: getSpreadsheetSheets e readSheetData têm cache com TTL, então a chamada extra do endpoint não gera round-trip adicional ao Google."
  - "Case do utm_source não foi normalizado ('whatsapp' e 'WhatsApp' convivem) — decisão certa: a tabela mostra o dado como está na planilha."
  - "O @dev não reportou '11 falhas pré-existentes' quando uma rodada acusou 13: rodou de novo duas vezes e confirmou antes de afirmar."

