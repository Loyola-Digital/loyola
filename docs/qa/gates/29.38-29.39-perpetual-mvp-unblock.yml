issues:
  - id: QA-01
    severity: medium
    category: correctness
    blocking: true
    status: RESOLVIDO
    resolution: >-
      Corrigido em `ffe59d3`. `fracaoParaPP`/`ppParaFracao` em
      `lib/utils/percent.ts`, aplicados aos dois campos. A medição que apontou o
      defeito foi repetida com a correção: **0 de 2000** (era 537). 15 testes
      novos, sendo o principal uma varredura de 2000 taxas — os valores redondos
      que se testa por instinto passavam mesmo com a implementação ingênua.
    description: >-
      LIXO DE PONTO FLUTUANTE NOS CAMPOS PERCENTUAIS.

      `perpetual-mvp-analysis.tsx:109` e `:111` hidratam os campos editáveis com
      `String(fração * 100)`, sem arredondar. Em JavaScript isso produz:

        0.07   × 100 = 7.000000000000001
        0.0399 × 100 = 3.9900000000000007
        0.035  × 100 = 3.5000000000000004
        0.0199 × 100 = 1.9900000000000002

      Medi o alcance percorrendo o caminho REAL — pontos percentuais → fração →
      `numeric(6,5)` do banco → leitura → × 100 → tela. De 2000 taxas entre
      0,01% e 20,00%, **537 (27%) exibem lixo**. Entre elas 7% e 3,99%, que são
      valores correntes de gateway.

      O erro numérico é de 1e-16 e não corrompe cálculo. O problema é de
      confiança: um gestor que abre a tela e vê `7.000000000000001` conclui que
      o sistema está quebrado — e o valor volta a ser gravado assim no save
      seguinte.

      Atinge DOIS campos:
        - `gatewayPctVar` (:111) — introduzido pela 29.39;
        - `margemDesejadaPct` (:109) — vem da 29.35, mas NUNCA foi visto porque
          a aba nunca funcionou. Vai estrear com o defeito no primeiro deploy.

      Agravante: o padrão correto já existe no MESMO arquivo — as linhas 380 e
      381 usam `.toFixed(2)` para os campos herdados. Não foi aplicado aos
      editáveis. Isso é descuido, não decisão de design.
    recommendation: >-
      Um helper na borda, aplicado aos dois campos. `.toFixed(4)` cobre a
      precisão de `numeric(6,5)` em pontos percentuais, e o `Number(...)` remove
      os zeros à direita para não exibir "2,5000":

        const fracaoParaPP = (f: number) => String(Number((f * 100).toFixed(4)));

      Corrigir os dois na mesma passada — deixar a margem para depois seria
      entregar o defeito conscientemente.

  - id: QA-02
    severity: low
    category: correctness
    blocking: false
    status: RESOLVIDO
    resolution: "Corrigido em `ffe59d3`. `apiErrorMessage` recebe a operação; o banner de carga informa 'ao carregar'."
    description: >-
      MENSAGEM DE ERRO FORA DE CONTEXTO NA LEITURA.

      `apiErrorMessage` devolve, para 500, "Erro no servidor **ao salvar**...".
      A função é usada tanto nos três `catch` de gravação quanto no banner de
      falha de CARGA (`:271`). Se o GET falhar com 500 — precisamente o cenário
      de migration pendente que originou esta story — o banner de leitura vai
      dizer que houve erro ao salvar.

      Não induz a ação errada, mas é o tipo de imprecisão que faz o usuário
      descrever o problema errado quando abre um chamado.
    recommendation: >-
      Neutralizar o texto ("Erro no servidor") ou aceitar um parâmetro de
      operação. A dica sobre migration pendente é útil e deve ficar.

  - id: QA-03
    severity: low
    category: maintainability
    blocking: false
    status: RESOLVIDO
    resolution: "Corrigido em `ffe59d3` — `genérica` → `isGeneric`."
    description: >-
      Identificador com acento em `api-error.ts:35` (`const genérica`). É válido
      em TypeScript e o build passa, mas destoa do resto do código e complica
      grep para quem procurar por `generic`.
    recommendation: "Renomear na próxima vez que o arquivo for tocado. Não vale um commit próprio."

  - id: QA-04
    severity: medium
    category: process
    blocking: false
    description: >-
      DUAS STORIES NUM PR. A 29.38 e a 29.39 vão juntas, e a justificativa do
      @dev procede: separadas produziriam um deploy intermediário gravando
      fração num campo rotulado "R$". Os commits estão separados por story, o
      que preserva a rastreabilidade.

      Registro para que a decisão fique explícita no histórico e não seja lida
      como descuido de escopo.
    recommendation: "Nenhuma ação. Decisão correta, apenas documentada."

  - id: QA-05
    severity: medium
    category: correctness
    blocking: true
    description: >-
      O FORMULÁRIO ACEITA UM GATEWAY QUE O MOTOR REJEITA.

      `perpetual-mvp-analysis.tsx:239` valida `g < 0 || g > 99` — permite **zero**.
      Mas `assertRate` rejeita zero (U-01), então:

        1. usuário digita `0` em Gateway (%) — leitura legítima: "não pago taxa
           variável de gateway";
        2. o formulário aceita e salva;
        3. a análise inteira aborta com
           `U-01: gateway de pagamento % = 0 fora de (0, 1]. Provável valor em
           pontos percentuais — dividir por 100.`

      A mensagem acusa erro de unidade quando o usuário digitou zero de propósito.
      Ele vai dividir por 100, digitar 0 de novo, e ver o mesmo erro.

      É assimetria introduzida por esta story: a margem, no mesmo formulário,
      valida `m <= 0` e bloqueia zero com mensagem no campo. O gateway não.

      Confirmei contra o `cac_engine.py`: o engine também aborta com
      `gateway_pct = 0`, então o PORT está fiel à referência. O defeito é do
      formulário, que deixa passar o que o motor recusa.
    recommendation: >-
      Correção mínima e segura: alinhar com a margem (`g <= 0`) e dizer no toast
      que, não havendo taxa, o campo deve ficar VAZIO — vazio significa "não
      informado" e produz análise parcial explícita, que é honesto.

      A alternativa melhor exige decisão do @po: tratar zero como legítimo para
      CUSTOS, distinguindo-os de taxas de conversão. A justificativa de U-01 no
      YAML do protocolo (linha 227) é explicitamente sobre conversão — *"taxa
      zero torna o CAC infinito e quase sempre significa etapa não medida"* — e
      nada disso vale para um custo. Mas divergir do protocolo é decisão de
      produto, não de implementação.

  - id: QA-06
    severity: low
    category: correctness
    blocking: false
    description: >-
      DIVERGÊNCIA PORT × ENGINE NÃO DOCUMENTADA, NO CMV.

      O cabeçalho do `cac-protocol.ts` declara: *"onde divergir do engine, o
      engine vence"*. Testei os dois com `cmv = 0`:

        engine (`cac_engine.py`) → ABORTA por U-02 (`valor monetário = 0 não é > 0`)
        port   (`cac-protocol.ts`) → ACEITA, devolve CAC = 294,80

      O port não aplica U-02 ao CMV. Na prática isso é BOM: a própria migration
      `0095` descreve o CMV como *"tipicamente 0 em produto digital"*, que é o
      caso deste projeto. Se o port seguisse o engine à risca, o cenário mais
      comum abortaria.

      O problema é que a divergência não está declarada em lugar nenhum, e o
      contrato do módulo diz o oposto. Pré-existente da 29.35, não desta story —
      registro aqui porque só apareceu ao investigar o QA-05.
    recommendation: >-
      Documentar a divergência no cabeçalho do módulo como decisão consciente, ou
      revisar o contrato de autoridade. O comportamento atual não deve mudar.

