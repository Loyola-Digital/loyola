rereview_notes: >-
  2ª PASSADA (após `ffe59d3`). Veredicto mantido em CONCERNS, agora por QA-05.

  QA-01, QA-02 e QA-03 estão RESOLVIDOS e verifiquei cada um por conta própria,
  não pelo relato. Repeti a medição que apontou o QA-01 — 0 de 2000, era 537 — e
  sondei extremos que o autor não cobriu (0,01% · 99,99% · 12,345% · soma com
  erro binário acumulado). Todos limpos.

  A forma da correção merece registro: o helper foi centralizado em vez de
  corrigido inline nas duas linhas, e o teste principal é uma VARREDURA de 2000
  taxas. Isso importa porque os valores que se escolhe por instinto — 2,5 · 5 ·
  15 — passavam mesmo com a implementação ingênua. Foi assim que o defeito
  entrou, e um punhado de casos escolhidos à mão o deixaria entrar de novo.

  QA-05 é novo e bloqueia: o formulário aceita gateway zero e o motor o rejeita,
  com uma mensagem que acusa erro de unidade quando o usuário digitou zero de
  propósito. Confirmei contra o engine de referência que o port está fiel — o
  defeito é da validação do formulário, e é assimetria com a margem, que no
  mesmo formulário bloqueia zero corretamente.

  QA-06 apareceu ao investigar o QA-05 e não bloqueia: o port aceita `cmv = 0`
  enquanto o engine aborta. O comportamento do port é o correto para o negócio
  (produto digital), mas contradiz o contrato de autoridade declarado no próprio
  cabeçalho do módulo. É dívida de documentação, herdada da 29.35.

notes: >-
  CONCERNS, com QA-01 marcado blocking.

  O trabalho de engenharia aqui está acima da média da sequência: a extração da
  função, a validação por mutação e a reancoragem executando o engine de
  referência são três decisões que o caminho fácil teria dispensado. A prova de
  que as falhas da API são pré-existentes foi feita com diff, não com alegação —
  e isso importa depois de uma auditoria que apontou justamente inferência
  passando por verificação.

  QA-01 não desmerece isso, mas precisa ser corrigido antes do merge: são duas
  linhas, e o defeito estreia visível para o usuário no primeiro deploy em que
  a aba finalmente funcionar. Entregar o destravamento da aba junto com um campo
  que exibe `7.000000000000001` desperdiçaria a primeira impressão que esta
  entrega existe para consertar.

  Nota pessoal de processo: o defeito que a 29.38 corrige passou por dois gates
  meus. Nos dois, li o comentário do autor que dizia "preserva o que já existe
  quando o PUT não manda o campo" e verifiquei que os quatro campos citados
  estavam protegidos — sem perguntar quantos campos existiam ao todo. A lição é
  que revisar a afirmação do autor não é o mesmo que revisar o código, e o
  padrão repetido quinze vezes é onde essa diferença se esconde.
