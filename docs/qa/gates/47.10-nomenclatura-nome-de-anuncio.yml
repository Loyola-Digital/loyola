achados_abertos:
  - id: QA-4710-01
    severidade: low
    o_que: >
      O aviso do NN no gerador dispara quando o valor digitado difere da
      SUGESTÃO, não quando está ocupado: digitar 05 com 03 livre mostra
      "próximo livre é 03; um NN já usado é recusado ao salvar" mesmo com 05
      livre. A API decide certo (409 só se ocupado); só a mensagem é imprecisa.
    recomendacao: "expor os NN usados em /ads/proximo (ou um /ads/seqs) e avisar só quando o digitado está na lista."
  - id: QA-4710-02
    severidade: info
    o_que: "Q4 (sigla de perpétuo) e Q5 (lançamentos como registro) seguem no default; a aba Valores fixos de Nome Ads avisa. Sem DELETE de anúncio (não pedido)."
  - id: QA-4710-03
    severidade: info
    o_que: "AC8, AC10 e AC12 (tela) só têm prova pelo roteiro visual — componente .tsx sem runner."

