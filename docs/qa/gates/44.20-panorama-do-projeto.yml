summary: >
  A story entrega as oito ACs e a disciplina do epic está respeitada onde mais
  importa: o serviço **não recalcula cadeia nenhuma** — chama
  `montarPayloadCadeiaCac` por etapa e repassa `principal` com `motivo`/`message`
  intactos. A regra 7.6 não foi violada; não há uma única divisão de taxa no
  arquivo novo.

  A validação contra produção é o ponto alto e foi além do exigido: `spendLonga`
  bate com `agregado.spend` da cadeia com delta **0,0000** nas seis etapas com
  gasto, e a revisão reconferiu o gross-up por fora, contra o SQL cru no MESMO
  instante — razão 1,1383 nas duas etapas do BBE e ~1,137 nas cinco órfãs. O
  imposto é aplicado uma vez, e o `round` por (campanha, dia) é o que faz os
  centavos fecharem.

  As cinco reversões do @dev foram reexecutadas e continuam derrubando a suíte.
  E o defeito que ele achou sozinho — a pendência `semDados` de mensagem vazia
  mandando conectar fonte já conectada — é o QA-4414-02 do gate anterior
  materializado; a correção pelo desempate de `message` está certa e travada nos
  dois sentidos.

  **O que segura o gate é uma medição que faltou, e o número é grande:** a AC7
  foi medida só no caminho default. Com `?fresh=1` — que é query param declarado
  da rota (AC6) e da doc — o maior projeto vai a **15.137 ms**, 3× o teto de 5 s
  da própria AC7. Ver QA-4420-01.

