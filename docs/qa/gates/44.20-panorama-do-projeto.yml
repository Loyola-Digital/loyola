issues:
  - id: QA-4420-01
    status: >
      RESOLVIDO — caminho (a) escolhido pelo dono do produto em 27/08: o
      panorama deixou de propagar `fresh`. O param saiu dos dois schemas de rota,
      de `OpcoesDoPanorama`, do `llms.txt` e da `description` da tool, com a nota
      de para onde ele foi (a etapa). Re-medido: DG & CPDF em **667 ms**.
      Travado por teste que afirma sobre o `maxAgeMs` que chega ao
      `getFreshSalesDaily` — não sobre tempo, que em teste é ruído. Provado por
      reversão: repondo a propagação, 1 failed com "o panorama repassou
      maxAgeMs: 0".
    severity: high
    category: performance
    title: "A AC7 foi medida só sem `?fresh=1`. Com ele, o maior projeto leva 15,1 s — 3× o teto que a própria AC define"
    file: packages/api/src/services/panorama-do-projeto.ts:395
    story: "44.20 (AC6, AC7)"
    reproduced: true
    blocking: true
    description: >
      A AC6 declara `?fresh=1` entre os query params da rota, a AC8 mandou
      documentá-lo, e a entrada do `llms.txt` o anuncia ao agente. A AC7 exige
      medir o tempo do maior projeto. **A medição do @dev cobriu só o caminho
      default.**

      Medido nesta revisão, contra produção, os dois caminhos lado a lado:

        projeto        etapas   sem fresh   com fresh=1
        DG & CPDF        12       676 ms     15.137 ms     ← 3,0× o teto
        BBE               6       494 ms      1.275 ms
        PP                2       227 ms        259 ms
        FZ & MFB          1       259 ms        251 ms
        Lyrio             1       106 ms         97 ms

      A causa é estrutural, não um pico: `opts.fresh` é repassado a **todas** as
      N chamadas de `montarPayloadCadeiaCac` (`:395`), e em cada etapa paga ele
      zera o `maxAge` do `getFreshSalesDaily`, forçando recompute ao vivo. O
      panorama multiplica por N a operação mais cara do payload da cadeia — e N
      é exatamente o que cresce no projeto grande.

      A assimetria confirma: Lyrio e FZ & MFB não mudam (uma etapa, e a do Lyrio
      é `familia: null`, que retorna antes de tocar em vendas); DG & CPDF, com
      12 etapas, multiplica por 22.

      ⚠️ **Não é só orçamento estourado.** 15 s é faixa de timeout de gateway e
      de cliente MCP. O agente Inácio é o consumidor declarado desta rota, e
      `?fresh=1` está anunciado a ele na doc como se fosse barato. Uma rota que
      responde ou não conforme o projeto é pior que uma rota lenta.
    suggestedFix: >
      Três caminhos, e a escolha é do @po porque mexe no contrato da AC6:
      (a) **Não propagar `fresh` no panorama** — ele é a varredura; a leitura
      profunda com dado fresco é `/cadeia-cac` por etapa, que já tem o parâmetro
      e custa o de uma etapa só. É o menor contrato e o mais coerente com "o
      ponto de partida diário".
      (b) Propagar só para as etapas `noAr` (as que gastaram na janela curta) —
      no DG & CPDF isso seria 0 de 12 hoje.
      (c) Manter e declarar o custo na doc e na tool, com o número medido.
      Em qualquer um dos três, a AC7 exige que a medição fique **registrada na
      story** — o que esta revisão já fez.

  - id: QA-4420-02
    severity: medium
    category: contrato
    title: "`totais.spendCurta` exclui as campanhas órfãs, e nada declara isso"
    file: packages/api/src/services/panorama-do-projeto.ts:470
    story: "44.20 (AC2, AC4)"
    reproduced: true
    blocking: false
    description: >
      `totais.spendCurta`/`spendLonga` somam **só as etapas**. As órfãs ficam de
      fora, por construção — e é uma decisão defensável (elas não pertencem a
      etapa nenhuma). O problema é que nem a forma da resposta na AC2, nem a
      entrada do `llms.txt`, nem a `description` da tool dizem isso.

      No BBE, medido hoje: `totais.spendCurta` = 6.677,63 enquanto o projeto
      gastou ~R$ 13 a mais, em 5 campanhas órfãs. O consumidor que publicar
      "investimento do BBE na semana" a partir de `totais` subnotifica.

      O valor é irrelevante e o sinal não é — é o argumento da própria AC4
      ("valor irrelevante, sinal relevante"). E o campo vizinho
      `campanhasComGasto` teve o cuidado de declarar em comentário que conta só
      as vinculadas; `spendCurta` não teve.
    suggestedFix: >
      Uma linha na entrada do `llms.txt` e no comentário de `totais`: os totais
      são das ETAPAS; some `campanhasOrfas` se quiser o gasto do projeto. Ou um
      campo `spendOrfas` ao lado, que remove a pergunta.

  - id: QA-4420-03
    severity: low
    category: correctness
    title: "Campanha vinculada a duas etapas seria contada duas vezes nos totais — 0 casos hoje, mas nada impede"
    file: packages/api/src/services/panorama-do-projeto.ts:470
    story: "44.20 (AC2)"
    reproduced: false
    blocking: false
    description: >
      `totais.spendCurta` e `campanhasComGasto` somam **por etapa**, sem
      deduplicar `campaignId`. Se a mesma campanha estiver em `campaigns` de duas
      etapas do projeto, o gasto dela entra duas vezes no total — e a etapa
      individual continua certa, que é o que torna o defeito difícil de ver.

      Medido em produção nesta revisão: **0 campanhas** em mais de uma etapa de
      funil vivo, nos 5 projetos. É defeito latente, não ativo — por isso `low`.

      Mas o vínculo é um `jsonb` editado pela UI, sem constraint de unicidade
      entre etapas: nada no banco impede que apareça amanhã. E o painel
      já tem histórico dessa classe — a dedup por (campanha, dia) do daily bulk
      (`feedback_meta_daily_bulk_double_count`) existe porque a duplicata nasceu
      em produção.
    suggestedFix: >
      Somar os totais sobre um `Map<campaignId, spend>` em vez de sobre as
      etapas, ou declarar na doc que os totais podem contar a mesma campanha
      duas vezes quando ela está em duas etapas.

  - id: QA-4420-04
    severity: low
    category: teste
    title: "O teste de paridade das rotas não prova paridade contra dados reais"
    file: packages/api/src/__tests__/panorama-do-projeto.test.ts:196
    story: "44.20 (AC6, T1)"
    reproduced: false
    blocking: false
    description: >
      T1 compara os dois payloads sobre o fake de banco. Ele prova que as duas
      rotas chamam a mesma função com os mesmos argumentos — que é a divergência
      que a AC6 teme — mas com um fake que ignora predicados, e com uma fixture
      NOVA por rota (necessário, porque o fake consome a fila).

      É o mesmo padrão da 44.9, então não é regressão de disciplina. Fica
      registrado porque o @dev declarou honestamente, nas Dev Notes, o que o fake
      não prova (IDOR, `archivedAt`), e esta é a terceira coisa da mesma família.
    suggestedFix: >
      `scripts/mede-panorama.ts` já roda contra produção; acrescentar a ele a
      chamada das DUAS rotas via `app.inject` com banco real fecharia a última
      lacuna, sem tocar na suíte.

