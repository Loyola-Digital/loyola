resolucaoDoDebito:
  decisao: "(a) não propagar `fresh` no panorama — dono do produto, 2026-08-27"
  motivo: >
    O panorama é a varredura: ele diz QUAIS etapas merecem leitura profunda.
    Forçar recompute de venda em todas elas multiplicava por N a operação mais
    cara da cadeia para responder uma pergunta que não precisa de dado ao vivo.
    Quem quer venda recomputada abre a etapa em
    `/stages/{stageId}/cadeia-cac?fresh=1` e paga o custo de UMA.
  antes: "DG & CPDF 15.137 ms com `?fresh=1`"
  depois: "DG & CPDF 667 ms — o param não existe mais na rota"
  travadoPor: "packages/api/src/__tests__/panorama-do-projeto.test.ts — asserção sobre `maxAgeMs`, provada por reversão"
  contratoAlterado: >
    ⚠️ A AC6 lista `?fresh=1` entre os query params. Ele foi REMOVIDO das duas
    rotas do panorama. Fastify ignora query param desconhecido, então um chamador
    antigo continua recebendo 200 — só não força mais o recompute. A doc e a tool
    declaram a ausência e para onde o parâmetro foi.
