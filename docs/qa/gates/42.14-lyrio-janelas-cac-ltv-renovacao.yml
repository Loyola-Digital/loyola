  - id: REL-001
    severity: low
    category: reliability
    description: 'Com a consulta da Meta em erro (`useCampaignDailyInsightsBulk`), o `data` fica `undefined` para sempre. O card Investimento (Meta), o CAC Meta e o consolidado ficam "—" SEM memorial de causa, como se estivessem carregando. Antes da story, o mesmo erro virava "R$ 0" (`metaDaily28 ? … : 0`), então houve melhora. O PO-D4 só cobre o RevenueCat, e o REL-001 da 42.13 trata o mesmo padrão no bloco Meta.'
