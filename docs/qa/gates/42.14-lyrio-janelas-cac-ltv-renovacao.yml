top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O fio da tela não tem teste: o ARGUMENTO `days` de cada consulta pode virar 28, ou sumir, sem nenhum teste cair. Mutações aplicadas uma a uma no clone descartável, cada uma contra a suíte INTEIRA do web (2.036/2.036 em ebd460aa; 2.041/2.041 em 61890deb, com `--testTimeout=60000`): W1 `lyrio-stage-view.tsx:189` Meta do filtro com 28 → SOBREVIVE (o card Investimento diria "segue o filtro de 90 dias" com 28 dias, e o ROAS e a Margem misturariam janelas, que é o defeito que a story corrige) · W2 `:215` `diasDaConsultaDoGoogle(days, 28)` → `days` → SOBREVIVE (com filtro de 7 dias, o CAC Google de 28d fixo somaria só 7 dias) · W3 `:224` receita do Resumo com 28 → SOBREVIVE (mesma mistura do W1) · W4 `:227` novos clientes com 28 → SOBREVIVE · W5 `revenuecat-overview-block.tsx:46` receita do Overview com 28 → SOBREVIVE · W6 `lyrio-stage-view.tsx:264` pagantes do filtro com 28 → SOBREVIVE (o eco protege contra o número errado, mas os CACs do filtro, as renovações e o LTV somem em silêncio) · L13 `:686` aviso de não classificado tirado da tela → SOBREVIVE. Os testes jsdom mocam os hooks sem olhar o `days` (`useRevenuecatReceita: () => receita`), e o teste de fio por `readFileSync` de `vendas-por-canal-lyrio.test.ts` só amarra `googleFiltro`/`google28` e o `days` da tabela "Por canal". Na primeira rodada, W2–W5 pareceram cair; era o timeout conhecido de 5 s do `vturb-tabela`. Com `--testTimeout=60000`, os sete passam. Hoje o código está certo.'
    recommendation: 'No teste de fio de `lib/utils/__tests__/vendas-por-canal-lyrio.test.ts`, amarrar por regex as sete chamadas: `useCampaignDailyInsightsBulk(..., days)` (a do filtro) e a de `28`; `diasDaConsultaDoGoogle(days, 28)`; `useRevenuecatReceita(..., days, connected)` e `useRevenuecatNovosClientes(..., days, connected)` no Resumo e no Overview; `useRevenuecatPagantesPorCanal(..., days, connected)` e a de `28`; e `{avisoDoLtv && (` dentro do bloco do LTV com `role="alert"`. Defesa extra, barata: conferir o eco `dados.days === ctx.diasDoFiltro` na receita (`cardsDoResumo`, `cardsDoOverview`) e nos novos clientes (`cardDeNovosClientes`), como `daJanela` já faz nos pagantes. As duas rotas já ecoam `days`.'
    owner: '@dev'
    status: resolved
    resolved_in: '41a2b82e'

  - id: REQ-001
    severity: medium
    category: requirements
    description: 'O DoD pede "Números conferidos em produção (somente leitura) com o SQL exato das rotas". Ninguém fez essa conferência. O @dev não lê produção, e a leitura do @qa (banco e API do RevenueCat) é bloqueada pelo classificador. Não há medição em produção de novos pagantes por canal, renovações, LTV por plano, não classificados nem do tempo da consulta (PERF-001). Também seguem pendentes a validação visual e as `[FALTA]` não bloqueantes: o fuso da conta do Google Ads (AC4f) e se os 28 dias do overview incluem hoje (P8).'
    recommendation: 'O Danilo (ou alguém com leitura autorizada) roda a rota `pagantes-por-canal?days=28` e `?days=90` contra produção, ou o SQL de `consultaDePagantesPorCanal`/`consultaDoLtvPorPlano` pelo `PgDialect`. Conferir: os totais por canal contra a tabela "Por canal" (as pessoas novas ≤ compradores); `ltv.naoClassificado` (esperado: vazio ou só ids que pedem decisão); a soma da receita dos três planos mais fora e não classificados contra a venda paga da janela; o tempo da consulta. Depois, a validação visual dos dois blocos com o filtro em 7, 28 e 90 dias.'
    owner: 'Danilo / @devops'
    status: open
    note_iteracao_1: 'Pendente de EVIDÊNCIA. A sonda read-only `scratchpad/probe/conferencia-42.14.mjs` está pronta. Conferi que ela abre a sessão com `default_transaction_read_only = on`, imprime só agregados (nada de `app_user_id`, chave, e-mail ou IP) e roda o código COMPILADO do clone. O `dist` é de 16:55, a hora do commit `41a2b82e`; rodar `tsc` na API antes da sonda garante que é o mesmo código. Ela cruza os resultados com a `vendas-por-canal` da 42.12 e mede os tempos (PERF-001). A conferência fecha quando a saída mostrar: os dois cruzamentos com "ok"; `naoClassificado` vazio, ou só com ids que pedem decisão; e os tempos.'

