  iteracao_3: 'Re-review sobre e8ee5af3 (diff 96cd1f95..e8ee5af3: 8 arquivos, 225+/30−; 6 de código e testes), na worktree `wt-4214`, sem editar código. REVISÃO: PERF-001, REL-002 e D34 conferidos linha a linha (ver as notas dos itens). Semestral: `premium_halfyearly` não colide com `premium_yearly` (o 9º caractere é ''h'' contra ''y''); a ordem Mensal, Trimestral, Semestral, Anual vale na API e no web; o `promocao: null` gera um ramo SQL sem o `OR`; e o tipo `PlanoDoLtv` e o espelho do web incluem `semestral`. Contrato: a rota é nova nesta PR, então não há bump (fica em 51). SONDA: li os três scripts, todos read-only e só com agregados; comparei `s.json` × `s2.json` por script (derivadas idênticas nas três janelas; tempos; `atributosDesde`; `naoClassificado`; cruzamentos). MUTAÇÕES PRÓPRIAS, diferentes das do @dev (aplicar → suíte → `git checkout`, `git status` vazio depois de cada uma; harness em `scratchpad/qa4214-it3/mutar.sh`): PERF-001: Q1 `NOT LIKE ''PAYWALL_IMPRESSION''` cai; Q2 exclui também `RENEWAL` e cai (composição das derivadas); Q3 exclui também `CANCELLATION` e cai; Q4 retira o filtro em memória e cai no banco falso de `revenuecat-janelas-42-14`; Q5 `coalesce` no `event_type` SOBREVIVE, equivalente. REL-002: R1–R6 caem. Semestral: Sa prefixo `premium_half` cai (o negativo `half_yearly`); Sb ramo sem promoção devolvendo ''anual'' cai em 3; Sc Semestral depois do Anual na constante cai em 5; Sd tira o `r.promocao != null` do TS e SOBREVIVE, equivalente (o `productId` já não é null ali); Se inventa a promoção `six_month` e cai; web: Wa ordem cai, Wb card "—" quando a API não manda o plano cai em 3, Wc rótulo cai. TEST-003: T3a (M24d) e T3b caem. Total nas três correções: 19 (Q1–Q5, R1–R6, Sa–Se, Wa–Wc), 17 caem e 2 são equivalentes; mais T3a/T3b, que caem. GATES: tsc da API EXIT 0; eslint da API com 0 erros e 1 aviso antigo (`lp-campaigns.ts:57`); vitest da API (`--testTimeout=60000`) 5.170/5.180, com as 10 falhas da baseline (`funnel-stages-lead-inputs` 3, `instagram-routes` 1, `instagram` 1, `projects` 3, `schema` 2); vitest do web 2.055/2.055 em 148 arquivos. Não refiz o `next build` nem o tsc do web: não toquei no web, e o @dev registra os dois verdes nesta worktree. ESCOPO: os 6 arquivos de código estão na lista autorizada (`utils/**`, `__tests__/**`, `lib/**`), e o commit leva `[scope-override]`.'
  iteracao_1: 'Re-review sobre 41a2b82e (20 arquivos, 620+/117−), no meu clone descartável `qa4214`. FIO: W1–W6, L13 e M38 refeitas com `--testTimeout=60000`, e cada uma derruba exatamente o teste do item no `fio-da-tela-lyrio-42-14.test.ts` ou no `resumo-mobile-lyrio.test.ts` (confirmado pelo nome do teste que falha, não pela contagem). Todas as 52 mutações de regra da iteração 0 foram refeitas: as que não aplicavam mais no texto (M03, M11, M12, M21–M24, M29) foram reescritas no lugar novo, e todas caem. Novas: M24b, que ignora o `agora`, cai; M24c, que lê o `period_type` de outro campo, cai; M24d, que tira o filtro de etapa, SOBREVIVE (TEST-003); N1, o eco ignorado em `naJanelaPedida`, cai em 4 testes; N2–N4, o erro da Meta ignorado no card, no ROAS/Margem e no CAC, caem; N5, o erro da Meta que não chega aos construtores, cai no fio. EXTRAÇÃO: diferencial descartável (`scratchpad/qa-diferencial-4214.test.ts`, fora do repo): a composição de 61890deb, copiada (Drizzle `select` + `eq`), contra `metricasDerivadasDaEtapa` e `pagantesPorCanalDaEtapa` de 41a2b82e, no MESMO PGlite + `drizzle-orm/pglite`. São 5 sementes × 700 eventos (10 tipos, `period_type` TRIAL/NORMAL/INTRO/PROMOTIONAL/trial/nulo/ausente, payload `{}`, 5% sem `event_at`, 5% sem usuário, 10% em outra etapa) e janelas sem `days`, 1, 7, 28, 90 e 365. Resultado: o JSON é idêntico nas 55 comparações, e `diasDaJanelaEmSp` = `businessToday` + `inicioDaJanela` em 4 instantes × 5 janelas. Controles: `datas[1]` no `serieDesde` derruba o diferencial, e trocar `assinaturaDesde`/`atributosDesde` na cópia antiga também, então ele não é vazio. Uma diferença ENCONTRADA, só a favor: com `period_type` NÃO texto no payload (um número), a rota antiga quebrava (`toUpperCase is not a function`, HTTP 500); a nova lê pelo `->>` e trata como texto. O RevenueCat documenta o campo como texto, então isso não muda nada no dado real. FORMA: o `pagantes-por-canal` devolve as mesmas 7 chaves, conferidas pelo teste de fio e pelo diferencial, e `metricas-derivadas` devolve a mesma resposta. O contrato fica em 51, porque `contract.ts` não está no diff. SUÍTES: web 2.054/2.054 em 148 arquivos; API 5.164/5.174, com as 10 falhas da baseline nos mesmos 5 arquivos. tsc da API 0; eslint da API (0 erros, 1 aviso antigo) e do shared limpos; `next lint` limpo. `next build` (webpack): 43/43 páginas, EXIT 0. A primeira tentativa falhou no `next/font` do Google porque apaguei o `.next` (rede), e a segunda passou. tsc do web depois do build: 0. ESCOPO: os 20 arquivos estão na lista autorizada (`api/src/utils/sale-date.ts` está em `utils/**`), e o commit leva `[scope-override]`. SEGURANÇA: `memorialDoErroDaMeta` mostra só a mensagem da rota de tráfego; a sonda é read-only e só imprime agregados.'
  code_review: 'Li o diff `origin/main...61890deb` inteiro: 32 arquivos até ebd460aa (4.843+/605−) e mais 10 no AC7 (583+/147−). API: `/receita` e `/novos-clientes` usam `businessToday` + `inicioDaJanela` (dias de SP enviados como start/end_date; o RevenueCat conta em UTC, declarado no memorial), `getStage` antes de qualquer leitura, `currency=USD` conferida na volta, `value` não numérico é erro, falha → `{ error, details, causa }` com 429/502 e nunca 200 com null. `metricas-derivadas` ganha `getStage` (AC2e), a janela por `instanteDoInicioDaJanela` e o eco `days`/`desde` (null sem janela). `pagantes-por-canal`: uma linha por pessoa sem o id, `row_number` só sobre os eventos pagos, primeiro pagamento da série inteira, renovação = `RENEWAL` pago com `ordem_pago > 1`, canal pela origem mais antiga (`min(event_at)`) e empate → `conflito`. AC7: `REGRA_DOS_PLANOS` + `FORA_POR_DECISAO` numa constante; SQL por `left(col, n) = prefixo` (sem LIKE, logo sem curinga) e igualdade exata nas promoções; `GROUPING SETS` com `count(DISTINCT app_user_id)` POR CLASSE. Web: `declararJanela` é a fonte única (AC2a); `estadoDaFonte` testa a falha antes da ausência; Receita, ROAS e Margem em erro ficam "—" com a causa, sem cair para os 28 dias; só o 404 da rota (API anterior) leva o trio aos 28 dias, declarado e em âmbar; as Conversões só leem numerador com o eco de 28 dias; os CACs e o LTV só valem com o eco da janela pedida (`daJanela`). Card `forwardRef` + `{...rest}` + `tabIndex`, provider local no Overview.'
  scope: 'Todos os 33 arquivos do diff estão em `components/funnels/**`, `docs/stories/*` ou na lista de scope-override (D20, D31, D32): `lib/**`, `routes/revenuecat.ts`, `services/revenuecat.ts`, `utils/**`, `__tests__/**`, `shared/src/contract.ts`, `web/vitest.config.ts`. `routes/google-ads-analytics.ts` e `services/google-ads.ts` NÃO foram tocados (PO-07). Os 6 commits que tocam a lista de override levam `[scope-override]`; os 9 só de story, não.'
  api_contract: 'v51 sobre a main em 50 (`28f84781`, conferida com `git ls-remote`). Três rotas novas (`/receita`, `/novos-clientes`, `/pagantes-por-canal`), mais o `?days=` e o eco em `metricas-derivadas` e a `causa` nas falhas. A linha de histórico descreve tudo, inclusive o `ltv`. O AC7 não sobe de novo: a rota é nova nesta mesma PR (um bump por PR, PO-D1). Fallback com API antiga: 404 da rota → oculto/28 dias declarados; sem eco → "série inteira" e Conversões "—" (testado).'
  unit_tests: 'Web: 2.041/2.041 em 147 arquivos (61890deb) e 2.036/2.036 (ebd460aa). `vitest list` coleta os dois `.test.tsx` novos de `components/funnels` (9 testes jsdom), e NÃO coleta `stage-creative-performance-table` nem `stage-lead-inputs` (PO-13). API: 5.162/5.172; as 10 falhas são as da baseline, nos mesmos 5 arquivos, e rodam iguais em `origin/main` (10 falhas, 52 passam). MUTAÇÕES PRÓPRIAS (aplicar → suíte → `git checkout`, `git status` limpo; lista e resultado em `scratchpad/qa-mutacoes-*.txt`): 38 nas regras até ebd460aa → 37 caem (M38 sobrevive, TEST-002). Entre elas: numerador da Conversão na janela do filtro (M01), sem o eco dos 28 dias (M02), derivadas sem janela (M03), Pagante por eventos + pessoas (M04), SQL contando eventos (M05), novo = qualquer pago (M06), renovação com o primeiro pagamento (M07, M08), empate → Meta (M09), `max` no lugar de `min` (M10), erro → 28 dias ou zero ou ausência (M11–M18), eco ignorado (M19–M21), régua UTC ou em horas (M22–M26), consolidado sem orgânico/sem atribuição ou sem conflito (M27, M28), CAC 28d com o investimento do filtro (M29), CAC por renovações (M30), US$ 0 pago (M31), sem provider local, sem `ref`, sem `{...rest}`, sem `tabIndex` (M32–M35), âmbar em quem segue (M36). Mais 15 no AC7 (61890deb): 14 caem, entre elas os testes 5 a 8 (L05a/b, L06, L07a/b, L08a), a equivalência TS × SQL por caixa (L08b) e o PII (L12). L13 sobrevive (fio, TEST-001). Mais 6 de fio (W1–W6), que sobrevivem (TEST-001).'
