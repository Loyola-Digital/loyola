    resolved_in: '41a2b82e'

  - id: TEST-003
    severity: medium
    category: tests
    description: 'Re-review: na extração, o filtro de etapa da consulta de `metricas-derivadas` passou a ser SQL de texto (`consultaDosEventosDasDerivadas`, `utils/metricas-revenuecat.ts`: `WHERE ${c.stageId} = ${stageId}`). Trocar esse filtro por `${stageId} = ${stageId}`, que é sempre verdadeiro, SOBREVIVE às suítes da story (`revenuecat-janelas-42-14`, `pagantes-lyrio`, `instante-da-janela-4213`: 91/91). Com a mutação, a rota somaria os eventos de TODAS as etapas de TODOS os projetos nos cards do Overview: churn, trials, conversões. O `getStage` protege o acesso, mas não o escopo da consulta. O teste da composição no PGlite (`pagantes-lyrio.test.ts:405`) não semeia evento de outra etapa, e o fio da rota (`revenuecat-janelas-42-14`) responde o mesmo para qualquer SQL. A lacuna já existia antes da extração, com o `eq()` do Drizzle e o banco falso, mas a extração é o momento de fechá-la. O meu diferencial descartável (10% dos eventos em outra etapa) derruba a mutação nas 5 sementes. Hoje o código está certo.'
    recommendation: 'No teste de `metricasDerivadasDaEtapa` em `pagantes-lyrio.test.ts`, inserir eventos de OUTRA etapa (um trial e um EXPIRATION pago) e afirmar que os números não mudam, como o teste "fora do escopo: outra etapa" já faz nos pagantes.'
    owner: '@dev'
    status: resolved
    resolved_in: '96cd1f95'
    note_iteracao_3: 'Conferido em e8ee5af3. A M24d (`WHERE ${stageId} = ${stageId}`) derruba o teste de composição de `metricasDerivadasDaEtapa`. A mesma troca em `consultaDoInicioDosAtributos` derruba 3 testes, inclusive o fio da Jornada.'

  - id: REL-002
    severity: medium
    category: reliability
    description: 'Achado do @dev na sonda de 27/10: `atributosDesde` = 2026-08-06, quando a 42.13 tinha medido 06/10. A causa são 26 eventos de PAYWALL com `event_at` de agosto e setembro, gravados de 14 a 25/10 já com os atributos do dia em que chegaram. Com o filtro em 90 dias, a tela diria "cobertura desde 06/08" e esconderia que a Meta só tem atribuição desde outubro: os novos pagantes da Meta são 70 em 28 E em 90 dias.'
    recommendation: 'Só contar, na cobertura, o evento entregue no prazo.'
    owner: '@dev'
    status: resolved
    resolved_in: 'e8ee5af3'
    note_iteracao_3: 'Conferido. `created_at <= event_at + $n::interval`, com `$n` = `ATRASO_MAXIMO_DA_COBERTURA` (''7 days''), que o drizzle passa como parâmetro com cast; o PGlite executa e o plano mostra `(event_at + ''7 days''::interval)`. `created_at` é `NOT NULL DEFAULT now()` e só o webhook grava (`onConflictDoNothing`), então não há reprocessamento que reescreva `created_at`. Consumidores: `pagantesPorCanalDaEtapa` (42.14), `/jornada` e `/vendas-por-canal` (42.12/42.13). Os três voltam a 06/10, que é a semântica que a 42.12 (AC6) e a 42.13 mediram, então o efeito é o pretendido. A 2ª rodada da sonda dá `atributosDesde` 2026-10-06 nas três janelas, e os novos pagantes por canal ficaram idênticos. Mutações próprias, todas caem: R1 (`<` em vez de `<=`), R2 (direção invertida), R3 (`7 hours`), R4 (`purchased_at` no lugar de `event_at`: caem 3), R5 (`6 days`) e R6 (`OR` no lugar do `AND`: caem 3). Caso de borda sem efeito na Lyrio: uma etapa em que TODO evento com atributo chegue com mais de 7 dias de atraso fica com `atributosDesde` null.'

  - id: PERF-002
    severity: low
    category: performance
    description: 'A sonda mostra `pagantes-por-canal` de 259–428 ms (1ª rodada) para 450–664 ms (2ª), cerca de +190 a +236 ms nas três janelas. A story diz "sem mudança de código: é a rede". Mas houve mudança: `consultaDoInicioDosAtributos`, que essa rota executa, ganhou o prazo de entrega (REL-002). O `min(event_at)` vira um Index Scan em `(stage_id, event_at)` com LIMIT 1, que para no primeiro evento que passa no filtro. Antes, os eventos atrasados de 06/08 paravam a varredura em agosto; agora ela percorre todo o paywall de junho até 06/10. Reproduzi o mecanismo num PGlite sintético com 240 mil eventos (`scratchpad/qa4214-it3/bench-atributos.mjs`): de 31 para 77 ms, com 101 mil para 211 mil linhas removidas pelo filtro e o mesmo plano. O custo cai também na `/jornada` e na `/vendas-por-canal`. Não é regressão em relação à 42.13: é o custo de antes dos eventos atrasados chegarem (14/10). E o ganho de ~1,1–2,2 s × 2 das derivadas cobre com folga.'
    recommendation: 'Corrigir a frase da story (a variação não é só rede). Se a cobertura pesar no futuro: um índice parcial de expressão sobre os eventos com atributo, ou memorizar o `atributosDesde` por etapa, que só muda quando chega evento novo. Não precisa ser agora.'
    owner: '@dev'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: 'O memorial de TODO card de LTV (`packages/web/lib/utils/aquisicao-lyrio.ts:310`) diz "Entra no plano o product_id que começa com o prefixo da família (premium_monthly, premium_quartely, premium_yearly — o partner entra no seu tipo) ou a promoção da mesma duração, pelo nome exato". No card LTV Semestral, a frase não cita `premium_halfyearly`, e o Semestral não tem promoção. O id que entrou aparece logo abaixo, então o número não fica escondido; o texto é que ficou para trás. Detalhe da mesma natureza: o teste obrigatório 1 de `pagantes-lyrio.test.ts` ainda se chama "os três planos", com quatro.'
    recommendation: 'Incluir `premium_halfyearly` na lista e dizer que o Semestral não tem promoção. Opcional: renomear o teste 1.'
    owner: '@dev'
    status: open

