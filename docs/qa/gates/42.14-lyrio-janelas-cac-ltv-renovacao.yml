  security: '`app_user_id` não sai da SQL (agrupa, não seleciona): testado nas duas consultas (L12 cai). A Secret Key não entra na mensagem do `rcFetch`, que é o `details` da resposta (testado com `sk_segredo`). O log do `warn` de conflito leva só `stageId` e a contagem. `metricas-derivadas` fechou o IDOR da PO-06 (`getStage`, com teste de 404 sem ler os eventos). 429 e 403 do RevenueCat são repassados como `causa`, e só o 429 sai como HTTP 429.'
  acceptance_criteria: 'AC1 ✓ (9 cards do Resumo + 15 do Overview com memorial; erro com causa; jsdom) · AC2 ✓ (a: fonte única; b: ramo D10 pela sonda, numerador por pessoa; c: viabilidade por card; d: nenhuma razão mistura janelas, UTC×SP declarado; e: `getStage`) · AC3 ✓ (âmbar só em `agora` e `28d fixo` e nos 28 dias da API; título com datas; Overview sem intervalo; sem `period`) · AC4 ✓ (duas janelas; por pessoa; origem mais antiga e empate em conflito; "—" com causa; Google na régua de SP pela `/daily`, fuso da conta declarado) · AC5 ✓ (consolidado com orgânico, sem atribuição e conflito; duas janelas) · AC6 ✓ · AC7 ✓ (a–f; os 10 testes obrigatórios existem, e os 5–8 refeitos por mim caem) · AC8 ✓ (os 6 testes obrigatórios; M07/M08 caem) · AC9 ✓ (com a lacuna de fio do TEST-001) · AC10 ✓ (51, eco, fallback). DoD: conferência em produção e validação visual pendentes (REQ-001).'
