ncial, e `metricas-derivadas` devolve a mesma resposta. O contrato fica em 51, porque `contract.ts` não está no diff. SUÍTES: web 2.054/2.054 em 148 arquivos; API 5.164/5.174, com as 10 falhas da baseline nos mesmos 5 arquivos. tsc da API 0; eslint da API (0 erros, 1 aviso antigo) e do shared limpos; `next lint` limpo. `next build` (webpack): 43/43 páginas, EXIT 0. A primeira tentativa falhou no `next/font` do Google porque apaguei o `.next` (rede), e a segunda passou. tsc do web depois do build: 0. ESCOPO: os 20 arquivos estão na lista autorizada (`api/src/utils/sale-date.ts` está em `utils/**`), e o commit leva `[scope-override]`. SEGURANÇA: `memorialDoErroDaMeta` mostra só a mensagem da rota de tráfego; a sonda é read-only e só imprime agregados.'
