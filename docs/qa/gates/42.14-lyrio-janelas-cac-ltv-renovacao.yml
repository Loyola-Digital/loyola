  - id: PERF-001
    severity: low
    category: performance
    description: 'Cada carga da etapa faz 2 chamadas a `pagantes-por-canal` (filtro e 28 dias), com 4 consultas cada, uma delas o `GROUPING SETS` do LTV. Faz também 2 a `metricas-derivadas`, e cada uma carrega TODOS os eventos da etapa, porque a janela é aplicada em memória (padrão anterior, agora em dobro). A consulta de pagantes preserva o `compradores AS MATERIALIZED` da 42.12, mas não há tempo medido em produção (REQ-001). No RevenueCat: 3 chamadas por carga e 2 por troca de filtro, dentro do limite de 25/min. Medido no código, não no ar.'
    recommendation: 'Medir os tempos na conferência do REQ-001. Se `metricas-derivadas` passar de ~1 s, levar o corte por `event_at` para o `WHERE`, mantendo a série inteira só para o `jaPagou`.'
    owner: '@dev'
    status: resolved
    resolved_in: 'e8ee5af3'
    note_iteracao_3: 'A sonda mediu de 1.252 a 2.339 ms. O @dev cortou por TIPO, não por data: `AND event_type <> ''TEST'' AND event_type NOT LIKE ''PAYWALL%''`. É melhor que a minha recomendação, porque mantém a série inteira para o `jaPagou` sem custo. Conferi a equivalência. (1) `event_type` NULL: o SQL agora o exclui (`NULL <> x` é NULL), mas em memória ele já não contava, porque vira `""`, não casa com nenhum tipo e cai no `e.eventType &&` do `deAssinatura`. Minha Q5 (`coalesce(event_type, '''') <> ''TEST''`) sobrevive, como esperado de um mutante equivalente. (2) Tipos que a conta lê: INITIAL_PURCHASE, RENEWAL, EXPIRATION e CANCELLATION, e nenhum deles é excluído. (3) `serieDesde`/`totalDeEventos`: o predicado em memória é o mesmo do SQL (`LIKE` e `startsWith` são sensíveis a caixa; a string vazia o SQL mantém e a memória descarta, sem efeito na saída). (4) O banco falso de `revenuecat-janelas-42-14.test.ts` ignora o WHERE, então continua exercitando o filtro em memória: a minha Q4, que o retira, cai lá. Em produção, as derivadas foram idênticas nas três janelas entre `s.json` e `s2.json` (churn 19/65/113, trials 100/473/1.032, `serieDesde` 2026-08-10, `totalDeEventos` 4.746), e o tempo foi de 100 a 111 ms. Cerca de 20x mais rápido.'

