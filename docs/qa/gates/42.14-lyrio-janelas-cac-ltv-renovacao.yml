  - id: PERF-001
    severity: low
    category: performance
    description: 'Cada carga da etapa faz 2 chamadas a `pagantes-por-canal` (filtro e 28 dias), com 4 consultas cada, uma delas o `GROUPING SETS` do LTV. Faz também 2 a `metricas-derivadas`, e cada uma carrega TODOS os eventos da etapa, porque a janela é aplicada em memória (padrão anterior, agora em dobro). A consulta de pagantes preserva o `compradores AS MATERIALIZED` da 42.12, mas não há tempo medido em produção (REQ-001). No RevenueCat: 3 chamadas por carga e 2 por troca de filtro, dentro do limite de 25/min. Medido no código, não no ar.'
    recommendation: 'Medir os tempos na conferência do REQ-001. Se `metricas-derivadas` passar de ~1 s, levar o corte por `event_at` para o `WHERE`, mantendo a série inteira só para o `jaPagou`.'
    owner: '@dev'
    status: open

  - id: MNT-001
    severity: low
    category: maintainability
    description: '(a) `lib/utils/aquisicao-lyrio.ts:44`: o JSDoc "Espelha `GET …/revenuecat/pagantes-por-canal`" ficou acima de `ProdutoDoLtv`, depois que os tipos do AC7 foram inseridos entre ele e `PagantesPorCanal`. (b) Os CACs do Google e o consolidado com o Google em erro reutilizam `memorialDoGoogleSemNumero` (`lyrio-google-ads.ts:135`), cuja nota diz "o ROAS e a Margem de Contribuição ficam "—"". No card do CAC, a frase não fala do próprio CAC. A causa está certa; o texto é do outro card.'
    recommendation: '(a) Mover o comentário para cima de `PagantesPorCanal`. (b) Opcional: um parâmetro `dependentes` no `memorialDoGoogleSemNumero`, como o `memorialDoErroDaFonte` já tem.'
    owner: '@dev'
    status: resolved
    resolved_in: '41a2b82e'

  - id: TEST-003
    severity: medium
    category: tests
    description: 'Re-review: na extração, o filtro de etapa da consulta de `metricas-derivadas` passou a ser SQL de texto (`consultaDosEventosDasDerivadas`, `utils/metricas-revenuecat.ts`: `WHERE ${c.stageId} = ${stageId}`). Trocar esse filtro por `${stageId} = ${stageId}`, que é sempre verdadeiro, SOBREVIVE às suítes da story (`revenuecat-janelas-42-14`, `pagantes-lyrio`, `instante-da-janela-4213`: 91/91). Com a mutação, a rota somaria os eventos de TODAS as etapas de TODOS os projetos nos cards do Overview: churn, trials, conversões. O `getStage` protege o acesso, mas não o escopo da consulta. O teste da composição no PGlite (`pagantes-lyrio.test.ts:405`) não semeia evento de outra etapa, e o fio da rota (`revenuecat-janelas-42-14`) responde o mesmo para qualquer SQL. A lacuna já existia antes da extração, com o `eq()` do Drizzle e o banco falso, mas a extração é o momento de fechá-la. O meu diferencial descartável (10% dos eventos em outra etapa) derruba a mutação nas 5 sementes. Hoje o código está certo.'
    recommendation: 'No teste de `metricasDerivadasDaEtapa` em `pagantes-lyrio.test.ts`, inserir eventos de OUTRA etapa (um trial e um EXPIRATION pago) e afirmar que os números não mudam, como o teste "fora do escopo: outra etapa" já faz nos pagantes.'
    owner: '@dev'
    status: open

