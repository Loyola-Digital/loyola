checks:
  code_review: 'Diff de três pontos contra `origin/main` (11 arquivos, só `packages/web` e a story; `packages/api` e `packages/shared` intocados → sem bump de `API_CONTRACT_VERSION`, front não exige API nova). `planejamento-bases.ts` só formata e ordena; `rotuloComBases` omite o grupo sem leitura; `basesMarcadasNaOrdemDaLista` filtra a LISTA. Página: `basesIds: string[]`, hooks antes dos `return` antecipados, seis `useQueries` (sem hook em laço), `etapaPorBase` como mapa (o `useEffect` de reset sumiu sem deixar `stageId` de outra base para trás). Chaves e URLs conferidas uma a uma contra os hooks. AC6: nenhum `setForm`/efeito novo; o `useEffect` dos componentes carrega o formulário só com `form === null`. Imports de valor do shared só por subpath de módulo folha; `StageSalesData` do barrel é `import type`. NBSP: a moeda passa por `textoDeReferencia`/`fmtCurrency`; os testes normalizam ` `. Atenção: a config de eslint da raiz não carrega `react-hooks` — a regra dos hooks foi conferida lendo o código, não por lint.'
  unit_tests: 'RE-GATE (`f81f8fb1`): vitest dos 4 arquivos (3 + fio) 82/82; web completo 127/127 arquivos, 1.776/1.776; W1 → 2 falhas, W2 → 2, W3 → 1, W4 → 1 (isoladas, pelo @qa); X1 chave reordenada → 1; X2/X3/X4 → 0 (TEST-002). Restauração conferida com `shasum -c` e `git status`. GATE ORIGINAL: Rodado no gate: `vitest run` dos 3 arquivos da story 68/68; `vitest run lib/utils/` 109 arquivos / 1.622 testes; `vitest run` completo 126 / 1.762 (com as mutações W1–W4 aplicadas, isto é, a suíte não as vê). Mutações próprias na biblioteca, todas diferenciais: Q1 conversão paga de `bases[0]` em todos os grupos → 1 falha; Q2 `declaracaoDoRealizado(…, false)` → 1; Q3 sem o ramo "lendo" → 1; Q4 `alternarBase` com `push` na lista recebida → 1; Q5 cartão quente/frio com `base:` = `real:` → 3. Fio: W1–W4 → 0 (TEST-001). Restauração conferida com `shasum -c` (4 arquivos OK) e `git status` sem código modificado.'
  acceptance_criteria: 'RE-GATE: AC5 e AC7 agora com teste de fio; AC8 completo (a troca quente/frio derruba também no ponto de chamada). GATE ORIGINAL: AC1 ✓ (`page.tsx:264-277` caixas na ordem de `/bases`; `basesMarcadasNaOrdemDaLista` `planejamento-bases.ts:120`) · AC2 ✓ (`rotuloComBases` `:65`; 26 campos via `gruposDoInput` em `planejamento-inputs-financeiros.tsx:185-198`, inclusive `aria-label`; abas 2/3 em `planejamento-leads-organicos.tsx:107,476` e `planejamento-leads-pagos.tsx:108,505`) · AC3 ✓ (`etapaEscolhidaDaBase` `planejamento-realizado.ts:90`; mapa `page.tsx:148-149`; seletor por base `:280-298`) · AC4 ✓ (`linhasDaDeclaracao` `planejamento-bases.ts:164`; render `page.tsx:307-312`; cabeçalho plural `textoDoCabecalhoDasBases`) · AC5 ✓ no código (`realizadoDoInvestimentoMeta` `planejamento-realizado.ts:280`; cartões `planejamento-inputs-financeiros.tsx:311-314`) — fio sem teste (TEST-001) · AC6 ✓ · AC7 ✓ por leitura (`page.tsx:112-181`) — sem teste (TEST-001) · AC8 ✓ na biblioteca, parcial no fio (a mutação "trocar `.quente` por `.frio`" no call site sobrevive) · AC9 ✓ eslint 0/0 no gate; tsc shared/api/web e `next build` aceitos do registro do @dev, não refeitos.'
  no_regressions: 'Testes da 48.9/48.11/48.13 que afirmavam `(base: X · real: Y)` e o cabeçalho singular foram invertidos com `[48.14 inverte: …]` no título; nenhum outro teste mudou. Suíte inteira do web 1.762/1.762 no gate (a falha por timeout de `vturb-tabela` registrada pelo @dev não se repetiu).'
  performance: 'Leituras por base marcada (AC7) e com as mesmas chaves dos hooks: desmarcar tira só a entrada daquela base do array; os observers das outras são reaproveitados pelo hash da chave e não refazem a leitura. Base sem simulador não pede inputs/orgânicos/pagos (48.13).'
