issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O fio da página e do componente não tem teste. Mutações do gate aplicadas juntas — W1 `gruposDoInvestimentoMeta(bases, "frio")` no cartão "Meta · quente" (`planejamento-inputs-financeiros.tsx:311`); W2 cartão do frio montado como `${rotuloComBases("Meta · frio", …"quente")} (${pct})` (referência ANTES do percentual e com a temperatura trocada, `:312-314`); W3 `comSimulador` a partir de `bases.data?.bases` em vez de `marcadas` (leituras do simulador para todas as bases da lista, `page.tsx:112`); W4 `enabled: !!etapa` sem `podeLerOrigem` (`buyers-origin` para guest, `page.tsx:177`) → `vitest run` do web 126/126 arquivos, 1.762/1.762 testes. O AC8 pede "trocar `.quente` por `.frio` derruba": derruba na biblioteca (M3 do @dev), não no ponto de chamada. O AC7 inteiro (leituras só das marcadas, mesmas chaves dos hooks) e a guarda de guest só têm leitura de código como prova.'
    resolution: 'Fechado no `f81f8fb1`: `planejamento-bases-fio.test.ts`. Re-gate: W1 → 2 falhas, W2 → 2, W3 → 1, W4 → 1, cada uma aplicada isolada.'
    recommendation: 'Criar `packages/web/lib/utils/__tests__/planejamento-bases-fio.test.ts` no padrão dos `*-fio.test.ts` existentes (readFileSync do fonte + regex), afirmando: (1) o cartão "Meta · quente" chama `gruposDoInvestimentoMeta(bases, "quente")` e o "Meta · frio" chama `rotuloComBases(\`Meta · frio (${pctPontos(d.pctMetaFrio)})\`, gruposDoInvestimentoMeta(bases, "frio"))`; (2) na página, `comSimulador` deriva de `marcadas` e os `useQueries` de `/realizado`, `sales-data` e `buyers-origin` mapeiam `marcadas`; (3) o `enabled` do `buyers-origin` contém `podeLerOrigem` e `podeLerOrigem` exclui `guest`; (4) as três chaves copiadas (`planejamento-realizado`, `stage-sales-data`, `buyers-origin`) batem com as dos hooks (ler os dois fontes). Provar com W1–W4: cada uma tem de derrubar pelo menos um teste.'
    status: resolved

  - id: MNT-001
    severity: low
    category: maintainability
    description: 'Três `queryKey` foram copiadas à mão dos hooks (`page.tsx:137`, `:156`, `:175`: `planejamento-realizado`, `stage-sales-data`, `buyers-origin`), com comentário apontando o hook. Hoje batem (conferido contra `use-planejamento-realizado.ts:17`, `use-stage-sales-data.ts:21`, `use-sales-journey.ts:230`); se um hook mudar a chave, o cache entre as duas formas deixa de valer em silêncio. Inputs/orgânicos/pagos já usam as fábricas exportadas.'
    recommendation: 'Exportar fábricas de chave dos três hooks (como `planejamentoInputsQueryKey`) ou cobrir no teste de fio do TEST-001 (item 4). Não bloqueia.'
    status: resolved
    resolution: 'Fechado por teste no `f81f8fb1`: a chave do hook é extraída do fonte e comparada posicionalmente com a da página (mutação X1 do re-gate, chave reordenada → 1 falha). Hooks não tocados.'

  - id: REL-001
    severity: low
    category: reliability
    description: 'Preexistente (48.9/48.11), não introduzido: falha de `sales-data`, `buyers-origin` ou das três leituras do simulador de UMA base vira ausência — o `real:` do ticket/conversão ou o `base:` somem do rótulo e a linha da procedência continua dizendo que "ticket médio … e conversão vêm da etapa X". Só a falha de `/realizado` aparece (AC4, provado). Com várias bases o efeito fica por base, sem vazar para as outras.'
    recommendation: 'Candidato a story futura: levar `isError` das leituras por base para `linhasDaDeclaracao` ("ticket não pôde ser lido"). Fora do escopo desta.'
    status: open

  - id: DOC-001
    severity: low
    category: docs
    description: 'Herdado da 48.13 (DOC-001 de lá): o cabeçalho novo diz que os valores "aparecem entre parênteses ao lado de cada campo" (`planejamento-referencia.ts`, `textoDoCabecalhoDasBases`); o `real:` cobre 4 dos 26 campos, a conversão por canal e agora os 2 cartões quente/frio.'
    recommendation: 'Trocar por "ao lado dos campos que eles cobrem" junto com o TEST-001. Texto, não regra.'
    status: resolved
    resolution: 'Cabeçalho com bases marcadas → "ao lado dos campos que eles cobrem" (`f81f8fb1`). A frase sem base marcada ("Escolha… ao lado de cada campo") ainda generaliza: resto cosmético, não reaberto.'

  - id: TEST-002
    severity: low
    category: tests
    description: 'Novo no re-gate. O teste de fio amarra a `queryKey`, mas não a `queryFn` nem as opções. Nos hooks, chave e URL saem do mesmo `funnelId` (`basePath`); a página copia as URLs. Mutações do re-gate que passaram verdes (82/82): X2 `inputsQ` com a chave da base e a URL `${params.funnelId}` (o planejamento do funil ATUAL apareceria como `base:` e contaminaria o cache da chave da base); X3 `sales-data` com `subtype=main_product` na URL e a chave em `main_product,tmb`; X4 `/realizado` com `retry: 3` (a 48.11 AC9 exige `retry: false`). Hoje as seis URLs e as opções estão certas, conferidas uma a uma.'
    recommendation: 'Numa próxima passada no fio: afirmar que cada `queryFn` dos seis blocos interpola `${b.funnelId}` (e nunca `params.funnelId`), que o `sales-data` pede `subtype: "main_product,tmb"` e que `/realizado` tem `retry: false`. Não bloqueia.'
    status: open

