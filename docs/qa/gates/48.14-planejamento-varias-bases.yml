status_reason: 'A regra está toda em `lib/utils/planejamento-bases.ts` e é provada: cinco mutações próprias na biblioteca (contaminação entre bases, aviso sem simulador, ramo "lendo", lista mutada, `base:` vazando no cartão quente/frio) derrubam o teste dedicado a cada uma. O fio não tem teste: trocar `"quente"` por `"frio"` no cartão, pôr a referência antes do percentual do frio, ler o simulador de TODAS as bases da lista e pedir `buyers-origin` para guest — as quatro juntas deixaram a suíte inteira do web verde (126 arquivos, 1.762 testes). É a segunda vez na mesma página (TEST-001 da 48.13 segue aberto) e o projeto já tem o padrão `*-fio.test.ts`.'
