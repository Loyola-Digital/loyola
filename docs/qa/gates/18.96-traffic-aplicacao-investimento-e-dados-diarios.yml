story_title: 'Etapa de Aplicação — campanhas Meta, cards de investimento e custo, e "Dados diários"'
gate: CONCERNS
status_reason: 'Re-gate (iteração 2) sobre 61607ab. O QA fix 1 fechou REL-001, DATA-001, DATA-002 e TEST-001, e fechou o REQ-001 fora da faixa das 21h às 24h de Brasília. Aplicações e vendas usam a régua do shared (inicioDaJanela + businessToday), e o web marca "—" em todo dia sem cobertura da Meta. Resta o REQ-002 (medium): a cópia privada de dateRangeFromDays em meta-insights-cache.ts:79 ainda calcula o "hoje" em UTC. Das 21h às 24h de Brasília, o /campaign-daily em lote começa um dia depois, e o dia mais antigo da Aplicação volta a mostrar R$ 0. É um defeito da plataforma, anterior a esta story, que atinge todas as telas que usam o caminho em lote: Captação, Vendas, comparação e relatórios. Vai para story própria.'
iteration_1_status_reason: 'Nas janelas 7d/30d/90d as aplicações cobrem um dia a mais que a Meta. A API corta em hoje − days à meia-noite (days+1 dias de calendário); a Meta usa since = hoje − (days−1). Resultado: o custo por aplicação divide o gasto de N dias pelas aplicações de N+1 dias, e sai até ~12% menor em 7d. O dia mais antigo aparece com Investimento R$ 0,00 e Custo R$ 0,00. Há também um medium: erro da Meta vira investimento e custo R$ 0,00, sem aviso. O resto está correto: Σ dias + Sem data = card, cards = Total, degradação com a API antiga, regra P6, fórmulas e fuso da célula sem fuso.'
