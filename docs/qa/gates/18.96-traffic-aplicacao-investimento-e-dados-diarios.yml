story_title: 'Etapa de Aplicação — campanhas Meta, cards de investimento e custo, e "Dados diários"'
gate: FAIL
status_reason: 'Nas janelas 7d/30d/90d as aplicações cobrem um dia a mais que a Meta. A API corta em hoje − days à meia-noite (days+1 dias de calendário); a Meta usa since = hoje − (days−1). Resultado: o custo por aplicação divide o gasto de N dias pelas aplicações de N+1 dias, e sai até ~12% menor em 7d. O dia mais antigo aparece com Investimento R$ 0,00 e Custo R$ 0,00. Há também um medium: erro da Meta vira investimento e custo R$ 0,00, sem aviso. O resto está correto: Σ dias + Sem data = card, cards = Total, degradação com a API antiga, regra P6, fórmulas e fuso da célula sem fuso.'
reviewer: 'Quinn'
