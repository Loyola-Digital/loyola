achados_abertos:
  - id: QA-477-01
    severidade: low
    o_que: >
      A marcação "(inativa)" na tabela de LPs é código morto: a lista não pede
      `inativos`, e `GET /lps` sem esse parâmetro devolve só ativas
      (`querInativos(q)`). Já era assim antes da story ("como hoje", AC4), mas a
      tabela nova deixa a marcação mais visível. Ou passa `inativos: true` (e
      então mostra a marcação de verdade) ou remove a marcação.
    recomendacao: "Decidir com o dono: a spec § 5 tira inativos dos selects do gerador; a tela de slug é auxiliar, listar só ativas é coerente. Se ficar assim, remover o ramo."
  - id: QA-477-02
    severidade: low
    o_que: >
      Erro da API na tabela usa `erroDaApi().mensagem` cru; as abas do
      Dicionário usam `mensagemDeErro()` (privada em abas.tsx) que traduz 404
      em "a API ainda não tem as rotas" e 500 em "migration pendente". Painel
      à frente da API (cenário real, 29.45) mostra aqui um texto menos útil.
    recomendacao: "Exportar `mensagemDeErro` de abas.tsx (ou mover para use-nomenclatura.ts) e usar nos dois lugares. Uma linha."
  - id: QA-477-03
    severidade: info
    o_que: "AC4–AC6 só têm prova pelo roteiro visual (componente .tsx sem runner). Declarado na story e no epic desde a 47.4."

