decisao: CONCERNS
condicional: >
  Aprovada. CONCERNS só porque a AC8 (roteiro visual de 10 passos) depende do
  dono do produto em produção — as ACs de tela (AC4–AC6) não têm teste
  automatizado neste repo (runner só coleta lib/utils) e o roteiro é a prova.
  Dois achados low, nenhum bloqueia. Gate promovido a PASS quando o dono
  relatar o roteiro. Mesmo agente implementou e revisou na mesma sessão;
  o que foi re-executado de forma independente está em `evidencias`.

