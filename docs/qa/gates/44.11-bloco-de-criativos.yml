porQueFAILeNaoCONCERNS: >
  A régua deste epic, fixada no gate da 44.12, é reprovar por **defeito presente
  no comportamento entregue**, não por risco futuro. Este era presente, medido
  em produção, e visível na tela: dois números na mesma página que não fecham.

  Considerei CONCERNS porque a correção era pequena e a arquitetura do bloco
  está certa. Mas o defeito não era um erro de conta — era a reimplementação de
  um agregador que existe **especificamente** para impedir esse erro, com um
  comentário no arquivo garantindo a propriedade violada. CONCERNS teria
  sinalizado que o item era negociável, e ele não era.

  O re-gate é CONCERNS: os dois restantes são observações com ação diferida, e
  nenhum deles muda um número.

