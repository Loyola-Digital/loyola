status_reason: >-
  QA-07 resolvida corretamente: o residuo saiu da disputa por vaga. So as
  entidades sao ordenadas e fatiadas, o residuo e anexado sempre que existe, e
  `omittedCount`/`omittedSpendShare` passam a contar somente entidades — o que
  esta certo, porque o residuo nunca e omitido. Verifiquei 4 bordas que o @dev
  nao escreveu (so residuo sem entidade nenhuma; residuo nao reduzindo o numero
  de entidades exibidas; entidades todas com spend zero; reconciliacao das tres
  metricas apos a mudanca de ordenacao) e todas passam. QA-08 tambem tratada.
  Restam duas imprecisoes de texto, ambas low, nenhuma bloqueante.
