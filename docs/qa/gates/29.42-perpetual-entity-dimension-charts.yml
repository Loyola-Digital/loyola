status_reason: >-
  A QA-01 foi corrigida na origem: o residuo agora carrega as duas ausencias e a
  reconciliacao fecha nas TRES metricas, com testes. Mas a correcao abriu a
  QA-07: a serie residual e ordenada por `totalSpend` e disputa vaga no teto de
  10 como se fosse uma entidade. Quando ela tem receita e NAO tem investimento —
  o que acontece SEMPRE na dimensao Por Campanha, porque ali `unattributedByDate`
  e vazio por construcao — ela fica com totalSpend=0, ordena por ultimo e cai do
  corte. Com mais de 10 campanhas (73 ativas nos ultimos 30 dias nesta conta), o
  sintoma que a QA-01 descreveu volta identico na visao PADRAO da tela: o
  faturamento existe em `all`, o teste passa, e o grafico nao mostra. Fix de
  poucas linhas — o residuo nao e concorrente por vaga.
reviewer: 'Quinn'
updated: '2026-08-07T00:00:00Z'

top_issues:
  - id: 'QA-07'
    severity: high
    finding: >-
      A serie residual entra no mesmo `sort((a,b) => b.totalSpend - a.totalSpend)`
      e no mesmo `slice(0, TOP_N_SERIES)` das entidades. `totalSpend` do residuo
      conta apenas o investimento sem anuncio — receita residual nao pontua. Logo,
      residuo sem investimento vai para o fim da fila.
    reproduction: >-
      15 entidades com investimento + salesByEntity={"(sem origem)": 50000/90vendas},
      unattributedByDate={} -> residuo na posicao 15 de 16, fora de `plotted`.
      totalForDate(all, revenue)=50000; totalForDate(plotted, revenue)=0.
    impact: >-
      Na dimensao **Por Campanha** — que e a inicial do `tableFilter` —
      `getEntityDailySeries` devolve `unattributedByDate: {}` por construcao. O
      residuo tem sempre totalSpend=0 e, havendo mais de 10 campanhas, e sempre
      cortado. Vendas sem UTM voltam a nao aparecer no grafico, exatamente como
      na QA-01. A diferenca e que agora os testes passam, porque operam sobre
      `all` e o defeito esta no recorte de `plotted`.
    suggested_action: >-
      Tirar o residuo da disputa: ordenar e fatiar somente as entidades, e
      anexar o residuo a `plotted` sempre que existir. Ele nao concorre por vaga
      porque nao e uma entidade — e a prestacao de contas do que sobrou.
      Ajustar `omittedCount`/`omittedSpendShare` para nao conta-lo, e acrescentar
      teste com residuo sem investimento e mais de 10 entidades.
    ac_violated: 'AC0 (o residuo tem de ser visivel), AC5'

  - id: 'QA-08'
    severity: low
    finding: >-
      `useEffect(() => setOcultas({}), [assinatura])` dispara tambem na montagem,
      substituindo `{}` por um `{}` novo. Nao ha laco (a dep e string primitiva e
      nao inclui `ocultas`), mas custa um render extra por montagem e por troca
      de periodo.
    suggested_action: >-
      Guardar com `if (Object.keys(ocultas).length) setOcultas({})`, ou aceitar.
      Cosmetico — registrado para nao ser reachado como novidade depois.

resolvidos_nesta_iteracao:
  - id: 'QA-01'
    status: RESOLVED_NA_ORIGEM
    nota: >-
      Residuo unificado carregando investimento sem anuncio E venda sem entidade.
      A escolha de um bucket em vez de dois esta bem justificada: faz as tres
      reconciliacoes fecharem com uma serie a mais, e a margem do residuo e
      leitura legitima. Mover a montagem do eixo X para depois do residuo foi
      correto e nao obvio — venda residual pode cair em dia que nenhuma outra
      fonte conhece, e ha teste para isso. 4 testes novos cobrem faturamento e
      vendas, que eram o ponto cego. Ver QA-07 para o que sobrou no recorte.
  - id: 'QA-02'
    status: RESOLVED
    nota: >-
      useEffect explicito sobre (dimensao, dias). O @dev registrou que o
      comentario anterior estava errado, em vez de so trocar o codigo — isso vale
      tanto quanto o fix.
  - id: 'QA-03'
    status: RESOLVED
    nota: 'Tratada junto com a QA-05, na 29.44.'

