schema: 1
story: '29.42'
gate: FAIL
status_reason: >-
  Os graficos de Faturamento x Vendas e Margem x Margem % PERDEM receita e vendas
  em silencio. Vendas sem UTM ("(sem origem)") e vendas de anuncio ausente do
  cache de insights nunca viram serie, porque as series so existem para entidades
  presentes em entityDaily.rows. Reproduzido: 500 de 1000 de faturamento plotados,
  1 de 4 vendas. Isso quebra o AC10 teste 1 para faturamento/vendas e e exatamente
  a classe de defeito que o AC0 foi criado para impedir — residuo que some — so
  que aplicada a outra metrica. Na tela, o grafico por dimensao contradiz o
  agregado da 29.32 logo acima. Fix pequeno e localizado no util.
reviewer: 'Quinn'
updated: '2026-08-07T00:00:00Z'

top_issues:
  - id: 'QA-01'
    severity: high
    finding: >-
      buildEntitySeries monta `porNome` APENAS a partir de `rows` (entityDaily).
      Receita/vendas de qualquer chave de `salesByEntity` que nao case com um
      entityId presente em `rows` e descartada sem sinal. Dois casos garantidos
      em producao: (a) a chave "(sem origem)" que o backend usa para vendas sem
      UTM nunca e um entityId; (b) anuncio com venda na planilha mas sem linha
      em meta_ad_insights_daily (deletado, ou fora da janela de sync) — a mesma
      causa que gerou os 59 pares campanha-dia do AC0.
    reproduction: >-
      rows=[{entityId:"ad_1",spend:100}], salesByEntity={ad_1:500/1venda,
      "(sem origem)":300/2vendas, ad_deletado:200/1venda}
      -> totalForDate(revenue)=500 (esperado 1000); totalForDate(sales)=1 (esperado 4).
    impact: >-
      O grafico "Faturamento x Vendas" por dimensao mostra faturamento menor que
      o grafico agregado da 29.32 na MESMA tela, sem nada explicando a diferenca.
      Margem e Margem % herdam o erro (derivam de revenue). O gestor le como
      queda de receita.
    suggested_action: >-
      Mesmo tratamento que o AC0 deu ao investimento: uma serie residual visivel.
      Somar as chaves de salesByEntity nao casadas numa serie "(sem origem
      atribuida)" — ou acumular na propria "(sem anuncio atribuido)", com o
      rotulo ajustado para cobrir as duas ausencias. Acrescentar ao teste de
      reconciliacao os casos de faturamento e vendas, que hoje so cobrem spend.
    ac_violated: 'AC10 (teste 1), AC0 (principio)'

  - id: 'QA-02'
    severity: low
    finding: >-
      AC4 exige que o estado da legenda resete ao trocar dimensao ou periodo.
      `ocultas` e indexado so pela chave do grafico e nunca e limpo — nao ha
      useEffect de reset em EntityDimensionCharts. Esconder "Campanha A", trocar
      para Por Criativo e voltar mantem "Campanha A" escondida.
    impact: >-
      Baixo. O comentario do @dev afirma que "o reset vem de graca porque as
      chaves sao outras" — verdade para a dimensao NOVA, falso ao voltar para a
      anterior. Serie escondida que reaparece escondida pode ser lida como
      ausencia de dado.
    suggested_action: >-
      useEffect([dimensao, series.dates.join()]) -> setOcultas({}). Ou assumir a
      persistencia como comportamento desejado e corrigir o AC4 — mas ai a
      decisao precisa ser do @po, nao do comentario.
    ac_violated: 'AC4'

  - id: 'QA-03'
    severity: low
    finding: >-
      A cor do delta assume que subir e sempre melhorar. O AC5 da 29.44 pediu
      explicitamente que, nao havendo hoje etapa onde subir e piorar, isso fosse
      REGISTRADO. Nao esta registrado em lugar nenhum do codigo. (Registrado
      aqui na 29.42 porque a mesma premissa reaparece nos graficos: CAC subindo
      e ruim, e a linha de CAC nao tem semantica de cor.)
    suggested_action: 'Comentario de uma linha no ponto da cor. Nao bloqueante.'

