resolvidos_nesta_iteracao:
  - id: 'QA-07'
    status: RESOLVED
    verificacao: >-
      Reproducao original (15 entidades, residuo so com receita, Por Campanha):
      faturamento em `plotted` foi de 0 para 50.000, com as 10 entidades
      preservadas — o residuo nao tomou vaga de ninguem. Bordas adicionais
      testadas por mim: residuo sozinho sem entidades entra em `plotted`;
      12 entidades + residuo continuam plotando 10 entidades (nao 9);
      entidades com spend zero nao produzem NaN em `omittedSpendShare`;
      reconciliacao das 3 metricas em `all` intacta apos a reordenacao.
  - id: 'QA-08'
    status: RESOLVED
    nota: 'Guarda com funcao de atualizacao — devolve `prev` quando nao ha o que limpar.'

top_issues:
  - id: 'QA-09'
    severity: low
    finding: >-
      A nota do teto diz "X% do investimento do periodo", mas o denominador
      passou a ser o investimento das ENTIDADES, sem o residuo. Com residuo
      grande o percentual sai superestimado em relacao ao que a frase promete.
      Ex.: entidades 1000, residuo 500, omitidas 200 -> a tela diz 20% "do
      periodo", quando sobre o periodo real (1500) sao 13,3%.
    suggested_action: >-
      Trocar a redacao para "do investimento atribuido" (ou "das entidades").
      O denominador esta certo — quem esta impreciso e o rotulo. Nao bloqueia.

  - id: 'QA-10'
    severity: low
    finding: >-
      O comentario acima da nota ("calculado sobre o conjunto INTEIRO, nao sobre
      os 10 plotados") envelheceu meio passo: continua verdadeiro quanto ao que
      importava na iteracao 1, mas nao menciona que o residuo agora esta fora do
      denominador.
    suggested_action: 'Uma linha no comentario. Pode ir junto com a QA-09.'

