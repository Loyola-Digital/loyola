story_title: 'Desempenho de Testes de LPs — coluna Status (Ativo / Pausado)'
gate: CONCERNS
status_reason: 'A coluna Status sai certa nos três pontos de montagem. A regra OR por anúncio é calculada nos MESMOS anúncios do gasto: correção manual, filtros de mídia e de público valem, e gasto de campanha sem anúncio não decide status. A API não faz consulta nova; contrato 58 e cache :v6. Os 8 mutantes do @dev ficam vermelhos e a revisão independente não achou defeito de correção. Fica um medium de comunicação (REQ-001): como manda o AC2, o status só enxerga anúncios COM entrega no período. Uma LP cujo único anúncio ativo ainda não entregou aparece "Pausado em todas as campanhas", o que o dado não sustenta.'
reviewer: 'Quinn'
updated: '2026-10-27T20:30:00Z'
