top_issues:
  - id: 'REQ-001'
    severity: medium
    status: 'RESOLVIDO no QA fix 1 pela opção 1 do gestor ("bora"): tooltip e título dizem a base ("entre os anúncios que rodaram no período"; anúncio sem entrega não entra). O @qa conferiu: a reversão para o texto antigo deixa 1 teste vermelho. A versão completa (anúncios sem entrega) fica como possível story futura.'
    finding: >-
      O status considera só os anúncios presentes em `lpPorAnuncio.anuncios`, que vêm de
      `filteredAds` (insights do período), como o AC2 manda ("os mesmos cujo gasto entra nela").
      Um anúncio ACTIVE sem nenhuma entrega no período não entra na conta. Cenário: na LP A, o
      ad1 rodou e foi pausado; o ad2 foi ligado hoje e ainda não entregou. A linha aparece
      **Pausado**, com o tooltip "Pausado em todas as campanhas". A LP está no ar. Pelo pedido do
      gestor ("se pausada em todas as campanhas"), o texto promete mais do que o dado sustenta.
      Apontado pelo revisor independente (item 5) e classificado pelo @qa como medium,
      porque o rótulo engana justamente quem usa a coluna para saber se a LP está no ar.
    suggested_action: >-
      Barato e recomendado antes do merge: o tooltip passa a dizer a base, por exemplo
      "Pausado em todos os anúncios que rodaram no período" e "Ativo em N campanha(s) — entre os
      anúncios que rodaram no período", e o título da coluna explica o mesmo.
      Completo (outra story, se o gestor quiser): olhar também os anúncios sem entrega das
      campanhas da etapa. Isso pede uma leitura nova (anúncio → campanha → link no cache), fora
      do AC5 ("nenhuma consulta nova"). Decisão do gestor.
