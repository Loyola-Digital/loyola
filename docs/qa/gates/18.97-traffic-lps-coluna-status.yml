      não usa a `LpPerformanceTable` e ficou sem a coluna. O pedido diz "Desempenho de Testes de
      LPs", e a story mapeou só os três pontos da `LpPerformanceTable`, então está fora pelo texto.
      Pode não estar fora pela intenção do gestor.
    suggested_action: 'Perguntar ao gestor. Se ele quiser, vira story à parte, porque o perpétuo tem outro modelo de linha.'
  - id: 'MNT-001'
    severity: low
    status: 'JSDoc RESOLVIDO no QA fix 1; badge compartilhado segue para depois'
    finding: >-
      `lps-do-lancamento.ts:39-41`: o `type StatusDoAnuncio` entrou entre o JSDoc "Uma entrada por
      anúncio…" e a `interface AnuncioDaLp`, então o comentário passou a documentar o tipo.
      `lp-performance-table.tsx:56` importa de `components/funnels/` o badge. Há precedente
      (`LpFunnelCard`) e não há ciclo, mas um módulo de badge compartilhado seria mais limpo.
    suggested_action: 'Mover o `type` para cima do JSDoc. O badge compartilhado fica para quando houver um terceiro uso.'
  - id: 'REL-001'
    severity: low
    status: 'Tooltip com nome vazio RESOLVIDO no QA fix 1; o id duplicado segue hipotético e aceito'
    finding: >-
      Hipotético: em `lp-por-anuncio.ts:221` o status é fixado pela 1ª linha de insight do anúncio.
      Um mesmo anúncio vindo como `_222` e `222`, com a 1ª linha sem status no cache, fica
      `unknown`. Os insights da Meta trazem ids numéricos, então isso não ocorre hoje.
      O tooltip com `campaignName` vazio sai "Ativo em 1 campanha: ".
    suggested_action: 'Aceitar.'

