checks:
  code_review: 'O diff tem 2 serviços. Em `debriefing-guards.ts`, o predicado `semAdLevelNaDimensaoExibida(p) = tc.aplicavel && tc.adLevel.motivo === "SEM_AD_LEVEL"` passou a decidir `lacunasExigidas` (F11, `:575`) e o WF9 (`:852`); o `porque` e a mensagem do WF9 continuam iguais. Em `debriefing-audience-engine.ts`, só entrou um comentário. A correção na guarda deixa o payload igual em todos os casos, então o AC4 vale por construção, e o SHA confirma.'
  predicado: 'Certo e sem buraco do R1. `tipoDeCriativo` tem um único produtor, `computeDebriefingAudience`, com dois ramos: `"nenhuma"` → `aplicavel: false` literal (`:1281`); qualquer outra dimensão → `aplicavel: true` literal (`:1387`). Logo, `aplicavel ≡ dimensao !== "nenhuma"` para todo payload que o motor gera, e a Q1 (trocar um pelo outro) é equivalente. O render decide pelo mesmo campo: `if (!tc.aplicavel)` → lacuna "Dimensão de criativo (…) não exibida"; senão monta "Criativo por tipo" e, com `!tc.adLevel.aplicavel`, "Mídia por criativo indisponível" (`debriefing-render.ts:1547-1562`). Não existe caso com dimensão ≠ "nenhuma" e `aplicavel = false`, então a falta de ad-level com dimensão exibida continua exigida e avisada; Q2–Q5 e M2/M4/M6 provam isso. A `motivo` existe exatamente quando `!adLevel.aplicavel` nos dois ramos, e por isso a Q2 também é equivalente. Os conflitos de tipo com "nenhuma" são sempre `[]` (`tipoDoAdId` devolve `null` em `:1177`, e o ramo grava `conflitosDeTipo: []`), então o WF9 de conflito não muda (Q10 equivalente).'
  acceptance_criteria: 'AC1 ✓: com o código da main, `validateDebriefing` do caso "nenhuma" sem ad-level dá bloqueado = true e F11 failed "lacuna SEM_AD_LEVEL ausente em lacunas[] (sem ad-level no período)". Com a correção: bloqueado = false, sem violações, e o orquestrador devolve 200. A parcial depende da 49.12 (REL-001). AC2 ✓: sem lacuna nem WF9 de ad-level, e o HTML sem "por tipo de criativo não medidos", "Mídia por criativo indisponível" e "Criativo por tipo". O @dev listou os leitores do ad-level (render, lista de lacunas, banner, `campanhasDoAdId`, `spendPorAdId`, money-time loader), e a leitura do QA bate com a dele; o caso do `linkDoPost` é o REQ-001. AC3 ✓: com ia-humano e com video-estatico sem ad-level, a lacuna é registrada e exigida e o WF9 avisa; tirando a lacuna, F11 failed e 422 sem gravar. AC4 ✓: ver `ac4_sha`. AC5 ✓: (a) 4 testes falham na main, conferido pelo QA ao trocar os 2 serviços pelos da main; (b) e (c) cobertos; (d) M1/M2 e Q3/Q4/Q5 morrem.'
  ac4_sha: 'O QA rodou o próprio script do @dev (`scratchpad/sha-49-15.mts`, cópia em `qa-sha-49-15.mts`) com `tsx`, em 3 estados: depois (HEAD), antes (os 2 serviços de `origin/main`) e de volta à HEAD. Os resultados batem byte a byte com `sha-antes.txt`/`sha-depois.txt` do @dev. Os 5 casos congelados saem idênticos antes e depois: ia-humano com 4486fcdc…/13a61e0b…; ia-humano sem 0fa878ff…/b14e5196…; video-estatico com f9fe478e…/d5b14a8e…; video-estatico sem e6f90adb…/9b202af3…; nenhuma com 75eff4e2…/135d3acc… (HTML/payload). No caso corrigido, "nenhuma" sem ad-level, a main dá 422 INVARIANTE_VIOLADO e a HEAD dá 200 com HTML 75eff4e2… (igual a "nenhuma com") e payload 2d7d933f…. O script compara o que diz comparar: chama `gerarDebriefing` com os motores reais da worktree, o `agora` fixado em `GERADO_EM` e SHA-256 de `body.html` e de `JSON.stringify(body.payload)`. Os alertas não estão no payload, mas entram no HTML pelo banner. Sonda de sensibilidade: trocar uma palavra da mensagem do WF9 mudou o SHA do HTML exatamente nas 2 linhas com WF9 e em nenhuma outra. O comparador não é cego ao que a guarda emite.'
  unit_tests: 'Arquivo da story: 14/14. Suíte de debriefing: 20 arquivos, 677/677. O `mutar-49-15.py` do @dev, reexecutado, dá 10/10 mortas (M1 4, M2 9, M3 4, M4 6, M5 2, M6 5, M7 2, M8 20, M9 4, M10 2 falhas). Mutações do QA (`scratchpad/qa-mutar-49-15.py`, suíte de debriefing inteira, cada uma restaurada e `git status` limpo ao fim): Q1 aplicavel → `dimensao !== "nenhuma"`: sobrevive, EQUIVALENTE (ver predicado). Q2 motivo → `!adLevel.aplicavel`: sobrevive, EQUIVALENTE. Q3 `&&` → `||`: morre (14). Q4 `!aplicavel`: morre (13). Q5 só `aplicavel`, exige mesmo com ad-level: morre (10). Q6 ramo "nenhuma" com `aplicavel: true`: morre (5). Q7 ramo "nenhuma" sem o `motivo` (só o fato no payload): sobrevive. Não há leitor documental (o render não lê `motivo` e a guarda só lê com `aplicavel`), e o AC4 não congela o payload do caso "nenhuma" sem ad-level, então não há defeito. Q8 render nunca mostra "Mídia por criativo indisponível": morre (3). Q9 chamador, F11 fora de `validateDebriefing`: morre (10). Q10 a mensagem do WF9 volta a ler `motivo` direto: sobrevive, EQUIVALENTE (com "nenhuma", conflitos = [] e o bloco nem entra). Q11 fio do loader com a dimensão fixa em "nenhuma": sobrevive, pré-existente (TEST-002). Nos dois sentidos pedidos: "exigir sempre" (M1/M3/M5) e "nunca exigir" (M2/M4/M6/Q4) morrem.'
  no_regressions: 'Rodado pelo QA: `node_modules/.bin/tsc --noEmit -p packages/api` exit 0, sem saída. `eslint src/` da API: 0 erros e 1 warning pré-existente (`routes/lp-campaigns.ts:57`). API inteira: 238 arquivos, 10 falhas e 4.438 passando (4.448 testes); as falhas são as 10 pré-existentes conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2), nenhuma nova.'
  security: 'N/A: nenhuma rota, acesso ou dado novo. A correção só afrouxa uma exigência num caso em que o documento não exibe a dimensão; com a dimensão exibida, a exigência segue presa por M2/M4/M6/Q4.'
  api_contract: 'N/A: sem migration, sem mudança de forma do payload nem da config, sem bump. O payload sai idêntico por SHA.'
  documentation: 'Dev Agent Record completo: `[AUTO-DECISION]` (guarda × motor; não proibir a lacuna na F11), AC2 item a item, tabela de SHA e mutações. O achado do link (REQ-001) foi registrado pelo @dev em vez de corrigido, o que está certo, porque mexeria no HTML congelado pelo AC4.'

