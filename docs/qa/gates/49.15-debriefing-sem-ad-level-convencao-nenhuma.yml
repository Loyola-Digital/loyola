issues:
  - id: REQ-001
    severity: low
    category: requirements
    description: 'Achado do @dev, confirmado. O link do nome em "Criativo × Faixa" vem de `postDoGrupo(porVolume, spendPorAdId, postPorAdId)` (`debriefing-audience-engine.ts:1253`). `spendPorAdId` sai só do ad-level (`:1219-1220`). Sem ad-level, todo spend é 0; `postDoGrupo` começa com `melhorSpend = -1` e troca só com `sp > melhorSpend` (`utils/post-do-criativo.ts:61,66`), então fica o primeiro ad_id com post na ordem `porVolume`, que é a de respondentes (`:1224`). A nota do render continua dizendo "do anúncio de maior investimento do Ad Name" (`debriefing-render.ts:1544`), e isso é inexato. Vale com qualquer dimensão, e também com ad-level quando os ad_ids com post não gastaram no período. Com a dimensão exibida, a lacuna "Mídia por criativo indisponível" ao menos sinaliza que faltou ad-level. Com "nenhuma", o caso que a 49.15 destravou, o documento não diz em lugar nenhum que faltou ad-level, então a nota fica inexata em silêncio. O link continua apontando para um post real do mesmo Ad Name; não é dado errado, é critério descrito errado. Não viola o AC2 na letra ("depender de ad-level e ficar sem dado": a célula tem dado), e o @dev registrou o achado como o AC2 pedia.'
    recommendation: 'Story nova (@sm/@po): a nota segue o critério efetivo. Por exemplo, sem spend no grupo, "do anúncio com mais respondentes (sem investimento por anúncio no período)". Ela muda o HTML do caso "com dimensão, sem ad-level", que o AC4 da 49.15 congela, e por isso precisa de AC próprio de SHA. A fixture deve ter criativo na pesquisa e 2+ ad_ids com post no mesmo Ad Name, porque a sintética de hoje não exercita o desempate (ver TEST-001).'
    owner: '@sm/@po'
    status: open

  - id: TEST-001
    severity: low
    category: tests
    description: 'A pesquisa da fixture sintética não traz criativo. Com isso, a tabela "Criativo × Faixa" sai vazia nos 6 casos do AC4, e o único leitor do ad-level que o documento ainda exibe com "nenhuma" (o `linkDoPost`) não entra nos SHAs nem nos testes. O @dev declarou isso na ressalva do item 6 do AC2. Não esconde defeito desta story, porque a 49.15 não mexe no motor; mas o "nenhuma com ad-level = nenhuma sem ad-level no HTML" vale só para esta fixture.'
    recommendation: 'Junto da story do REQ-001.'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Pré-existente, fora do escopo. A mutação Q11 do QA (o loader passa `dimensaoDeCriativo: "nenhuma"` fixo, em vez de `config.dimensaoDeCriativo`, em `debriefing-audience-loader.ts:810`) sobrevive à suíte de debriefing inteira (677/677). Os testes da 49.15 entram pelo `calcularPayload` falso e não passam pelo loader. Nenhum teste prende o fio config → loader → Motor II da dimensão.'
    recommendation: 'Um teste de loader que afirme `entrada.config.dimensaoDeCriativo === config.dimensaoDeCriativo`. Pode ir numa story de testes do Epic 49 ou na do REQ-001.'
    status: open

  - id: REL-001
    severity: low
    category: reliability
    description: 'Conflito textual em `debriefing-guards.ts` com a 49.12 (`origin/feat/49.12-debriefing-em-andamento` @ 117b90c5, PR #992) e com a 49.14 (f0543b52, empilhada na 49.12), conferido por `git merge-tree`. A 49.15 insere `semAdLevelNaDimensaoExibida` logo depois de `checarF10`, no mesmo ponto em que a 49.12 insere `checarF10EmAndamento`. Os dois call sites (F11 e WF9) e o motor fazem auto-merge. Na 49.12 e na 49.14 não há leitor novo de `adLevel.motivo` além desses dois (grep).'
    recommendation: 'Quem mergear depois (provavelmente a 49.12) mantém os dois blocos no rebase e roda `debriefing-sem-ad-level-49-15.test.ts` no modo parcial também. O AC1 diz "e parcial também, se a 49.12 já estiver na main".'
    owner: '@dev/@devops'
    status: open

