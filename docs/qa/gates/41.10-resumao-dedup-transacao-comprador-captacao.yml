story_title: 'Correção do Resumão: dedup por ID da venda antes de somar; comprador de captação = Imersão OU Combo'
gate: CONCERNS
status_reason: >-
  O código está correto e bem testado. A dedup usa (ID da venda, produto), roda antes do corte,
  sobrevive a primeira linha, linha sem ID nunca colapsa, e as planilhas sem ID ou sem produto
  mapeado recebem W10 em vez de ficarem em silêncio. Seis mutações próprias foram pegas pela suíte.
  Os números do PG04 e do PG02 foram reconferidos em produção, em leitura. O que impede o PASS
  está fora do código: (1) a tabela da janela 09/05 nos AC2/AC4 diverge da regra do AC1
  (15 / R$ 1.485,00 contra 13 / R$ 1.287,00) e precisa ser ratificada pelo @po; (2) a P-8 tem
  objeto (o Resumão 6b4c3492 do PG04 muda) e, pela própria story, bloqueia o merge até o dono
  decidir; (3) no PG02 a dedup fica inerte até o gestor mapear `ID` como transactionId. Por fim,
  a conferência em produção dos AC5, AC7 e AC7b só pode acontecer depois do deploy.
