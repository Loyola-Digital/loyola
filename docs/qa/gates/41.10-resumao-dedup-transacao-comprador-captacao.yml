top_issues:
  - id: 'REQ-001'
    severity: medium
    category: requirements
    finding: >-
      A janela 17/04–09/05 dos AC2/AC4 não bate com a regra que o AC1 manda e o código implementa:
      W9 = 15 / R$ 1.485,00 (story: 13 / R$ 1.287,00); vendas 2.174 (story: 2.176); faturamento
      R$ 228.820,94 (story: 229.018,94); OB 274 / R$ 30.084,54 (story: 276 / 30.282,54). Com a regra
      antiga, os únicos vão a 1.406, e a story afirma que eles não mudam. Os 13 vêm da estimativa,
      que deduplicava depois do corte. O QA reconfirmou os 15 de forma independente, no snapshot e
      na produção. A spec já declara a tabela com 15 como oráculo, mas o texto dos AC é do @po.
    suggested_action: >-
      @po ratifica (ou não) a tabela 09/05 com 15 / 1.485,00 e corrige os AC2/AC4. O QA não decide.
      Nota para a ratificação: a duplicata −3 h tem cara de conversão de fuso no n8n. O dia da
      sobrevivente é o mesmo do export da Kiwify e de todas as demais linhas da planilha, então a
      regra é coerente com o resto do relatório.
  - id: 'REL-001'
    severity: medium
    category: requirements
    finding: >-
      A P-8 tem objeto: o Resumão 6b4c3492 do PG04 (09/07–30/07) muda com a dedup (−5 vendas /
      −R$ 428,50), e isso foi reconferido em produção. Pela story, uma P-8 com objeto bloqueia o
      merge, e a comunicação ao usuário (AC7) também tem de vir antes do merge.
    suggested_action: 'O dono decide a P-8 e a comunicação do AC7 é feita. Só então @devops faz o merge.'
  - id: 'OPS-001'
    severity: medium
    category: requirements
    finding: >-
      No PG02, o `transactionId` não está mapeado em produção. No merge, o Resumão do PG02 só ganha
      o W10 e os números não mudam. As 25 duplicatas só saem depois que o gestor mapear `ID` pela UI
      (o painel Captação Paga também é afetado, porque deduplica pelo mesmo mapping). AC4/AC4b: a
      config R2-1 já está aplicada, mas não há registro de quem fez nem quando.
    suggested_action: >-
      O gestor mapeia `ID` no wizard e registra o antes→depois. O dono registra o AC4/AC4b. Depois
      do deploy, o @qa gera o PG02 (09/05 e 11/05) e o PG04 em produção e preenche os pendentes
      do AC5 (UTM, decomposição, A1–A9). Por último, a regeração do AC7b.
  - id: 'TEST-001'
    severity: low
    category: tests
    finding: >-
      O fio rota→guardas não tem teste. Cortei `dedup: carregado.dedup` (Resumão) e
      `{ dedup: c.dedup }` (Comparativo): a suíte ficou idêntica e o tsc, limpo, porque
      `ValidateOptions.dedup` é opcional e não há teste de rota. O código atual está ligado
      (conferido na leitura), mas um refactor pode fazer os números caírem sem W9/W10.
    suggested_action: >-
      Tornar `dedup` obrigatório na chamada (por exemplo, `assertLaunchReport(carregado.metricas,
      { dedup: carregado.dedup })` via helper tipado) ou cobrir o handler com um teste que afirme
      W9/W10 no `alertas[]` da resposta.
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: >-
      O teste do loader "a sobrevivente é a primeira (a com Transaction preenchida)" é tautológico:
      passa com a mutação "sobrevive a última". Quem protege a regra são os testes do util e o AC3(g).
    suggested_action: 'Afirmar o `dia`/horário (ou `txId`/campo distintivo) da linha mantida, e não só a contagem.'

