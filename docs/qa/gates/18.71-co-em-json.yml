summary: >
  A story resolve o caso que o gestor relatou, mas descreve mal o mundo em que
  vai rodar. Rodei `JSON.parse` sobre as 85 células que começam com `{` em todas
  as abas de venda de produção: **5 parseiam, 80 falham**. Não é um formato com
  variações — são três formatos diferentes, e a story só descrevia o primeiro.

  As 2 vendas do relato (R$ 2.991,00 no `bbe-pr2`) são formato 1 e ficam
  resolvidas. Mas "9 abas em 5 funis" vira **1 aba, 1 funil** para o que o AC1
  corrige — e o AC6, que prometia agrupar orgânico em `org`, estava falso para
  a maioria dos casos. Story corrigida antes do @dev pegar.

formatos_encontrados:
  - id: 1
    exemplo: '{"co":"120247542282230489","url":"…","v":1}'
    linhas: 5
    onde: "bbe-pr2-ago-26 (só)"
    tratado_pela_v1: true
  - id: 2
    exemplo: '{"org","org"} · {"imersao","imersao"}'
    linhas: 41
    onde: "fz-l2-jun-26, fz-m2-jul26, dg-pg02"
    nota: "par duplicado entre chaves; NÃO é JSON — JSON.parse lança"
    tratado_pela_v1: false
  - id: 3
    exemplo: "{{ad.id}}"
    linhas: 42
    onde: "dg-pg02 (39), dg-pg04 (2), fz-m2-jul26 (1)"
    nota: >
      macro do Meta não substituída — anúncio mal configurado, não bug de
      parsing. `survey-aggregation.ts` já barra via isLikelyAdId().
    tratado_pela_v1: false

