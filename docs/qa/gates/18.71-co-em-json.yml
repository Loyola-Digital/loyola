    - "integration: uma linha formato 1 com ad_id numérico é atribuída ao criativo; sem o fix, não é"
  P1:
    - "unit: isLikelyAdId continua barrando os 3 formatos depois do AC2 (AC5b)"
    - "integration: LP recebe as 2 vendas do bbe-pr2 (AC3) e os criativos as mesmas 2 (AC4)"
  P2:
    - "unit: formato 2 vira `org`/`imersao` na dimensão Ad Name (AC6) — usar fixture de fz-l2/fz-m2, não bbe-pr2"

