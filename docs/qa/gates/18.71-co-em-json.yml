    finding: "Alcance declarado ('9 abas em 5 funis') mede os 3 formatos juntos e superestima o efeito do AC1"
    action: "Seção de medição corrigida com a quebra por formato — CORRIGIDO"
  - id: QA-1871-04
    severity: medium
    finding: >
      Zero cobertura de teste hoje em `normalizeNumericId` e
      `computeCreativeSalesMetrics` — a mudança é no coração da atribuição de
      receita e não há rede nenhuma.
    action: "AC1 e AC5 já exigem teste novo; sem eles, NÃO aprovar o gate de código"
  - id: QA-1871-05
    severity: low
    finding: >
      Depois do fix, os `{\"co\":\"org\",\"u\":\"<uuid>\"…}` colapsam num único
      grupo `org` (o uuid muda por venda, então hoje cada um é um grupo).
      A contagem de grupos na tela vai CAIR.
    action: "Registrado no AC6 como resultado esperado, para não virar bug report"

