top_issues:
  - id: TEST-001
    severity: low
    category: tests
    description: 'O terceiro fio da "regra única", `FUNIL_COLADO` em `funil-e-oferta.ts` (29.79), não tem guarda. Mutação Q3: voltei a ele o literal `/\[[a-z]{2,4}a(\d{1,2})\]/g`, e as 190 da API e as 41 do web passaram. Esperado, porque o literal é equivalente. Mutação Q3b: literal DIVERGENTE, com sigla de 2 a 5 letras. As 190 e as 41 também passaram. O teste "fila, sugestão e a leitura da 29.79 concordam" só usa os 4 nomes reais, todos com sigla de 3 letras, e não chega às bordas. A M4 do @dev provou que o fio estava ligado naquele commit, mas não protege contra uma cópia futura, que é justamente o R3 da story. Se as duas regras divergirem, o filtro do perpétuo lê funil de um nome que a fila não lista (ou o contrário), e o aviso "Classificável na fila" mente. O AC3 deixa a 29.79 fora dos critérios, por isso é low.'
    recommendation: 'Incluir as bordas no teste de concordância, dos dois lados: `[ABCDA1]` → `lerFunilDoNome` a01 e `ehCandidataALegada` true; `[ABCDEA1]` e `[AA1]` → sem código e false. Ou fazer um teste de fio lendo o fonte de `funil-e-oferta.ts`: ele contém `new RegExp(FUNIL_ENTRE_COLCHETES` e nenhum literal `\[[a-z]`.'
    status: open

  - id: OPS-001
    severity: low
    category: requirements
    description: 'Janela de deploy. `ehCandidataALegada` roda no web (código do shared), mas a fila é SQL da API. Se o web publicar antes da API, o aviso do filtro do perpétuo já mostra "Classificar em Campanhas › Legadas", com link, para os `[FZA1]…`, e a fila ainda não os lista. É o caso que o PO-08 da 29.80 queria evitar (mandar procurar o que não existe). Some com o deploy da API. Não há rota nem campo novo, então a regra do contrato não exige bump.'
    recommendation: 'Fazer a validação visual da DoD só depois de conferir que a API está no ar com este commit, e não chamar de bug o link sem a campanha na fila enquanto isso não acontecer.'
    status: open

waiver: { active: false }

checks:
  code_review: 'Diff de 9 arquivos lido inteiro. `nomenclatura-legado.ts`: nenhum `import`/`export … from` (grep); segue folha. `FUNIL_ENTRE_COLCHETES = "\\[[a-z]{2,4}a([0-9]{1,2})\\]"` é válida nos dois dialetos, e `REGEX_LEGADA_SQL` é composta por interpolação, sem cópia. Na sugestão, `new RegExp(FUNIL_ENTRE_COLCHETES)` sem flag, sobre o nome já em minúsculas e sem acento (`:61`); `padStart(2,"0")` resolve o PO-05. Em `funil-e-oferta.ts`, `new RegExp(…, "g")` com `matchAll` tem o mesmo comportamento do literal antigo (`\d` ≡ `[0-9]` sem flag `u`; `matchAll` clona o `lastIndex`). `repositorio.ts` não mudou e passa a constante como parâmetro.'
  autonomous_decisions: '(1) Inversão da dependência: CORRETA. Conferi que o web importa `nomenclatura-legado` por VALOR via subpath (`filtro-funil-oferta.ts:27`) e que nenhum arquivo do web importa valor do índice bare `@loyola-x/shared` (varredura de todos os `import {…}`: 0) nem de `funil-e-oferta` (0). O import relativo novo em `funil-e-oferta.ts` fica, portanto, fora do grafo que o webpack empacota. O `next build` não foi refeito: no web mudaram só um comentário e um teste. O AC3 também manda a constante para `nomenclatura-legado.ts`. (2) Prioridade da forma com borda sobre a de colchetes: CORRETA. Nenhum nome que já recebia sugestão muda de funil, o que preserva a 47.5; o conflito entre as duas formas só existe em nome hipotético, a sugestão passa por confirmação humana, e o caso está fixado por teste (Q2b cai).'
  inverted_expectations: 'LEGÍTIMAS, não afrouxamento. (a) `funil-e-oferta-nome.test.ts` PO-12: o próprio comentário original dizia "se um dia ele passar a casar `[FZA1]`, este teste avisa", e o AC2 manda casar. O teste não virou `toBeDefined`: fixa `a01` e iguala a `lerFunilDoNome`; as outras duas asserções (não casa `a01` no nome, não lê oferta) ficaram intactas. (b) `filtro-funil-oferta.test.ts` PO-08: o caso `[FZA1]` fora da fila era o R3 da 29.79. Agora ele exige a ação e o href exatos, e o caso negativo (texto "Não entra na fila", href/acao null) foi preservado com `[30-14-7-5A1]`, nome real de lançamento. No `montarAvisoDoFiltro`, só o href da campanha 444 mudou. Q1 derruba os dois testes invertidos do web.'
  visible_change: 'COERENTE. O aviso do filtro passa a oferecer "Classificar em Campanhas › Legadas" para `[FZA1]…` porque o AC1 põe essas campanhas na fila, e classificar a oferta delas é o objetivo declarado da story (62,6 % do gasto do FZ fora do filtro de Oferta). A função consulta a mesma `ehCandidataALegada` que é o oráculo da fila. Ressalva de deploy: OPS-001.'
  unit_tests: 'Suítes da story e da 29.79/29.80 (nomenclatura-legado, nomenclatura-repositorio, funil-e-oferta-nome, perpetual-funil-oferta-regra, perpetual-funil-oferta-filtro, nomenclatura-rotas): 190/190. Web filtro-funil-oferta 35/35, + nomenclatura-legadas = 41/41. Web completo: 1635/1635 (a 1ª rodada deu 2 falhas por carga; a 2ª, 1635/1635). API completa: 3359/11. São as 10 do baseline em 5 arquivos (funnel-stages-lead-inputs 3, projects 3, schema 2, instagram-routes 1, instagram 1), mais `lp-correcao-e-fio-1883` 1, que isolada passa 19/19 (flake de carga, não é desta story). MUTAÇÕES PRÓPRIAS, com rebuild do shared (a API lê o `dist`), revertidas com `git checkout` e `git status` vazio depois de cada uma: Q1 `REGEX_LEGADA_SQL` sem a alternativa nova e a constante ainda exportada → 4 falhas na API ((a), caixa, "uma definição", predicado (d)) + 2 no web (link do `[FZA1]`) · Q2a sugestão lê só a forma entre colchetes → 5 falhas (3 do AC6 da 47.5, precedência, rota 47.5 AC7) · Q2b prioridade invertida (colchetes antes da borda) → 1 falha (precedência) · Q3 `FUNIL_COLADO` da 29.79 volta a ser literal equivalente → SOBREVIVE (esperado: é equivalente) · Q3b literal divergente (sigla 2–5) → SOBREVIVE (TEST-001).'
  acceptance_criteria: 'AC1 ✓ (constante na fila e em `ehCandidataALegada`; prova em produção do @dev: 72 → 76, exatamente as 4, 0 perdidas) · AC2 ✓ (`a01`/`a10`, confiança `media`, `naoCadastrado`, sem `expertHint` nada) · AC3 ✓ (uma constante; fila + sugestão; a 29.79 ficou ligada além do pedido, sem guarda: TEST-001) · AC4 ✓ (`[30-14-7-5A1]`, `ba1-teste`, `bbe-a10-lancamento`, `[DGA1B]`, `[ABCDEA1]` fora; as 12 da AMOSTRA dentro) · AC5 ✓ (a)–(e); (d) com `PgDialect`, sem banco mockado; (e) = Q1/Q2a · AC6 ✓ (eslint dos 8 arquivos tocados 0; tsc shared (build) 0 e API 0, rodados aqui; tsc e `next build` do web conforme o Dev Record, não refeitos, ver autonomous_decisions (1)).'
  no_regressions: 'Os nomes que casavam continuam casando (AMOSTRA; produção: 0 perdidos). A sugestão da forma delimitada não mudou (Q2b). `lerFunilDoNome`/`lerOfertaDoNome` da 29.79 têm o mesmo comportamento (as outras asserções das suítes 29.79/29.80 seguem sem edição e verdes).'
  performance: 'N/A: a mesma consulta `~*`, com uma alternativa a mais; a fila já faz varredura sequencial no cache de nomes.'
  security: 'N/A: sem rota, entrada ou permissão nova. A regex vai como parâmetro do drizzle (sem interpolação em SQL). Não há ReDoS: é uma alternativa limitada e sem quantificador aninhado.'
  documentation: 'Cabeçalhos de `nomenclatura-legado.ts` e `funil-e-oferta.ts` atualizados, inclusive a restrição nova (o web não pode importar VALOR de `funil-e-oferta` por subpath). Comentário de `sinalizacaoDaCampanhaSemDimensao` atualizado. O Dev Record lista o desvio dos 2 testes.'
  api_contract: 'NÃO SOBE, e está correto. `contract.ts` e `routes/` sem diff (`git diff origin/main...HEAD --stat`). A mudança é de conjunto de linhas numa rota existente, sem rota, campo ou snapshot novo. `API_CONTRACT_VERSION` = 26 na base.'

