story_title: 'Nomenclatura — campanhas com a sigla entre colchetes (`[FZA1]`) entram na fila de Legadas'
gate: PASS
status_reason: 'Uma constante (`FUNIL_ENTRE_COLCHETES`) compõe a expressão da fila e a leitura de funil da sugestão; `nomenclatura-legado.ts` continua folha e o web não importa valor de `funil-e-oferta.ts`, então a inversão da dependência não afeta o `next build`. As duas expectativas invertidas da 29.79/29.80 fixavam o R3 que esta story corrige; o caso negativo foi preservado com `[30-14-7-5A1]`. 5 mutações próprias: 3 caem; as 2 que sobrevivem (o fio da 29.79 trocado por um literal, igual ou divergente) ficam fora do AC3 e viram TEST-001 (low). Sem rota nem campo novo, o contrato não sobe.'
reviewer: 'Quinn'
