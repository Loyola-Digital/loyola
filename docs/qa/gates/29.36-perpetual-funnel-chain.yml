issues:
  - id: QA-09
    status: RESOLVIDO em 73cb866
    severity: critical
    category: correctness
    description: >-
      BLOCKER — o CAC decomposto NUNCA calculava. `connect_rate` ficava sem
      valor e sem campo para digitar: o template a marcava como "analytics", o
      sistema não fornecia o número, e o campo de edição só aparecia para
      `source === "manual"`. Como GR-01.d derruba o cálculo quando falta uma
      etapa, e connect_rate está em todas as 7 arquiteturas (regra R2 — nunca
      sai da cadeia), a funcionalidade principal da story não entregava nada.

      A investigação do dev mostrou que era MAIOR: seis etapas marcadas
      "analytics" (connect_rate, conv_lead, opt_in, presell_conv, registration,
      vsl_connect) e o sistema fornece zero. Corrigir só connect_rate teria
      deixado 4 das 7 arquiteturas quebradas — e o gate teria passado.
    resolution: >-
      Editabilidade passou a derivar do que o sistema FORNECE, não do `source`
      declarado. Auto-corretivo: quando a integração existir, o campo some
      sozinho. Verificado que o fix cobre os dois pontos de decisão (linha 103,
      montagem da cadeia; linha 285, botão de edição) e que `source` segue
      documentando a fonte ideal na coluna Origem.
    blocking: true

  - id: QA-10
    severity: low
    category: tests
    description: >-
      O `SYSTEM_PROVIDES` do teste de regressão é uma constante duplicada do que
      `measuredRates` faz no componente. Se a tela passar a fornecer uma etapa
      nova e ninguém atualizar a constante, o teste segue verde testando um
      mundo que não existe mais.
    recommendation: >-
      Exportar a lista de chaves que o sistema fornece de um único lugar e
      importá-la nos dois. Baixo risco hoje (uma chave só), mas o acoplamento
      por cópia envelhece mal.
    blocking: false

notes: >-
  Primeiro FAIL desta sequência de stories, e o único achado até aqui que
  impedia a feature de funcionar — os anteriores eram degradação graciosa ou
  dívida técnica.

  Duas coisas valem registro. A primeira: o defeito não era detectável por
  typecheck nem por build, porque tipo e comportamento estavam ambos corretos —
  o que divergia era a INTENÇÃO declarada num comentário ("fica como manual") e
  o que o template dizia. Só leitura cruzada de três arquivos pegava.

  A segunda: o dev não se limitou a corrigir o que eu apontei. Foi verificar
  quantas outras etapas tinham o mesmo problema, achou seis, e trocou a
  abordagem em vez de remendar a chave que eu citei. Se tivesse corrigido
  apenas `connect_rate`, o gate teria passado e quatro arquiteturas
  continuariam inertes em produção.
