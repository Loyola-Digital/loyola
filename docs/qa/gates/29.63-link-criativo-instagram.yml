verificacoes_manuais_executadas:
  - o: 'O cast removido realmente protege, ou so parece?'
    como: >-
      Removi a linha `igPermalinkUrl: r.creative?.igPermalinkUrl ?? null` do
      `loadCached` e rodei o `tsc`.
    resultado: >-
      ERRO TS2322 — "Property 'igPermalinkUrl' is missing in type ... but
      required in type 'MetaAdCreative'". PROVA de que o QA-34 esta resolvido:
      antes, esse mesmo estado compilava limpo. Restaurado depois.

  - o: 'A query de `igPermalinkStale` pode ler o cache ANTES da escrita do fresh?'
    como: >-
      Rastreei a ordem: `fetchAdCreativesWithCache` faz `await
      adapter.saveToCache(fresh)` (meta-ads.ts:1801) antes do return, e a query
      de stale roda depois disso na rota.
    resultado: >-
      Sem race. Cheguei a suspeitar da AUSENCIA de filtro de TTL na query de
      stale (o `loadCached` filtra por 24h e ela nao) — mas a ausencia esta
      CERTA: a query precisa ver o estado pos-escrita, nao o pre. Nao e achado.

  - o: 'O import de valor do shared quebra o `next build`? (tsc nao pega esse caso)'
    como: '`next build` completo no `packages/web`, ~55 min nesta maquina.'
    resultado: >-
      BUILD_ID e manifests gerados, e `PISO_DE_REPRODUCOES` aparece em
      `.next/server/chunks/4072.js` — o simbolo foi resolvido e empacotado.
      O import usa modulo folha (`video-camadas.ts` nao tem import nenhum) via
      subpath, o mesmo padrao de 6 arquivos ja em producao.

  - o: 'O AC7 ("nada muda de valor") se sustenta?'
    como: >-
      `git diff main...HEAD` filtrado por termos de calculo (spend, revenue,
      margin, roas, cac, reduce, `* 100`).
    resultado: >-
      Todas as ocorrencias sao FIXTURES de arquivos de teste. Nenhuma funcao de
      calculo de producao foi tocada.

  - o: 'O `hookRate` sobrevive ao `enrichWithPaidLeads`?'
    como: 'Inspecao do retorno — `return { ...c, ... }`.'
    resultado: 'Spread preserva. Sem perda de campo na cadeia agregacao -> enrich.'

