status_reason: >-
  CONCERNS — aprovado para merge, uma observacao low, nenhuma bloqueante.
  Os oito ACs estao atendidos, e a story fez mais do que pediu: as duas dividas
  que a 36.8 deixou abertas (QA-34 e QA-35) foram FECHADAS, nao contornadas.
  Verifiquei o QA-34 por mutacao propria: removi `igPermalinkUrl` do `loadCached`
  e o `tsc` REJEITOU com "Property 'igPermalinkUrl' is missing in type". Com o
  cast que existia antes, esse mesmo erro passava limpo — era o modo de falha
  mais caro que o repo tinha (certo na Meta, errado na tela, verde no CI).
  A observacao unica: o AC6 (`igPermalinkStale`) nao tem teste. Inverter o
  predicado `< IG_PERMALINK_RESOLVER_VERSION` nao derruba nada. E o QA-36 da
  36.9 reaparecendo em outra rota — predicado de query sem cobertura.
