issues:
  - id: QA-44-01
    severity: high
    category: correctness
    title: "coberturaLeads pode passar de 100% — mesmo lead atribuído a duas campanhas"
    file: packages/api/src/services/campaign-attribution.ts
    story: "44.3 (AC1, AC5)"
    description: >
      O numerador da cobertura de leads é a SOMA de `leadsUnicosAtribuidos` por
      campanha; o denominador é `vistos.size`, o conjunto de chaves distintas.
      Uma chave que aparece em duas campanhas (o mesmo e-mail aplicando duas
      vezes, por anúncios de campanhas diferentes — retargeting) conta DUAS
      vezes no numerador e UMA no denominador.
    proof: |
      Executado contra a implementação real, não deduzido:

        leads = [
          { utmContent: "111111", chave: "jose@x.com" },  // campA
          { utmContent: "222222", chave: "jose@x.com" },  // campB
        ]

        totalLeadsUnicos: 1
        porCampanha: campA → 1 lead · campB → 1 lead
        coberturaLeads: 2      ← 200%

    whyItMatters: >
      A cobertura é o campo que existe para dizer "quanto deste número é
      medido". Uma cobertura de 200% não é um número impreciso — é um número que
      desmente a própria função do campo. E a AC5 fez dela campo de primeira
      classe justamente para não ser nota de rodapé.
    blastRadius: >
      NENHUM hoje. `campaign-attribution.ts` não tem consumidor de rota — só
      testes e o script de medição (`grep` confirmado). O defeito é latente: a
      44.6 e a 44.7 são exatamente quem vai consumir.
    recommendation: >
      O numerador deve ser o tamanho da UNIÃO das chaves atribuídas, não a soma
      dos tamanhos dos conjuntos por campanha. `leadsUnicosAtribuidos` por
      campanha pode continuar como está (a pergunta "quantos leads esta campanha
      trouxe" tem resposta legítima com sobreposição) — o que não pode é somá-los
      para derivar cobertura.
    testGap: >
      Os 4 testes de cobertura existentes cobrem null, 1, não-pago e lead sem
      UTM. Nenhum cobre a mesma chave em duas campanhas.

  - id: QA-44-02
    severity: high
    category: test-coverage
    title: "A correção da 44.2 — o único breaking change do epic — não tem teste nenhum"
    file: packages/api/src/routes/public-meta.ts
    story: "44.2 (AC1)"
    description: >
      A mudança de `a.clicks` para `a.linkClicks` acontece em `deriveMetrics()`
      (linha 220). Nenhum teste do repositório exercita esse caminho.
    proof: |
      Verificação independente, não leitura. Reverti a correção no arquivo e
      rodei a suíte do módulo:

        connectRate: a.clicks > 0 ? ...   (implementação ANTIGA restaurada)
        → Test Files 1 passed · Tests 11 passed

      Verde com o bug de volta. Depois:

        grep -rn "connectRate|lpRate|deriveMetrics" packages/api/src/__tests__/
        → nenhum resultado fora do arquivo da 44.1

    misleadingClaim: >
      O relatório `docs/qa/audits/44.2-connectrate-antes-depois.md` afirma:
      *"Teste com `clicks ≠ linkClicks` no fixture — com os dois iguais, o teste
      passaria com a implementação errada"*. O teste existe e o fixture de fato
      usa 200 ≠ 100 — mas ele verifica os BRUTOS do endpoint da 44.1
      (`linkClicks: 100`, `landingPageViews: 80`, ausência de `clicks`), que é
      outro caminho de código. O próprio teste diz isso num comentário. A frase
      do relatório sugere uma proteção que não existe.
    whyItMatters: >
      É a mudança de maior risco do epic: altera número servido em produção,
      sobe `API_CONTRACT_VERSION` e move o que o agente Inácio reporta. É
      também a única sem rede. Um revert acidental deixa a suíte inteira verde.
    recommendation: >
      Um teste sobre `deriveMetrics` (ou sobre uma rota que a chame) com
      `clicks` ≠ `linkClicks`, afirmando que `connectRate` = lpViews ÷
      linkClicks. Deve falhar se alguém devolver o denominador antigo.

  - id: QA-44-03
    severity: medium
    category: documentation
    title: "\"Painel e API precisam subir juntos\" é factualmente errado, e está em quatro lugares"
    story: "44.2 (AC4)"
    files:
      - packages/shared/src/contract.ts
      - docs/stories/44.2.corrigir-connect-rate-e-nomes.md
      - docs/qa/audits/44.2-connectrate-antes-depois.md
      - docs/stories/epics/EPIC-44-RETOMADA.md
    description: >
      O painel NÃO consome `/api/public/meta`. Verificado: nenhuma ocorrência de
      "/public" em `packages/web`. Ele usa `/api/meta-ads/*` (autenticado) e
      calcula o Connect Rate por conta própria, já dividindo por `linkClicks` —
      `funnel-metrics.ts:348` e `perpetual-daily-metrics.ts:95`.
    selfContradiction: >
      O próprio relatório antes/depois prova isso: a coluna "interno (tela)" já
      mostra 60,5% enquanto a pública mostra 25,7%. Se a tela já exibe o valor
      correto, o deploy da API não muda a tela — logo não há nada a coordenar
      entre os dois.
    whatIsActuallyTrue: >
      O consumidor real é `packages/mcp` — servidor stdio que roda na máquina do
      Inácio apontando para `LOYOLA_API_BASE_URL`. Não é um deploy controlado
      pelo time: no instante em que a API subir, os números do relatório do
      Inácio mudam, e o MCP não tem nenhuma checagem de contrato.
      O bump `API_CONTRACT_VERSION` 1→2 faz o banner do PAINEL disparar enquanto
      a API não acompanha — o que é o detector funcionando (o `commit: null`
      cega só a checagem de commit, não a de contrato).
    whyItMatters: >
      É a instrução que o @devops vai seguir para montar o deploy. Do jeito que
      está, ele coordena o que não precisa e não faz o único aviso que importa —
      avisar o Inácio, com o antes/depois na mão, antes da API subir.
    rootCause: "QA-44-04 — a AC2 existia exatamente para produzir esse levantamento."

  - id: QA-44-04
    severity: medium
    category: requirements
    title: "AC2 da 44.2 não foi entregue — o inventário de consumidores"
    story: "44.2 (AC2)"
    description: >
      A AC pede: *"Listar TODOS os consumidores de `connectRate` e `lpRate` —
      telas, hooks, rotas, tools MCP e o doc do Inácio. Entregar a lista ANTES
      de alterar a primeira linha."*
      O que foi entregue é uma tabela de medição antes/depois por ETAPA — nove
      linhas de projeto×etapa com os dois valores. É outra coisa: mede o
      tamanho do efeito, não mapeia quem sofre o efeito.
    consequence: "Produziu QA-44-03. A AC não era burocracia."

  - id: QA-44-05
    severity: low
    category: requirements
    title: "AC3 da 44.2 atendida parcialmente — a colisão de nomes foi documentada, não resolvida"
    story: "44.2 (AC3)"
    description: >
      A AC oferecia três saídas: alias depreciado, payload versionado, ou
      renomear com ciclo de aviso. Foi feito o bump de `API_CONTRACT_VERSION`,
      que versiona — mas `lpRate` continua no payload com o mesmo significado,
