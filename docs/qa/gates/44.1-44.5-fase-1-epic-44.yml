reReview:
  gate: PASS
  previousGate: CONCERNS

  method: >
    Verificação INDEPENDENTE dos três fixes, não o relato do @dev. Para cada um:
    reverter a correção no arquivo, rodar a suíte, confirmar que os testes novos
    falham, restaurar. Um teste que não falha com o bug de volta é decorativo —
    foi exatamente assim que o QA-44-02 apareceu na primeira rodada.

  resolved:
    - id: QA-44-01
      severity: high
      status: RESOLVED
      commit: 85bfcba8
      verifiedBy: |
        Revertido `coberturaLeads` para a soma dos conjuntos:

          × mesmo lead em duas campanhas não infla a cobertura acima de 100%
          × cobertura de lead nunca passa de 1, mesmo com sobreposição e não-atribuídos
          Tests  2 failed | 13 passed (15)

        Com o fix: 15/15.
      correctnessArgument: >
        `chavesAtribuidas` só recebe chaves vindas de `porCampanhaLead`, que por
        construção é subconjunto de `vistos` (o laço adiciona a `vistos` ANTES
        de checar a UTM). Logo a razão é ≤ 1 por construção, não por sorte de
        fixture.
      alsoChecked: >
        `coberturaVendas` não tinha o mesmo defeito e continua correta: cada
        venda é atribuída a no máximo uma campanha, então `atribVendas` nunca
        passa de `totalVendas`. Conferido no código, não presumido por simetria.
      designPreserved: >
        `leadsUnicosAtribuidos` POR CAMPANHA continua contando a sobreposição —
        e está certo. O teste afirma isso explicitamente (camp-A → 1 e camp-B →
        1 com o mesmo lead), então a decisão fica travada contra alguém
        "consertar" a sobreposição depois achando que é bug.

    - id: QA-44-02
      severity: high
      status: RESOLVED
      commit: 810f708b
      verifiedBy: |
        Revertido `deriveMetrics` para `a.clicks`:

          × connectRate = lpViews ÷ linkClicks, NÃO ÷ clicks
          × lpRate acompanha connectRate — mesmo valor, mesmo denominador
          × sem link click, connectRate é null e não 0
          Tests  3 failed | 11 passed (14)

        Com o fix: 14/14. Na primeira rodada o mesmo revert deixava a suíte
        100% verde — a diferença é que agora o teste passa pelo caminho de
        código da correção.
      discoveryDuringFix: >
        O @dev encontrou uma AC6 na própria story 44.2 — *"Teste que falha se
        alguém voltar a dividir por `clicks`"* — que estava aberta e que o gate
        anterior não tinha citado por nome (eu havia lido só as ACs 1-4). O
        achado QA-44-02 era, na verdade, uma AC explícita não cumprida, não uma
        lacuna de cobertura inferida. Agora atendida.
      scopeNote: >
        `deriveMetrics` tem cinco call sites (o @po já havia registrado:
        `:291,417,513,584,677`). O teste passa por um deles
        (`/stages/:stageId/daily`), o que basta: a correção mora na função, não
        nos chamadores. Um teste por call site protegeria contra outra coisa —
        alguém parar de chamar `deriveMetrics` — que não é o risco desta story.

    - id: QA-44-03
      severity: medium
      status: RESOLVED
      commit: a7a189aa
      verifiedBy: >
        Varredura por "subir juntos|painel e API|web e API" em todo o repo. Os
        únicos resultados remanescentes são: as próprias correções citando a
        frase antiga para refutá-la, o heading da AC4 (ver `stillOpen`), o
        `api-contract-banner.tsx` e a story 29.46 — estes dois falam do banner
        de versão em geral, que é afirmação diferente e correta.
      correctionQuality: >
        As três correções não só removem a frase errada: explicam por que
        estava errada e apontam a evidência (a coluna "interno (tela)" do
