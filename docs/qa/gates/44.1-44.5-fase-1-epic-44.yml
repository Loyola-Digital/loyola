  - id: QA-44-06
    severity: low
    category: correctness
    title: "Atribuição não-determinística para anúncio movido de campanha"
    file: packages/api/src/services/campaign-attribution.ts
    story: "44.3"
    description: >
      `mapearAdsParaCampanhas` usa `selectDistinct` sem `ORDER BY` e fica com o
      primeiro `campaignId` que chegar. Sem ordenação, "o primeiro" não é
      estável entre execuções: a mesma requisição pode atribuir a mesma venda a
      campanhas diferentes em dois momentos.
    mitigation: >
      `adsAmbiguos()` existe e detecta o caso — mas é uma função separada, que
      repete a MESMA query, e `atribuirPorCampanha` não a chama. A sinalização
      prometida no comentário depende de o chamador lembrar de pedir.
    recommendation: "ORDER BY determinístico, ou devolver os ambíguos no mesmo retorno."

  - id: QA-44-07
    severity: low
    category: observability
    title: "utmContentNaoResolvido só conta vendas; utm_content não-numérico é invisível"
    file: packages/api/src/services/campaign-attribution.ts
    story: "44.3"
    description: >
      O laço de leads faz `if (!campanha) continue` sem incrementar o contador —
      um lead com Ad ID que não resolve some sem registro, enquanto a venda
      equivalente é contada. Além disso, `utm_content` presente mas não-numérico
      (ex.: "link_in_bio") é tratado como ausente. O teste da linha 93 mostra
      que a decisão é deliberada, mas ela cria um terceiro balde — "veio UTM,
      não é Ad ID" — que o retorno não expõe.
    note: >
      Cosmético hoje, mas o campo existe justamente porque o serviço se propõe a
      não misturar causas de perda ("as duas causas pedem ações diferentes").

  - id: QA-44-08
    severity: low
    category: requirements
    title: "Status de venda ausente conta como receita sem sinalizar no retorno"
    file: packages/api/src/services/campaign-attribution.ts
    story: "44.3 (AC3)"
    description: >
      `if (v.status !== null && !isRevenueBucket(...)) continue` — com a coluna
      de status não mapeada, toda linha vira receita. É o comportamento legado e
      é coerente com `classifyRefundStatus(raw, false) → "paid"`, então não é
      divergência do repositório. Mas `ResultadoAtribuicao` não tem campo que
      diga "o filtro de status não rodou", e a regra 4 do prompt mestre pede que
      ausência seja declarada.
    recommendation: "Um booleano no retorno (ex.: `statusFiltradoIndisponivel`)."

  - id: QA-44-09
    severity: low
    category: process
    title: "CodeRabbit não rodou"
    description: >
      Fase 0 do fluxo de review é varredura automatizada. Indisponível nesta
