top_issues:
  - id: REL-001
    severity: medium
    category: reliability
    description: 'O item 8 da T1 (T5, AC7) não funciona com 2 contas. `sincronizarHistoricoDasCampanhasNovas` (services/meta-sync-campanhas-novas.ts:27-35) dispara `triggerBackgroundSyncForNewCampaigns` uma vez por conta, no mesmo tick. Cada disparo cai em `fetchCampaignDailyInsightsForIdsWithCache`, que usa a chave `cmp-refetch:${projectId}:${ids}:${since}:${until}` (services/meta-insights-cache.ts:304). A chave NÃO tem a conta, e as duas chamadas têm o mesmo projeto, os mesmos ids e a mesma janela de 365 dias. A segunda se junta à promise da primeira, e a segunda conta nunca é consultada. Provei com um teste temporário que usa o módulo real de cache, com a Meta simulada e 50 ms de latência: `fetchCampaignDailyInsightsForIds` foi chamado só com `["111"]`, esperado `["111","222"]`. A ordem das contas é por nome, então a 1ª é "Danilo Gato" (a antiga), e as campanhas novas moram na "DaniloGatoPerpétuo". No caso real, o sync não aquece nada. O teste da story (`meta-sync-campanhas-novas.test.ts`) simula `triggerBackgroundSyncForNewCampaigns` e por isso não vê a colisão. Impacto limitado: o caminho de leitura (`…EmContas`) busca o que falta em todas as contas sob demanda, então os números não ficam errados, só não são pré-aquecidos. O gatilho também só dispara com `metaAccountId` no funil ou na etapa. A mesma chave pode colidir entre a leitura multi-conta do painel e um chamador de conta única (`perpetual-report-loader`, `launch-report-loader`) com os mesmos ids e as mesmas datas. Nesse caso o painel recebe só uma conta, e `getCampaignDailyInsightsBulk` guarda isso no cache em memória pelo TTL. É improvável, mas possível.'
    recommendation: 'Trocar o laço por UMA chamada que pede todas as contas: `syncCampaignHistoryInBackground` (ou o serviço novo) chama `fetchCampaignDailyInsightsForIdsWithCacheEmContas(db, projectId, contas, ids, 365)` dentro de try/catch, fire-and-forget. E pôr as contas na chave do `singleFlight` (`contas.map(c => c.metaAccountId).sort().join("+")`). O teste deve usar o `meta-insights-cache` REAL, simulando só `fetchCampaignDailyInsightsForIds` com latência, e afirmar que as duas contas foram consultadas. Hoje esse teste falha.'
    owner: '@dev'
    status: open

  - id: TEST-001
    severity: medium
    category: tests
    description: 'Dois dos cinco pontos da API voltam a ler uma conta só sem nenhum teste cair. M3: `orphan-campaigns` com `lerDeTodasAsContas(contas.slice(0, 1), …)` (routes/funnels.ts:784) → 19/19 verdes, SOBREVIVE. M4: auto-popular de etapa com `lerDeCadaConta(contas.slice(0, 1), …)` (routes/funnel-stages.ts:337) → SOBREVIVE. A Dev Notes pede "teste que falha com o `.limit(1)` de volta", e são exatamente os itens 2 e 3 da T1. M7: tirar o `ordenarContas` de `getAllMetaAccountsForProject` (services/traffic-analytics.ts:398) → SOBREVIVE. A ordem dos grupos no seletor volta a ser a do banco (AC7 fala em "nunca a ordem do banco"). `ordenarContas` é testada pura, mas o fio dela não.'
    recommendation: 'Teste por `inject` de `GET /orphan-campaigns` com 2 contas (órfã só na 2ª) e de `POST /stages` com auto-popular (código casando só na 2ª), no molde de `meta-campaigns-seletor.test.ts`. Para a ordem, um caso em `all-adsets-multi-conta` ou no seletor com o banco devolvendo as contas fora da ordem do nome.'
    owner: '@dev'
    status: open

  - id: REL-002
    severity: low
    category: reliability
    description: 'O "falha em qualquer conta lança" do diário existe só no teste. O comentário de `fetchCampaignDailyInsightsForIdsWithCacheEmContas` (services/meta-insights-cache.ts:274) e o Dev Agent Record dizem que uma falha em qualquer conta lança, "como lançava a de conta única". Mas `fetchCampaignDailyInsightsForIds` (services/meta-ads.ts:620-660) usa `Promise.allSettled` por trecho de datas, registra o erro no log e devolve `[]`, então nunca lança por erro HTTP. Com o token de uma conta vencido, a rebusca devolve a parte da outra conta, calada. O teste `campaign-daily-multi-conta` "falha numa conta lança" simula um `fetchCampaignDailyInsightsForIds` que lança, o que a função real não faz. O comportamento é ANTERIOR à story (com uma conta já era assim) e o cache do dia passado continua servindo, por isso low.'
    recommendation: 'Corrigir o comentário e o Dev Agent Record ("a falha de um trecho vira log, como antes"), ou levar à story de erro-visível do diário. Não é preciso mudar código nesta story.'
    owner: '@dev'
    status: open

  - id: REL-003
    severity: low
    category: reliability
    description: '`getAllMetaAccountsForProject` (services/traffic-analytics.ts:398-405) decifra o token de todas as contas fora de try/catch. Se uma conta tiver o token ilegível (troca de chave, IV corrompido), o seletor inteiro responde 502 (routes/funnels.ts:705-712), contra o espírito do AC3 ("falha numa conta não esconde a outra"). O mesmo vale para os conjuntos e o diário. O AC3 cita token expirado, sem acesso e rate limit, que são falhas da Meta e estão cobertas. Decifrar e falhar é raro. Também não filtra `meta_ads_accounts.is_active`, como o `.limit(1)` antigo também não filtrava: uma conta desativada mas vinculada entra nos números e, se falhar, derruba conjuntos e diário.'
    recommendation: 'Story pequena ou o QA loop: decifrar por conta e devolver a falha como `accountErrors` no seletor. Decidir com o @po se conta `is_active = false` deve entrar nos leitores.'
    owner: '@dev / @po'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'O lado web tem teste só na função pura `agruparCampanhasPorConta`. O fio de `CampaignSelector` (passar `accountErrors`, o chip com a conta) e os 7 pontos de chamada não têm teste. Conferi os 7 lendo o diff. O vitest do web só coleta `.test.ts`, então um teste de componente `.test.tsx` não rodaria de qualquer forma.'
    recommendation: 'Teste de fio por `readFileSync` dos 7 arquivos (`accounts={…accounts}` e `accountErrors={…accountErrors}` junto de cada `<CampaignSelector`), como as stories anteriores fizeram.'
    owner: '@dev'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: 'O Dev Agent Record diz "Voltei o `getAllAdSetsForProject` … e a rota do seletor …: 7 de 7 falham". Isso vale para esses dois pontos, mas as órfãs e o auto-popular não foram mutados e não têm teste (TEST-001). A frase "Falha em qualquer conta lança … como lançava a de conta única" do diário não vale para a função real (REL-002). A decisão do item 8 ("pede a cada conta") não vale na prática (REL-001).'
    recommendation: 'Atualizar o Dev Agent Record junto com o conserto de REL-001 e TEST-001.'
    owner: '@dev'
    status: open

