checks:
  code_review: 'Li o diff `cd279ebd...1ca5746c` inteiro (25 arquivos, 1.406+/231−). Uso de `lerDeCadaConta` × `lerDeTodasAsContas` por ponto: seletor → cada conta, 502 só quando NENHUMA responde (AC3), CORRETO; órfãs → todas (falha vira 502, como antes), aceitável, porque "nenhuma órfã" por conta não lida seria falso negativo; auto-popular → cada conta, com a falha no log e o resto aproveitado, CORRETO (é sugestão conferida no seletor); conjuntos e diário → todas, CORRETO para números. `fireBackgroundMetaSync` passava o UUID de `funnels.meta_account_id` (schema: `uuid(...).references(metaAdsAccounts.id)`) como `act_`, então falhava sempre. Achado real do @dev, e o conserto troca pelo `act_` de cada conta, mas a coalescência anula isso (REL-001). A premissa "conta que não é dona da campanha devolve vazio" está no `filtering campaign.id IN` do `/act_X/insights` (meta-ads.ts:577). Insights tratam filtro como filtro, e `routes/meta-ads-comparison.ts` já se apoia nisso em produção ("uma conta que não as possui devolve [] sem erro"). Risco baixo, a conferir na T8. `fetchAllAdSetInsights` tem `singleFlight` com a conta na chave (meta-ads.ts:749), sem colisão. Leitores das 7 telas que continuam com uma conta: os de banco (overview, campanhas, top, all-ads, entity-daily), com fallback ao vivo só com o banco vazio no período; `/adsets?campaignId`, `/ads?adsetId` e `/placements`, ao vivo e de conta única, que só a tela de Tráfego do projeto usa (`funnel-campaign-table` em `projects/[id]/traffic`, `usePlacementBreakdown` em `traffic/page.tsx`), fora das 7; `/lp-campaigns`, ao vivo e de conta única, que nenhum chamador no web usa. O inventário da T1 se confirma.'
  autonomous_decisions: '(1) Caminho (B), consultar todas as contas sem migrar `funnels.campaigns`: CORRETA, porque as seleções antigas continuam valendo. (2) Duas leituras por intenção (parcial com aviso × falha alta): CORRETA e bem documentada. (3) Manter a condição do gatilho do sync (`metaAccountId` preenchido) para não aumentar chamadas à Meta (R2): ACEITA. O AC4 é sobre números, e o caminho de leitura busca o que falta em todas as contas. O sync é pré-aquecimento. (4) Fora das duas stories os 9 pontos que só usam o token, porque as duas contas compartilham o token (decisão do Danilo): ACEITA, registrada. (5) `getAllMetaAccountsForProject` com `id`/`accountName` e ordem: o `meta-perf-sync` só lê `metaAccountId`/`accessToken` (meta-perf-sync.ts:112-125) e não quebra. A ordem não tem teste de fio (TEST-001/M7). [AUTO-DECISION] Gate CONCERNS e não FAIL → o REL-001 atinge só o pré-aquecimento e só funis com `metaAccountId`, não os números. O conserto é pequeno e cabe numa iteração do QA loop antes do merge.'
  unit_tests: 'Suítes da story, rodadas por mim: API 19/19 (5 arquivos) e web 7/7 (`campanhas-por-conta`). MUTAÇÕES PRÓPRIAS (aplicar → suítes da story → `git checkout`, `git status` limpo depois): M1 seletor lendo 1 conta → 3 falham · M2 seletor com 502 se QUALQUER conta falhar → 1 · M3 órfãs com 1 conta → SOBREVIVE · M4 auto-popular com 1 conta → SOBREVIVE · M5 diário com 1 conta → 2 · M6 conjuntos com 1 conta → 2 · M7 sem `ordenarContas` no fio → SOBREVIVE · M8 `accountErrors` vazio → 2. Resultado: 5 de 8 caem (M1, M2, M5, M6, M8); M3, M4 e M7 sobrevivem → TEST-001. PROVA DE REL-001: teste temporário (removido do worktree, cópia em scratchpad) com o `meta-insights-cache` real → `expected ["111"] to deeply equal ["111","222"]`. Suíte completa da API, rodada por mim com `--testTimeout=60000`: 5.107 de 5.117, com 10 falhas em 5 arquivos, igual ao Dev Agent Record. Uma 1ª rodada com o timeout padrão deu 59 falhas em 40 arquivos, todas por tempo, sob carga. Ver `no_regressions`.'
  lint_typecheck: 'Refeitos por mim no worktree. API: `tsc --noEmit` EXIT 0 (18 s); `eslint src/` 0 erros, 1 aviso antigo (`lp-campaigns.ts:57`, arquivo fora do diff). Web: só o vitest do arquivo novo; `next build`, `tsc` e `next lint` do web NÃO foram refeitos (o Dev Agent Record diz verde). As mudanças de tipo do web são aditivas e opcionais.'
  no_regressions: 'Falhas pré-existentes conferidas. `funnel-stages-lead-inputs`: 3 falhas ("Data final não pode ser menor que hoje"). O teste NÃO importa `routes/funnel-stages.ts`: monta a própria rota com `projectionEndDate: "2026-06-30"`, data que já passou. Não tem relação com a story. `instagram-routes` 1, `instagram` 1, `projects` 3 e `schema` 2 também falham, e nenhum importa arquivo do diff. São as mesmas 10 falhas em 5 arquivos da baseline de gates anteriores. AC6 (uma conta só): seletor só ACRESCENTA campos (teste "uma conta só"), conjuntos e diário chamam a Meta com a mesma conta e a mesma consulta, e as órfãs e o auto-popular dão o mesmo resultado. A falha ao decifrar já caía em `[]` pelo try externo. Única mudança de comportamento com uma conta: o sync de campanhas novas passa a funcionar de fato (antes falhava sempre pelo UUID), o que gera mais chamadas à Meta quando `metaAccountId` está preenchido. É o comportamento original pretendido pela 30.2.'
  performance: 'R2: os conjuntos (`level=adset`, conta inteira, ao vivo) passam a fazer N chamadas por request frio, uma por conta, com `singleFlight` por conta e cache em memória. O diário só vai à Meta para o que falta no banco e agora pergunta a N contas. O seletor faz N `fetchCampaigns`. Para N = 2 é aceitável.'
  security: 'A resposta do seletor monta cada campo explicitamente (`montarRespostaDoSeletor`) e não leva o token. O teste afirma `not.toContain("tok-")`. As mensagens de erro por conta repetem o texto da Meta (ex.: "Error validating access token"), sem segredo. A guarda da rota não mudou.'
  documentation: 'Dev Agent Record completo, com o inventário da T1 e as decisões. Três afirmações não se sustentam (DOC-001). A 29.84 está reservada e o AC4 tem a exceção registrada.'
  api_contract: '51 → 52 com a linha de histórico (packages/shared/src/contract.ts:589-601): campos novos em `campaigns[]` (`accountId`, `accountName`, `metaAccountId`) e na resposta (`accounts`, `accountErrors`). A `origin/main` ainda está em cd279ebd (contrato 51, `git ls-remote`). O fallback do AC8 está no web: tipos opcionais, `?? []` em `useCampaignPicker` e `agruparCampanhasPorConta` sem `accountId` = um grupo sem título (teste "API antiga"). Item 8 do gate: OK. Se outra PR subir o contrato antes, o @devops renumera.'
  acceptance_criteria: 'AC1 ✓ no código (rota lê todas as contas, 7 telas passam `accounts`/`accountErrors`; a prova real é a T8) · AC2 ✓ (grupo por conta com `accountName`, mesmo nome em grupos diferentes, sem título com 1 conta, chip com a conta) · AC3 ✓ (200 com a conta que respondeu + aviso com nome e motivo; 502 só se todas falham; ressalva REL-003 para token ilegível) · AC4 ✓ no código para os itens 4 e 7 (conjuntos e diário); a prova contra o Gerenciador é a T8; criativos e Lead Scoring → 29.84 · AC5 ✓ por construção (soma das linhas das duas contas no diário e nos conjuntos; teste 100 + 40 = 140) · AC6 ✓ (ver `no_regressions`) · AC7 PARCIAL: nenhum `.limit(1)` nos pontos tocados, mas o `fireBackgroundMetaSync` só consulta a 1ª conta com 2 contas (REL-001) · AC8 ✓ (52 + fallback).'

