issues:
  - id: QA-07
    severity: medium
    category: correctness
    description: >-
      PERÍODO DESSINCRONIZADO ENTRE ABAS. A aba Análise MVP recebe
      `days={paidSalesDays}` — um estado da PÁGINA, default 90, cujo seletor
      vive dentro da aba Meta Ads, na seção de vendas manuais. Já o
      `PerpetualDashboard` tem estado PRÓPRIO (`const [days, setDays] =
      useState(90)` na :742) com seu próprio DayRangePicker e suporte a
      customRange.

      Três consequências:
        1. a aba MVP não tem seletor de período — o usuário não pode mudá-lo;
        2. mudar o período no dashboard NÃO reflete na MVP;
        3. o CAC realizado da MVP pode ser de 90 dias enquanto a aba Meta Ads
           mostra 7 — dois valores para a mesma métrica em abas vizinhas.

      Não é violação técnica (cada aba é coerente internamente), mas contraria o
      espírito de AGG-01/ST-07 do protocolo, que exige janela homogênea para que
      números sejam comparáveis. E é o tipo de divergência que o usuário
      atribui a bug de cálculo, não a período diferente.

      `customRange` é prop opcional do componente e a página nunca a passa —
      sintoma do mesmo problema.
    recommendation: >-
      Mínimo: DayRangePicker próprio na aba MVP, para o período ser explícito e
      controlável. Melhor: elevar o estado de período para a página e compartilhar
      com o PerpetualDashboard — mas isso mexe em componente fora do escopo desta
      story e merece decisão à parte.
    blocking: false

  - id: QA-08
    severity: low
    category: tests
    description: >-
      Os 4 arquivos `.test.tsx` de componente seguem fora do runner. A decisão
      está documentada no vitest.config.ts e é defensável para esta story, mas
      permanece como dívida: são testes escritos que nunca rodaram, e quanto mais
      tempo passa, mais provável que tenham apodrecido junto com os componentes.
    recommendation: >-
      Story própria para ligar jsdom + testing-library e sanear os 4. Estimar
      considerando que podem falhar de saída, como falharam 2 dos 6 de lib/utils.
    blocking: false

