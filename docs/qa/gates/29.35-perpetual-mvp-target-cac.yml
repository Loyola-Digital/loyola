notes: >-
  CONCERNS por QA-07. Nenhum dos dois issues bloqueia merge, mas o período
  dessincronizado é o tipo de coisa que gera chamado de suporte — o usuário vê
  dois CAC diferentes em abas vizinhas e conclui que o sistema está errado,
  quando o sistema está certo e as janelas é que diferem.

  Registro do que a implementação fez de melhor: o teste de paridade pegou um
  bug do próprio autor. O port derivava o limiar de kill/continue do valor
  ARREDONDADO em vez do exato — violando ROUND-01, que o mesmo autor havia
  documentado no cabeçalho do módulo três funções acima. É exatamente para isso
  que existe teste de paridade contra implementação de referência, e é a
  primeira vez nesta sequência de stories que um defeito foi pego por teste em
  vez de revisão manual.
