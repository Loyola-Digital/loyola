top_issues:
  - id: 'REL-001'
    severity: medium
    finding: 'A ordem de deploy está escrita como "junto com o merge" (topo do 0168_debriefing_em_andamento.sql:26-28 e Dev Agent Record, pendência 1), e o efeito está subestimado ("GET/PUT da config e Gerar dão 500"). Sem a 0168, o GET /api/debriefings/:id também dá 500, para QUALQUER debriefing, inclusive upload: routes/debriefings.ts:204 e :210 seleciona `debriefing_payloads.parcial` num leftJoin incondicional. Como o deploy é automático a partir da main, qualquer atraso entre o merge e a aplicação deixa o viewer inteiro fora do ar.'
    suggested_action: 'Condição de merge: o @devops aplica a 0168 em produção ANTES do merge e cola a prova do information_schema (2 colunas em debriefing_configs NOT NULL, `parcial` NOT NULL default false, o CHECK e o índice UNIQUE … WHERE parcial). A migration é retrocompatível com o código da main (sonda 3). Corrigir a frase no topo do .sql e no Dev Agent Record para "antes do merge" e incluir o viewer de debriefings na lista do que quebra.'
    owner: devops
  - id: 'TEST-001'
    severity: low
    finding: 'O retry da corrida da 1ª parcial (debriefing-generate.ts, `gravarDebriefingGerado`) não é exercitado pela suíte: a mutação A3, que tira o retry, sobrevive. O @dev declarou a ausência do teste. A sonda do QA provou que o caminho funciona com o erro real do PG.'
    suggested_action: 'Incorporar a sonda: Proxy em `db.transaction` que lança, na 1ª chamada, o 23505 capturado de uma inserção real; o teste afirma 2 chamadas, o mesmo id da vencedora e 1 parcial no banco, e que um final não faz retry.'
    owner: dev
  - id: 'TEST-002'
    severity: low
    finding: 'A mutação A10 sobrevive: o detalhe do viewer juntando o payload por `stage_id_origem = debriefings.stage_id` não é pego. O teste do upload manual só roda depois que o final consumiu a parcial, quando já não existe parcial viva na etapa.'
    suggested_action: 'No teste de AC14 do debriefing-parcial-store, fazer o upload manual na MESMA etapa ENQUANTO a parcial existe e afirmar `parcial: null` no upload.'
    owner: dev
  - id: 'TEST-003'
    severity: low
    finding: '`lerEstadoDoSyncDaMidia` (SQL: contas das etapas e do funil, fallback para as contas ativas do projeto, filtro por projectId) não tem teste. Só a função pura `contasAtrasadasNoCorte` é testada; a leitura foi vista uma vez em produção, com 1 conta, no AC13(d).'
    suggested_action: 'Um caso em PGlite com duas contas (uma por etapa, outra pelo funil), uma sem estado, e o fallback do projeto.'
    owner: dev
  - id: 'REQ-001'
    severity: low
    finding: 'O AC12 diz "`DEBRIEFING_PAYLOAD_VERSAO` sobe se o formato do payload mudar", e o @dev não subiu (AUTO-DECISION). O QA aceita a leitura: os campos são aditivos e opcionais, o epic:498 é condicional, o AC13(a) proíbe mudar o HTML e parcial e final se distinguem por `situacao` e pela coluna `parcial`. Mas é desvio da letra do AC.'
    suggested_action: 'O @po ratifica no AC12 ("formato" = forma incompatível; campo aditivo opcional não sobe a versão) e registra na 49.9 que ela lê `payload.situacao` (ausente = final).'
    owner: po
  - id: 'REL-002'
    severity: low
    finding: 'AC15: o `meta_sync_state` é por (projeto, conta). Uma conta apontada pela etapa ou pelo funil mas não vinculada ao projeto em `meta_ads_account_projects` nunca é sincronizada para esse projeto, e então bloqueia para sempre, com a ação "esperar o próximo sync", que não resolve. Além disso, a fronteira usa 00:00 BRT, e o `until` do sync é BRT fixo (meta-ads.ts:31), mas o dia dos insights da Meta é o do fuso da conta. Uma conta fora de BRT pode passar com o dia de corte ainda aberto no fuso dela. É hipotético para as contas atuais.'
    suggested_action: 'Na 49.14, ou quando surgir o caso: quando a conta não tiver estado nenhum para o projeto, dizer no `detalhe` que ela não está vinculada ao projeto. Avaliar o fuso da conta na fronteira.'
    owner: dev

