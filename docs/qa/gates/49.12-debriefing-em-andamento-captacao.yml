coverage:
  AC1: 'PASS. `situacao_do_lancamento` tem DEFAULT encerrado com CHECK. O PUT trata situação omitida como encerrado. No formulário, config nova vem com a resposta null (falta responder) e config salva vem como encerrado. No encerrado, `problemasDasDatasChave` é a regra de sempre e recusa "ainda não aconteceu". Mutações A8, A9 e W3 morreram.'
  AC2: 'PASS. "Ainda não aconteceu" é a data null mais a fase em `aindaNaoAconteceu`, sem valor sentinela. No payload e no documento ele é diferente de "não houve" (A12 morreu). A ordem é conferida entre as datas que existem. O formulário só lista o que falta no modo escolhido (W5 morreu).'
  AC3: 'PASS. O corte vem de `businessYesterday` (Intl com America/Sao_Paulo). O QA conferiu em TZ=UTC, America/Sao_Paulo e Asia/Tokyo: 2026-10-07T01:30Z dá 2026-10-05 e 03:00Z dá 2026-10-06. O corte entra na config como entrada, então os motores continuam sem relógio. O 422 SEM_DIA_FECHADO tem erro, detalhe e ação.'
  AC4: 'PASS. Abertura informada e menor ou igual ao corte dá 422 CARRINHO_JA_ABERTO. A fronteira (abertura NO dia de corte) é coberta: a mutação A5, que troca <= por <, morreu.'
  AC5: 'PASS. `janelaDaGeracao` é a porta única. Mídia, vendas, leads e pesquisa param no corte, e o payload grava `situacao.janela.motivoDoFim`.'
  AC6: 'PASS. A lacuna CARRINHO_AINDA_NAO_ABRIU tem 13 itens nomeados e é cobrada pela F11. O render escreve a lacuna no lugar do zero e tira os marcos de carrinho. A lista por seção está no Dev Agent Record.'
  AC7: 'PASS. O título e o campaignName dizem "PARCIAL — dados até dd/mm · D+N", e o aviso `data-parcial` fica no topo do documento.'
  AC8: 'PASS. Pela config, a comparação é cortada em início + N (o off-by-one A4 morreu) e o diferencial do AC13(c) bate. Métrica que só existe de um lado mostra Δ "—" com nota. Só com payload salvo, o documento sai sem Δ e com aviso. Comparação em andamento, pela config ou pelo ÚLTIMO payload salvo, dá 422 COMPARACAO_EM_ANDAMENTO, nunca 500.'
  AC9: 'PASS. Todas as guardas rodam. A F10 tem um ramo próprio para o modo em andamento, e no encerrado ela é a mesma de antes. A troca de `?? 0` por `?? faturamentoPorEtapa.principal` na F1 é equivalente no encerrado, porque lá `faturamentoPrincipal.valor` nunca é null (conferido em origin/main, engine:1809).'
  AC10: 'PASS. A transação faz SELECT … FOR UPDATE só na linha com parcial = true da etapa, e o UPDATE mantém o mesmo id e os comentários. O final consome a parcial e grava parcial = false. Um final nunca é procurado, então nunca é sobrescrito. Uma falha não altera a parcial: os 422 e o 413 voltam antes do gravar, e a transação reverte o resto. O índice único parcial garante no máximo uma parcial por etapa. A1, A2, A3 e A11 morreram.'
  AC11: 'PASS. O botão diz "Gerar parcial (dados até {ontem})" e avisa que vai SUBSTITUIR a parcial. Os 422 novos têm título no bloco persistente. Contra a API v34, o corpo do PUT não leva as chaves novas e o "em andamento" fica desabilitado com a frase de API atrás. W1, W2, W4 e W5 morreram.'
  AC12: 'PASS COM RESSALVA. O contrato sobe de 34 para 35 com linha de histórico. A migration é a 0168, conferida livre. `DEBRIEFING_PAYLOAD_VERSAO` não subiu (decisão 1, ver REQ-001), e o caminho 2 continua achando os payloads salvos.'
  AC13: 'PASS. (a) SHA reproduzido pelo QA: o HTML é idêntico entre origin/main e a branch nos 3 casos (7a7bcbfe…, 318a26ea…, 7bc6e88b…). No diff do payload, chave a chave, só `config.situacaoDoLancamento` e `situacao` diferem. (b) e (e): 27 mutações do @dev mais 16 de 18 do QA morreram. (c) O diferencial em D+28 está na suíte. (d) A sessão foi `default_transaction_read_only = on`, o `gravar` virou no-op e a saída tem só agregados, rotulada como SIMULAÇÃO.'
  AC14: 'PASS. O aviso fica fora do iframe. O srcDoc é montado só com o `debriefing.html`, então a edição inline não grava o aviso. O GET devolve `parcial` null no final e no upload. TEST-002: o caso "upload na MESMA etapa com uma parcial viva" não é testado.'
  AC15: 'PASS. Ver a decisão 3 abaixo. A fronteira 00:00 BRT foi provada pelo QA, e A6 e A7 morreram. A leitura SQL das contas não tem teste (TEST-003).'

decisoes_do_dev:
  d1_payload_versao_nao_subiu:
    veredito: 'ACEITA (leitura válida do AC12; o @po deve ratificar, ver REQ-001)'
    motivo: 'Os campos são aditivos e opcionais. O epic, na linha 498, trata a subida como condicional ("se a 49.12 ou a 49.14 o subirem"). Subir a constante mudaria o HTML do encerrado, porque o render imprime a versão, e isso fere o AC13(a). Os consumidores conseguem distinguir parcial de final de dois jeitos: `payload.situacao.modo` (ausente quer dizer final) e a coluna `debriefing_payloads.parcial`. `lerUltimoPayloadSalvoDoFunil` + `parcialDo` já recusa parcial na comparação. A 49.9 precisa ler `situacao` (nota já registrada no epic).'
  d2_corte_business_yesterday:
    veredito: 'ACEITA'
    motivo: '`toBusinessDayKey` usa Intl com `timeZone: America/Sao_Paulo` e não depende do TZ do processo. Medido pelo QA em 3 fusos, e a virada UTC×BRT está correta. O teste do @dev fixa o relógio e o TZ (M1 e M2).'
  d3_ac15_ad_daily:
    veredito: 'ACEITA'
    motivo: 'Conferido em `meta-perf-sync.ts:157-186`. O `ad-daily` grava estado em toda rodada; o `campaign-daily` só roda com `campaignIds.length > 0`. Em `recordSyncRun`, uma falha preserva `last_success_at` (COALESCE) e atualiza `last_run_at`. Os três casos fecham. (1) Conta que ainda não sincronizou o dia de corte: `ad-daily.last_success_at` fica antes das 00:00 BRT de corte+1, e a geração bloqueia. (2) Conta parada: o `ad-daily` segue com sucesso a cada 15 min e o `campaign-daily` fica velho sem ter rodado depois do corte, então não bloqueia. (3) Conta cujo `campaign-daily` rodou depois do corte e falhou: bloqueia. A mídia do debriefing sai de `meta_campaign_insights_daily` (loader:768-774), o que confirma o `campaign-daily` como fonte. Ressalva em REL-002.'
  d4_corrida_indice_mais_retry:
    veredito: 'ACEITA, com TEST-001'
    motivo: 'O índice único parcial garante o invariante no banco. Na corrida em READ COMMITTED, a 2ª transação bate em 23505, refaz e encontra a parcial vencedora. Um final concorrente com a parcial travada reavalia o WHERE depois do commit e insere um registro novo, que é a semântica certa. A suíte do @dev não exercita o retry: a mutação A3, que tira o retry, sobrevive a ela. A sonda do QA reproduziu a corrida com um erro de unicidade REAL do PG (PGlite) e um Proxy em `db.transaction`. O retry atualiza a vencedora, e o final não faz retry.'

migration_0168:
  aditiva: 'SIM. São 2 colunas NOT NULL com DEFAULT constante (no PG 11+ isso só mexe em metadado, sem reescrever a tabela), 1 coluna boolean DEFAULT false, 1 CHECK e 1 índice único parcial. Nenhuma coluna existente muda. O CHECK e o índice, sem NOT VALID/CONCURRENTLY, fazem um scan curto em tabelas pequenas, o que é aceitável.'
  defaults_seguros: 'SIM. Config existente vira encerrado com [], e payload existente vira parcial = false (sonda 3 do QA e teste do @dev).'
  codigo_antigo_com_migration: 'FUNCIONA. A sonda 3 do QA mostra que um INSERT sem as colunas novas, como faz o código da main, pega os defaults. O Drizzle da main seleciona colunas nomeadas, então as colunas extras são ignoradas. Ordem de deploy segura: migration primeiro.'
  codigo_novo_sem_migration: 'QUEBRA, mais do que o declarado. A sonda 2 do QA confirma "column does not exist" no `select()` de `debriefing_configs` (GET e PUT da config, gate, geração) e em `debriefing_payloads.parcial`. Esta última está no GET /api/debriefings/:id, que tem leftJoin incondicional (routes/debriefings.ts:204 e :210). Ou seja: o viewer de QUALQUER debriefing, inclusive upload do Epic 37, daria 500, além de toda geração (o INSERT leva `parcial`).'
  ordem_de_deploy_exigida: '1) Aplicar a 0168 em produção. 2) Provar pelo information_schema, com o roteiro do topo do .sql. 3) Só então mergear (o deploy é automático a partir da main). Não "junto com o merge".'
  rollback: 'CORRETO. As 5 linhas na ordem certa (índice, coluna, constraint, colunas), executadas pelo @dev em PGlite e reaplicadas depois. Só vale DEPOIS de reverter a API. Nota: se a API voltar sem desfazer a migration, o caminho 2 do código antigo não distingue uma parcial salva de um final.'
  tres_camadas: 'COERENTES. O Drizzle (schema.ts:3368, :3856-3868 e :3889) bate com o SQL em tipo, NOT NULL, default, CHECK e índice WHERE parcial. O zod aceita `situacaoDoLancamento` como enum opcional, `aindaNaoAconteceu` como enum[] com no máximo 4 e as datas como nullable. A normalização é feita por `valoresDaLinha` (filtra fases desconhecidas e cai em encerrado) e por `aindaNaoAconteceuDe` (deduplica e ordena).'

