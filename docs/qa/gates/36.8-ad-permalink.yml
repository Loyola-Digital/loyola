status_reason: >-
  CONCERNS — aprovado para merge com duas observacoes, nenhuma bloqueante.
  Os seis ACs estao atendidos e o AC5 foi superado: em vez de aceitar a divida
  que a story autorizava (`adPermalinkUrl: null` indistinguivel de "ainda nao
  buscamos"), o @dev reusou o `LINK_URL_RESOLVER_VERSION` da 29.43 e entregou
  `adPermalinkStale`. A decisao central da story — recusar o `preview_shareable_link`
  que o chamado pediu, porque carrega token e exige sessao do Business Manager —
  esta correta e protegida por teste.
  As duas observacoes tem a mesma raiz: o achado mais valioso da story (o cast que
  escondia o cache-hit sem o campo) foi corrigido no sintoma, mas a causa
  permaneceu. Verifiquei por mutacao propria — removi o fix e NADA quebrou:
  nem teste, nem `tsc`. O proximo campo repete o defeito em silencio.
