top_issues:
  - id: 'REQ-001'
    severity: medium
    category: requirements
    finding: >-
      O AC3 manda reportar ao dono, antes do merge, o funil em que linhas dobradas por evento não colapsam
      pela coluna mapeada. O BBE em setembro tem esse caso. O relato do @dev já leva o caso, mas com 8,4%,
      e o efeito real no botão 3 é 6 linhas / R$ 1.461,50 = 5,3%. No total da planilha são 9 linhas /
      R$ 2.329,00 = 6,3%. A decisão (remapear ou não) é do dono e, se for remapear, é ato do gestor pela UI.
      O QA não decide. No PPS, a `Transaction` repete com e-mails diferentes, e remapear lá removeria
      venda legítima.
    suggested_action: >-
      O lead leva ao dono o número corrigido (5,3% no botão 3, 6,3% na planilha) e registra a decisão na story.
      Isso precisa acontecer antes do merge, porque o AC3 manda assim.
  - id: 'REQ-002'
    severity: medium
    category: requirements
    finding: >-
      Fora do escopo e anterior à 41.11 (confirmado no código e no dado): o botão 3 soma `refused` e
      `waiting_payment` como venda, contra a regra "receita = só status pago" (isRevenueBucket, 29.26).
      Na §C.10 do BBE são 10 de 48 transações (20,8% do faturamento). No único relatório salvo são 29 de
      150 (19,6%). É bem maior que a duplicata, e a 49.10 herdaria o mesmo defeito ao consumir o loader.
    suggested_action: >-
      @po/dono abrem story própria (Epic 41) antes da 49.10 consumir o loader. Ela deve decidir também o
      destino do relatório salvo do BBE (análogo da P-7, agora com objeto). Não entra nesta PR (No Invention).
  - id: 'OPS-001'
    severity: low
    category: requirements
    finding: 'AC4 (conferência em produção antes/depois) só pode ser feita depois do deploy.'
    suggested_action: >-
      Depois do deploy, o @qa gera BBE-A1, PPS-A1 e FZ-A1 em produção e confere: nada deve mudar e não deve
      aparecer W-P7 nem W-P8.
  - id: 'TEST-001'
    severity: low
    category: tests
    finding: >-
      Q7 sobreviveu: se o loader sobrescrever `report.alertas` com os alertas da dedup, os W-P1…W-P6 do
      motor somem e nenhum teste falha. O código atual usa push (correto).
    suggested_action: 'No teste do loadPerpetualReport, afirmar que os alertas do motor (fixture que gere ao menos um) continuam presentes antes do W-P7.'
  - id: 'TEST-002'
    severity: low
    category: tests
    finding: 'Q2 sobreviveu: trocar clean() por ID cru faria duas linhas com o texto "null" colapsarem; o (d) tem um único "null".'
    suggested_action: 'No AC2(d), usar dois "null" (ou "-") com o mesmo produto.'

