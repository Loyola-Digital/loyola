status_reason: >-
  O código está correto e bem testado. A dedup reusa `deduplicarPorIdDaVenda` da 41.10 e roda depois
  do reembolso e dos filtros de linha e antes do corte de janela. W-P7 e W-P8 são anexados depois do
  motor; motor, P1–P7, rota, schema e UI ficaram intactos. Sete mutações próprias: cinco pegas, duas
  sobrevivem e são de risco baixo. A suíte completa da API, rodada sozinha, tem as mesmas 10 falhas
  de origin/main b419a7f3. A produção foi reconferida em modo leitura: 0 linhas removidas nos 3 funis,
  o array `vendas` antigo e o novo têm o mesmo SHA em 7 janelas, e a P-7 fica sem objeto. O PASS não
  sai porque falta o que a story manda levar ao dono antes do merge. O AC3 exige reportar a dobra
  por `Transaction` no BBE, e o percentual do relato do @dev está inflado: o efeito no botão 3 é
  5,3%, não 8,4%. Além disso, os status `refused`/`waiting_payment` são somados como venda. Esse
  defeito é anterior à 41.11, fica fora do escopo e é maior que a duplicata: 20,8% do faturamento
  da §C.10 do BBE. Por fim, o AC4 depende do deploy.
