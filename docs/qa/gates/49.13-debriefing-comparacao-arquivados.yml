checks:
  code_review: 'Diff de 3 arquivos de código. `opcoesDaComparacao` aplica `filter` antes de `sort`; o `filter` cria um array novo, então a ordenação não muta o cache do React Query. Comparador idêntico ao de `funnels/[funnelId]/page.tsx:135` e rótulo idêntico ao de `:299`. A rota já ordena os arquivados por último (`routes/funnels.ts` `orderBy archivedAt IS NOT NULL`), então o `sort` do cliente é redundante em produção. Isso é defesa e paridade, não defeito. `nomeDoFunil` é usado em `:419`, o item da lista salva do AC3. Tipo `FunilDaComparacao` compatível com o `Funnel` do web (tsc limpo).'
  acceptance_criteria: 'AC1 ✓: `useFunnels(projectId, "all")` → `?archived=all` → rota sem filtro de arquivamento. As opções excluem o próprio funil e os já listados. AC2 ✓: sufixo " (arquivado)", ativos antes dos arquivados, e `sort` estável preserva a ordem da API em cada grupo. AC3 ✓: `nomeDoFunilDaComparacao` com a lista `"all"`; o id só aparece para funil apagado. AC4 ✓ sem código: nenhum `services/debriefing-*.ts` nem rota de debriefing lê `archivedAt`, e `funisDoProjeto` (`debriefing-config.ts:944-946`) lista todos os funis do projeto. AC5 ✓: o diff troca uma única chamada de `useFunnels` (`grep` dos 10 chamadores: os demais estão iguais, incluindo `launch-comparativo-button.tsx:68`, o Comparativo do Epic 41, fora de escopo). O hook não mudou e o padrão segue `"false"`. Cache: `useArchiveFunnel`/`useUnarchiveFunnel` chamam `invalidateFunnelLists`, que invalida `["funnels", projectId]`. O React Query casa por prefixo (`exact` falso por padrão), então alcança `["funnels", projectId, "all"]`. Create, update, delete e reorder também invalidam o mesmo prefixo. AC6 ✓ na letra (ver TEST-001).'
  unit_tests: 'Arquivo da story: 24/24. Suíte inteira do web com o timeout PADRÃO de 5 s: 130 arquivos, 1.812/1.812 (load average ~8 no momento). Mutações do QA (cada uma aplicada e restaurada com SHA conferido, `git status` limpo ao fim). Biblioteca: M1 escopo `"false"` → (a)+(c) falham; M2 sem sufixo → (b)+(c); M3 sem `sort` → (b); M3b ordem invertida → (b); M4 nome sem rótulo → (c); M5 não exclui o próprio → (a)+(b); M6 não exclui os já listados (duplicata) → (a). Todas morrem. Componente: W1/W2/W3/W4 → 0 falhas, todas sobrevivem (TEST-001).'
  security: 'Funil arquivado de OUTRO projeto não aparece: a rota filtra `eq(funnels.projectId, :projectId)` depois de `getProjectAccess`, e `archived=all` só remove o filtro de arquivamento. O convidado preso a um funil continua restrito por `funilDoConvidado`, que vale também com `all`. O servidor rejeita id de outro projeto ao salvar (`debriefing-config.ts:1154,1166`: "não é um funil do mesmo projeto") e ignora ao gerar (`premissaEfetiva`, `:825-827`). O próprio lançamento fica fora (`x.id !== funnelId`, M5 morre). Uma comparação já na lista não duplica (`!jaNaLista.includes`, M6 morre; o fio de `f.comparacoes` é o TEST-001).'
  no_regressions: 'Lint (`next lint`): 0 avisos. `node_modules/.bin/tsc --noEmit -p packages/web` com `.next/types` presente: exit 0. O tsc é incremental, por isso levou 3,6 s; para provar que ele checa de fato, o QA injetou `{x.name}` e ele acusou TS2339 na linha 447, depois restaurou. Os timeouts de `.test.tsx` de instagram/planner que o @dev viu NÃO se reproduziram: 1.812/1.812 com o timeout padrão. Nenhum desses arquivos importa `debriefing*` ou `use-funnels` (grep vazio), e a story não toca nada fora dos 3 arquivos. Não há falha a atribuir, por isso o worktree em `origin/main` não foi necessário.'
  api_contract: 'N/A: sem rota, campo, migration ou bump de `API_CONTRACT_VERSION`. Front e API podem subir em qualquer ordem, porque `archived=all` já existe na rota desde a Story 10.9.'
  performance: 'Uma query a mais por projeto (`["funnels", id, "all"]`, staleTime 5 min) só quando o formulário abre. O `sort` é O(n log n) sobre a lista de funis. Irrelevante. O R1 (lista longa) é mitigado pela ordem ativos → arquivados.'
  documentation: 'Dev Agent Record completo, com o `[AUTO-DECISION]`, a prova de reversão e os comandos. A prova cobre a biblioteca e não o chamador (TEST-001).'

