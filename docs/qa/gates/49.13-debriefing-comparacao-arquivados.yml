    severity: medium
    category: tests
    description: 'Os testes provam a biblioteca e não o fio do componente. As funções do módulo folha estão travadas: M1–M6 morrem (ver checks.unit_tests). Mas as 4 mutações em `debriefing-generate-button.tsx` sobrevivem com 1.566/1.566 em `lib/utils/__tests__/`: W1 `useFunnels(projectId, ESCOPO_DOS_FUNIS_DA_COMPARACAO)` → `useFunnels(projectId)` (linha 235); W2 `{x.rotulo}` → `{x.id}` (linha 447); W3 `nomeDoFunil` volta ao `find(...)?.name ?? id` inline de hoje (linha 252); W4 `f.comparacoes` → `[]` (linha 445: a comparação já salva volta às opções, duplicata). W1 restaura exatamente o código de hoje, o filtro de ativos do AC1, e ainda assim nada falha. A prova de reversão do @dev reverteu a constante e as funções, não o chamador. O AC6 é atendido na letra, porque a biblioteca falha com a lógica de hoje, mas a regressão mais provável (alguém tirar o 2º argumento) passa com a suíte verde.'
    recommendation: 'Teste de fio no padrão de `lib/utils/__tests__/vturb-bloco-fio.test.ts` (o pacote web roda em `node` e não coleta `components/funnels/**`): ler o fonte com `readFileSync` e afirmar (1) `useFunnels(projectId, ESCOPO_DOS_FUNIS_DA_COMPARACAO)` e uma única chamada a `useFunnels(`; (2) `const nomeDoFunil = (id: string) => nomeDoFunilDaComparacao(funis, id);`; (3) `opcoesDaComparacao(funis ?? [], funnelId, f.comparacoes)` seguido de `{x.rotulo}` no `<option>`. O QA rodou um rascunho desse teste no worktree e depois o removeu: ele derruba W1, W2, W3 e W4 (4/4) e passa sem mutação. É 1 arquivo, cerca de 15 linhas.'
    owner: '@dev'
    status: open

  - id: TEST-002
