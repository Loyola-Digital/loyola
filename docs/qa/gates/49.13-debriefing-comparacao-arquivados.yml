    description: 'Sobre o `[AUTO-DECISION]` do @dev: o `doServidor` do teste (a) é um espelho escrito à mão de `routes/funnels.ts:209-214` e não confere nada contra a rota. O que de fato trava o escopo é `expect(ESCOPO_DOS_FUNIS_DA_COMPARACAO).toBe("all")`, que fixa um literal. Não é tautológico: M1 (`"false"`) derruba (a) e (c), e o espelho faz o (c) também morrer. Mas a extração para constante só tem valor se o componente usar a constante, e isso o TEST-001 não prova. Se a rota mudar a semântica de `all`, o espelho continua verde.'
    recommendation: 'Aceitável como está. O TEST-001 resolve o que importa. Opcional: um comentário no `doServidor` apontando que ele espelha `routes/funnels.ts` (já existe) é suficiente.'
