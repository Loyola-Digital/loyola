top_issues:
  - id: 'PERF-001'
    severity: medium
    status: 'RESOLVIDO no QA fix 1'
    finding: >-
      `ttlCutoffForDate` roda uma vez por linha do banco (`meta-insights-cache.ts:115`). No 682ad29, cada
      chamada a `todayInTimezone` criava um `Intl.DateTimeFormat` novo, a uns 30 µs cada. Medido: 20 000 linhas
      levavam 600 ms contra 10 ms com o `toISOString`, e isso bloqueia o event loop. A comparação de lançamentos
      (730 dias × N campanhas) e os perpétuos de 1 ano passam por aqui. Achado pelo @qa e confirmado pelo
      revisor independente.
    fix: 'Formatador criado uma vez por fuso e reaproveitado (`meta-ads.ts`, `formatadorDeDia`). Teste: 5 000 chamadas, no máximo 1 construção. A reversão N5 deixa o teste vermelho.'
  - id: 'REL-001'
    severity: low
    status: 'RESOLVIDO no QA fix 1'
    finding: >-
      `meta-insights-cache.ts:324-325` chamava `dateRangeFromDays(days)` duas vezes. Duas chamadas que cruzassem
      03:00:00Z davam o `since` do dia D e o `until` do D+1, com um dia a mais. Já acontecia na cópia UTC.
    fix: 'A janela é calculada uma vez.'
  - id: 'OBS-001'
    severity: low
    status: 'aceito, fora do escopo'
    finding: 'O fuso é fixo em `ACCOUNT_TIMEZONE` (São Paulo), embora `fetchAccountTimezone` exista. Já era assim em `meta-ads.ts`, e a story deixa isso fora.'
  - id: 'OBS-002'
    severity: low
    status: 'aceito'
    finding: 'Com `days=0` e sem datas, a cópia antiga não pedia nada; a de `meta-ads` dá "só hoje". Nenhum caminho real chega aqui: as rotas validam `days >= 1`, e os loaders mandam `startDate/endDate`. Agora o cache bate com o que a busca ao vivo já fazia.'
  - id: 'TST-001'
    severity: low
    status: 'aceito'
    finding: 'O `describe.each` de TZ pouco exercita, porque nenhum código do caminho usa o fuso local. Faltam as bordas exatas 02:59:59.999Z e 03:00:00Z, cuja lógica está no `Intl`. O AC1 é conferido por regex no código-fonte.'

