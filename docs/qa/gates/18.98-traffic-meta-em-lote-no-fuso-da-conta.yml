story_title: 'Meta em lote no fuso da conta — fim da cópia UTC do dateRangeFromDays'
gate: PASS
status_reason: 'A cópia UTC da janela saiu e o TTL passou a usar o dia de Brasília do `now` recebido. O teste de relógio prova, às 22h30 de Brasília, que o cache pede 20 a 26/10, acerta sem ir à Meta e mantém o dia mais antigo quando a Meta falha. Às 12h, nada muda. A revisão em duas leituras achou um medium de desempenho (PERF-001), com um Intl.DateTimeFormat criado por linha do cache, e um low de janela calculada duas vezes. Os dois foram corrigidos no QA fix 1, cada um com prova por reversão. O que sobra é low, já existia ou está fora do escopo.'
reviewer: 'Quinn'
updated: '2026-10-28T01:15:00Z'
pr: null
