story: '43.2'
gate: PASS
iteration: 1
status_reason: >-
  PASS, e e a primeira desta sequencia de stories que nao carrega uma pendencia
  de "nunca rodou contra dado real". O AC4 fechou com DESVIO ZERO contra a
  propria Meta em 3 anuncios e 4 metricas cada — incluindo o caso de anuncio sem
  video, que volta null dos dois lados. O AC5 foi medido em producao sobre 546
  criativos. Nao ha nada que dependa de deploy para ser verificado: a correcao
  esta provada antes de subir.
  Os dois achados sao LOW, sobre decisoes de design que hoje estao corretas e
  podem envelhecer mal. Nenhum afeta o resultado.
