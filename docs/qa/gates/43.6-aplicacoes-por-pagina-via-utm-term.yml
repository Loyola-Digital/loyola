  newIssue:
    id: QA-43.6-04
    severity: medium
    category: requirements
    title: "Aviso de 'aplicações sem página' aparece em funil que não mudou (AC9)"
    file: packages/web/components/funnels/applications-daily-chart.tsx
    line: 173
    description: >
      O bloco `!lpsOrfas.length && aplicacoesSemPagina > 0` não considera se
      houve quebra. No cenário do AC9 — aba-base sem nenhuma LP — a série
      continua única e idêntica ao que era, mas `aplicacoesSemPagina` é o total
      de linhas, e a tela passa a exibir um aviso âmbar novo.
    concreteCase: >
      dg-pg02: 49 aplicações, série única "apc", NADA mudou com esta story
      (medido pelo próprio @dev). Passaria a mostrar "49 aplicações estão no
      gráfico sem página identificada". Factualmente verdadeiro e operacionalmente
      inútil: aquele funil nunca organizou por página.
    whyItMatters: >
      O AC9 existe para o funil que não usa páginas NÃO mudar — "nada de série
      solitária substituindo um gráfico que funcionava". Um aviso âmbar novo é
      mudança. E a própria story cita a lição da 43.1: aviso que aparece com
      tudo certo ensina o time a ignorar avisos.
    recommendation: >
      Condicionar o bloco também a `paginasVieramDoUtmTerm` — só faz sentido
      falar de "aplicação sem página" quando o gráfico de fato organiza por
      página. Uma linha.
    doesNotRequireNewGate: >
      Fix de uma condição, com o mesmo sinal que já existe no payload. Pode ser
      verificado junto com a validação visual no preview, sem novo ciclo.

