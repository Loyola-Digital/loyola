  - "A Página C aparece: 17 -> PAGINA A 2 + PAGINA C 1 + Sem página 14. É o chamado que originou o Epic 43."
  - "AC1 verificado: a aba -PaginaB segue intacta em 53, inclusive as 9 linhas sem utm_term."
  - "AC6 confirmado por teste: alpha e alphabet NÃO viram LPH com a extração ancorada; extractLPName ficou intocado, como o AC6 exigia."
  - "AC5 resolvido na raiz: o aviso passou a ler as séries do gráfico (ehPagina) em vez dos labels do banco — que era a origem do defeito."
  - "O aviso ganhou ressalva em vez de sumir. Com 14 aplicações sem página, 'LPD não teve aplicação' seria afirmar mais do que se sabe. Está no espírito do Epic 43."
  - "O @dev REFUTOU a premissa do @po sobre o dg-pg02 com evidência (os utm_term não trazem LP) em vez de forçar o exemplo. Reduziu o alcance de 2 funis para 1, honestamente."
  - "Risco descartado por verificação: a comparação entre lançamentos usa aggregateForms (total vs total), então a quebra em N séries não a afeta."
  - "aggregateForms recebeu ehPagina: false — o agregado não é página nenhuma e não contamina o cálculo do aviso."

