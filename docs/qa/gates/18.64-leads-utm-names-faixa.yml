    severity: medium
    finding: 'A resolução de Names e as faixas dependem de dados de PRODUÇÃO: (a) Names só resolvem com conta Meta vinculada — sem ela, exibe o ID cru (fallback correto, não bug); (b) colunas Respondeu?/Faixa só aparecem com pesquisa vinculada ao stage tendo coluna e-mail/telefone (+ faixa). Não validável sem dados reais.'
    suggested_action: 'Validação visual no dashboard com a conta Meta + planilhas/pesquisa reais (DoD pendente). Comunicar que ID cru aparece quando a conta Meta não resolve aquele id — esperado.'
