    severity: low
    finding: 'A busca textual passou a operar sobre os Names nas dimensões traduzidas (cells). Buscar pelo ID cru de campaign/adset/ad não retorna mais resultado nessas dimensões.'
    suggested_action: 'Aceitável e esperado dado o objetivo (mostrar Names). Registrar; se necessário, um follow-up pode indexar o ID cru na busca além do Name.'
  - id: 'PERF-001'
    severity: low
    finding: 'filterSheetRowsByDays roda 2x sobre as mesmas linhas (coletor de IDs + agrupamento). Impacto baixo (planilhas de dezenas/centenas de linhas).'
