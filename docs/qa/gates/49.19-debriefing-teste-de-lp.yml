iteracao_2:
  fidelidade_aos_textos_do_po:
    REQ-001: 'Opção (b), fiel. `debriefing-teste-de-lp.ts` ramifica o texto por resultado: veredito sai com "."; empate, com "— a diferença de taxa não é significativa, mas a CBO está pondo mais verba nela."; sem leitura, com "— sem leitura: {textoSemLeitura}; o teste não rodou e a taxa ainda não indica perdedora.". O motivo vem do mesmo campo que já explica o sem leitura do par, sem número novo, como o @po pediu. O probe P1 da iteração 1 agora sai "… (90,91%) — sem leitura: a janela comum tem 2 dia(s), menos que os 3 do método; o teste não rodou e a taxa ainda não indica perdedora." O aviso continua no sem leitura, como manda o AC6.'
    REQ-002: 'As três notas estão iguais, palavra por palavra, ao texto do @po, cada uma com a sua condição: "Visitas = eventos landing_page_view…" sai sempre que o teste é aplicável; "O par soma os conjuntos…" sai com `par.conjuntos.length >= 2`; "Cada par é testado com p < 0,05…" sai com `par.lpsNaAssinatura >= 3`. O campo novo `lpsNaAssinatura` recebe o número de LPs da assinatura. Sem Bonferroni: o método não muda.'
    REQ-003: 'A frase é a do @po: "Compras = compradores de captação atribuídos pelo Ad ID do utm_content; N de M compradores de captação ficam fora por não terem Ad ID." N é `atribuicao.semAdId` e M é `atribuicao.compradores`, de `publico.midiaPorAnuncio.atribuicao`, a mesma fonte da nota da 49.18. Sem `midiaPorAnuncio` no payload (payload antigo), a frase não sai, sem número inventado. Observação: quem tem ad_id fora do ad-level também fica fora e não entra no N. A frase do @po fala só de "não terem Ad ID", e no PG05 esse grupo é 0.'
  mutacoes_do_qa: 'Usei `scratchpad/qa-mut-4919-it2.py` contra as 31 suítes de debriefing + Fisher, restaurando cada mutação. O `git status` ficou limpo no fim. As 4 sobreviventes da iteração 1 (Q5, Q7, Q8, Q19) agora MORREM. Das 13 novas nos 3 REQs, 12 morrem: N1 (o sem leitura volta a dizer "não é significativa"), N2 (sem leitura sem o motivo), N3 (veredito com a frase do empate), N4 (render, opção a: o aviso some no sem leitura), N5 e N6 (limite da nota de conjuntos), N7 (várias comparações já com 2 LPs), N8 (`lpsNaAssinatura` fixo no motor), N9 (nota de visitas some), N10 e N11 (N e M trocados) e N12 (chamador do render: a atribuição não é lida do payload completo). Sobrevive 1, a N13: a condição da nota de conjuntos lendo `par.anuncios.length` no lugar de `par.conjuntos.length` (TEST-002).'
  mutacoes_do_dev: 'Rodei uma cópia do `mut-4919-qa1.py` com saída própria: 71 de 71 morrem.'
  ac7_sha: 'O `ac7-4919.mts` contra a base independente do QA (`qa-base-4919`, de `git archive a1d8d121`) deu os 7 cenários com SHA IDÊNTICO ao da iteração 1, no HTML inteiro sem o bloco e no payload sem `publico.testeDeLp`. Pelo probe, o bloco cresceu (7.032 bytes no final e 7.109 no parcial, por causa das notas), mas continua aparecendo uma vez só, sem `<section>` aninhada, e o campo continua aparecendo uma vez só no payload.'
  execucao: 'Debriefing + Fisher: 31 arquivos, 962/962. `tsc --noEmit` da API: exit 0. `eslint src/`: 0 erros e 1 warning que já existia. API inteira: 4.723 passando e as 10 falhas já conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2). Web e shared: o diff não toca (N/A).'
  api_contract: 'Sem rota nova e sem mudança de resposta de rota. `lpsNaAssinatura` é aditivo dentro de `publico.testeDeLp` (payload gravado, lido só pelo render do servidor). `API_CONTRACT_VERSION` fica em 36.'

issues:
  - id: REQ-001
    severity: medium
    category: requirements
    description: 'Num par "sem leitura", o texto da verba afirma um resultado estatístico que não foi calculado. Em `debriefing-teste-de-lp.ts:552-560`, a verba invertida é avaliada em qualquer resultado diferente de "veredito", e o texto acrescenta "a diferença de taxa não é significativa, mas a CBO está pondo mais verba nela". Isso inclui o "sem-leitura". Com MENOS_DE_3_DIAS (ou COMPRAS_ACIMA_DAS_VISITAS), as taxas existem, o Fisher não roda, e mesmo assim o documento mostra o aviso amarelo `data-verba-invertida` com a frase "não é significativa" (`debriefing-render.ts`, `blocoDoParDeLp`). Reproduzido em `scratchpad/qa-probe-4919.mts` (P1): uma janela de 2 dias, LPA com 1/200 e 90,91% da verba, LPB com 10/200, dá "Sem leitura: a janela comum tem 2 dia(s)…" e, logo abaixo, "A LP com menor compras ÷ visitas (LPA, 0,50%) recebe a maior parcela da verba do par (90,91%) — a diferença de taxa não é significativa…". É o caso típico da estreia de uma LP (no PG05, LPH, LPI e LPJ estrearam em 07/10). O "sem leitura" do método existe para não mover verba com 1–2 dias de dado, e o aviso empurra justamente essa decisão. Nenhum teste cobre verba invertida com "sem leitura": o rascunho do QA tem um caso que falha com o código de hoje.'
    recommendation: '@po decide: (a) no "sem-leitura", não sinalizar a verba; ou (b) sinalizar com outra ressalva, por exemplo "sem leitura — as taxas ainda não se comparam (janela de N dias)". Em qualquer caso, a frase "não é significativa" só deve sair com `resultado === "empate"`. É 1 condição no motor mais 1 teste. O AC6 não condiciona ao veredito, então isto é precisão do texto, não mudança de escopo.'
    owner: '@po → @dev'
    status: closed (iteração 2)

  - id: TEST-001
    severity: low
    category: tests
    description: 'Das 19 mutações do QA (`scratchpad/qa-mut-4919.py`, contra as 31 suítes de debriefing + Fisher, cada uma restaurada, `git status` limpo no fim), 14 morrem e 5 sobrevivem. Quatro não são equivalentes. (Q5) A compra num dia do BURACO da janela (entre o início e o fim, num dia sem investimento de uma das LPs) passaria a contar: o código está certo, porque usa o conjunto de dias, mas o teste "janela com intervalo" não põe comprador no buraco. (Q7) Investimento igual nas duas LPs passaria a ser sinalizado como verba invertida. (Q8) Sem a guarda de taxas iguais, nada muda, porque o teste de "taxas iguais" só usa a orientação em que a LP de investimento maior é a primeira. (Q19) O limite de "p < 0,0001" no texto não tem teste entre 0,0001 e 0,001. A quinta, (Q10) campanha identificada só pelo nome e não pelo id, é quase equivalente: duas campanhas com o mesmo nome e a mesma LP caem no mesmo grupo de qualquer jeito, e muda só a contagem de campanhas.'
    recommendation: 'O rascunho `scratchpad/qa-rascunho-teste-4919.ts` derruba Q5, Q7, Q8 e Q19 (4/4) e passa sem mutação. Foi provado na worktree e removido. Pode ir para `debriefing-teste-de-lp-49-19.test.ts` junto com o fix do REQ-001.'
    owner: '@dev'
    status: closed (iteração 2)

  - id: REQ-002
    severity: low
    category: requirements
    description: 'Três ressalvas estatísticas, para o dono saber o que o número diz e o que não diz. Nenhuma é defeito: todas seguem o método. (1) Com 3 ou mais LPs na mesma assinatura, cada par usa alfa 0,05 sem correção para comparações múltiplas (AUTO-DECISION do @dev; com 3 LPs, a chance de pelo menos um falso veredito sobe para cerca de 14%). (2) O Fisher trata cada `landing_page_view` como uma tentativa independente, mas o LPV é evento e não pessoa, enquanto as compras são pessoas. (3) O par agrega os conjuntos. Sob CBO, a distribuição da verba entre conjuntos pode diferir de uma LP para a outra, e o agregado pode inverter o resultado por conjunto (paradoxo de Simpson). O AC5, mesmo criativo nas duas LPs, ajuda a enxergar isso.'
    recommendation: 'Nada no código agora. Se o dono quiser, uma linha de rodapé no bloco. Fica com o @po.'
    owner: '@po'
    status: closed (iteração 2)

  - id: REQ-003
    severity: low
    category: requirements
    description: 'O bloco do teste de LP não diz que as compras cobrem só os compradores com Ad ID no utm_content. No PG05, isso é 104 de 215 (111 sem Ad ID, 52%). A conta aparece na nota da Mídia por Anúncio, na mesma aba (o REQ-001 da 49.18), e não aqui. Isso não enviesa o Fisher por si: os 111 incluem orgânico, `co=org` e sem rastreio, e o numerador e o denominador são os da mídia paga. Mas viraria viés se uma LP perdesse a UTM no checkout e a outra não.'
    recommendation: 'Junto com o REQ-001 da 49.18: uma frase no rodapé do bloco ("compras = compradores atribuídos pelo Ad ID; N de M compradores de captação sem Ad ID ficam fora").'
    owner: '@po'
    status: closed (iteração 2)

  - id: TEST-002
    severity: low
    category: tests
    description: 'Iteração 2. A mutação N13 sobrevive: trocar a condição da nota "O par soma os conjuntos" de `par.conjuntos.length >= 2` para `par.anuncios.length >= 2` não derruba nenhum teste. Nas fixtures, o número de conjuntos e o de anúncios ficam do mesmo lado do limite 2.'
    recommendation: 'Um caso de render com 1 conjunto e 2+ anúncios: a nota não sai. E o contrário: 2+ conjuntos e 1 anúncio, a nota sai. Não bloqueia.'
    owner: '@dev'
    status: open

  - id: PERG-1
    severity: low
    category: requirements
    description: 'Virou a P-25 do @po. Pergunta do @dev ao dono, registrada sem decisão: conjuntos "iguais" querem dizer igualdade exata dos nomes ou interseção? No PG05, a LPA estático quente tem 4 conjuntos e a LPF tem 3 (falta `01_FD-ST_ALLINONE90D_INTERESSES`), e por isso as duas não pareiam. Acréscimo do QA para a mesma pergunta: a assinatura (formato, anúncios, conjuntos) é medida no período INTEIRO do relatório, não na janela comum do par. Um conjunto ou anúncio que rodou só antes de a outra LP estrear já impede o par, mesmo que, nos dias em comum, as duas tenham rodado exatamente nos mesmos conjuntos. Não reconsultei produção para ver se é o caso do ALLINONE90D.'
    owner: 'dono via @po'
    status: pending

  - id: PERG-2
    severity: low
    category: requirements
    description: 'Virou a P-26 do @po. Pergunta do @dev ao dono, registrada sem decisão: `lpaa` e `lpa` são a mesma LP? Hoje a `chaveLp` (regra da tabela de LPs, reaproveitada como o AC1 manda) soma as duas como LPA, e o rótulo fino aparece entre parênteses. Observação do QA: o parser reaproveitado também lê o bloco `--lp--` como LP "LP" e `--lpa1` como LPA (`scratchpad/qa-probe-4919.mts`, P8). É comportamento herdado, não desta story.'
    owner: 'dono via @po'
    status: pending

  - id: DOC-001
    severity: low
    category: documentation
    description: 'Validação visual do dono pendente (DoD).'
    owner: 'Danilo'
    status: pending

