    severity: low
    category: tests
    description: 'Iteração 3. Cinco mutações de R12-6 sobrevivem à suíte: L7 (junção de cópias da mesma LP sem normalizar os nomes), Q21 (sem a guarda `a.lp === b.lp`, duas campanhas da MESMA LP com conjunto em comum viram o par "LPA × LPA"), Q24 (`conjuntosForaDoPar` só da 1ª LP; os testes só têm o conjunto a mais do lado da 1ª), Q27 (compradores pelos Ad IDs só da janela: o ponto 4 da R12-6 conta o comprador de anúncio da interseção que comprou na janela, mesmo que o anúncio não tenha rodado nela) e Q28 (nota de conjuntos somados contando também os de fora do par). O código está certo nos cinco.'
    recommendation: 'O rascunho `scratchpad/qa-4919-r3/qa-rascunho-4919-r3.test.ts` (5 casos) passa sem mutação e mata as 5 (5/5). Foi provado na worktree e removido. Pode ir para `debriefing-teste-de-lp-49-19.test.ts`. Não bloqueia.'
    owner: '@dev'
