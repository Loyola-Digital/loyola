  - id: PERG-1
    severity: low
    category: requirements
    description: 'Virou a P-25 do @po. Pergunta do @dev ao dono, registrada sem decisão: conjuntos "iguais" querem dizer igualdade exata dos nomes ou interseção? No PG05, a LPA estático quente tem 4 conjuntos e a LPF tem 3 (falta `01_FD-ST_ALLINONE90D_INTERESSES`), e por isso as duas não pareiam. Acréscimo do QA para a mesma pergunta: a assinatura (formato, anúncios, conjuntos) é medida no período INTEIRO do relatório, não na janela comum do par. Um conjunto ou anúncio que rodou só antes de a outra LP estrear já impede o par, mesmo que, nos dias em comum, as duas tenham rodado exatamente nos mesmos conjuntos. Não reconsultei produção para ver se é o caso do ALLINONE90D.'
    owner: 'dono via @po'
    status: closed (R12-6, ratificada pelo @po em 86a9dc5a)

