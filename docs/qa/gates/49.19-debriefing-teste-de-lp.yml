fisher_conferido:
  definicao: 'Bilateral "minlike", a mesma do R `fisher.test` e do `scipy.stats.fisher_exact`: soma P(x) de toda tabela com probabilidade ≤ P(observada). O R compara com a tolerância relativa `d <= d_obs * (1 + 1e-7)`; aqui a comparação é EXATA, com os numeradores C(r1,x)·C(r2,c1−x) em BigInt. Sem tolerância, os empates verdadeiros entram por igualdade exata. A decisão `abaixoDoAlfa` é `soma·20 < total`, em inteiros. Só o p exibido passa para `number`, com pelo menos 64 bits de quociente.'
  referencias_independentes: 'O QA escreveu um oráculo próprio em Python (`fractions.Fraction` sobre `math.comb`), a regra do R reimplementada (lgamma + tolerância 1e-7) e o `scipy.stats.fisher_exact` 1.17.1, e comparou com o TS em 28.967 tabelas (`scratchpad/qa-fisher-*.py/.mts`): todas as 28.561 com a, b, c, d de 0 a 12 (cobre zeros, linhas e colunas vazias e assimetrias), mais 400 tabelas aleatórias de LP (até 3.000 visitas por lado) e casos grandes. O p do TS é igual ao da fração exata com erro relativo máximo de 0 (bit a bit), e a decisão p < 0,05 também é igual em 100% das tabelas. Contra o scipy, o erro relativo máximo é 2,7e-11 (na tabela de ~1.500 dígitos). A decisão diverge em 2 tabelas e, contra a regra do R, em 1, sempre nas tabelas com p = 1/20 EXATO. Nelas, o ponto flutuante dá 0,04999… e decidiria "veredito". O TS dá empate, que é o correto para p < 0,05.'
  valores: 'TeaTasting [[3,1],[1,3]] 0,4857 (R e scipy batem); Wikipédia [[1,9],[11,3]] 0,0027595 (bate); Convictions [[2,15],[10,3]] 0,0005367 (bate); PG05 LPA×LPG [[11,288],[16,317]] 0,5572 (bate com o scipy e com a fração); fronteira [[1,10],[10,11]] 0,049904 → veredito e [[1,5],[13,5]] 0,050083 → empate; as 8 orientações de p = 1/20 → empate.'

checks:
  fidelidade_ao_metodo: 'Passo 6, ponto por ponto. A LP sai do sufixo da campanha (parser reaproveitado). Só pareiam LPs com o mesmo formato, os mesmos anúncios e os mesmos conjuntos (por nome, como corrigiu o @po). A janela é a de dias inteiros em que as duas investiram, nunca o acumulado. Decide compras ÷ landing_page_view, com CPA, ROAS e tier ao lado. Fisher bilateral com 0,05. Menos de 3 dias na janela comum dá "sem leitura". O mesmo criativo aparece nas duas LPs, e a verba do par, com o sinal. Rodada 11: o corte é ontem, porque o loader já cortou (R11-0b); imposto do Loyola (R11-0c, a mutação E4 do @dev morre); fontes do Loyola (R11-0d); vale no parcial e no final (R11-0g, testado de ponta a ponta nos dois modos). O formato da resposta (item 6, "veredito com p-valor e recomendação de verba") está coberto pelo veredito com p e pelo sinal da verba.'
  acceptance_criteria: 'AC1 ✓: campanha sem LP contada com o investimento (Q17 e a R5 do @dev morrem). AC2 ✓: assinatura por nome normalizado, motivo do sem par, ids diferentes pareiam (Q11 e Q12 no chamador morrem). AC3 ✓: interseção dos dias com investimento > 0, linhas e compras só nesses dias (probe P3/P5; a Q5 sobrevive por falta de teste, mas o código está certo). AC4 ✓: tabela (compras, visitas − compras), p no texto e em `data-p-valor` (Q16 morre), "sem leitura" contado na janela COMUM, com 2 e 3 dias testados, e Fisher conferido acima. AC5 ✓. AC6 ✓ no núcleo, mas com o texto errado no "sem leitura" (REQ-001). AC7 ✓ (ver ac7_sha). AC8 ✓: testes que falham com o código de hoje e mutações, inclusive nos chamadores.'
  compras_por_visita: 'Os compradores vêm de `compradoresDaMidia` (49.18): UMA linha por PESSOA (critério headline, `compradoresCaptacao.porEmail`), com o Ad ID do `utm_content` da linha-âncora (ingresso ou combo). Quem comprou em duas campanhas é contado uma vez só, na campanha do Ad ID da âncora (o ad_id pertence a uma única campanha, via `campanhaPorAdId`). Não há dupla contagem entre LPs, e a Q6 (comprador contado nas duas LPs) morre com 3 falhas. Comprador sem `utm_content` (ou com `co=` que não é Ad ID) fica com `adId = null` e sai de todo numerador, SEM derrubar o par. O par só vira "sem leitura" por `SEM_UTM_CONTENT_NA_VENDA` quando NENHUMA venda da entrada traz utm_content (`vendasComConteudo`, flag global). Isso é o que o método pede: o passo 4 atribui pelo `co=`, e o comprador sem Ad ID não é de LP nenhuma. O ponto de leitura está no REQ-003. O numerador só leva compradores de Ad IDs com `landing_page_view` (a regra da 49.18), e o mesmo numerador alimenta o Fisher, a taxa e o sinal de verba. O CPA, o ROAS e o tier usam todos os compradores atribuídos do lado (base declarada no rodapé).'
  janela: '`dias` é a interseção dos dias com investimento > 0 das duas LPs. "< 3 dias" é contado nessa interseção, não no total da LP (testado com 2 e 3 dias; L13/L14 do @dev morrem). Linha com investimento 0 não abre dia (P5). A compra entra pelo dia da âncora, só se o dia estiver no CONJUNTO da janela, com buraco excluído (Q5: o código está certo, falta teste).'
  verba_invertida: 'É sinalizada quando a LP com MENOR compras ÷ visitas tem investimento ESTRITAMENTE maior no par, na janela. Taxas iguais: sem sinal. Investimento igual: sem sinal (P2; falta teste, Q7). Também é sinalizada no empate, com a ressalva (AUTO-DECISION aceito: o AC6 não condiciona). Defeito no "sem leitura": REQ-001.'
  ac7_sha: 'Base independente do QA: `git archive a1d8d121 packages/api/src` mais só a fixture nova (`scratchpad/qa-base-4919`). Rodei o `ac7-4919.mts` do @dev nas duas árvores: os 7 cenários dão SHA igual para o HTML inteiro sem o bloco e para o payload sem `publico.testeDeLp`. Os SHA também batem com o `ac7-base-4919.json` do @dev. O script compara o que diz comparar (probe `qa-ac7-probe-4919.mts`): em cada cenário o bloco existe uma vez só, sem `<section>` aninhada (o corte até o primeiro `</section>` é exato), e com conteúdo de verdade (2 pares, 3 sem par e 1 sem LP no final; empate p = 0,1204 e sem leitura no parcial). O payload tem `testeDeLp` exatamente uma vez, então a comparação não carrega o campo no payload gravado. No cenário sem ad-level, o bloco é a lacuna.'
  unit_tests: 'Debriefing + Fisher (API): 31 arquivos, 952/952. As 55 mutações do @dev, reexecutadas (cópia do runner com saída própria): 55 morrem. Das 19 do QA, 14 morrem: Q1–Q4 (Fisher: suporte, observado, precisão, dobro da menor cauda), Q6 (comprador nas duas LPs), Q9 (LPV ausente de um lado), Q11 e Q12 (chamador do Motor II), Q13 (loader), Q14 (Motor II no parcial com o carrinho fechado), Q15–Q18 (render a partir do payload: aviso de verba, `data-p-valor`, sem LP, par sem leitura). Sobrevivem Q5, Q7, Q8, Q19 e Q10 (TEST-001).'
  no_regressions: 'API: `node_modules/.bin/tsc --noEmit` com exit 0 (10 s); `eslint src/` com 0 erros e 1 warning que já existia (`lp-campaigns.ts:57`). A API inteira dá 4.713 passando e 10 falhas, as 10 pré-existentes conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2). Web e shared: o diff não toca `packages/web` nem `packages/shared`, então não rodei o `next build` e o `tsc` do web (N/A). O @dev registra os dois verdes.'
  caso_real_pg05: 'Conferido só no registro (`prod-4919.mts`/`.out`), sem rodar de novo. O pool usa `options: -c default_transaction_read_only=on`, e o `.out` traz `"sessao_read_only": "on"`. O `gravar` é no-op (`"nao-gravado"`). A saída tem só agregados, nomes de campanha, conjunto e anúncio e contagens, sem e-mail nem telefone (nenhum "@" no `.out`). A config é simulada e rotulada. Os números conferem com o Dev Agent Record: LPA × LPG em vídeo, 5 dias, [[11,288],[16,317]], p = 0,5572 (bate com o oráculo), empate, verba não invertida; LPF × LPI e LPH × LPJ com 1 dia, sem leitura; 7 campanhas sem par.'
  security: 'Os nomes de campanha, conjunto e anúncio passam por `esc()`, e o `data-p-valor` também. Sem rota nova e sem entrada de usuário. O payload ganhou só nomes e números, sem PII.'
  api_contract: 'Sem rota nova e sem mudança de resposta de rota. O campo `publico.testeDeLp` é aditivo e opcional no payload gravado, lido só pelo render do servidor, e o web não o consome. `API_CONTRACT_VERSION` fica em 36 e `DEBRIEFING_PAYLOAD_VERSAO` não sobe, a mesma regra ratificada na 49.12, na 49.17 e na 49.18. Payload antigo mostra "não calculado" (a R10 do @dev morre).'
  performance: 'O Fisher é O(min(compras)) em BigInt. A tabela de ~1.500 dígitos roda em milissegundos, e no teste de LP `a + c` é o total de compras, pequeno. O motor faz uma passada por campanha e outra por par. Sem I/O novo além de uma coluna no select do loader.'

