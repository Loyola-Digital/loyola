iteracao_3:
  escopo: 'R12-6 e os dois rebases. `git diff --stat ff7975e2 HEAD -- packages` e `71710aca HEAD -- packages` vazios: o código e os testes são os mesmos desde a execução das 82/82 mutações do @dev; entre as bases só mudaram testes e docs da 49.18 e o Planner (#1004).'
  r12_6_contra_o_po: 'Os 7 pontos ratificados conferidos no código. (1) Unidade: grupo = LP + assinatura exata (formato, anúncios, conjuntos normalizados); cópias idênticas se juntam. (2) Par: mesmo formato + interseção não vazia de `adset_name` normalizado + os mesmos anúncios DENTRO da interseção (`comparar`). (3) Interseção vazia: diferença "conjuntos (nenhum nome de conjunto em comum)". (4) `parDe` filtra as linhas pela interseção antes da janela, das visitas, da verba e dos Ad IDs dos compradores. (5) `conjuntosForaDoPar` no payload e no render (span `data-conjuntos-fora-do-par`). (6) `lpsNaAssinatura` = LPs do componente ligado (union-find). (7) Nomes de conjunto da janela do relatório (ad-level do loader). A `sec-desc` do bloco descreve a regra nova.'
  observacao_grupo: 'Com 1 LPA pareando com 2 campanhas LPF de conjuntos diferentes, saem 2 comparações e `lpsNaAssinatura` = 2, sem a nota de várias comparações. É a regra ratificada (3 ou mais LPs); só registro.'
  rebase_4918: '`montarPayloadDebriefing` segue com `comMelhorVersao` (`debriefing-payload.ts:172`; o arquivo está fora do diff da branch). `publicoDaCampanha` NÃO delega em `ehFrioAdv` nem na main nem nesta branch: `ehFrioAdv` só existe na 49.20 (`7b119775`, não mergeada). A 49.19 não toca `publicoDaCampanha` (DOC-002).'
