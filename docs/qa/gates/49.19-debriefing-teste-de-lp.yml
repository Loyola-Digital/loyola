  mutacoes_do_qa: '`scratchpad/qa-4919-r3/mut.py`, 18 mutações contra as suítes da 49.19, da 49.18 e de em-andamento, cada uma restaurada (`git status` limpo). Morrem 13: I6, I7, I10, I11, I11b (union-find não une), L4, L5, L6, Q20 (interseção sem normalizar, 38 falhas), Q22 (anúncios da interseção não comparados), Q23 (mesmo criativo pelos anúncios da campanha inteira), Q25 (rótulo antigo), Q26 (formato fora do par). Sobrevivem 5 (TEST-003). N13 da iteração 2 agora morre (TEST-002 fechado).'
