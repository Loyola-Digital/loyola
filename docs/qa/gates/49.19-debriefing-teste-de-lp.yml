  - '[AUTO-DECISION] Comprador sem utm_content deveria derrubar o par? → Não (razão: o método atribui pelo `co=`; o comprador sem Ad ID não pertence a LP nenhuma; o par só fica "sem leitura" quando a planilha não tem utm_content). O ponto de leitura vai para o REQ-003, low.'
  - '[AUTO-DECISION] Os AUTO-DECISIONs do @dev: Fisher em BigInt (aceito, e melhor que o R/scipy na fronteira); assinatura no ad-level do período (aceito, com o acréscimo à PERG-1); lpaa = lpa (aceito como regra herdada, PERG-2); pares por combinação sem correção (aceito, ressalva no REQ-002); verba também no empate (aceito, mas não no "sem leitura": REQ-001); comparação principal sem teste de LP no documento (aceito); nenhuma lacuna nova em `lacunas[]` (aceito, a seção 17 fica congelada).'
