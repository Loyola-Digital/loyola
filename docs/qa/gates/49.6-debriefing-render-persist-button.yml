top_issues:
  - id: 'TEST-496-1'
    severity: medium
    finding: 'Q1, Q2, Q5 e Q7 sobrevivem. Rótulo em todos os pontos, troca de abas, corpo explicado do 422 de conferência e "o JS não toca nas tabelas" não estão protegidos por teste. Hoje estão certos.'
    suggested_action: '(a) Afirmar o `display` do datalabels: não pode ser false, e só oculta null/0. (b) Teste de que cada `data-tab` dos botões tem `id="tab-<x>"` e que o script usa o mesmo prefixo, ou rodar o harness headless num teste. (c) `toMatchObject({erro, detalhe: expect.stringMatching(/\S/), acao: expect.stringMatching(/\S/)})` em TODO 422. (d) REL-002 por lista branca: o script de gráficos só referencia `canvas`/`.sem-grafico`, nenhum seletor de `table`/`tbody`/`tr`.'
    owner: dev
  - id: 'FMT-496-1'
    severity: low
    finding: 'No PG02 real aparece "2293 vendas, 5 via TMB" sem milhar, na seção 00 (Definições) e no tnote "s/ TMB — …". A origem é `textoTmb` (`debriefing-hygiene.ts:593`), que interpola o inteiro cru no texto do payload, e o render (`debriefing-render.ts:437`) o repassa. Fere o AC7 ("inteiro 1.234"). O teste de formato US não pega porque a fixture sintética tem menos de 1.000 vendas.'
    suggested_action: 'O render deve compor a frase com `inteiroBr` a partir dos números (tmb.vendas / tmb.viaTmb), sem usar `tmb.texto`. Também vale um caso ≥ 1.000 na fixture do teste de formatação. Corrigir no `textoTmb` mexe no payload da 49.3, então preferir o render.'
    owner: dev
  - id: 'UX-496-1'
    severity: low
    finding: 'A coluna de origem da data na auditoria mostra o código cru `SEM_DATA_DO_LEAD`.'
    suggested_action: 'Mapear para rótulo legível (ex.: "sem data do lead").'
    owner: dev
  - id: 'PERF-496-1'
    severity: low
    finding: 'O cache do GET memoiza também o `null` (etapa sem pesquisa). Pesquisa recém-conectada aparece como "sem pesquisa" por até 60 s.'
    suggested_action: 'Aceitável. Se incomodar, não cachear `null`.'
    owner: dev
  - id: 'UX-496-2'
    severity: low
    finding: 'O erro de "marcar combinação como validada" sai em toast, que some. O AC11 exige tela persistente só para a geração.'
    suggested_action: 'Opcional: mostrar no bloco do gate do formulário.'
    owner: dev

