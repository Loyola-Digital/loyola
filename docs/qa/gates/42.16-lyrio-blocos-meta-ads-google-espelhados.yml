top_issues:
  - id: TEST-001
    severity: low
    category: tests
    description: 'Q5: em `packages/web/lib/utils/cards-do-bloco-lyrio.ts:167`, troquei `if (canal === "meta") return memorialDoErroDaMeta(...)` por `if (true)` e a mutação SOBREVIVE às 7 suítes da etapa. Com ela, o memorial dos cards do bloco Google em erro diria "Meta Ads API indisponível" e "A consulta do gasto diário da Meta falhou", apontando para a rota da Meta. O teste de erro (`cards-do-bloco-lyrio.test.ts`, "investimento desconhecido") só afirma `result: "—"` e que a mensagem aparece no ROAS, e as duas coisas valem para os dois memoriais. O aviso do bloco está protegido: a Q6, que dá o texto da Meta ao aviso do Google, cai.'
    recommendation: 'No caso `google` do teste de tráfego em erro, afirmar `formula.expression` do Investimento (Google) = "Google Ads API indisponível" (e, no caso `meta`, "Meta Ads API indisponível").'
    owner: '@dev'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Ramos de render do filtro e do bloco sem teste de fio. Cada mutação abaixo SOBREVIVE às 7 suítes. Q8 (`lyrio-detail-table.tsx:316`): tirar o `plataforma === "todas"` do aviso âmbar. Com o filtro Meta em Público ou Criativo, a tela voltaria a dizer que "as N campanhas do Google aparecem só em Por Campanha", quando o usuário escolheu esconder o Google. Q9 (`:502`): tirar a nota do rodapé do filtro Google. As colunas Vendas e Receita ficariam "—" sem explicação, ou com o texto da Meta, que fala de "Sem linha nesta tabela", uma linha que o filtro esconde. Q10 (`lyrio-bloco-do-canal.tsx:123`): o esqueleto dos cards de venda nunca aparece. Enquanto a venda carrega, os cards mostrariam "—" sem memorial, como se a venda fosse desconhecida. Q12 (`lyrio-detail-table.tsx:169`): tirar o `googleNoFiltro` do `loadingGoogle`. Com o filtro Meta, a tabela esperaria o `/daily` do Google para aparecer. Hoje o código está certo nos quatro.'
    recommendation: 'Acrescentar ao `fio-da-tela-lyrio-42-16.test.ts`, por regex, as quatro condições: `temGoogle && plataforma === "todas" && dimensao !== "campaign"`, o ramo `plataforma === "google"` da nota, `{cards.carregandoVendas` e `const loadingGoogle = googleNoFiltro && googleTrafego.tipo === "carregando";`.'
    owner: '@dev'
    status: open

  - id: TEST-003
    severity: low
    category: tests
    description: 'Q13: em `packages/web/lib/utils/janela-dos-cards-lyrio.ts:165`, `inicioDaJanela(...) < desde` → `<=` SOBREVIVE. No dia em que a janela começa EXATAMENTE em `atributosDesde`, os cards de venda da Meta diriam "desde 06/10" em vez de "06/10 a 16/10", e o memorial diria que a cobertura começa depois da janela. A data é a mesma, então o número não engana; o que muda é a frase. É a mesma lacuna de borda da 42.13 (TEST-002 de lá, a borda `>=`). A M1 do @dev (`>`) cai porque troca o lado, não a igualdade.'
    recommendation: 'Um caso com `atributosDesde` = o início da janela (ex.: days = 11 com hoje 16/10 → início 06/10), esperando o intervalo.'
    owner: '@dev'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: 'O memorial do Google em erro (`memorialDoGoogleSemNumero`, `packages/web/lib/utils/lyrio-google-ads.ts:135`) cita como fonte `GET /api/google-ads/analytics/:accountId/campaigns`. No bloco Google e no aviso do Detalhamento, o erro agora vem do `/daily` por campanha (`trafegoDoGoogleNaRegua`). O Resumo já tinha esse descompasso desde a 42.14, e a 42.16 o leva para mais 9 cards. A causa e a mensagem estão certas; só a rota citada está errada.'
    recommendation: 'Trocar a fonte do ramo de erro para `GET /api/google-ads/analytics/:accountId/daily (por campanha vinculada)`, ou receber a fonte por parâmetro.'
    owner: '@dev'
    status: open

  - id: MNT-001
    severity: low
    category: maintainability
    description: '`googleTrafegoFiltro` (`lyrio-stage-view.tsx:225`) é recalculado a cada render, sem `useMemo`, e devolve um objeto e um `Map` novos. Ele é dependência do `useMemo` das linhas em `lyrio-detail-table.tsx`, então as linhas e a ordenação se refazem a cada render do pai, e o memo não serve para nada. O custo é desprezível com 1 a 3 campanhas. Não há efeito que dependa dele, então não existe risco de laço.'
    recommendation: 'Opcional: memorizar `googleConsultas`/`googleTrafegoFiltro` sobre `googleDaily`, `contaGoogle`, `days` e `hoje`.'
    owner: '@dev'
    status: open

auto_decisions_reviewed:
  - '"—" em Vendas e Receita com o filtro Google: ACEITA. É o mesmo "—" que a linha do Google já tinha em "Todas". O AC4d pede o Total "só das linhas exibidas", e nenhuma linha do Google tem venda por campanha. Mostrar `canais.google.vendas` no Total seria um número sem linha que o explique. A nota do rodapé explica por que fica "—" (mas não tem teste: TEST-002/Q9).'
  - 'Campanha do Google sem entrega não vira linha: ACEITA. O `/campaigns` de antes filtrava `segments.date` no WHERE, e a API do Google não devolve linha com todas as métricas zeradas, então a lista de antes também não tinha essas campanhas. A regra nova entra com gasto OU impressão OU clique, e a M26 do dev (só clique) cai. Efeito colateral, a favor: uma campanha REMOVED com gasto na janela agora aparece (o `/campaigns` a excluía), sem status.'
  - 'Falha do status sem aviso: ACEITA (PO-03). O status só vira o `title` da linha (`lyrio-detail-table.tsx:401`). Nenhuma métrica depende dele, e o erro que importa (`/daily`) tem aviso.'
  - 'Testes de fio da 42.13 reescritos: as invariantes CONTINUAM provadas. Conferi item a item: (a) a venda "oculta" sem RevenueCat agora é decidida no pai, e as duas entradas usam `vendasDosBlocos`; (b) a conta decide antes da consulta (`trafegoDoGoogleNaRegua(contaGoogle, …)` no fio, e "sem_conta antes" no teste unitário); (c) o alerta desenha título, detalhe e orientação; (d) o aviso do Detalhamento vem do mesmo estado; (e) REL-001: o erro da Meta decide antes do dado (unitário de `trafegoDoBlocoDaMeta`, e a M18 cai); (f) o `days` da consulta da Meta segue amarrado em `fio-da-tela-lyrio-42-14.test.ts:21`, e a minha Q16, que troca o erro do filtro pelo dos 28 dias, cai; (g) a cobertura na nota do funil. Nenhuma asserção antiga foi só apagada: as que liam o `LyrioMetaKpis` e o `GoogleAdsKpis` foram religadas ao pai, ao `cards-do-bloco-lyrio.ts` ou ao `lyrio-bloco-do-canal.tsx`.'
  - 'A etapa "Vendas" do funil também leva "desde": ACEITA. É o mesmo número do card Vendas, e o teste cobre `funil-vendas-meta`.'

