story_title: 'Lyrio — blocos Meta Ads e Google Ads com os mesmos cards e o período em cada card, e filtro Meta/Google no Detalhamento'
gate: PASS
status_reason: 'Gate único sobre 0fab2ff4, revisão independente do diff 1158c44f..0fab2ff4 inteiro (15 arquivos, 1.567+/455−). AC1 a AC6 estão atendidos no código. Os pontos de regra conferem. (1) A régua de SP do Google soma gasto, impressões e cliques no mesmo recorte [hoje − (N − 1), hoje]. Um dia de fora em cada borda é testado às 23:30 de SP, com TZ = UTC, SP e Tóquio. CTR, CPC e CPM saem das SOMAS: a linha do Google não carrega mais nenhuma taxa da API, então uma média de médias não tem nem como ser escrita. (2) O Google não declara "desde": a rota não tem uma data de cobertura do canal Google, e o memorial diz isso. (3) O filtro Plataforma liga e desliga as consultas por uma função pura. (4) Com o filtro "Todas", nenhum número da Meta muda em relação à main (a mesma consulta, a mesma função). O que muda nas linhas do Google é intencional (D16): investimento, impressões e cliques passam da janela N + 1 em UTC do `/campaigns` para a régua de SP do `/daily`. Com isso, o Total da tabela muda pelo mesmo motivo, e o bloco Google passa a bater com o Investimento (Google) do Resumo. Das minhas 20 mutações, 13 caem e 1 é equivalente. As 6 que sobrevivem são lacunas de teste em textos e ramos de render, todas low (TEST-001 a TEST-003). Ficam pendentes do dono, sem bloquear: a validação visual e a conferência em produção do DoD.'
reviewer: 'Quinn'
updated: '2026-10-28T01:45:00Z'
