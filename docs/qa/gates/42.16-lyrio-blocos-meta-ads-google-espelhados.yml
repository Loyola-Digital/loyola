checks:
  code_review: 'Li o diff inteiro. RÉGUA DO GOOGLE (`google-ads-na-regua.ts`): `trafegoNaRegua` soma gasto (em centavos), impressões e cliques só nas linhas com `inicio <= date <= hoje`. `trafegoDoGoogleNaRegua` decide nesta ordem: a conta, depois QUALQUER erro (nunca soma parcial), depois o carregando. Devolve o total e `porCampanha`. O `investimentoDoGoogleNaRegua` do Resumo virou uma derivação dela, com o mesmo arredondamento; o atalho `consultas.length === 0` saiu, e o caminho geral dá o mesmo `{pronto, 0}`. A consulta `/daily` pede `max(N, 28)` dias a partir de hoje em UTC. Hoje em UTC é sempre maior ou igual a hoje em SP, então a régua de SP fica sempre coberta. O `campaignId` vem do índice de `useQueries`, que preserva a ordem de `googleIdsVinculados`. BLOCO: `blocoDoCanalDoLyrio` é o `blocoMetaDoLyrio` com o canal na entrada, e o resto do corpo é idêntico. CTR e CPM do bloco saem dos totais. `trafegoDoBlocoDaMeta` testa o erro antes do dado. O bloco Meta lê a consulta do filtro do pai, a mesma chave que o `LyrioMetaKpis` repetia. "desde" só na Meta, e `atributosDesde` já é dia de SP na API (`routes/revenuecat.ts:539`), então a comparação fica numa régua só. DETALHAMENTO: `googleRow` recalcula CTR, CPC e CPM das somas da campanha, com `null` em divisão por zero. `cpm` virou `number | null`, e `sortRows` já põe `null` no fim. O tipo `GoogleCampaignInput` não tem mais taxa. `consultasDoDetalhamento` usa a dimensão EFETIVA. `linhasDoFiltro` vale nas três dimensões. O Total é `totalSpend(rows)` das linhas filtradas. `rodapeDoFiltro` esconde as linhas de venda da Meta com Google. Os itens desabilitados têm `title` e uma dica visível, porque item desabilitado do Radix não recebe hover. O estado é local.'
  regression_todas: 'Com o filtro "Todas", comparei com a main ramo a ramo. Meta: as linhas, o bloco (a mesma consulta `useCampaignDailyInsightsBulk(..., days)`, o mesmo `sumMetaInsights` e o mesmo corpo de função) e o Resumo (o `investimentoDoGoogleNaRegua` dá o mesmo valor, e a minha leitura do arredondamento confere) não mudam. Mudanças intencionais (D16/D2): as linhas do Google no Detalhamento e o Total da tabela (N + 1 em UTC pelo `/campaigns` → régua de SP pelo `/daily`; CTR/CPC/CPM recalculados e "—" sem impressão, onde a API dava 0); o nome da linha do Google (o nome do vínculo, PO-03); e o bloco Google (Conversões e CPA saem, D17; os cards novos batem com o Resumo). `SalesMetaKpis`, `services/google-ads.ts` e a API não foram tocados.'
  unit_tests: 'Rodados por mim na worktree. web `vitest run --testTimeout=60000`: 2.287/2.287 em 162 arquivos (o mesmo número do Dev Record). MUTAÇÕES PRÓPRIAS (aplicar uma por vez → as 7 suítes da etapa → restaurar; `git status` limpo depois; harness em `scratchpad/qa4216/mut.mjs`): Q1 CPM do Google por clique cai · Q2 cliques sem o 1º dia da régua cai (9) · Q3 impressões fora da soma cai (9) · Q4 `porCampanha` com o acumulado cai (3) · Q5 memorial da Meta no Google em erro SOBREVIVE (TEST-001) · Q6 aviso da Meta no Google em erro cai · Q7 rodapé escondido também com Meta cai · Q8 aviso âmbar com o filtro Meta SOBREVIVE (TEST-002) · Q9 nota do filtro Google removida SOBREVIVE (TEST-002) · Q10 esqueleto de vendas nunca SOBREVIVE (TEST-002) · Q11 linhas da campanha sem `linhasDoFiltro` cai · Q12 `loadingGoogle` sem o filtro SOBREVIVE (TEST-002) · Q13 `<` → `<=` no "desde" SOBREVIVE (TEST-003) · Q14 nota da cobertura do Google removida cai (3) · Q15 `sem_campanha` → `sem_conta` no bloco SOBREVIVE, equivalente (o pai não renderiza o bloco sem campanha) · Q16 bloco Meta com o erro dos 28 dias cai · Q17 dimensão efetiva sem o filtro cai · Q18 CPC por impressão cai · Q19 carregando antes do erro (soma parcial) cai (4) · Q20 bloco Meta com 28 dias no contexto cai. Total: 20; 13 caem, 1 é equivalente, 6 sobrevivem.'
  lint_typecheck: 'Rodados por mim. `pnpm --filter @loyola-x/shared build` OK. tsc do web EXIT 0, sem saída. tsc da API EXIT 0, sem saída. eslint nos 13 arquivos do diff (web) EXIT 0. Não refiz o `next build`, nem o vitest e o eslint da API: a API não está no diff (`git diff --stat` só tem `packages/web` e a story), e o @dev registra o `next build` verde e a API em 5.350/5.360 (só as 10 falhas da baseline).'
  scope: 'Fora de `components/funnels/**` estão só `lib/utils/**` e `lib/utils/__tests__/**`, dentro da autorização da D20, e o commit leva `[scope-override]`.'
  api_contract: 'Sem mudança: `packages/shared` e `packages/api` fora do diff, então o `API_CONTRACT_VERSION` continua 59 (AC6a).'
  security: 'Nada novo. O filtro é estado local, sem leitura de URL nem de storage (o fio afirma isso). Nenhum dado novo vai para a tela.'
