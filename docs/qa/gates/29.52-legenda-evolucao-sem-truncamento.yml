status_reason: >-
  AC1-AC5 atendidos num unico bloco. A causa foi removida na raiz (o
  `max-w-[130px] truncate`), nao contornada com tooltip ou abreviacao. O
  `min-w-0` junto do `wrap-anywhere` mostra entendimento do problema real: sem
