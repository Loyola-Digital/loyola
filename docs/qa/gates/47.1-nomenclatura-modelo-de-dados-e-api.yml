decisao: CONCERNS
condicional: >
  O código está certo e protegido — 53 testes, 9 reversões medidas, predicados
  do Drizzle inspecionados, migration conferida coluna a coluna contra o
  `drizzle-kit generate`. O que impede o PASS é o que NENHUM teste desta story
  alcança: nada foi gravado num Postgres de verdade. O primeiro contato do
  schema com um banco vai ser o `drizzle-kit push --force` do deploy. Ver
  QA-471-02. Somado a isso, a spec (§ 0.3) exige a revisão do dono do produto
  antes da 47.2, e ela ainda não aconteceu.

resumo: >
  A story faz o que a spec § 3–5 e § 9 pedem, e faz do jeito que o repo faz:
  módulo folha no `shared`, uma porta só para o changelog, regras puras
  separadas das consultas, mensagens de erro literais testadas. As oito regras
  invioláveis têm cada uma um teste que cai quando a regra volta atrás.

  Encontrei UM defeito de código, médio, e corrigi no gate: a checagem "já
  existe?" e o INSERT não são atômicos, e a corrida estourava o UNIQUE do
  banco como 500 "Erro interno" — o repo já tinha `violaUnicidade` para isso
  desde a Story 36.x e a rota não usava. Os demais achados são baixos.

