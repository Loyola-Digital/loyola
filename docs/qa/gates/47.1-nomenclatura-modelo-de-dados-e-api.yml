achados:
  - id: QA-471-01
    severidade: medium
    status: corrigido-no-gate
    o_que: >
      Corrida entre a checagem "código já existe?" e o INSERT: a segunda
      gravação simultânea estoura o UNIQUE e a rota devolvia 500 "Erro interno
      do servidor". O repo já tem `utils/db-errors.ts` (`violaUnicidade`) e
      três rotas o usam; esta não usava.
    correcao: >
      `tentar()` em `routes/nomenclatura.ts` passa a mapear `violaUnicidade(e)`
      para 409 com mensagem de "recarregue e escolha o próximo". Teste novo em
      `nomenclatura-rotas.test.ts` simula o erro do driver aninhado em `cause`
      (formato do Drizzle >= 0.44); reverter o mapeamento derruba 1 teste.
      Suíte: 53/53.

  - id: QA-471-02
    severidade: medium
    status: aberto
    o_que: >
      Nenhuma linha foi gravada num Postgres real. Migration conferida por
      comparação com o `generate`, seed testado contra banco em memória, rotas
      contra repositório em memória. O que falta provar só o banco prova:
      `defaultNow()` em coluna `date`, `onConflictDoNothing` sem `target`
      escolhendo o UNIQUE certo, e a transação da cascata.
    acao: >
      Antes do merge OU no primeiro deploy: rodar `pnpm --filter @loyola-x/api
      seed:nomenclatura` contra um banco com o schema aplicado, duas vezes, e
      anexar a saída (`inseridos` 9 → 0). A 47.4 (AC5) já prevê conferir a
      forma do dado no banco — se ninguém fizer antes, ela cobre.

  - id: QA-471-03
    severidade: low
    status: aberto
    o_que: "P1 — os `[PREENCHER]` da spec § 9. O seed pula experts, produtos, funil e LP. Não é defeito; é insumo que só o dono do produto tem."
    acao: "Dono do produto manda os valores → `DADOS_DO_SEED` → rodar o seed de novo."

  - id: QA-471-04
    severidade: low
    status: aberto
    o_que: "`GET /api/nomenclatura/changelog` lê `fastify.db` direto e não é exercitada pelo teste de rotas (que injeta repositório em memória)."
    acao: "Quando a 47.2 mostrar o histórico na tela, cobrir por `listarChangelog` com o db falso de `nomenclatura-repositorio.test.ts`."

  - id: QA-471-05
    severidade: info
    o_que: "A spec se contradiz sobre a sigla do expert (§ 4.1 'imutável depois de criada' × regra 5 'depois de usada'). O @po escolheu o lado estrito e o código segue. Registrado para o dono do produto confirmar na revisão da Etapa 1."

