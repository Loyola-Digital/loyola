checks:
  code_review: 'Diff de 16 arquivos lido inteiro (2.112+/52−). A regra de canal bate com a tabela da story. Conflito = Meta E Google, e vai para um balde próprio que entra no Total. Meta = `ad_network = meta` ou id válido. Google = `ad_network = google` ou `gclid` (D2a). Orgânico = `CONDICAO_ORGANICO`, a MESMA da Jornada (agora importada de um lugar só). `ig4a`/`fbclid` caem em Sem atribuição (D2). O canal sai da série inteira do usuário, porque a CTE `base` não tem filtro de data. A venda conta pela janela de `purchased_at` com `revenue_usd > 0`, tanto no FILTER quanto no HAVING. `atributo()` segue a semântica de `readSubscriberAttribute`. Conferi no PGlite a dúvida que eu tinha: `E''\v''` é tab vertical no Postgres e NÃO a letra "v" (os nomes "video_01", "vsl-lyrio" e "…_v" saem iguais ao TS). A identidade totalPago + semValor + semUsuario = card de `/sales` vale por construção (mesmo escopo, `REVENUE_EVENT_TYPES`, `purchased_at`). O Detalhamento cruza a campanha por id e o conjunto/anúncio por nome aparado, e cada entidade vai para uma linha só. O resto vai para "Anúncio não identificado" ou "Sem linha nesta tabela", e o total da Meta fecha. Contei as colunas do rodapé novo nas 3 dimensões e Vendas/Receita caem sob o cabeçalho certo. Também o bloco RevenueCat desconectado, que retorna antes da quebra e por isso não deixa skeleton eterno. Sem PII: o `app_user_id` só aparece no GROUP BY e no `IN (SELECT …)`, e o `warn` leva só stageId e a contagem.'
  autonomous_decisions: '(1) Conjunto e anúncio por NOME, não por id: CORRETA, e provada no dado. Os nomes do app batem 16/16 com os da Meta para os mesmos ids, e o Detalhamento agrega por nome. O desvio do texto do AC1 está em DOC-001. (2) Conflito como balde próprio + aviso âmbar + `warn` sem id, entrando no Total: CORRETA (D7). As mutações Q10/Q11 caem. (3) Investimento "conhecido" só com campanha vinculada E a consulta de 28 dias carregada; antes disso, "—": CORRETA, porque um ROAS sobre R$ 0 seria número falso. Q19 cai. (4) Desvio registrado do DoD, o probe rodado depois de começar o código: aceito. O resultado foi 0 macro, 0 `(not set)`, 0 vazio e 0 conflito, e o descarte segue no código pela semântica.'
  unit_tests: 'Suítes da story: API 66/66 (`vendas-por-canal-lyrio` 42 + `jornada-lyrio` 24, PGlite) e web 47/47 (3 arquivos). Completas: API 4959 passando e 10 falhando em 5 arquivos (funnel-stages-lead-inputs 3, projects 3, schema 2, instagram-routes 1, instagram 1), a mesma baseline da 42.11. Web 1902/1902 em 137 arquivos. MUTAÇÕES PRÓPRIAS (aplicar → suíte → `git checkout`, com `git status` limpo depois de cada uma): Q1 tirar `meta_ad_id` do `sinalMeta` → SOBREVIVE · Q1c `sinalMeta` só com `ad_network` → SOBREVIVE (TEST-001) · Q2 aliases `s_meta` × `s_google` trocados na CTE `ev` → 2 · Q3 `base` só com eventos de receita (canal sem o paywall) → 2 · Q4 `maisRecente` sem o FILTER `IS NOT NULL` → 1 · Q5 `sem_usuario` sem `app_user_id IS NULL` → 1 · Q6 `min` → `max` no início dos atributos → SOBREVIVE (TEST-003) · Q7 `base` sem o escopo da etapa → SOBREVIVE (TEST-002) · Q8 web, campanha casada por nome → 2 · Q9 web, Google contra o investimento Meta+Google → 2 · Q10 web, linha de conflito sempre → 1 · Q11 Jornada, conflito fora do Total → 2 · Q12 descarte só pelo prefixo `{{` → 2 · Q13 web, `<` → `<=` na cobertura → SOBREVIVE, equivalente na granularidade de dia (não é achado) · Q14 web, não identificado somado em "sem linha" → 2 · Q15 web, ROAS Meta sem o imposto → 1 · Q16 rota, campo extra na resposta → 1 · Q17 web, declaração (c) da Jornada invertida → 2 · Q18 tsx, `colunas` sem o `+2` das colunas de vendas → SOBREVIVE (fora do alcance do vitest; conferido à mão, ver TEST-003) · Q19 tsx, Google "conhecido" sempre → 1 · Q20 tsx, Detalhamento com 28 dias fixos → 1. Resultado: 16 caem e 4 sobrevivem. Fora a equivalente (Q13), as 3 que sobrevivem viraram TEST-001/002/003, e mais Q18 no layout.'
  lint_typecheck: 'eslint nos 15 .ts/.tsx tocados: EXIT 0. tsc da API `--noEmit`: EXIT 0, 0 linhas. `next build` e tsc do web: não refeitos, porque não mudei código; o Dev Record traz EXIT 0, rodado depois do `next build`.'
  acceptance_criteria: 'AC1 ✓ (rota, guarda, `days`, `purchased_at`, 4 linhas sempre, conflito, totalPago, metaPorEntidade, com o desvio de nome em DOC-001; `atributosDesde`; contrato) · AC2 ✓ no código (tabela abaixo dos cards; ROAS e Margem por canal com o imposto só na Meta; declaração de fonte; posição fica para a validação visual) · AC3 ✓ (Por canal + Total pago + declaração com número vindo da resposta; `/sales` intocada; fica numa linha ACIMA de "Por loja/Por produto", e não ao lado, ponto para a validação visual) · AC4 ✓ (duas linhas no lugar e na prioridade da antiga; Total igual: 15.790 em 90 dias, conflito 0; declaração (c) atualizada; tipo do web aceita `campanha`) · AC5 ✓ (3 dimensões; Google "—"; não identificado e sem linha; comentário atualizado) · AC6 ✓ (data vinda da resposta nos 4 blocos) · AC7 ✓ (404 da rota → oculto; 404 de domínio e 5xx → erro; Jornada antiga desenha o rótulo da API) · AC8 ⚠️ (quase todo provado; falta o braço dos ids da Meta na rota, TEST-001) · AC9 ✓ (gates acima).'
  no_regressions: 'As suítes completas estão iguais à baseline. `/sales`, `webhooks.ts` e `services/revenuecat.ts` não mudaram. A Jornada muda de forma, mas o Total é o mesmo (provado em produção). O web antigo contra a API nova desenha 8 linhas pelo rótulo. O web novo contra a API antiga esconde os blocos novos e mostra a linha antiga.'
  performance: 'Rota nova: 141 ms (28 dias) e 255 ms (5 dias) em produção. Início dos atributos: 226 ms. Jornada de 90 dias: 919 ms (PERF-001). Sem coluna nem índice novos.'
  security: 'Guarda `getProjectAccess` + `getStage`, testada no fio (guest sem vínculo → 404; etapa alheia → 404 sem consultar eventos). SQL parametrizado. Resposta com 8 chaves conhecidas e nenhum id de usuário (teste de fio + Q16). O `warn` não leva id.'
  documentation: 'Dev Agent Record completo: probe, SQL exato em produção, três iterações de desempenho com EXPLAIN, decisões e 21 mutações. Comentários no código explicam as diferenças conhecidas com o TS (`4.50`, espaço Unicode).'
  api_contract: 'O contrato sobe de 38 para 39, com uma linha de histórico que declara a rota nova e a mudança de forma da Jornada, mais o fallback do web. A `main` remota andou para a7478df5, já no contrato 40 (#1017 v39, #1018 v40). Então `contract.ts` vai dar conflito no merge e esta story vira 41. A renumeração é do @devops, com a linha de histórico e os comentários de DOC-001(b). Não é FAIL. Nenhum outro arquivo da story foi tocado na `main` (compare c321dc64...main).'

