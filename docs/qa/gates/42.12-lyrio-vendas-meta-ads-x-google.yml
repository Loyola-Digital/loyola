top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'Mutações Q1 e Q1c. Em `sinalMeta` (utils/vendas-por-canal-lyrio.ts), tirar `OR meta_ad_id IS NOT NULL` (Q1) e até reduzir a regra a `ad_network = ''meta''` (Q1c, sem nenhum dos três ids) não derruba nenhum dos 66 testes da API. O motivo é que toda semente Meta (`META`, `meta-sem-ids`) traz `ad_network = meta`. O caso "macro {{ad.id}} não é Meta" fica tautológico: passa igual com uma regra que nem olha os ids. Esse braço é a metade da regra 1 (D2) e o centro do PO-01 ("valor válido, não chave presente"). A Jornada está protegida: `parametrosDoTrecho` amarra os quatro atributos ao alias `c_campanha_meta`. A rota de vendas não está. Medido em produção (somente leitura): 0 eventos com id da Meta sem `ad_network = meta`, e 722 usuários com id contra 745 com a rede. Hoje é equivalente, mas basta o app mandar o id sem a rede para a venda cair em "Sem atribuição" sem nenhum teste acusar.'
    recommendation: 'Em `vendas-por-canal-lyrio.test.ts`, semear um comprador só com `meta_ad_id` válido e sem `ad_network` (esperado: Meta), e outro só com `meta_campaign_id` válido (esperado: Meta). Assim o caso da macro passa a ser contraprova de verdade. Opcional: no PgDialect, amarrar os quatro atributos ao alias `s_meta`, como a Jornada já faz.'
    owner: '@dev'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Mutação Q7: tirar `escopoDasVendas(stageId)` do WHERE da CTE `base` (os eventos dos compradores) não derruba nada. O fio da rota só confere que o STAGE aparece nos parâmetros de cada consulta, e ele continua aparecendo na CTE `compradores`. Sem o filtro, sinais e vendas de OUTRA etapa entrariam no comprador que tem o mesmo `app_user_id`, e eventos `TEST` também entrariam nos sinais. Hoje é equivalente: 0 usuários em mais de uma etapa, e 1 etapa com atributos. O AC8 pede "filtro por stage_id no predicado".'
    recommendation: 'Semear o mesmo `app_user_id` em `OUTRA` com `ad_network = google` e uma venda, ao lado de uma venda Meta em `STAGE`. Esperado: o comprador fica Meta, sem conflito, e as vendas de `OUTRA` não somam. Ou afirmar, no PgDialect, que o trecho `base AS MATERIALIZED (…)` contém `"stage_id" = $n` com o STAGE.'
    owner: '@dev'
    status: open

  - id: TEST-003
    severity: low
    category: tests
    description: 'Mutação Q6: trocar `min(event_at)` por `max(event_at)` em `consultaDoInicioDosAtributos` sobrevive. A semente do teste AC6 tem só UM evento válido na etapa (os outros são macro ou de outra etapa), então min = max. Com o max, `atributosDesde` viraria "o último evento", e a declaração do AC6 diria em toda janela que Meta e Google estão subcontados, com a data de hoje. Também sem teste, mas conferido à mão: o `colSpan` das linhas novas do rodapé do Detalhamento (Q18, `colunas` sem o `+2` sobrevive, porque os `.tsx` não são coletados).'
    recommendation: 'Acrescentar um segundo evento válido, mais recente, na semente do AC6 e manter o esperado no primeiro. O alinhamento das colunas fica para a validação visual (ver notes).'
    owner: '@dev'
    status: open

  - id: PERF-001
    severity: low
    category: performance
    description: 'A Jornada de 90 dias mediu 919 ms na minha rodada em produção, contra ~800 ms no Dev Record e 530–650 ms na `main`. Fica abaixo do limite de ~1 s das Dev Notes, mas perto dele, e a tabela cresce (186 mil eventos). A rota nova mediu 141–255 ms.'
    recommendation: 'Nenhuma ação na story. Se a Jornada passar de 1 s, levar ao @architect, como as Dev Notes mandam, antes de criar coluna ou índice.'
    owner: '@architect'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: '(a) O AC1 pede `metaPorEntidade` agrupado por `meta_adset_id`/`meta_ad_id`. O código agrupa conjunto e anúncio pelo NOME aparado (AUTO-DECISION). A decisão está correta: conferi em produção que os nomes de conjunto e de anúncio que o app manda batem 16/16 com os de `meta_ad_insights_daily` para os mesmos ids, e cruzar pelo id perderia vendas, porque `/all-adsets` e `/all-ads` agregam por nome. Mas o texto do AC continua dizendo id. (b) A `main` já está no contrato 40 (v39 = Lead Scoring/0170, v40 = Kiwify/0171). Comentários desta branch citam números fixos: `use-revenuecat.ts` ("contrato 39"), `lib/utils/jornada-lyrio.ts` ("contrato 38") e o histórico em `contract.ts` ("com a API v38").'
    recommendation: '(a) @po anota no AC1 que conjunto e anúncio casam por nome, com o motivo. (b) @devops, no merge: renumerar para 41, com a linha de histórico, e corrigir os três comentários.'
    owner: '@po / @devops'
    status: open

