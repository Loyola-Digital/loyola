status_reason: >-
  A auditoria esta correta e a aritmetica foi verificada de forma independente:
  os 10 pontos de spend da etapa aplicam o imposto exatamente 1x, e a
  equivalencia entre `sumMetaSpendWithTax` e `sumMetaInsights` se sustenta com
  divergencia maxima de 5,6e-9 em 100 mil linhas simuladas. O codigo esta certo.
  O CONCERNS e sobre o entregavel do AC1: 4 dos 10 pontos do inventario, mais
  uma referencia no corpo do texto, apontam para linhas que nao existem mais no
  commit onde o documento vive — deslocadas pelo proprio codigo das stories
  42.2/42.4, no mesmo commit. O documento se declara "referencia para quem for
  mexer nesta tela depois", e coordenadas erradas nao cumprem essa funcao.
  Correcao de minutos, sem tocar em codigo.
reviewer: 'Quinn'
