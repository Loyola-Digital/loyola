    o_que: >
      No gerador, `cascataInicial` do `FormLp` ("+ cadastrar novo" na LP) era
      um objeto novo a cada render. `FormLp` reseta o próprio estado quando
      essa prop muda de identidade → digitar no formulário da LP apagava o que
      se digitava. Não há teste de componente que pegue isso; só a tela (ou a
      leitura). Corrigido com `useMemo` pelos quatro ids.
