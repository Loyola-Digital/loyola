    - id: QA-4425-05
      severidade: MÉDIA
      categoria: docs
      titulo: "O PROMPT do Inácio não conhece a promoção nem o motivo novo"
      evidencia: >
        `docs/guides/inacio-panorama-diario.md` §3 — o texto que vai colado na
        configuração da rotina diária:

          :91-92  "principal.metrica muda com a família: cacReal na paga,
                   cplReal na gratuita. Nunca chame de CAC o número de uma
                   etapa gratuita."
          :96-98  "Os motivos (semDados, syncPendente, leituraFalhou,
                   indeterminado, foraDaAba, semTetoConfiavel,
                   coberturaIndisponivel) pedem AÇÕES DIFERENTES. Reporte o
                   motivo específico."

        `reguaDivergente` não está na lista, e nada diz para ler `familia` em
        vez de deduzir do `stageType`.
      porque_importa: >
        O @dev atualizou os DOIS lugares que o gate anterior apontou (llms.txt e
        a descrição da tool) e faltou o terceiro — que é o mais operante: o
        llms.txt é referência, a descrição da tool é dica de escolha, mas o §3
        é **o prompt que governa o agente**.

        Duas consequências concretas: (1) o Inácio vê `familia: "paga"` numa
        etapa que ele sabe ser `free` e pode reportá-la como bug; (2) vê
        `motivo: reguaDivergente` numa lista cuja regra é "cada motivo pede uma
        AÇÃO" e o publica como pendência do operador — exatamente o que a AC8
        existe para evitar.

        ⚠️ E a janela de risco é real: merge é deploy, e a Story 44.30 (que
        reescreve este guia) só vem depois da 44.28. Entre uma e outra, o
        Inácio roda com prompt velho e payload novo.
      recomendacao: >
        Duas linhas no §3 do guia, na 44.25: a promoção pelo funil, e
        `reguaDivergente` como exceção sem ação do operador.

