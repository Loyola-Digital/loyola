summary: >
  A implementação está correta contra os ACs validados, é mínima (11 linhas de
  código efetivo em 4 arquivos) e a disciplina de prova foi respeitada: a
  reversão do bug derruba 2 testes, e a varredura de produção confirmou as 3
  etapas que mudam e as 2 que não podem mudar.

  O gate é CONCERNS por um risco que os ACs não cobriram e que a revisão
  quantificou: a mudança de rótulo expõe uma divergência de 41% entre o CAC do
  Panorama e o da aba Meta Ads, na mesma etapa e na mesma janela. Não é defeito
  desta story — as duas réguas já eram diferentes —, mas era a diferença de
  nome que impedia a comparação. Ao renomear CPL para CAC, a story convida
  exatamente a comparação que agora falha.

achados:
  - id: QA-4425-01
    severidade: ALTA
    categoria: requirements
    titulo: "Panorama vai exibir CAC 41% abaixo do CAC da aba Meta Ads, sem declarar"
    evidencia: >
      Simulação com dados de produção (07/09/2026), janela longa do Panorama
      (09/08→07/09), etapa bbe-funil-churrasco:

        Panorama (após esta story) : R$ 15.841,75 ÷ 124 vendas = CAC R$ 127,76
        Aba Meta Ads (fixture §2.1) : R$ 15.757,56 ÷  73 vendas = CAC R$ 215,86

      O investimento bate (0,5% de diferença, sync mais fresco). O denominador
      não: 124 contra 73 vendas — a régua pública (`sales-daily`, dedup por
      txId+produto) conta 70% a mais que a régua do dashboard (checkout/comprador
      com classificação de produto). O CAC sai sistematicamente OTIMISTA.
    porque_importa: >
      Antes desta story o Panorama exibia "CPL R$ 72,62" — rótulo diferente do
      da aba, e ninguém comparava. Agora exibirá "CAC R$ 127,76" ao lado de uma
      aba que diz "CAC R$ 215,86" para a MESMA etapa. É a classe de defeito que
      o Epic 44 existe para impedir, e a 44.17 já a nomeou: "duas telas com o
      mesmo nome e números diferentes é exatamente o problema do connectRate que
      custou um ano ao projeto — isso precisa ser conferido e, se acontecer,
      DECLARADO NA TELA".

      Agravante: um CAC otimista numa tela de decisão de verba empurra para
      escalar. O erro tem direção, e é a direção que custa dinheiro.
    recomendacao: >
      Não bloqueia o merge da 44.25 — a régua é a 44.28. Mas exige UMA das duas
      antes de a mudança chegar ao usuário:
      (a) declarar na tela e no payload que este CAC usa a régua pública e pode
          divergir do dashboard perpétuo, com link para a 44.28; ou
      (b) segurar a 44.25 até a 44.28 unificar a régua.
      A decisão é do @po. Registrar como AC na 44.28 de qualquer forma.

  - id: QA-4425-02
    severidade: MÉDIA
    categoria: docs
    titulo: "docs/llms.txt continua dizendo que free é sempre gratuita"
    evidencia: >
      llms.txt:116 — `"gratuita" (free/cpl)`, sem menção ao tipo do funil.
      llms.txt:121-122 — "família gratuita → metrica: cplReal" e
      "⚠️ Numa etapa gratuita o número principal NÃO é CAC."
    porque_importa: >
      O llms.txt é o contrato que o agente Inácio lê — a própria doc do projeto
      o define assim. Depois desta story, `free` dentro de perpétuo devolve
      `familia: "paga"` e `metrica: "cacReal"`. O Inácio vai ler que free é
      gratuita, receber cacReal, e ou reportar errado ou abrir um bug que não
      existe. É a mesma armadilha de `packages/mcp` não ter checagem de
      contrato (`shared/src/contract.ts`).
    recomendacao: >
      Atualizar llms.txt na própria 44.25, antes do merge. É barato e o
      consumidor primário do payload é um LLM que lê esse arquivo.

  - id: QA-4425-03
    severidade: MÉDIA
    categoria: tests
    titulo: "AC2, AC3 e AC4 não têm teste — só a função pura foi coberta"
    evidencia: >
      Os 6 casos novos exercitam `classificarFamilia` isolada. Não há teste de
      integração com `free` + `perpetual` no payload nem no panorama. Em
      particular, `captaLead` (AC3) pode ser revertido para
      `familia === "gratuita"` e NENHUM teste falha — o CPL do perpétuo
      desapareceria do payload em silêncio.
    porque_importa: >
      É o padrão que o repo já pagou para aprender: teste que não falha com o
      bug de volta é decorativo. O @dev fez a prova de reversão para o AC1;
      AC2/AC3 ficaram sem a mesma proteção.
    recomendacao: >
      Um teste em `public-cadeia-cac.test.ts` com `etapa({ stageType: "free",
      funnelType: "perpetual" })` provando `familia: "paga"`,
      `principal.metrica: "cacReal"` E que o cache de lead continua sendo lido.
      A infraestrutura (`filaVinculo`, `etapa()`) já existe no arquivo.

  - id: QA-4425-04
    severidade: BAIXA
    categoria: tests
    titulo: "AC5 (web) sem teste"
    evidencia: "A chamada em page.tsx:308 não é coberta; menu-de-abas.test.ts recebe a família já resolvida."
    porque_importa: "Limitação estrutural conhecida — o runner do web cobre lib/utils e os .test.tsx de componente são órfãos de propósito (documentado na 44.21)."
    recomendacao: "Aceitar. Cobrir por validação visual, que já está no DoD."

