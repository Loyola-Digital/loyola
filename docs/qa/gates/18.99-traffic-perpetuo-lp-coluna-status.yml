status_reason: 'A coluna sai com a regra, o texto e o badge da 18.97, contada nos mesmos anúncios cujo gasto entra na linha, já com o filtro de público. A API só lê o Postgres, e com a API antiga a coluna mostra "—". A revisão em duas leituras não achou defeito na regra. Achou um medium: a campanha do tooltip era contada pelo nome, e o nome escolhido dependia do plano do Postgres. Os lows foram o lote com erro, testes fracos e leitura em série. Tudo foi corrigido no QA fix 1, com prova por reversão (M1–M12 vermelhas).'
