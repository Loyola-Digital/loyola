top_issues:
  - id: 'REQ-001'
    severity: medium
    status: 'RESOLVIDO no QA fix 1'
    finding: >-
      A campanha era identificada pelo NOME (`selectDistinct(ad_id, campaign_name)` sem ORDER BY). Campanha
      renomeada podia aparecer como duas ("Ativo em 2 campanhas: X, X2"), e duas campanhas com o mesmo nome
      contavam como uma. Qual nome ficava dependia do plano do Postgres. A 18.97 conta pelo `campaignId` e
      ordena os nomes. Achado pelo revisor independente.
    fix: '`DISTINCT ON (ad_id)` por `date_start DESC` (a linha mais recente: o nome atual), devolvendo `{campaignId, nome}`. O web conta num `Map<campaignId, nome>` e ordena os nomes. Reversões M7 (por nome), M8 (sem sort) e M11 (sem ordem por data) vermelhas.'
  - id: 'REL-001'
    severity: low
    status: 'RESOLVIDO no QA fix 1'
    finding: >-
      O hook juntava só os lotes que já tinham resposta. Com o lote 2 em erro, onde estava o único anúncio ativo
      sem URL, a linha "Sem link resolvido" saía "Pausado" sem dado.
    fix: 'Junção pura `juntarStatusDosLotes` (`perpetual-lp-rows.ts`). Se algum lote está carregando, deu erro ou não tem o campo, o resultado é "—". O hook a chama com `results.map((r) => r.data)`. Reversões M9 e M10 vermelhas.'
  - id: 'TST-001'
    severity: low
    status: 'RESOLVIDO no QA fix 1'
    finding: 'O banco falso da API ignorava o `where`: tirar o filtro de projeto ou o `inArray` não derrubava nenhum teste. A junção dos lotes era conferida só por regex.'
    fix: '`eq`, `inArray` e `desc` viraram marcadores no teste da API, que confere projeto, ad_ids e ordem nas duas leituras (M12 vermelha). A junção é testada como função, com 2 lotes, lote faltando e lote sem o campo.'
  - id: 'PERF-001'
    severity: low
    status: 'RESOLVIDO no QA fix 1'
    finding: 'O status e a campanha eram lidos em série depois do cache de criativos e do agendamento da cura.'
    fix: 'As leituras rodam em `Promise.all` com a do cache de criativos. O `DISTINCT ON` também lê menos que o `DISTINCT` sobre todo o histórico. O padrão (`DISTINCT` por ad_id em `meta_ad_insights_daily`) já roda em `campaign-attribution.ts:86`, em lotes de até 120 anúncios, pelo prefixo da chave primária.'
  - id: 'OBS-001'
    severity: low
    status: 'aceito'
    finding: 'Anúncio ativo sem campanha conhecida cai num grupo único "", que conta 1 sem nome. Na prática não acontece: as linhas saem da mesma tabela que dá a campanha.'

