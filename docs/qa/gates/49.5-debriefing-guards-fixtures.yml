limite_do_f1:
  avaliacao: 'O limite é real. O F1 confere a consistência entre os caminhos de soma, não a dedup. Uma dedup desligada em todos os caminhos passa no F1. A QA-M6 mostra que quem a pega é o teste de origem: só 1 teste morre, o ponta a ponta com dup 2× no motor real. A cobertura existe, mas depende de um único teste.'
  recomendacao: 'Guarda complementar NÃO bloqueia este gate (REC-001). Sugestão barata: amarrar o contador ao que foi contado, com Σ vendas mantidas nos grupos === dedup.camada2.depois. Isso pega o "contador diz que removeu, mas a linha seguiu", que é exatamente a QA-M6.'

issues_gate_anterior:
  - id: REQ-001
    severity: medium
    finding: 'A classificação `fonte-janela` do investimentoCaptacao do PG02 (+R$ 50,24, +0,04%), decidida pelo coordenador (reprocessamento da Meta, precedente da 41.2), não está registrada. `danilo-gato-pg02-loyola.ts` só lista as 6 linhas `definicao` em `divergenciasClassificadas`. A story ainda a trata como pergunta aberta (Dev Agent Record, Perguntas ao dono 2). Em produção, a conferência governante FALHA.'
    suggested_action: 'Adicionar `{ chave: "investimentoCaptacao", causa: "fonte-janela", nota: "drift de reprocessamento da Meta (spec §As duas diferenças que sobraram, 41.2): +R$ 50,24 / +0,04%", classificadaPor: "coordenador (decisão de 2026-10-02)", data: "2026-10-02" }`. Mover a pergunta 2 para "decidido" e reexecutar o script: a governante deve terminar sem divergência não classificada.'
  - id: TEST-001
    severity: medium
    finding: 'Nenhum teste prova que K não se aplica a `dinheiro`/`taxa-de-volume` quando K ≠ 1 (AC7: "o imposto não a afeta"). O AC8(d) cobre só `volume`. A QA-M3 sobrevive.'
    suggested_action: 'Na fixture da skill (K = 1,0073486), criar uma métrica `dinheiro` igual ao payload, que tem de sair `ok`, e uma igual a payload × K, que tem de sair `diverge`. Fazer o mesmo para `taxa-de-volume`.'
  - id: TEST-002
    severity: low
    finding: 'O WF7 não tem teste com SÓ `vendasExcluidas` (decisão 7). O payload sintético também tem vendas fora da coorte ou além da janela, então a QA-M5 (alerta sumindo em silêncio) sobrevive.'
    suggested_action: 'Teste com `alemDaJanela = []`, `foraDaCoorte = []` e 1 venda excluída. O WF7 tem de aparecer com "excluídas automaticamente antes da abertura 1".'
  - id: REC-001
    severity: low
    finding: 'O limite do F1 está declarado e coberto por um único teste de origem (ver limite_do_f1).'
    suggested_action: 'Opcional: invariante contador × contados. Pode ficar para a 49.6.'

