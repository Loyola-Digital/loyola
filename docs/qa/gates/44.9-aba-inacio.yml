validacaoVisual:
  veredito: "O padrão que as outras stories deveriam seguir."
  porQue: >
    A 29.51/29.52 declarou validação visual que nunca rodou. Esta não só rodou —
    ela verificou ARITMÉTICA a partir do que a tela mostrou, em vez de olhar e
    dizer "parece certo".

    Três coisas que só um print com conta feita provaria:

    1. O CPC de R$ 5,38 contra alvo R$ 2,60 saiu VERMELHO. Pela §6 ao pé da letra
       ("🟢 ≥ alvo") sairia verde — um CPC ao dobro do teto pintado como
       saudável, numa tela inteiramente plausível.

    2. O Connect Rate caiu a 0,22 p.p. da fronteira (71,39% contra 71,17% de
       corte) e ficou amarelo. Qualquer erro no limiar teria mudado aquela
       célula de cor.

    3. A identidade de telescopagem da §8, reconstruída dos números exibidos:
       `CPC ÷ (Connect × Conv.LP) = 57,84 = spend ÷ checkouts`. Bate na segunda
       casa, o que só acontece se as cinco métricas vierem da MESMA agregação.

    E a gratuita provou a QA-446-01 até a última milha: Conv. LP saiu `—`, não
    `0%`, e ficou fora do ranking. Com zero ali, a queda real contra qualquer
    teto daria 100% e a etapa sem dado nenhum lideraria o "onde atacar primeiro".

  achadoNaoPlanejado: >
    A tela expôs o argumento da v1.1 sem que ninguém procurasse: CAC real
    R$ 51,04 é MAIS BARATO que o custo por checkout R$ 57,84 — 1.283 vendas
    reais contra ~1.132 checkouts do pixel. O pixel subconta, como o deck §7.1
    descreve. Se o número principal viesse da cadeia, sairia inflado. É a
    justificativa inteira da v1.1 demonstrada por acidente, em produção.

