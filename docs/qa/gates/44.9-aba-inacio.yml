porQueConcernsENaoFail: >
  Nada está quebrado. Os três achados são superfície desprotegida, não defeito
  entregue — e a validação visual mostrou os dois caminhos funcionando com
  números conferidos.

  Considerei FAIL pelo QA-449-01, porque ele é da mesma família do QA-448-01 que
  segurou a story anterior: falha que se disfarça de estado válido e induz a ação
  errada. A diferença é decisiva — no 44.8 o defeito estava PRESENTE no
  comportamento entregue e eu o reproduzi no payload; aqui ele só existe se
  alguém quebrar o campo depois. Reprovar por risco futuro seria mudar a régua no
  meio do epic.

