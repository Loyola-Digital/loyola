summary: >
  A story resolve um bloqueio real que oito stories não viram, e resolve do jeito
  certo: a composição saiu para um serviço, as duas rotas viraram invólucros, e
  existe um teste comparando o payload INTEIRO das duas em seis cenários. A rota
  interna ainda melhora a postura das irmãs ao escopar por `/api/projects/`, o
  único prefixo em que o `guest-guard` valida membership.

  A validação visual é a melhor evidência produzida neste epic. Não foi um print
  decorativo: o @dev reconstruiu os brutos a partir da tela e fechou a identidade
  de telescopagem da §8 na segunda casa, o que só acontece se as cinco métricas
  vierem da mesma agregação.

  O que segura o gate não é defeito presente — é superfície desprotegida. Os dois
  campos que a AC4 criou, que a AC5 consome e que motivaram uma migration em
  PRODUÇÃO não têm uma linha de teste, e o modo de falha deles é indistinguível
  de um estado legítimo. A rota de escrita que os grava também não tem teste.

issues:
  - id: QA-449-01
    severity: medium
    category: test-coverage
    title: "`lpTemVsl` e `ticketMedioManual` não têm cobertura, e a falha deles se disfarça de estado válido"
    file: packages/api/src/services/cadeia-cac-payload.ts
    story: "44.9 (AC4, AC5)"
    reproduced: true
    description: >
      Os dois campos que a AC4 adicionou ao schema, que motivaram a migration
      0109 aplicada ao banco de produção, e que a AC5 usa para escolher o
      benchmark de Conv. LP, aparecem ZERO vezes nos testes da API.

      Reproduzido: removendo `lpTemVsl: stage.lpTemVsl` do payload —

        typecheck da API      limpo
        testes da API         42 passando
        testes do web        480 passando

      Nada acusa. E na tela o resultado é `benchmarkConvLP(undefined, …)` →
      `{ valor: null, motivo: "vslNaoRespondido" }`, que renderiza exatamente
      como o estado legítimo "ninguém respondeu se a LP tem VSL — preencha na
      configuração da etapa".

      ⚠️ É a mesma FAMÍLIA do QA-448-01, que segurou o gate da story anterior: a
      tela faz uma afirmação sobre a causa que induz a ação errada. Quem visse
      isso iria preencher um campo que já está preenchido, e nada mudaria.

      A diferença — e o motivo de ser CONCERNS e não FAIL — é que ali o defeito
      ESTAVA presente e reproduzido no comportamento entregue; aqui ele é
      latente, e a validação visual mostrou o caminho funcionando de verdade.
    suggestedFix: >
      Um teste de rota afirmando que `lpTemVsl` e `ticketMedioManual` chegam ao
      payload com o valor da etapa (inclusive `null`), verificado por reversão.
    blocking: false

  - id: QA-449-02
    severity: medium
    category: test-coverage
    title: "A rota de ESCRITA `PATCH .../cadeia-cac-config` não tem nenhum teste"
    file: packages/api/src/routes/funnel-stages.ts
    story: "44.9 (AC4)"
    reproduced: true
    description: >
      `grep -rl "cadeia-cac-config" src/__tests__/` devolve vazio. É uma rota que
      ESCREVE em colunas recém-criadas em produção, e ninguém a exercita.

      O que fica sem defesa, e que o próprio código se dá ao trabalho de
      documentar:

      - a distinção `{ lpTemVsl: null }` (limpa a resposta) contra campo ausente
        (não mexe) — sem teste, o dia em que ela quebrar ninguém desfaz uma
        resposta errada;
      - a prova de cadeia etapa→funil→projeto do `innerJoin` antes de escrever;
      - o `String(...)` no `numeric`, que existe para não perder centavos.
    suggestedFix: "Testes de rota no molde existente: patch parcial, `null` explícito, 404 para etapa de outro projeto."
    blocking: false

  - id: QA-449-03
    severity: low
    category: maintainability
    title: "O contrato do payload é declarado duas vezes, e o TypeScript não confronta as duas"
    file: packages/api/src/services/cadeia-cac-payload.ts:165
    story: "44.9"
    reproduced: true
    description: >
      `montarPayloadCadeiaCac` devolve `Promise<Record<string, unknown>>`, e o web
      declara `CadeiaCacPayload` à mão em 92 linhas
      (`lib/hooks/use-cadeia-cac.ts`). O web só depende de `@loyola-x/shared`, não
      do pacote da API, então nada confronta as duas formas.

      Reproduzido: renomeando `unidadeDasTaxas` e `vendasSemDataNoTotal` só no
      serviço, **os dois pacotes compilam limpos**.

      ATENUANTE, e é o que separa isto de medium: os testes de rota da API DO
      pegam renomeação — a mesma sonda quebrou 4 testes. O que eles não pegam é
      (a) mudança de TIPO com o nome intacto e (b) campos que nenhum teste toca,
      que é o QA-449-01.

      A correção estrutural é a mesma que este epic já aplicou duas vezes: o tipo
      mora no `shared` e os dois lados importam. Aí um rename quebra o build dos
      dois, em vez de virar `undefined` na tela.
    suggestedFix: "Mover a interface do payload para `packages/shared` e tipar o retorno do serviço com ela."
    blocking: false

