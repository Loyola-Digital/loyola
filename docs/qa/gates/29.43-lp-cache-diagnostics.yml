status_reason: >-
  O entregavel funciona e foi validado com dado real: o backfill levou a
  cobertura do funil fz-a1 de 0% para 100% do investimento (92 de 92 anuncios, 3
  LPs distintas). A decisao do AC2 — carimbo em vez de inferencia por proporcao
  — esta certa e bem argumentada, e a medicao que a sustenta e verificavel. Mas
  a classificacao das causas MENTE quando a API ainda nao devolve `staleInCache`
  (QA-11), e esse e exatamente o cenario que esta story existe para consertar:
  este projeto tem historico de a API ficar dias atras da main. Alem disso, o
  AC6 pedia testes de `resolveCreativeLinkUrl` — a funcao de que a story inteira
  depende — e nao ha nenhum (QA-12). Dois fixes pequenos.
reviewer: 'Quinn'
updated: '2026-08-08T00:00:00Z'

top_issues:
  - id: 'QA-11'
    severity: medium
    finding: >-
      `staleInCache` e opcional no contrato (`staleInCache?: string[]`) e o
      dashboard faz `?? []`, colapsando "a API nao informou" em "medi e nao ha
      nenhum". Como `buildLpRows` usa o `else` final para `semLinkNaMeta`, todo
      anuncio sem LP passa a ser reportado como **sem URL na Meta**.
    reproduction: >-
      buildLpRows com 2 anuncios em cache sem URL e `staleInCache: []`
      -> cacheDesatualizado=0, semLinkNaMeta=2. A tela afirma "2 sem URL na
      Meta", quando a causa real e cache escrito por codigo antigo.
    impact: >-
      A frase mais cara da tela e justamente essa: "sem URL na Meta" nao tem
      acao, e encerra a investigacao do gestor. E o cenario nao e hipotetico —
      o web sobe no merge (Vercel) e a API e deploy separado; ESTA story nasceu
      de uma janela dessas, que durou mais de um dia. O @dev registrou uma
      variante disso na nota D4 ("direcao segura"), mas o caso web-novo +
      API-antiga e a direcao OPOSTA da que ele descreveu.
    suggested_action: >-
      Distinguir `undefined` de `[]`. Quando a resposta nao traz `staleInCache`,
      a causa do `null` e DESCONHECIDA — nem "cache velho" nem "sem URL na
      Meta". Uma quarta contagem (`causaIndeterminada`) ou, mais simples,
      propagar `undefined` ate o util e cair num rotulo neutro do tipo "causa
      nao determinada — API pode estar desatualizada".
    ac_violated: 'AC2, AC3'

  - id: 'QA-12'
    severity: medium
    finding: >-
      O AC6 pede, textualmente: *"`resolveCreativeLinkUrl`: um fixture por
      origem da cascata (`link_data`, `video_data`, `asset_feed_spec`,
      `link_url`) + um sem nenhuma -> `null`"*. Nao existe teste algum dessa
      funcao — `grep -rl resolveCreativeLinkUrl src/__tests__/` volta vazio.
    impact: >-
      E a funcao de que a story inteira depende, e a unica cuja regressao
      reproduziria o defeito original em silencio: a cascata voltaria a nao
      encontrar a URL, o cache gravaria `null` com carimbo NOVO, e a tela
      passaria a afirmar com confianca que a Meta nao tem o dado. O carimbo,
      que e a boa ideia desta story, amplifica o estrago de uma regressao ali.
    suggested_action: >-
      5 casos em `packages/api/src/__tests__/`. A ordem da cascata tambem merece
      um caso: `link_data` deve vencer `link_url` quando os dois existem.
    ac_violated: 'AC6'

  - id: 'QA-13'
    severity: low
    finding: >-
      O AC6 tambem pede caso para "100% nao resolvido -> analise impossivel". O
      comportamento foi implementado (limiar `>= 99.5` no componente), mas mora
      no JSX e nao e alcancavel por teste unitario na estrutura atual.
    suggested_action: >-
      Extrair o limiar e a escolha do tom para uma funcao pura no util (algo como
      `classifyLpCoverage(share)`), que ai fica testavel. Ou aceitar e cobrir na
      validacao manual. Nao bloqueia.

