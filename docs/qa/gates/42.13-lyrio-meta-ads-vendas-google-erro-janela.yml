top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'O conserto central do relato ("Google está com erro para puxar os dados") é MOSTRAR o erro, e a camada que mostra não tem teste. Mutações aplicadas no `.tsx`, cada uma com as duas suítes da story (33 testes) e, juntas, com a suíte inteira do web (1.918 de 1.918 verdes): Q1 `googleAtivo = googleCampaignIds.size > 0` (sem `&& !!googleAccountId`, a AUTO-DECISION do @dev: com ids e sem conta, o ROAS e a Margem do Resumo ficariam "—" para sempre) → SOBREVIVE · Q2 memorial do card "Investimento (Google)" em erro trocado por `false` (o card fica "—" sem causa, contra o AC1b "com a causa no memorial") → SOBREVIVE · Q3 a mensagem do erro no memorial vazia → SOBREVIVE · Q4 o aviso do Detalhamento sem `mensagemDoErroDoGoogle(erroGoogle)` → SOBREVIVE · Q7 `GoogleAdsKpis` sem `{estado.mensagem}` (o AC1a pede a mensagem da API) → SOBREVIVE · Q8 `GoogleAdsKpis` sem a orientação de reconectar → SOBREVIVE. O fio por `readFileSync` da story confere a presença do `role="alert"` e das condições, mas não o conteúdo de cada alerta nem o memorial. Hoje o código está certo; o risco é a próxima edição apagar a mensagem e a tela voltar a dizer só "Não foi possível buscar", sem o `invalid_grant`.'
    recommendation: 'No teste de fio de `lib/utils/__tests__/vendas-por-canal-lyrio.test.ts`, amarrar: (a) `const googleAtivo = googleCampaignIds.size > 0 && !!googleAccountId;`; (b) o ramo `googleEstado28.tipo === "erro"` do memorial com `value: googleEstado28.mensagem`; (c) `{estado.mensagem}` e `{ORIENTACAO_DO_ERRO_DO_GOOGLE}` dentro do bloco `role="alert"` de `GoogleAdsKpis`; (d) `mensagemDoErroDoGoogle(erroGoogle)` no aviso do Detalhamento. Melhor ainda: extrair o memorial de erro para uma função pura em `lib/utils/lyrio-google-ads.ts` e testá-la.'
    owner: '@dev'
    status: open

  - id: TEST-002
    severity: low
    category: tests
    description: 'Outras quatro mutações sobrevivem: Q5 o bloco Meta sem `declaracaoDeCobertura(estado.dados)` (AC2e) → SOBREVIVE · Q6 o bloco Meta sem o `role="alert"` do erro da rota (AC2f) → SOBREVIVE · Q10 o `desde` da resposta da JORNADA de volta à régua antiga (`agora − days × 24 h`, dia UTC) → SOBREVIVE na suíte inteira da API (as 10 falhas da baseline e nenhuma outra). O web usa esse campo na declaração da assinatura (`lib/utils/jornada-lyrio.ts:105`). O AC4c só cita o `desde` de vendas-por-canal, e esse está protegido (Q9 cai) · Q16 `gte` → `gt` no corte de `/sales` → SOBREVIVE. Só muda a venda às 00:00:00,000 exatas de SP, e o AC6d testa 23:30 e 00:30.'
    recommendation: 'Acrescentar ao fio do bloco Meta as duas linhas (cobertura e alerta). No teste de fio da Jornada, afirmar `corpo.desde === inicioDaJanela(30, businessToday(new Date(antes)))`, como o de vendas-por-canal já faz. A borda exata (Q16) é opcional.'
    owner: '@dev'
    status: open

  - id: REL-001
    severity: low
    category: reliability
    description: '`LyrioMetaKpis` copiou de `SalesMetaKpis` o `daily ? sumMetaInsights([daily]) : { spend: 0, impressions: 0, linkClicks: 0 }`. Com a consulta de tráfego da Meta em erro, o bloco mostra "Investimento (Meta)" R$ 0,00 e, havendo vendas, "Custo por venda" R$ 0,00, porque `div(0, vendas)` dá 0 e não `null`. É o mesmo padrão "erro virando zero" que a story conserta no Google. O padrão é ANTERIOR à story (o bloco antigo já fazia isso) e o AC2 não trata o erro do tráfego, por isso o achado é low.'
    recommendation: 'Story pequena: ler `error` de `useCampaignDailyInsightsBulk` no bloco do Lyrio (e no `SalesMetaKpis`) e mostrar "—" com `role="alert"`, como o Google faz agora.'
    owner: '@sm / @dev'
    status: open

  - id: MNT-001
    severity: low
    category: maintainability
    description: 'Agora há duas réguas lado a lado na mesma resposta: `desde` é o dia de SP (AC4c), mas `atributosDesde` (vendas-por-canal e Jornada) e `assinaturaDesde` (Jornada) continuam como dia UTC (`dataIso` → `toISOString().slice(0, 10)`). `declaracaoDeCobertura` compara `desde < atributosDesde` e imprime a data. Em produção dá o mesmo dia, mas por 11 minutos: o primeiro atributo é de 2026-10-06T03:11:13Z (00:11 de SP). Um evento entre 00:00Z e 03:00Z imprimiria um dia a mais que o de SP. Fora do escopo do AC4, e equivalente hoje.'
    recommendation: 'Quando alguém mexer nessas declarações: passar `atributosDesde` e `assinaturaDesde` para o dia de SP (o `diaNoFusoDoNegocio` já existe), com uma linha no contrato.'
    owner: '@dev'
    status: open

  - id: DOC-001
    severity: low
    category: documentation
    description: '(a) A seção "Gates" do Dev Agent Record diz "API 72/72 + 7 (`instante-da-janela-4213`); web 44/44". Medi: API `vendas-por-canal-lyrio` 44 + `jornada-lyrio` 24 + `instante-da-janela-4213` 7 = 75; web `lyrio-google-ads` + `vendas-por-canal-lyrio` = 33. Os totais das suítes completas batem (API 5.008/5.018, web 1.918/1.918); só os números das suítes da story estão trocados. (b) `packages/web/lib/utils/jornada-lyrio.ts:44` ainda documenta `desde` como "(`AAAA-MM-DD`, UTC)". O tipo de vendas-por-canal foi atualizado; o da Jornada não.'
    recommendation: '(a) Nenhuma ação no código. Fica registrado aqui. (b) Corrigir o comentário junto com TEST-002.'
    owner: '@dev'
    status: open

