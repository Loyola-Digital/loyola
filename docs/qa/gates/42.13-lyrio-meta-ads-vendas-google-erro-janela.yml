checks:
  code_review: 'Diff `b9a50304...88d0111b` lido inteiro (15 arquivos, 942+/36−). API: `instanteDoInicioDaJanela` lê o deslocamento do `Intl` na meia-noite UTC do dia de início. Conferi à mão: 13/10 com `days = 5` → 09/10 03:00Z, e 2018 com horário de verão → 02:00Z. A virada de horário de verão poderia errar uma hora na volta (fevereiro), mas o Brasil não tem horário de verão desde 2019, então não é achado. As três rotas usam a mesma função e nenhum `86_400_000` sobra em `revenuecat.ts`, `vendas-por-canal-lyrio.ts` e `jornada-lyrio.ts` (grep). A Jornada continua cortando pela coorte, no HAVING (PO-01). O corte compara `purchased_at` com um parâmetro, sem função na coluna (AC4d). O `desde` da resposta sai de `toISOString().slice(0, 10)`, e isso está certo com o fuso de SP negativo: 00:00 de SP cai no mesmo dia em UTC. `services/google-ads.ts` não está no diff (AC4e). Web: `estadoDoGoogle` dá prioridade ao erro (mesmo com cache), `investimentoDoGoogle` devolve `null` em erro e em carregando, e o Resumo usa `googleIndisponivel` no ROAS, na Margem e no card. `LyrioMetaKpis` recebe o MESMO estado `vendasPorCanal` do pai (chave `["revenuecat-vendas-por-canal", stageId, days]`, a mesma do Detalhamento) e força `oculto` sem RevenueCat. `SalesMetaKpis` não está no diff (AC2a). O rótulo do rodapé vem de `rotuloDoNaoIdentificado(dimensao)`.'
  autonomous_decisions: '(1) Uma régua só, `instanteDoInicioDaJanela`, com as assinaturas `desde: Date` mantidas: CORRETA. (2) O deslocamento lido do `Intl`, e não fixado em −03:00: CORRETA. Q11 cai pelo teste de 2018. (3) O erro do Google tem prioridade sobre o dado em cache: CORRETA. (4) O Resumo trata "carregando" como desconhecido (ROAS e Margem "—" até o Google responder): CORRETA, porque antes o ROAS aparecia só com a Meta. (5) Com ids do Google e sem conta, o Google conta 0 (`googleAtivo`): CORRETA, mas sem teste (Q1, TEST-001). (6) RevenueCat desconectado → `oculto`, com o convite para conectar: CORRETA. (7) A dica de "Margem" saiu do bloco Meta: aceita, porque a Margem por canal já está no Resumo (42.12).'
  unit_tests: 'Suítes da story: API 75/75 (`instante-da-janela-4213` 7, `vendas-por-canal-lyrio` 44, `jornada-lyrio` 24) e web 33/33 (2 arquivos). Suítes completas, rodadas por mim na worktree: API 5.008 de 5.018, com as 10 falhas da baseline nos mesmos 5 arquivos (`funnel-stages-lead-inputs` 3, `projects` 3, `schema` 2, `instagram` 1, `instagram-routes` 1); web 1.918 de 1.918 em 138 arquivos. TZ: `instante-da-janela-4213` fixa `TZ = UTC` (o do servidor) e o relógio; a função usa `Intl` com `timeZone` e não depende do TZ do processo. MUTAÇÕES PRÓPRIAS (aplicar → suíte → `git checkout`, com `git status` limpo depois de cada uma): Q1 `googleAtivo` sem a conta → SOBREVIVE · Q2 memorial do Google em erro → SOBREVIVE · Q3 mensagem vazia no memorial → SOBREVIVE · Q4 aviso do Detalhamento sem a mensagem → SOBREVIVE · Q5 bloco Meta sem a cobertura → SOBREVIVE · Q6 bloco Meta sem o alerta de erro → SOBREVIVE · Q7 `GoogleAdsKpis` sem a mensagem → SOBREVIVE · Q8 `GoogleAdsKpis` sem a orientação → SOBREVIVE · Q1–Q8 juntas na suíte inteira do web → 1.918/1.918, SOBREVIVEM · Q9 `desde` de vendas-por-canal na régua antiga → 1 · Q10 `desde` da Jornada na régua antiga → SOBREVIVE (suíte inteira da API = baseline) · Q11 deslocamento fixo +3 h → 1 (2018) · Q12 sinal do deslocamento invertido → 8 · Q13 "hoje" em UTC no lugar de SP → 1 (23:30 de SP) · Q14 `new Date(y, m − 1, d)` local no lugar de `Date.UTC` → 3 nesta máquina (BRT); com `TZ = UTC`, a do servidor, a mutação é equivalente · Q15 `diaNoFusoDoNegocio` em UTC → 1 (PGlite) · Q16 `gte` → `gt` em `/sales` → SOBREVIVE · Q17 `investimentoDoGoogle` sem entrega → `null` → 1 · Q18 rótulo do conjunto trocado pelo do anúncio → 1. Resultado: 8 de 18 caem, 10 sobrevivem (TEST-001: Q1–Q4, Q7, Q8; TEST-002: Q5, Q6, Q10, Q16). Também reapliquei 3 das 16 do @dev: M7 (`estadoDoGoogle` ignora o erro) → 2, M11 (bloco lê o total pago) → 4, M14 (ROAS ignora o Google indisponível) → 1.'
  lint_typecheck: 'Refeitos por mim na worktree. eslint da API em `src/`: EXIT 0, 0 erros e 1 aviso antigo (`lp-campaigns.ts:57`, fora da story). `next lint`: "No ESLint warnings or errors". tsc da API `--noEmit`: EXIT 0, 0 linhas. `next build` e tsc do web (depois do build): ver `build`.'
  build: 'Refeito por mim: `next build` EXIT 0 (sem "error" nem "failed" no log) e, depois dele, tsc do web `--noEmit` EXIT 0, 0 erros. O shared `dist` já estava em 42.'
  acceptance_criteria: 'AC1 ✓ (a: três estados, mais o "pronto", com `role="alert"`, a mensagem `error: details` e a orientação; b: card "—", memorial com a causa, ROAS e Margem "—"; c: aviso no Detalhamento com as linhas da Meta mantidas; d: `estadoDoGoogle`/`investimentoDoGoogle` puras e testadas. A camada da tela não tem teste: TEST-001) · AC2 ✓ (a: componente próprio, `SalesMetaKpis` intocado; b: os 5 cards, com "—" na divisão por zero e sem câmbio; c: funil de 3 etapas com CTR e conversão nas setas, sem LP Views, Checkouts e Tickets; d: mesmo estado e mesma chave; e: `declaracaoDeCobertura` sem número fixo; f: 404 → "—", erro → alerta, carregando → skeleton; g: mensagem sem campanha) · AC3 ✓ (rótulo e dica por dimensão; "Sem linha" igual; a nota abaixo da tabela também usa o rótulo da dimensão) · AC4 ✓ (a: uma função nas 3 rotas, com a Jornada pela coorte; b: diário pelo dia de SP; c: `desde` = `inicioDaJanela`; d: indexável; e: Google intocado) · AC5 ✓ (41 → 42, com o histórico declarando a mudança de comportamento; a `origin/main` está no 41) · AC6 ✓ (a–d com os casos pedidos; e: os testes novos caem com as mutações correspondentes, as minhas Q9–Q15/Q17/Q18 e as do @dev que reapliquei) · AC7 ✓ (gates abaixo).'
  no_regressions: 'Suítes completas iguais à baseline. Fora do Lyrio, nada muda: `SalesMetaKpis`, `services/google-ads.ts` e `useGoogleAdsCampaigns` estão fora do diff. A forma das respostas não mudou (o teste de fio confere as 8 chaves de vendas-por-canal). PO-03 medido: o Resumo por canal de 28 dias passa de 289 para 287 vendas pagas (2 em Sem atribuição).'
  performance: 'Em produção, a consulta de vendas-por-canal mediu 609 ms na primeira chamada (fria, 5 dias, régua nova) e de 171 a 201 ms nas outras cinco. Sem índice nem coluna novos; o corte continua sendo instante contra coluna.'
  security: 'Sem mudança de guarda (`getProjectAccess` + `getStage` nas três rotas) e sem dado novo na resposta. A mensagem do Google mostrada na tela é a que a API já devolvia no 502 (`error` + `details`). Ela não leva token nem segredo: no caso real, é o JSON `invalid_grant` do Google.'
  documentation: 'Dev Agent Record completo, com decisões, a conferência em produção nas duas réguas e 16 mutações. Números das suítes da story trocados (DOC-001a). O histórico do contrato declara a mudança de comportamento e o exemplo de 13/10.'
  api_contract: '41 → 42 sobre a `origin/main` b9a50304 (conferido com `git fetch`: a main ainda está no 41). O `shared/dist` da worktree já está em 42. Não muda forma; o web antigo contra a API nova só vê janelas em SP. Se outra PR subir o contrato antes do merge, o @devops renumera.'

