checks:
  code_review: 'Diff de 10 arquivos lido inteiro. SQL por usuário SEM o id (`GROUP BY app_user_id`, id fora do SELECT), `bool_or` com `coalesce`, `sum … FILTER (revenue_usd > 0)` em `REVENUE_EVENT_TYPES` e coorte no HAVING e também na função pura (defesa dupla). Prioridade e contagem ficam em funções puras. As regras de canal batem com a tabela "Regra de canal medida" (PO-02), inclusive `jsonb_exists(... coupom_code)`, `upper(platform) = IOS OR store = APP_STORE` e `acquisition_source` fora. A rota tem a guarda de `/sales` (`getProjectAccess` + `getStage`, não o modelo de `/metricas-derivadas`) e `days` via `salesQuerySchema` (1–365, default 90). A resposta traz só `days`, `desde`, `assinaturaDesde`, `linhas` e `total`. O bloco fica fora da condição do Detalhamento e usa o `days` do cabeçalho. O hook tem `retry` sem 404. Nada no código a corrigir.'
  autonomous_decisions: '(1) "Só o 404 da ROTA (corpo `Not Found`) esconde o bloco; 404 de domínio vira erro": CORRETA. O AC6 fala em "404 da rota (API ainda sem ela)". A lição da 47.15 já mostrou que 404 de domínio não é API atrás, e a decisão reaproveita `ehApiAtras` (IDS REUSE). Conferido no `api-client.ts`: o Fastify responde `{ error: "Not Found" }`, e esse texto vira `message`. Então a rota inexistente dá "Not Found" e "Etapa não encontrada" dá erro. Há teste para os dois. (2) "Falha com dado antigo em cache mostra o erro": CORRETA e coerente com "erro não vira ausência nem dado velho". Para o React Query, os números de outra janela ou de antes da falha não são os da janela pedida. O custo é que um refetch em segundo plano que falhe troca uma tabela válida por erro. Esse custo é atenuado pelo `retry` de até 2 e fica registrado para a validação visual. Mutação N3 (dado antes do erro) → 1 falha, então a decisão está protegida por teste.'
  unit_tests: 'Suítes da story: API 19/19, web 9/9. Suítes completas: web 1455/1455 (108 arquivos); API 3127 passando e 10 falhando, as 10 do baseline em 5 arquivos (funnel-stages-lead-inputs 3, projects 3, schema 2, instagram-routes 1, instagram 1). Mutações próprias, cada uma aplicada, rodada e revertida com `git checkout` (`git status` vazio depois de cada uma): N1 FIO SQL→TS, condições de `c_gclid` × `c_install` trocadas (a prioridade invertida no SQL real) → SOBREVIVEU (TEST-002) · N2 REGRA, coorte na janela em vez da série (`event_at >= desde` no WHERE) → SOBREVIVEU (TEST-001) · N3 decisão autônoma, dado em cache vence o erro → 1 falha · N4 PII, `app_user_id` no SELECT → 1 falha.'
  regate_2026_09_24_qa_fix: 'Commit e1821bcc: só `packages/api/src/__tests__/jornada-lyrio.test.ts` (+55); nenhum código de produção mudou (conferido no `git diff --stat`). MUTAÇÕES (aplicar → suíte → `git checkout`, `git status` vazio depois de cada uma): N1 (a do gate) condições de `c_gclid` × `c_install` trocadas no SQL → 1 falha (alias) · N2 (a do gate) `AND event_at >= desde` no WHERE → 2 falhas (PgDialect + fio da rota) · N6 janela pelo escopo (`event_at > now() - 365 days` dentro do `and(...)` de `escopoDaJornada`) → 2 falhas · N7 aliases `c_fbclid` × `c_organico` trocados (condições no lugar, nomes invertidos) → 1 falha · N8 `primeiro_evento` com `max` em vez de `min` → 1 falha · N5 `coalesce(purchased_at, now()) >= desde` no WHERE → SOBREVIVE, mas é praticamente equivalente: para quem está na coorte (primeiro evento ≥ desde), toda compra já é posterior a desde, então o filtro não muda nenhuma contagem. Não vira achado. GATES: suíte da story API 22/22 (eram 19) e web 9/9; web completo 1455/1455 (108 arquivos); API completa 3130 passando / 10 falhando, as mesmas 10 do baseline nos mesmos 5 arquivos; eslint do arquivo tocado 0; tsc da API 0. `next build`/tsc do web não refeitos: nada do web mudou desde o gate.'
  acceptance_criteria: 'AC1 ✓ (7 linhas + Total, colunas e as duas taxas; "—" com denominador 0; posição e `days` conforme o PO-03) · AC2 ✓ no código (ver TEST-001: a coorte "pela série" só está protegida na função pura) · AC3 ✓ (prioridade e valores medidos; probe do PO-04 registrado ANTES de codar: `platform` em 100% dos paywalls, então iOS e Android ficam separados) · AC4 ✓ (as três declarações; data (a) vem da API, `assinaturaDesde`) · AC5 ✓ (rota, guarda, agregação no banco, sem PII, contrato 19 → 20) · AC6 ✓ · AC7 ✓ com as lacunas de TEST-001/002 · AC8 ✓ (eslint dos arquivos tocados 0; tsc da API 0; tsc do web 0; `next build` conforme o Dev Record, não refeito).'
  no_regressions: 'Rota e componente novos. O `lyrio-stage-view.tsx` ganhou só o import e o bloco. `webhooks.ts` e `services/revenuecat.ts` não mudaram (PO-10). As suítes completas estão iguais ao baseline.'
  performance: 'Duas consultas por requisição, em paralelo. A da jornada agrupa cerca de 110 mil eventos da etapa (medido em produção: 346 ms para 10.150 usuários) e usa o índice `(stage_id, …)`. O `staleTime` é de 60 s. Aceitável para um bloco de análise. Se o volume crescer, a candidata natural é cache no banco, não filtro de janela no WHERE (ver TEST-001).'
  security: 'Guarda `getProjectAccess` (guest sem vínculo → 404) + `getStage` (etapa do funil e do projeto → 404 sem consultar eventos), ambas testadas no fio. SQL parametrizado (drizzle `sql`). O `app_user_id` só aparece no GROUP BY. Não há log do resultado. A resposta tem 5 chaves conhecidas e nenhum id (teste de fio).'
  documentation: 'Story com Dev Agent Record completo: probe do PO-04, riscos medidos (`UNCANCELLATION` 0 com receita > 0; 1 evento SANDBOX) e conferência do SQL exato em produção. Tooltips das colunas trazem as definições do PO-03.'
  api_contract: '19 → 20, com linha de histórico e declarada ADITIVA (rota nova). O web tem fallback: 404 da rota esconde o bloco e o banner acusa a versão. O briefing informa a `main` já em 20; o `origin/main` local (9a9dcde8, sem fetch) ainda mostra 19. Nos dois casos, esta branch e a 47.16 (que também sobe para 20) precisam de renumeração no merge, com histórico, e isso é do @devops, não FAIL.'

