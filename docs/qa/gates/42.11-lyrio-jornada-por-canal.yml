top_issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'Mutação N2: `consultaDaJornada` ganhou `AND event_at >= desde` no WHERE. Com isso, o `min(event_at)` passa a ser calculado só dentro da janela, o HAVING vira tautologia e todo usuário ativo na janela vira "novo" (e as etapas também passam a contar só dentro da janela, não "até hoje"). É o inverso da definição central do AC2. Mesmo assim, as 19 da API e as 9 do web passam. O caso "usuário antigo com evento novo NÃO entra" do AC7 só é testado na função pura, que recebe `primeiroEvento` pronto. O teste do SQL confere que o HAVING existe, mas não que o WHERE está livre de filtro de data. O risco é concreto: o índice é `(stage_id, event_at)`, e quem otimizar a consulta vai querer justamente esse filtro.'
    recommendation: 'Em `jornada-lyrio.test.ts`: `expect(q.sql.slice(q.sql.search(/ where /i), q.sql.search(/ group by /i))).not.toMatch(/event_at/)`, com um comentário de que a série inteira é a regra do AC2. O mesmo vale para o SQL capturado no teste de fio.'
    status: resolved
    resolution: 'fechado em e1821bcc: sem `event_at` no WHERE…GROUP BY (PgDialect e SQL executado pela rota), e `event_at` só nos dois min(); N2 → 2 falhas, N6 (janela via escopo) → 2, N8 (`max` no primeiro_evento) → 1'

  - id: TEST-002
    severity: low
    category: tests
    description: 'Mutação N1: troquei as condições das colunas `c_gclid` e `c_install` no SQL (a ligação SQL → `lerLinhaDaJornada` → `canalDoUsuario`), e as 28 passam. Na tela, as linhas Google (≈2,4 mil) e Meta ig4a/fb4a (≈5 mil) trocariam de números, e a prioridade gclid > ig4a ficaria invertida para quem tem os dois. O "inverter derruba" do AC7 está provado só na função pura. O teste do SQL confere que cada condição aparece no texto, mas não o alias a que ela está ligada. Só `viu_paywall` e `pagou` estão amarrados ao nome. O código de hoje está certo: o SQL exato reproduziu a medição em produção (Google 2.383 × 2.368, Meta 5.034 × 5.020). O que falta é teste contra a regressão.'
    recommendation: 'Amarrar cada condição de canal ao seu alias no teste do PgDialect, por exemplo `toContain(\`coalesce(bool_or("revenuecat_sales"."gclid" IS NOT NULL), false) AS "c_gclid"\`)` e as equivalentes de `c_fbclid`, `c_install`, `c_organico`, `c_ios` e `c_campanha`.'
    status: resolved
    resolution: 'fechado em e1821bcc: as seis condições amarradas ao alias + fio alias → lerLinhaDaJornada → canalDoUsuario; N1 → 1 falha, N7 (aliases c_fbclid × c_organico trocados) → 1'

