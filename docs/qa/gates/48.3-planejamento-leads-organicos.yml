top_issues:
  - id: 'TEST-001'
    severity: medium
    status: open
    finding: 'AC8 fixa `conversao = vendas ÷ leads` com os INTEIROS da cadeia do produto. O único teste que afirma a conversão do produto usa o WhatsApp (90 ÷ 2 500 = 0,036), onde o bruto dá o mesmo 0,036 — a mutação `conversao: div(vendasBruto, leadsBruto)` (mistura de cadeias, exatamente o que D10 proíbe) passa **29/29**. Um "simplify" futuro que unificasse as duas conversões não seria pego.'
    suggested_action: 'Afirmar a conversão do produto num canal em que as cadeias divergem: Email `62 ÷ 1 676 = 0,036993` (bruto 0,037) e/ou Área de Membros `14 ÷ 438 = 0,031963` (bruto 0,032); e afirmar explicitamente `conversao !== conversaoBruto` nesses canais. Re-mutar QM3 e ver a suíte cair.'
  - id: 'UX-001'
    severity: medium
    status: open
    finding: 'Bloco sem referência de faixa (base do canal vazia na aba 1 OU taxa de captação vazia no bloco) tem `leadsEsperados = 0`, `limites = {0, 0, 0}` e `faixaDe` classifica toda célula > 0 como faixa 4: a grade inteira fica VERMELHA e a legenda mostra "# Leads < 0 · 0 ≤ # Leads ≤ 0 · 0 < # Leads ≤ 0 · # Leads > 0". Reproduz a planilha (V0), mas é o caso que a nota 2 do gate da 48.2 pediu para a tela desta story tratar ("pode preferir — quando não há base — registrar lá"). O diagnóstico da aba 1 cobre a base vazia, mas não a taxa de captação (parâmetro do bloco), e a grade vermelha lê como "tudo ruim", não como "sem base" — erro virando outra coisa.'
    suggested_action: 'Na tela: quando `grade.leadsEsperados` não é > 0, não colorir as células e mostrar a legenda "Faixas sem base — informe a taxa de captação e a base do canal" (o ramo já existe para `limites === null`; estender para referência zero). Motor intocado (48.2 reproduz de propósito). Teste no `lib/utils` se a decisão de cor for extraída para função pura.'
  - id: 'REQ-001'
    severity: medium
    status: open
    finding: 'AC13: "Se foi salva mas com margem-alvo sem base (meta de receita `null`), as grades mostram —". Com meta `null` o motor da 48.2 devolve série de dez zeros e vendas/leads 0 (é a regra da 48.2: meta vazia → zeros), então a grade mostra **"0"** em toda célula, não "—". A tela avisa "Custos variáveis somam 100 % ou mais…" (bom), mas o número na grade contradiz a AC. O mesmo vale para a AC3 ("série toda zero e vendas null") — a metade "vendas null" não é o que o motor faz, e não é desta story mudar o motor.'
    suggested_action: 'Presentação, sem tocar o motor: em `BlocoDoCanal`, quando `origem.metaReceita === null`, renderizar "—" nas células de receita, vendas e leads (e nas combinações o canal já contribui 0 — manter). Registrar no Dev Agent Record que a AC3 "vendas null" é imprecisa: o motor dá 0 e a tela traduz para "—" só quando a META é null (sem base), não quando é zero.'

