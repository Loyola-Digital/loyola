equivalence_claim: 'A afirmação do @dev ("somar o Investimento em float ou em centavos dá o mesmo, porque o Google é sempre centavo inteiro") VALE, mas o motivo declarado não basta. O Google em centavos inteiros é necessário. Falta mostrar que a Meta crua nunca fica a um épsilon de ponto flutuante do meio centavo. Isso vale porque o spend da Meta vem em centavos e o gross-up é ÷ 0,8785 = × 2000/1757. Em centavos, a parte fracionária do total da Meta é k/1757 (com linhas de 2025 sem imposto também), e k/1757 = 1/2 exigiria 2k = 1757, ímpar: impossível. A menor distância ao meio centavo é 1/3514 ≈ 2,8e−4 de centavo, ordens de grandeza acima do erro do float. Confirmei com o código real: 0 divergências em 400 mil spends de uma linha e em 200 mil combinações de 1 a 20 linhas (`contraexemplos.mts`, `contraexemplos2.mts`). Q11 (a soma em float) sobrevive, como esperado. O mesmo argumento mostra que o Total cru do Invest. Meta e a soma da coluna nunca divergem na exibição. A Receita NÃO tem essa proteção, porque o câmbio tem 4 casas arbitrárias: é o REL-001.'

