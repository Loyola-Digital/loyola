checks:
  code_review: 'Li o diff inteiro (14 arquivos). API: `montarDiarioDoTotalPago` agrupa por dia, soma `vendas` e `centavos` sem filtro de canal e ordena por dia. A rota calcula `diasDosCompradores` uma vez e alimenta a 42.19 e o `diario`. Web: `montarDadosDiariosDoLyrio` monta os dias com `diasDaJanela(n, hoje)` (o `hoje` é o `hojeNoNegocio()` de SP da tela). A Meta usa `sumMetaSpendWithTax` sobre as MESMAS linhas do card (`metaDailyFiltro`); o card recebe `metaFiltro = sumMetaSpendWithTax([metaDailyFiltro])`, então é a mesma função sobre o mesmo array. O Google usa `googleTrafegoFiltro`, de onde sai o `investimentoDoGoogleNaRegua` do card (mesmos argumentos, mesmo `spend`). As vendas usam `vendasDosBlocos` (o mesmo estado e a mesma chave de cache). O Total do Investimento é `(centavos(Meta) + centavos(Google)) / 100`, a fórmula do card (`resumo-mobile-lyrio.ts:298`). O Total da Receita é `totalPago.receitaUsd × taxa`, como no card (`:350`). A tabela não chama `cardsDoResumo`: recompõe com os mesmos helpers e os mesmos insumos. A igualdade é por construção e está testada contra o `cardsDoResumo` real. As razões do rodapé saem das somas (`razoes()` sobre os totais). O componente só desenha, com o `title` da causa em cada "—" e o `role="alert"` por aviso.'
  unit_tests: 'Rodados por mim. API vitest: 5.425 passaram e 10 falharam, de 5.435. As 10 são EXATAMENTE a baseline (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2), sem timeout. Web vitest `--testTimeout=60000`: 2.509/2.509 em 172 arquivos. MUTAÇÕES PRÓPRIAS: `scratchpad/qa-gate-4217/mutar-qa.py` (série Q, 35, uma por vez, sempre restaurada; `git status` limpo no fim). Rodei contra as 3 suítes da 42.17 no web e as 3 da quebra de vendas na API (42.17, 42.19 e 42.12). Lista de dias: Q01 fim ontem cai · Q02 início 1 dia antes cai · Q03 some o dia vazio cai · Q04 a tela passa o hoje de UTC cai · Q05 dia por `event_at` na API cai. Dia em andamento: Q06 marca no 1º dia cai · Q07 marca sem a dica cai. Total = Resumo: Q08 Meta sem imposto cai · Q09 Receita ≠ card cai · Q10 Investimento parcial com o Google desconhecido cai · Q11 soma em float SOBREVIVE (equivalente provada). Gross-up: Q12 dia pelo `sumMetaInsights` SOBREVIVE (equivalente: o mesmo gross-up, e a repartição arredonda) · Q13 imposto duas vezes no Total cai. Câmbio: Q14 duas vezes nas parcelas do dia SOBREVIVE (TEST-001) · Q15 duas vezes no Total cai. Σ diario = totalPago: Q16 centavo do dia ao dólar cai · Q17 a rota perde um dia cai. Regra do `diario`: Q18 sem o conflito cai · Q19 sem o sem atribuição cai · Q20 conta evento de US$ 0 de comprador SOBREVIVE (TEST-003). "—": Q21 desconhecido vira 0 cai · Q22 Total sem a causa cai · Q23 vendas desconhecidas viram 0 cai. Janela misturada: Q24 cai · Q25 cai · Q26 SOBREVIVE (TEST-002). API antiga: Q27 cai · Q28 controle equivalente SOBREVIVE (esperado). Coluna do Google: Q29 aparece sem campanha cai · Q30 a tela sempre mostra o Google cai. Outros: Q31 resto no menor dia cai · Q32 custo por venda do rodapé cai · Q33/Q34 (D4) caem · Q35 borda do `serieDesde` SOBREVIVE (TEST-002). Total: 28 caem e 7 sobrevivem; 3 das sobreviventes são equivalentes (Q11, Q12, Q28) e 4 são achados (Q14, Q20, Q26, Q35). Li o `mutar.py` do @dev (56/56), mas não usei como evidência. As minhas variantes são outras: fim deslocado, hoje de UTC no fio, `event_at`, Investimento parcial, câmbio nas parcelas, conflito e sem atribuição no diário, evento de US$ 0, `desde` posterior e borda do `serieDesde`.'
