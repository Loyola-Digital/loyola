top_issues:
  - id: REL-001
    severity: medium
    category: code
    description: 'O AC4c não vale quando a Receita total em R$ cai exatamente no meio centavo. O rodapé (`dados-diarios-lyrio.ts:362` → `formatarCelula`) e o card do Resumo (`resumo-mobile-lyrio.ts:350` → `fmtBRL`) exibem o valor cru, arredondado pelo `Intl`. Já as parcelas dos dias (`dados-diarios-lyrio.ts:363-364` → `fecharNoMaiorDia` → `fecharEmCentavos`, `lyrio-margin.ts:52`) fecham em `Math.round(total × 100)`. No empate, os dois arredondamentos divergem. Reproduzi com o código real (`scratchpad/qa-gate-4217/receita-empate.mts`): US$ 3.250,00 × câmbio 5,4123 = R$ 17.589,975. O card mostra R$ 17.589,98, o Total da tabela também, e os dias somam R$ 8.794,99 + R$ 8.794,98 = R$ 17.589,97. Na varredura (`contraexemplos3.mts`), deu 316 casos em 8 milhões de pares (receita em centavos de US$ × 8 câmbios com 4 casas, como o `/api/fx/usd-brl`). É raro, mas acontece em receitas da ordem das reais (US$ 6.798,19 em 90 dias). O Investimento não tem o problema: o Total sai em centavos inteiros, e a Meta crua nunca empata (ver `equivalence_claim`). O AC4a continua valendo: rodapé = card.'
    recommendation: 'Arredondar a Receita total ao centavo UMA vez, com `Math.round` (`centavos(receitaUsdTotal × taxa)`), e exibir esse valor no card (`cardsDoResumo`) e no rodapé da tabela. Assim card, Total e coluna batem no empate também. Teste: o fixture acima (US$ 3.250,00 × 5,4123, em dois dias de US$ 1.625,00), afirmando card = Total = Σ da coluna = R$ 17.589,98 (ou ,97, desde que os três concordem). `lib/utils` está dentro da D20.'
    owner: '@dev'
    status: open

