checks:
  fidelidade_ao_metodo: 'R11-0a: D0 = `config.datasChave.inicioCaptacao`, e `janela.inicio` é o mesmo valor; a Q5 (D0 = 1ª venda, como no método) morre. R11-0b: o corte vem da 49.12 (o `agora` vira ontem em Brasília), e o caso real deu corte 06/10 com geração em 07/10. R11-0c: CAC, investimento e curva usam `aplicarImposto` com o imposto da config (12,15%), nunca ×1,13. R11-0d: os leads vêm das planilhas `type = "leads"` das etapas de captação, não do export da Kiwify. R11-0h: o AC9 é testado no documento e no payload. R11-3: a curva tem só o atual e a comparação principal (`comparacao` é a principal). AC7: `acao: null` e "sem leitura de IA", com o espaço `data-bloco-ia` para a 49.7. As perguntas do gate do método foram mapeadas como o @po aceitou ("D0 confirmado?" cai, porque D0 vem da config).'
  acceptance_criteria: 'AC1 ✓: o bloco fica entre o banner e a navegação, sem `sec-num`, e as 18 seções seguem 00…17. AC2 ✓: 10 linhas (as 9 do método mais a taxa), Δ, "—" com nota, edição única e parcial sem Δ. AC3 ✓: o CAC usa a mesma base do ROAS de captação; com 0 compradores sai nulo com `SEM_COMPRADORES_DE_CAPTACAO` (M2 e Q13, CAC = 0, morrem). AC4 ✓: dedup por e-mail OU telefone; descarta "test" em qualquer caixa e "teste" (Q1 com `startsWith` morre); conta os descartados; sem fonte, lacuna nova exigida pela F11; `LEADS_DO_PAINEL` continua; taxa = compradores headline ÷ leads únicos. AC6 ✓: a curva fecha com os totais (compradores, faturamento com order bump, investimento só de captação: Q2, Q3 e Q4 morrem) e para no corte dos dois lados. AC7 ✓. AC8 ✓, com ressalva (REQ-002). AC9 ✓. AC10 ✓, com a seção 17 (REQ-001). AC11 ✓ (ver contrato). AC12 ✓ na letra para A+B, com o furo de chamador do TEST-001; o caso real dos testes pré-lançamento fica com a fatia C.'
  ac10_sha: 'Reproduzido com o `sha-4917.mts` do @dev: a saída `-v` bate byte a byte com `sha-4917.txt` (7 casos: 17 iguais, mais a exceção da 03; no sem-planilha, 16 + 1 + Base de Conhecimento). A cópia `velho-4917/` foi conferida idêntica a `origin/main:packages/api/src` (`diff -rq`). O script compara por título as `<section>`, e por isso não vê o que fica FORA delas (cabeçalho, banner, rodapé e o JSON `const D` dos gráficos). O QA estendeu a prova (`qa-full-4917.mts`): o HTML INTEIRO novo, sem os acréscimos (bloco, regra de CSS, os 2 gráficos da curva em `D` e o texto da 03), comparado por SHA com o HTML da main, dá IGUAL em 6 dos 7 casos. No 7º (sem planilha), a diferença é só a linha da lacuna nova na seção 17. Alertas iguais nos 7. Payload: só os caminhos aditivos (`dinheiroTempo.cac`, `.leads`, `.curvaAcumulada`, `resumoMacro`) e, no sem-planilha, a lacuna nova em `lacunas`.'
  ac13a_da_4912: 'O ajuste não esconde regressão. `semO4917` corta exatamente o trecho entre `data-resumo-macro` e `<div class="nav">`, que é só o bloco, porque a montagem é header + aviso + banner + resumo + nav. A regra de CSS sai por string exata. O texto da 03 é trocado do novo para o antigo, e só ele. Do `D` saem apenas as duas chaves da curva, que entram por último, e o JSON é reserializado. O SHA medido em `4920adfb` continua batendo, o que prova a reserialização fiel e o resto do documento intacto. A asserção `not.toBe(SHA)` garante que o bloco está lá. No payload saem só os 3 campos aditivos (`leads` não existe nessa fixture).'
  unit_tests: 'Rodado pelo QA: suítes de debriefing + post-do-criativo da API, 29 arquivos, 843/843; o arquivo novo tem 27 testes. As 35 mutações do @dev, reexecutadas: 34 mortas, M18 viva. A M18 é equivalente: o render recalcula o resumo com a mesma função e as mesmas entradas, e o fio do payload está preso pela M35. Mutações do QA (`scratchpad/qa-mutar-4917.py`, contra as 29 suítes de debriefing, cada uma restaurada, `git status` limpo): 13 de 15 morrem. Morrem: Q1 teste por `startsWith`; Q2 curva pela última compra; Q3 curva sem order bump; Q4 investimento de todos os grupos; Q5 D0 = 1ª venda; Q6 Δ invertido; Q8 só `leads-captacao` é captação (o PG05 é `vendas-captacao`); Q9 qualquer etapa serve; Q10 F11 exige a lacuna em payload antigo (92 falhas: compatibilidade com payload salvo protegida); Q12 limitação da comparação salva omitida; Q13 CAC 0; Q14 taxa antes do dedup; Q15 texto da 03 com payload antigo. Sobrevivem Q7 e Q11 (TEST-001).'
  web: '`next build` exit 0. Depois do build, `tsc --noEmit -p .` exit 0. `next lint` sem avisos. Suítes de debriefing do web: 7 arquivos, 95/95. O web não muda e não lê o payload do debriefing (grep).'
  no_regressions: 'API: `node_modules/.bin/tsc --noEmit -p packages/api` exit 0. `eslint src/`: 0 erros e 1 warning pré-existente. API inteira: 246 arquivos, 10 falhas e 4.592 passando. As 10 são as pré-existentes conhecidas (funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2).'
  contrato_e_versao: 'Concordo com as duas decisões do @dev. `API_CONTRACT_VERSION` fica em 36: a forma das rotas não muda (o 200 continua `{ id, html, payload, alertas, substituiuParcial }`), o payload só ganha campos opcionais e o web não os lê; subir acenderia o banner "API atrás" sem ganho. `DEBRIEFING_PAYLOAD_VERSAO` fica em 1: `lerUltimoPayloadSalvoDoFunil` filtra `versao = atual`, então subir faria TODO relatório salvo deixar de servir de comparação (R7-7), e o fallback viraria 422 `COMPARACAO_SEM_CONFIG`. A regra dos campos aditivos e opcionais, ratificada na 49.12, segue valendo. Payload antigo como comparação: "—" com nota (testado), e a F11 não exige a lacuna nova quando `leads` está ausente (a Q10 morre com 92 falhas).'
  caso_real_pg05: 'Conferido no Dev Agent Record e no script (`ac12-4917.mts` e `.out`), sem rodar de novo. A sessão tem `default_transaction_read_only=on`, e o `.out` registra `"sessao_read_only": "on"`. O `gravar` é no-op, retornando `"nao-gravado"`. A saída só traz agregados: contagens, valores, rótulos de planilha e códigos de lacuna; nenhum e-mail, telefone ou nome (o .out não tem nenhum "@"). As premissas de etapa e pergunta são simuladas e estão rotuladas. Resultado: 279 leads únicos (330 lidos, 1 de teste, 49 fora da janela), taxa de 67,0%, CAC de R$ 46,09 e a curva D+0…D+6 fechando com 187 compradores, R$ 13.094,30 e R$ 8.618,27.'
  security: 'Nada de PII novo no payload: os leads entram só como contagens, e a dedup usa as chaves anônimas de `chavesDeComprador`. O HTML novo passa por `esc()` (rótulos, notas, limitações e pendências). Nenhuma rota nova.'
  performance: 'A leitura de leads reaproveita a aba já lida como fonte da jornada, sem chamada nova ao Sheets (o teste de PGlite confere "lida uma vez"). A curva tem O(dias × séries), e o caso real levou 4,9 s.'

