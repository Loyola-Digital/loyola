issues:
  - id: TEST-001
    severity: medium
    category: tests
    description: 'Duas mutações não equivalentes sobrevivem às 29 suítes de debriefing (831/831). (Q7) O orquestrador monta o resumo com `alertas: []` em vez de `guardas.alertas` (`debriefing-generate.ts`, bloco 5a). O WF2 (preço contaminado) some das limitações do payload e do documento, e nada falha: o teste do WF2 chama `montarResumoMacro` direto, não pelo `gerarDebriefing`. É exatamente o chamador que o AC12 manda cobrir. (Q11) As colunas "Compradores <comparação>" e "Compradores <atual>" da tabela da curva trocadas (`debriefing-render.ts`, `linhasCurva`). O documento passa a mostrar o número de um lançamento sob o nome do outro, e nada falha: o teste da curva confere só os rótulos D+x das linhas. As 49.18–49.20 vão mexer no mesmo render, então essa troca é uma regressão plausível.'
    recommendation: 'Acrescentar os 2 testes do rascunho do QA (`scratchpad/qa-rascunho-teste-4917.ts`, cerca de 30 linhas) ao fim de `debriefing-resumo-macro-49-17.test.ts`. Eles reaproveitam `deps`/`gerar`/`bloco`. O QA rodou o rascunho na worktree e depois o removeu: os 2 testes passam sem mutação, Q7 morre e Q11 morre. Opcional: estender o Q11 às colunas de faturamento e investimento e às séries dos 2 gráficos.'
    owner: '@dev'
    status: open

  - id: REQ-001
    severity: low
    category: requirements
    description: 'Pergunta do @dev sobre a seção 17. Sem planilha de leads, a lacuna nova `LEADS_UNICOS_SEM_FONTE` aparece na lista "Lacunas declaradas" da Base de Conhecimento. O QA mediu que é a ÚNICA diferença: tirando a linha `<br><code>LEADS_UNICOS_SEM_FONTE</code> …`, o HTML inteiro, sem os acréscimos, bate com o da main. A letra do AC10 só prevê a exceção da seção 03, então tecnicamente o AC10 não cobre esse caso. Mas a diferença é a consequência correta do AC4: a lacuna é obrigatória (F11) e a seção 17 é o catálogo de TODAS as lacunas do payload (49.5 AC8). O AC10 existe para proteger o conteúdo que já existia, e esse conteúdo está intacto.'
    recommendation: 'Recomendação do QA ao @po: ratificar como 2ª exceção do AC10 ("a lacuna nova declarada pelo AC4 entra na lista de lacunas da seção 17 quando não há planilha de leads") e NÃO filtrar a lista. Filtrar deixaria a lacuna no payload, nas limitações do resumo e na F11, mas fora do catálogo do documento. Seria uma lacuna declarada pela metade, contra a regra "lacuna escrita, nunca em silêncio". A decisão é do @po.'
    owner: '@po'
    status: open

  - id: REQ-002
    severity: low
    category: requirements
    description: 'As limitações do resumo (AC8) cobrem as lacunas do catálogo `LACUNAS_QUE_AFETAM_A_PARIDADE` dos dois lados e o WF2 só do lado atual. O que fica de fora, que pode mexer em compradores/investimento da captação: as pendências `MIDIA_DE_ETAPA_FORA_DA_CONFIG`, `VENDA_DE_ETAPA_FORA_DA_CONFIG` e `TIPO_INESPERADO_NA_CAPTACAO`, e os alertas das guardas da comparação. Não viola o AC8, que fala de "lacunas e alertas", e essas pendências aparecem em outras partes do documento. O exemplo do AC8 "plataforma de venda ausente" não tem fonte no payload, e o @dev não inventou uma, o que está correto.'
    recommendation: 'Se o @po quiser, uma story futura acrescenta as pendências que tiram dinheiro ou venda da conta. Não bloqueia.'
    status: open

