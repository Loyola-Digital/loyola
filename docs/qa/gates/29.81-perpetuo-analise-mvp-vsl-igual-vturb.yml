checks:
  code_review: 'Diff `origin/main...14b616a2` com 16 arquivos. **CHAIN-01 intacto:** `vturb-chain.ts`, `funnel-templates.ts`, `cac-protocol.ts`, `perpetual-chain-section.tsx` e `routes/vturb.ts` estão sem hunk. Na cadeia, `pitchRateEncadeado` = Σ over ÷ Σ started; `connect_rate` = Σ viewed; `conv_post_pitch` = checkouts ÷ Σ over. O numerador de cada elo é o denominador do seguinte. **Cartão:** `retencao` = `totalDaTabela(videos).retencao` (a mesma função do Total da 29.78, com o Σ extraído em `somaDasVsls`); o Play rate segue arredondado; o `AVISO_DA_CADEIA` declara a base encadeada; `DICA_DA_SOMA`, "soma de X de Y vídeos", proveniência por vídeo com o pitch atual, e a guarda de janela com `tabela.range`. **Funil misto** (vídeo lido, sem pitch, com `startedUniq > 0`): `pitch_rate` e `conv_post_pitch` saem ausentes com o motivo nomeando o vídeo, e a Retenção do cartão cobre os vídeos com pitch, com "Fora da Retenção". **Falha parcial:** fica fora do Σ com linha vermelha no cartão, e `connect_rate`/`conv_post_pitch` saem ausentes com o motivo. **Falha geral:** erro no cartão e os 4 elos ausentes com o motivo, sem número calado. **Fallback:** a `/chain` só é pedida no 404 da `/vsls` (`enabled` via `projectId` nulo). **Feed:** `montarEtapaDoFeed` = `montarEtapa(derivarCadeia(stats, pitchAtual))` trocando só `pitchRate` por `retencaoDoVturb` (`fracaoTruncada` do shared). `lerEtapasDoFeed` faz uma linha por vínculo, em sequência; o pitch atual vem de uma `/players/list` e é o enviado ao `sessions/stats`; a quota conta +1; `pitchRateBase` vai nas 4 respostas de sucesso. O truncamento foi movido, sem reescrita, para o módulo folha `shared/src/percentual-truncado.ts`: o web importa por subpath e a API pelo índice.'
  unit_tests: 'Re-rodado pelo @qa: web completo **1.673/1.673** (121 arquivos); API `public-vsl`, `public-vsl-fio`, `vturb-chain`, `vturb-tabela` e `vturb-rotas-fio` com **81/81**; web `mvp-vsl-somada(-fio)`, `mvp-chain-rates` e `vturb-tabela` com **78/78**. **Mutações próprias** (runner em scratchpad: aplica, roda, restaura com `git checkout`; `git status`/`git diff` vazios no fim): **Q1** fonte da cadeia com `overPitch: soma.over + soma.under` (CHAIN-01 no elo pitch→pós-pitch, a cadeia com a base do VTurb) → **3 falhas**; **Q2** funil misto com `startedUniq >= 0` (vídeo sem pitch e sem plays tornando o funil misto) → **1**; **Q3** feed trocando também o `convPostPitchDenominador` por over+under (muda mais que o `pitchRate`) → **3**; **Q4** `lerEtapasDoFeed` engolindo a falha da `/players/list` com `.catch(() => [])` (feed calado, com pitch nulo em tudo) → **1**. As 21 provas do @dev (W-a…W-l, A-a…A-h) não foram refeitas. Observação: o teste novo de `vturb-chain.test.ts` (2 vídeos) soma à mão e chama `derivarCadeia`, mas o Σ de produção da MVP não passa por `derivarCadeia`. A prova real do CHAIN-01 com 2 vídeos é a do web (`mvp-vsl-somada.test.ts:133-137`), e a Q1 a derruba.'
  acceptance_criteria: '**AC1** ✓: Retenção sobre over+under, truncada pela conta inteira do shared, rótulo "igual ao VTurb", Play rate arredondado. **AC2** ✓: `/vsls` (união, ordem, recorte da 29.78), Σ de `somaDasVsls` extraído de `totalDaTabela`, contagem de vídeos, dica da soma, proveniência lista os vídeos, guarda com a janela devolvida. **AC3** ✓: pitch atual (`/players/list` na `/vsls`), rodapé sem a cópia, vídeo sem pitch fora do Σ da Retenção com indicação, funil misto → elos ausentes com motivo. **AC4** ✓: `connect_rate` com Σ viewed, `conv_post_pitch` com Σ over. **AC5** ✓ (padrão): a cadeia continua encadeada, os 3 arquivos estão intocados, o aviso aparece no cartão e o item 5 do mapa foi estendido a 2 vídeos em `mvp-vsl-somada.test.ts` (não em `mvp-chain-rates.test.ts`, que ficou intacto e verde). **AC6** ✓: a janela anterior passa pela mesma montagem. **AC7** ✓. **AC8** ✓: todos os subitens, com a opção "a resposta inteira falha" para a lista (REL-001). **AC9** ✓. **AC10** ✓: fio web e API por leitura de fonte; `PgDialect` não se aplica no caminho A (o recorte é o da `/vsls`, provado na 29.78). **AC11** ✓ (ver lint e build_typecheck).'
  no_regressions: 'Com a API antiga (404 da `/vsls`), o cartão e a cadeia voltam a ser os da `/chain`, sem mudança. Funil sem vídeo (200 `[]`) continua "Nenhuma VSL vinculada". A cadeia só muda onde o AC manda: o Σ e os elos ausentes com motivo. O feed muda o `pitchRate` (pedido) e ganha o 502/429 da lista (REL-001). A suíte completa da API não foi refeita pelo @qa; o @dev registrou 3.366/3.376 com as 10 falhas da baseline alheia.'
  performance: 'Cota do VTurb: a MVP passa de 2 para 2 × (1 + N) chamadas por abertura (duas janelas, cada uma com `/players/list` + N `sessions/stats`), com cache de 2 min. Com N = 2 são 6 contra 2. O R6 aceitou isso. A chave `vturb-vsls` é compartilhada com o bloco VSL, mas as janelas quase nunca coincidem (calendário × 7/30/90), então na prática não há economia. Funil com muitos vídeos e várias abas abertas na mesma conta pode chegar perto de 60/min; vale observar. Feed: +1 chamada por requisição, já contada na quota.'
  security: 'O recorte não mudou. Feed: `requireScope(PUBLIC_READ_SCOPE)`, vínculos do projeto da URL; o `pitchRateBase` é constante. MVP: `/vsls` com `denyGuest`, funil do projeto e vínculos por etapa E `project_id` (29.78). Novidade menor: o 502 público repassa o texto do erro do VTurb (SEC-001, low).'
  documentation: 'Dev Agent Record completo: caminho A com a razão, 4 decisões e desvios declarados, 21 provas com contagem, gates. JSDoc de `PITCH_RATE_BASE`, `retencaoDoVturb`, `lerEtapasDoFeed` e `montarVturbDaMvp` explica o porquê. O texto "· numerador manual" do `conv_post_pitch` ficou mantido de propósito (Fora do escopo, AUTO-DECISION registrada).'
  api_contract: '**v26 → v27**, com a linha de histórico (`pitchRateBase` aditivo; a chave `pitchRate` muda de significado, 5,76 → 5,58 no NETÃO; consumidor externo; `packages/mcp` não afetado; o web não exige API nova porque a `/vsls` existe desde a v23 e o 404 cai na `/chain`). A `main` está em v26. Se outra PR subir o contrato antes do merge, renumerar é do @devops, não é FAIL desta story.'
  lint: 'eslint re-rodado pelo @qa nos tocados: web 7 arquivos (componente, `mvp-vsl-somada`, `mvp-chain-rates`, `vturb-tabela`, `use-vturb`, 2 testes) com EXIT 0; API 5 arquivos (rota, `vsl-funnel`, 3 testes) com EXIT 0.'
  build_typecheck: '`shared build` re-rodado: EXIT 0. `tsc --noEmit` da API (binário direto) re-rodado: 0 erros, em 10 s. `next build` e `tsc` do web não foram refeitos (instrução do lead; o @dev registrou web 0 e build EXIT 0). O import novo do web é por subpath de módulo folha sem imports, no padrão de `janela-de-dias`.'

