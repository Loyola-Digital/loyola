issues:
  - id: REL-001
    severity: low
    category: reliability
    description: 'O feed 43.5 ganha um modo de falha novo. Antes ele respondia 200 sempre que havia conexão, e a falha de VTurb por etapa ia para `avisos`. Agora, se a `/players/list` falhar, a resposta inteira sai 502 (ou 429). O AC8 autoriza essa opção ("a resposta inteira falha com o status do VTurb"), e ela é mais honesta que o 200 calado de antes: com o VTurb fora, as `sessions/stats` falhariam todas e o feed vinha com `etapas: []`. O impacto prático é pequeno, porque a lista é 1 chamada entre 1+N e a checagem de quota já conta com ela. Mas o consumidor externo (Slide 20) nunca tinha recebido um status ≠ 200 por causa do VTurb.'
    recommendation: 'Incluir no aviso ao Slide 20, junto com o R4 (a mudança de base do `pitchRate`): o feed pode responder 502/429 com `code: "VTURB_ERROR"`, e isso significa tentar de novo, não "sem VSL".'
    status: open

  - id: SEC-001
    severity: low
    category: security
    description: 'O 502 do feed público devolve `err.message`. Num `VturbError` genérico, isso inclui até 200 caracteres do corpo da resposta do VTurb (`mensagemDoErro`, `services/vturb.ts:41-42`), e um erro que não é `VturbError` sai com a mensagem crua. É o mesmo padrão de `replyVturbError` nas rotas internas, só que agora numa rota de API pública. O consumidor é autenticado por chave do projeto e o token não aparece na mensagem.'
    recommendation: 'Numa follow-up: no feed público, mandar só a mensagem mapeada (401/429/404/504) e trocar o resto por um texto fixo, com o detalhe no log.'
    status: open

  - id: MNT-001
    severity: low
    category: code
    description: '(a) Um projeto sem VTurb conectado recebe 409 `NOT_CONNECTED` da `/vsls`. Hoje isso marca os 4 elos de vídeo da cadeia como "falha na leitura do VTurb: VTurb não conectado". Antes só o `connect_rate` dizia "VSL não vinculada". A editabilidade não muda (`value == null` continua digitável, `perpetual-chain-section.tsx:125`). O cartão já mostrava o mesmo texto antes. É uma ausência rotulada como falha, e o efeito é só de texto. (b) `pitchTimeUtil` (`vsl-funnel.ts:98`) deixou de ter uso em produção e só os testes a chamam.'
    recommendation: '(a) Em `montarVturbDaMvp`, tratar `code === "NOT_CONNECTED"` como "VTurb não conectado", não como falha. (b) Remover `pitchTimeUtil` ou marcá-la como legado.'
    status: open

  - id: REL-002
    severity: low
    category: reliability
    description: '`montarEtapaDoFeed` ainda calcula `derivarCadeia(stats, pitchAtual)` para aproveitar o `playRate` e o `convPostPitchDenominador`. Essa função ABORTA (`ProtocolViolation`) se over ÷ plays únicos passar de 1, e aí a linha sai do feed com o aviso "dado inconsistente", mesmo quando a Retenção publicada (over ÷ (over + under)) seria válida. Esse comportamento já existia antes da story, com a outra base. Ninguém mediu isso acontecendo: no NETÃO, 225 ≪ 3.903.'
    recommendation: 'Nada agora. Se aparecer um aviso "dado inconsistente: pitch_rate" no feed, calcular o `playRate` sem passar pelo `taxa("pitch_rate")` que o feed descarta.'
    status: open

