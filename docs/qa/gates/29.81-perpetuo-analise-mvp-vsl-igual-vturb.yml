status_reason: 'AC1–AC11 atendidos no caminho A: o cartão mostra a Retenção do Total da 29.78 (Σ dos vídeos, truncada) e avisa a base; a cadeia da 29.36 fica na base encadeada, com CHAIN-01 travado em 2 vídeos. `derivarCadeia`, `funnel-templates.ts` e `cac-protocol.ts` estão sem hunk. O feed muda só o `pitchRate` e segue com uma linha por vínculo. As 4 mutações próprias do @qa derrubam testes. Ficam 4 achados low e a operação: validação visual, aviso ao Slide 20 e renumeração do contrato no merge.'
