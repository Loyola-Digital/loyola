acCoverage:
  AC1:
    status: PASS
    evidencia: >
      Decisão (b) implementada: `comoAdId` exportada de `campaign-attribution.ts`
      e reusada, de modo que produtor e numerador do `convLP` usam a MESMA regra.
      `projectId` resolvido por `innerJoin` etapa→funil e **preguiçosamente** —
      etapa sem `utm_content` não paga a query (`:588-598`). Ids deduplicados por
      `new Set` antes do `inArray` (`:586`). Travado por R6 e pelos testes de
      `:119`, `:134`, `:141`.
  AC2:
    status: PASS
    evidencia: >
      Comentário de 20 linhas NO PONTO onde o `Map` nasce (`:578-598`), como o
      @po exigiu — não no topo do arquivo. Explica por que NÃO é o QA-44-01 (lá o
      denominador era único; aqui os dois lados são do mesmo dia, então cada
      janela é ≤ 1). Teste `:153` trava com um lead em dois dias afirmando global
      1 / série 2. R8 confirma diferencial.
  AC3:
    status: PASS
    evidencia: >
      `coberturaDiaria: {date, leadsAtribuidos, leadsTotais}[]` e `leadsSemData:
      number` em `LeadOriginPayload` (`:359-368`), em CONTAGENS. O teste `:97-100`
      afirma `Number.isInteger` nos dois campos. Zero PII — só contagens. R13
      confirma diferencial (4 falhas).
  AC4:
    status: CONCERNS
    evidencia: >
      **Metade entregue e travada, metade sem defesa.** A leitura única foi
      reordenada corretamente (cache lido em `:284-307`, reusado no `cplReal` em
      `:428`) e o teste que conta as queries (`mockSelect` chamado 3×) é sólido —
      R10 derruba 14 testes. Mas a outra metade da AC — `calcularTetos` receber
      `coberturaDaEtapa` — não tem UM teste: R15 corta o fio e a suíte inteira
      fica idêntica ao baseline. Ver QA-4412-01.
  AC5:
    status: CONCERNS
    evidencia: >
      Os quatro estados existem no back e na aba, e três estão travados (R9, R11).
      `TEXTO_DO_MOTIVO.coberturaAtipica` ganhou texto próprio, como a AC pedia.
      Duas pendências: (a) para `aplicada` a AC pede "quantas janelas foram
      barradas, se alguma" e o que se reporta é `dias` com lead — a contagem
      existe em `shared:589` e não é exposta; (b) a mensagem genérica de
