  - id: QA-4412-08
    severity: low
    category: maintainability
    title: "O script de diagnóstico reimplementa `findColIdx` e DIVERGE do serviço"
    file: packages/api/src/scripts/diag-cobertura-colunas.ts:18-29
    story: "44.12"
    reproduced: true
    description: >
      O script copia `norm`, `findColIdx` e `toIsoDate` em vez de importar. A
      cópia de `findColIdx` não é fiel — a segunda passada difere:

        serviço  (:66)  h.length > 2 && (h.includes(na) || na.includes(h))
        script   (:26)  h.includes(na)

      Faltam o guarda de tamanho e, sobretudo, o `na.includes(h)`. O script
      SUB-reporta a resolução por alias: um cabeçalho `hora` é casado pelo
      serviço (`"datahora".includes("hora")`) e reportado como "ALIASES.date
      resolve? NÃO" pelo script.

      Importa porque o levantamento inteiro das 9 etapas (grupos A/B/C/D da
      Sessão 2) saiu da saída desta ferramenta. As conclusões continuam de pé —
      a evidência decisiva foi a contagem de células parseáveis por coluna, que
      não usa `findColIdx` — mas a divergência é uma armadilha para a próxima
      rodada, que ainda tem 2 etapas do BBE para mapear.

      Menor: o comentário de `:108` diz "primeiras 200 linhas" e o código usa
      `sheet.rows` inteiro (`:109`).

      **Veredito sobre versionar: MANTER.** Verifiquei que é estritamente
      read-only — só `SELECT` e `readSheetData`, zero INSERT/UPDATE/DELETE, e o
      cabeçalho declara isso. Segue convenção já estabelecida na mesma pasta
      (`debug-sheet-headers.ts`, `medir-cobertura-atribuicao.ts`,
      `recontagem-viabilidade-teto.ts`, `relatorio-agrupamento-campanhas.ts`), e
      duas etapas ainda dependem dele.
    suggestedFix: "Exportar `findColIdx` e `toIsoDate` de `lead-origin-sync.ts` e importá-las no script, em vez de manter a terceira cópia."
    blocking: false

  - id: QA-4412-09
    severity: low
    category: robustness
    title: "`dataMapeadaNaSurvey` chama `.trim()` em jsonb sem o `.toString()` que a função vizinha adicionou"
    file: packages/api/src/services/lead-origin-sync.ts:196-197
    story: "44.12"
    reproduced: false
    description: >
      Assimetria dentro da mesma story. `resolveColIdx` ganhou defesa explícita
      contra valor não-string (`mapped?.toString().trim()`, `:111`); duas telas
      acima, `dataMapeadaNaSurvey` faz `mapping?.timestamp?.trim()` cru sobre um
      `jsonb`. Um `{"timestamp": 2}` gravado direto no banco derruba
      `computeLeadOriginForStage` da etapa inteira — e antes desta story esse
      ramo devolvia `null` e nunca tocava o valor.

      Não alcançável pelo painel: `survey-mapping-dialog.tsx:71` filtra os
      headers para strings não vazias. Fica registrado pela assimetria, não pelo
      risco.
    suggestedFix: "`String(mapping?.timestamp ?? \"\").trim()`, igual à função vizinha."
    blocking: false

  - id: QA-4412-10
    severity: low
    category: docs
    title: "Números já publicados MUDARAM no endpoint público, e a story diz o contrário"
    file: packages/api/src/routes/public-leads.ts:71-77
    story: "44.12"
    reproduced: true
    description: >
      O `GET /api/public/v1/projects/:projectId/stages/:stageId/leads-origin`
      devolve o payload INTEIRO (`...row.payload`). Promover as duas chaves muda
      três valores que já estavam publicados nesse contrato:

      - `range.from` / `range.to` — nas etapas do grupo B o alias lia coluna
        errada (`fz-m2-jul26`: `Data Conversão`, 0/343). Depois do backfill o
        range existe e é outro.
      - `topUtm.content` — `bumpUtm(utmCounts.content, cell(row,
        idx.utmContent))` (`lead-origin-sync.ts:522`) usa o índice promovido. Na
        `pps1` isso saiu de tudo-`(vazio)` para Ad IDs reais.
      - `columnsResolved.utmContent` — de `false` para `true` na `pps1`.

      Todas as três mudanças vão na direção da correção, e é por isso que isto é
      `low` e não bloqueia. O problema é o registro: a story afirma que "preservar
      a fonte de quem já produz cache é o que a precedência desta função defende
      desde a 36.9", como se nada publicado tivesse mudado. Mudou — para melhor,
      mas mudou, e um consumidor externo do endpoint público merece a linha.

      No mesmo balaio, deriva de documentação:
      - o DoD registra "API **1264/11**"; o número real hoje é **1267/11** (os 3
        testes de `5a1189be` não foram somados);
      - File List e Change Log não incluem o commit `d5ac3865`.
    suggestedFix: "Uma linha na story declarando os três campos do endpoint público que mudam de valor após o backfill, e acertar 1264 → 1267."
    blocking: false

