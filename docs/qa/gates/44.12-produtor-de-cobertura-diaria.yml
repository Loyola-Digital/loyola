  reason: "CLI em WSL, host macOS. Sexto gate seguido sem ele — lacuna de cobertura, não aprovação."

summary: >
  A story faz o que se propôs, e a evidência de produção é boa: de 1 para 11 de
  15 etapas com cobertura diária, 5 delas gratuitas, e a aba deixou de exibir o
  aviso de guarda indisponível. A Sessão 2 é o melhor trabalho do lote — o plano
  combinado (escrever `column_mapping` direto no banco) teria produzido efeito
  ZERO, porque o sync nunca lia esse campo e o nome lá é `timestamp`, não `date`.
  Descobrir isso ANTES de escrever em produção, e descobrir que 7 das 9 etapas já
  tinham a coluna certa apontada no painel, vale mais que a story inteira.

  O grupo B é o achado que ninguém tinha previsto e é o mais grave: em duas
  etapas o alias não falhava em achar a coluna — ele **achava a errada em
  silêncio** (`Data Conversão` com 0 de 343 células contra `Submitted at` com
  343/343). Rodar o backfill sem isso teria publicado `leadsSemData=343` numa
  etapa cuja data está 100% preenchida.

  E a honestidade do registro é o padrão do epic: a Sessão 1 declara que a R30
  "foi mal construída e NÃO conta", o achado herdado da `fz-l2-jun-26/Cap.Paga`
  é declarado sem ser consertado, e o efeito colateral aceito da `pps1`
  (leads pagos não classificados como pagos, porque `utm_source` mora em `s=`)
  está escrito com o alcance medido antes da decisão.

  **O que segura o gate é uma coisa só, e é grande:** o fio que dá título à
  story — `calcularTetos` receber a cobertura — não tem UM teste. Cortá-lo deixa
  a suíte INTEIRA da API no baseline exato, e o payload continua anunciando
  `estado: "aplicada"`. Ver QA-4412-01.

issues:
  - id: QA-4412-01
    severity: high
    category: test-coverage
    title: "O fio que dá título à story não tem teste: cortá-lo não quebra nada, e o payload continua dizendo que a guarda rodou"
    file: packages/api/src/services/cadeia-cac-payload.ts:310
    story: "44.12 (AC4, AC7)"
    reproduced: true
    description: >
      A story se chama "ligar a guarda de rastreio". A ligação é uma linha:

        const tetos = calcularTetos(series, familia, coberturaDaEtapa ? { coberturaDaEtapa } : {});

      Reproduzido — trocando por `calcularTetos(series, familia, {})`, isto é,
      **a guarda nunca roda**:

        suíte INTEIRA da API   1267 passando / 11 falhando
        baseline               1267 passando / 11 falhando
        typecheck              limpo

      Byte por byte o mesmo resultado. Nenhum dos 1278 testes percebe.

      E o pior não é a lacuna, é o que ela deixa passar: `guardaDeCobertura` é
      calculado a partir de `lead?.coberturaDiaria` (`:309`), **independente de
      esse valor ter chegado ao `calcularTetos`**. Com o fio cortado o payload
      continua devolvendo `{ estado: "aplicada", dias: 10 }` e a aba continua
      exibindo "Guarda de rastreio ativa". Não existe fonte única entre "a guarda
      rodou" e "o payload diz que a guarda rodou".

      Por que os 21 testes novos não pegam: o único teste que exercita a guarda
      ponta a ponta (`lead-origin-cobertura-diaria.test.ts:225-254`) chama
      `calcularTetos` DIRETO, com um array `cobertura` construído à mão
      (`:234-238`) — nunca a saída de `computeLeadOriginForStage`, e nunca pela
      rota. Ele testa a biblioteca do `shared`, que a 44.6 e a 44.7 já testaram.

      ⚠️ É a família do QA-448-01 / QA-449-01 — a tela afirmando algo que o
      mecanismo por trás não garante. A diferença para o QA-449-01, que foi
      CONCERNS: lá o campo desprotegido era acessório; aqui é a entrega
      principal da story.
    suggestedFix: >
      Um teste de ROTA que monte uma etapa gratuita cuja série de cobertura tenha
      uma janela atípica, e afirme sobre `tetos.convLP` que (a) traz
      `coberturaJanela` presente, ou (b) que o valor difere do calculado sem
      opts. Verificado por reversão do terceiro argumento.
    blocking: true

  - id: QA-4412-02
    severity: medium
    category: correctness
    status: RESOLVIDO DURANTE A REVISÃO (commit d5ac3865)
    title: "`aplicada` afirmava ter descartado janelas quando zero foram descartadas"
    file: packages/web/components/funnels/cadeia-cac-stage-tab.tsx:323
    story: "44.12 (AC5)"
    reproduced: true
    description: >
      Achado e reproduzido por sonda antes de o @dev commitar a correção. Fica
      registrado porque a evidência importa para o próximo gate.

      A frase original era "...considerou N dia(s) com lead **e descartou janelas
      de cobertura atípica**", renderizada sempre que `estado === "aplicada"`.
      Mas `aplicada` só exige `comLead > 0`; não exige que a guarda tenha barrado
      nada.

      Sonda executada contra a rota, com cobertura uniforme:

        guarda        { estado: "aplicada", dias: 3, motivo: null, message: null }
        tetos.convLP  { valor: null, motivo: "baseInsuficiente" }

      E `baseInsuficiente` é emitido por `shared/cadeia-cac.ts:641-646`
      exatamente quando `houveBarradaPelaGuarda === false` — **zero janelas
      barradas**, com a tela dizendo que descartou.

      ⚠️ Esse era o estado das CINCO gratuitas na validação visual: a própria
      story registra "guarda=aplicada em todas, e convLP com motivo
      baseInsuficiente". A frase falsa estava na tela durante a validação e
      passou.

      Corrigido em `d5ac3865` para "Janelas com cobertura atípica são
      descartadas." — afirmação sobre a REGRA, verdadeira sempre.

      **Residual, e por isso o item não fecha:** (a) a AC5 pede para `aplicada`
      "quantas janelas foram barradas, se alguma", e a contagem continua não
      sendo entregue — `calcularTetos` rastreia `houveBarradaPelaGuarda`
      internamente (`:589`, `:607`) e não expõe; (b) a frase nova não tem teste,
      porque componente do web não tem runner (decisão de 29.35); (c) o commit
      não atualiza File List nem Change Log da story.
    suggestedFix: "Expor a contagem de janelas barradas em `TetosDoGrupo` e reportá-la — ou registrar o débito explicitamente no backlog junto da 44.3."
    blocking: false

  - id: QA-4412-03
    severity: medium
    category: correctness
    title: "No caso MISTO a série é truncada em silêncio — `leadsSemData` só aparece quando a série está vazia"
    file: packages/api/src/services/cadeia-cac-payload.ts:327-350
    story: "44.12 (AC2, AC3)"
    reproduced: true
    description: >
      `leadsSemData` só é dito quando `comLead === 0` (dentro da string do
      `semLeadNoPeriodo`, `:339-348`). Quando há dias com lead E leads sem data
      ao mesmo tempo, cai em `aplicada` e nada é declarado.

      Sonda executada contra a rota, com 10 dias de cobertura e
      `leadsSemData: 213`:

        guardaDeCobertura        { estado: "aplicada", motivo: null, message: null, dias: 10 }
        payload menciona "213"?  false

      O payload INTEIRO não menciona os 213. E `leadsSemData` não é chave de
      topo do payload — as chaves são projectId, stageId, stageName, stageType,
      fonte, spendIncludesMetaTax, unidadeDasTaxas, range, lpTemVsl,
      ticketMedioManual, familia, campanhas, agregado, atuais, principal,
      atribuicao, **vendasSemDataNoTotal**, tetos, guardaDeCobertura, ranking,
      composto, decomposicaoCPC, benchmarks.

      ⚠️ `vendasSemDataNoTotal` está lá, sempre. E a AC2 desta story diz
      literalmente que `leadsSemData` é "o mesmo padrão do `vendasSemDataNoTotal`
      da 44.8 — declarar, nunca corrigir em silêncio". O padrão citado é
      justamente o que não foi seguido.

      Por que importa e não é cosmético: a mediana de referência da guarda
      (`shared:576-583`) sai da série SOBREVIVENTE. Uma etapa em que metade dos
      leads tem data ilegível produz mediana de meia amostra, barra janelas
      contra ela, e a aba diz "Guarda de rastreio ativa" sem nenhuma ressalva.
    suggestedFix: "Promover `leadsSemData` a campo de topo do payload da cadeia, espelhando `vendasSemDataNoTotal`, e exibi-lo na aba com o mesmo componente `Motivo` quando > 0."
    blocking: true

  - id: QA-4412-04
    severity: medium
    category: correctness
    title: "A mensagem genérica de `semLeadNoPeriodo` mente quando o problema é IDENTIFICADOR, não data"
    file: packages/api/src/services/cadeia-cac-payload.ts:346
    story: "44.12 (AC5)"
    reproduced: true
    description: >
      Derivado do produtor, não hipotético. Em `lead-origin-sync.ts` uma linha só
      entra em `linhasDeCobertura` se tiver `key` (`:537`), e `leadsSemData` só
      incrementa se `key && !date` (`:538`). Logo, num payload recém-produzido:

        coberturaDiaria === []  E  leadsSemData === 0
          ⟺ NENHUMA linha tem identificador (e-mail nem telefone)

      Nesse caso a mensagem servida é "A cobertura de rastreio foi computada, mas
      **nenhum dia do período tem lead** — a guarda não teve como julgar as
      janelas."

      Numa etapa que pode ter centenas de leads. É o caso que a própria story
      documenta na `fz-l2-jun-26 / Captação Paga`: 128 leads, `dias=0`,
      `leadsSemData=0`, colunas `email`/`telefone` 0 de 128 preenchidas.

      ⚠️ É exatamente a mesma classe de defeito que o commit `09583f69` corrigiu
      no ramo vizinho — dizer a causa errada e mandar a pessoa procurar no lugar
      errado. A ação certa aqui é mapear a coluna de identificador; a mensagem
      manda procurar leads que existem.

      Atenuante: a `fz-l2-jun-26/Cap.Paga` é família `paid`, então cai em
      `naoSeAplica` e a frase não renderiza HOJE. Nada impede uma gratuita de ter
      o mesmo problema — a `bbe-pr1-mar-26 / Captação paga` já tem 2 linhas sem
      identificador nenhum.

      O dado para distinguir já está no mesmo objeto: `identifiersFilled:
      { email, phone }` (`lead-origin-sync.ts:341`, gravado em `:636`).
    suggestedFix: >
      Terceiro ramo: se `identifiersFilled.email + identifiersFilled.phone === 0`
      e `totalLeads > 0`, dizer que nenhuma linha tem identificador e que a ação
      é mapear a coluna de e-mail/telefone.
    blocking: false

  - id: QA-4412-05
    severity: medium
    category: repo-hygiene
    title: "8 artefatos de sync `\" 2\"` foram COMMITADOS no `5a1189be` — ~1.120 linhas que não são da story"
    file: packages/api/src/services/campaign-attribution 2.ts
    story: "44.12"
    reproduced: true
    description: >
      O commit `5a1189be` declara 11 arquivos e 1.214 inserções. Só 3 arquivos e
      ~94 linhas são da story. Os outros 8 são artefatos de sync varridos por um
      `git add` amplo:

        packages/api/src/services/campaign-attribution 2.ts        (224)
        packages/api/src/__tests__/public-meta-campaigns-daily.test 2.ts  (338)
        packages/api/src/__tests__/campaign-attribution.test 2.ts  (198)
        packages/api/src/__tests__/campaign-name.test 2.ts          (65)
        packages/api/src/scripts/relatorio-agrupamento-campanhas 2.ts (110)
        packages/api/src/scripts/recontagem-viabilidade-teto 2.ts    (89)
        packages/api/src/scripts/medir-cobertura-atribuicao 2.ts     (77)
        packages/api/src/db/migrations/0106_users_listed 2.sql       (19)

      Verifiquei o risco operacional e ele é NULO, mas só por sorte:
      - os `.test 2.ts` NÃO rodam — o include do vitest é
        `src/__tests__/**/*.test.ts` e esses terminam em `2.ts`;
      - o `.sql` duplicado é inerte — `grep -c users_listed
        src/db/migrations/meta/_journal.json` devolve **0**, e o deploy usa
        `drizzle-kit push`, que nem lê a pasta.

      O que NÃO é inerte: `campaign-attribution 2.ts` está dentro de `src`, o
      `include` do tsconfig é `["src"]`, então o `tsc` o compila e ele vai para
      `dist/`. E ele é a cópia **pré-44.12** — a única diferença para o arquivo
      vivo é justamente `comoAdId` sem `export`.

      A ironia vale ser dita: o arquivo duplicado é aquele cujo comentário na
      cópia viva diz que "duas definições dariam populações diferentes para o
      numerador e para a cobertura".
    suggestedFix: "`git rm` dos 8 arquivos num commit de limpeza antes do PR, e um `.gitignore` para `* 2.*` / `* 2/`."
    blocking: true

  - id: QA-4412-06
    severity: low
    category: test-coverage
    title: "A fronteira do `dataMapeadaNaSurvey` está travada pela metade — a story afirma que está inteira"
    file: packages/api/src/services/lead-origin-sync.ts:192-201
    story: "44.12"
    reproduced: true
    description: >
      A story (linha 392-393) diz: "`utm_source`, `utm_medium`, `utm_term`,
      `email` e `phone` continuam no alias, **e há teste travando isso**".

      Furei a fronteira nas cinco chaves, uma reversão por grupo:

        promover utm_source                        → 1 teste falha  ✅ travado
        promover email                             → 1 teste falha  ✅ travado
        promover phone + utm_medium + utm_term     → 0 testes falham ❌ LIVRE

      Dois de cinco. E os três livres não são inofensivos pelo argumento da
      própria story: `utm_medium` alimenta `classifyCanal` e `utm_term` alimenta
      `classifyTemperatura` — os dois são publicados em `byCanal` e `byTemp` no
      endpoint público. `phone` é a metade do identificador de dedup para lead
      sem e-mail.
    suggestedFix: "Estender o teste `SÓ a data é promovida` (`:485`) para afirmar as cinco chaves numa asserção só, com o mapping trazendo todas."
    blocking: false

