    status: PASS
    nota: >
      Duas queries a mais por etapa gratuita, ambas condicionais: o `projectId`
      e o `mapearAdsParaCampanhas` só rodam se houver ao menos um `utm_content`
      que pareça Ad ID (`:587`). Ids deduplicados antes do `inArray`, como a AC1
      exigia. A leitura do cache de lead foi REDUZIDA de 2 para 1 (AC4), com
      teste contando as queries. Custo novo de memória: `linhasDeCobertura`
      guarda um objeto por linha com identificador — irrelevante nas dimensões
      medidas (maior etapa: 343 linhas), mas é O(linhas) onde antes era O(1).
  confiabilidade:
