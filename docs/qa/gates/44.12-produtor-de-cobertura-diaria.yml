porQueConcernsENaoFail: >
  Considerei FAIL pelo QA-4412-01, e por mais tempo do que nos gates anteriores.
  Ele é pior que o QA-449-01 numa dimensão que importa: lá o campo sem cobertura
  era acessório do payload; aqui é a entrega que dá TÍTULO à story, e o payload
  afirma que ela aconteceu independentemente de ter acontecido.

  Três coisas seguraram o FAIL, e são de fato:

  1. **A ligação está correta.** Eu li o código, não só rodei o teste. O
     `coberturaDaEtapa` é passado, `calcularTetos` o consome, e a validação
     visual em produção mostrou as cinco gratuitas saindo de `indisponivel` para
     `aplicada`. O defeito é latente — a régua que a 44.9 fixou ("reprovar por
     risco futuro seria mudar a régua no meio do epic") se aplica.

  2. **O único defeito que estava PRESENTE no comportamento entregue — a frase
     que afirmava ter descartado janelas — já foi corrigido**, no `d5ac3865`, com
     o motivo escrito no código e o débito da contagem endereçado ao backlog. Foi
     o perfil que reprovaria (o do 44.8), e deixou de ser.

  3. **O QA-4412-03 e o QA-4412-04 são omissões e imprecisões de declaração, não
     números errados.** Nenhum valor exibido está incorreto por causa deles.

  O que não é negociável antes do PR: os 8 arquivos de sync (QA-4412-05) não
  podem entrar na `main`, e o QA-4412-01 é um teste, não um redesenho.

