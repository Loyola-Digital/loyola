    status: PASS
    nota: >
      Os dois campos novos são CONTAGENS — zero PII, coerente com o contrato
      "só agregados" do scope. As chaves de dedup (`chave`) vivem só em memória
      dentro de `linhasDeCobertura` e nunca são serializadas. A query nova é
      escopada por `projectId` resolvido pelo `innerJoin` etapa→funil, não por
      valor vindo do request. O `diag-cobertura-colunas.ts` é estritamente
      read-only (verificado: só `SELECT` e `readSheetData`).
