validacaoVisual:
  veredito: "Executada, honesta, e o que ela NÃO provou está escrito."
  porQue: >
    Feita pelo usuário em ambiente local sobre o banco de produção, e registrada
    com a contraprova junto: `fz-l2-jun-26/Grat`, `pps1/Aquisição` e
    `dg-pg02/Downsell` **sem** o aviso de indisponível, e `bbe-pr1-mar-26/Grat`
    exibindo a mensagem nova, citando os 213 leads com data ilegível. Testar o
    caso que deve falhar junto com o que deve passar é o que separa validação de
    print decorativo.

    E o registro declara o limite do que se observou, sem embelezar: `Conv. LP`
    continua sem alvo nas cinco gratuitas, e o motivo NÃO é a guarda — é
    `baseInsuficiente`, porque a base do `convLP` são leads por campanha, que a
    44.3 ainda não produz. O caminho `coberturaAtipica` segue coberto por teste,
    não por dado de produção, e a story diz isso com todas as letras.
  oQueElaDeixouPassar: >
    A frase "descartou janelas de cobertura atípica" estava na tela nas cinco
    gratuitas — todas com zero janelas barradas. Achei por sonda; o @dev
    corrigiu em `d5ac3865`. Não é crítica à validação: é o argumento de que
    afirmação sobre MECANISMO precisa de teste, porque olho não distingue
    "rodou e não barrou nada" de "rodou e barrou".

evidenciaDeQualidadeAcimaDoPadrao:
  - "A Sessão 2 desmontou o próprio plano ANTES de escrever em produção: `{\"date\": \"<índice>\"}` em `funnel_surveys.column_mapping` não teria efeito nenhum, porque o sync devolvia `columnMapping: null` nos dois ramos de pesquisa e o campo lá se chama `timestamp`, não `date`. Descobrir isso antes do UPDATE é o achado mais valioso do lote."
  - "7 das 9 etapas JÁ tinham a coluna certa apontada no painel — o dado existia no banco e faltava lê-lo. Zero escrita em `column_mapping` foi necessária."
  - "Grupo B, não previsto por ninguém: o alias não falhava em achar, ele achava a coluna ERRADA em silêncio (`Data Conversão` 0/343 contra `Submitted at` 343/343). Rodar o backfill sem corrigir teria publicado `leadsSemData=343` numa etapa com data 100% preenchida."
  - "A Sessão 1 declara que a reversão R30 'foi mal construída e NÃO conta' — autocrítica que reduz o próprio placar em vez de inflá-lo."
  - "O achado herdado (`fz-l2-jun-26/Cap.Paga`, `uniqueLeads=0` desde antes desta story) foi declarado, atribuído à causa certa (`email`/`telefone` 0/128) e explicitamente NÃO consertado, com o motivo — é etapa `paid` e mexer trocaria o dedup de caches publicados."
  - "O efeito colateral aceito da `pps1` (leads pagos não classificados como pagos, porque `utm_source` mora em `s=`) está registrado com o alcance MEDIDO antes de decidir: 1 etapa de 15."
  - "Fallback por conteúdo foi RECUSADO com argumento: 'procurar uma coluna que pareça data é como se lê a coluna errada em silêncio'. Índice explícito responsabiliza alguém."
  - "A armadilha operacional do `turbo build` sobre o `next dev` foi diagnosticada e registrada, evitando que a próxima pessoa persiga um defeito de render que não existe."

