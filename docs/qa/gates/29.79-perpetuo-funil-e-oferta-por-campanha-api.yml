checks:
  code_review: 'Diff lido inteiro (API/shared). O parser é um módulo folha no shared: token delimitado por ^/$/_/-, mais [SIGLA+A<N>], com a1≡a01; dois códigos distintos viram "mais de um código"; ofmix vira motivo. Em services/funil-e-oferta.ts, os nomes vêm do meta_entity_names_cache (project_id + entity_type + in), e o vínculo só entra quando o nome não deu UM código. campanhasParaMidia devolve null quando o recorte fica vazio. decidirLinhaNoFiltro manda ao aviso só o que não se sabe atribuir. Em perpetual-sales.ts, o filtro roda depois do bucket de receita e ANTES da dedup; refundedTxIds é montado antes do filtro nas três leituras; sem filtro, extrasDoRecorte devolve {}. A refatoração idsDeCampanhaDasEtapas é equivalente às duas cópias. As 7 decisões autônomas foram avaliadas (ver notes): nenhuma contradiz AC nem decisão do Danilo.'
  unit_tests: 'Rodado pelo QA: as 4 suítes novas dão 79/79. A API completa tem 191 arquivos, 3.187 testes passando e 10 falhando. As 10 falhas estão nos 5 arquivos da baseline (funnel-stages-lead-inputs, projects, schema, instagram-routes, instagram), confirmado rodando só esses 5: 10/10 falham lá, e nenhum deles foi tocado pela story. Mutações do QA: 6/7 caíram; Q8 sobreviveu (TEST-001).'
  acceptance_criteria: 'AC1 ✓ (positivos dos 6 perpétuos; [30-14-7-5A1] e lança1 são negativos; "mais de um código" e ofmix cobertos; sugerirClassificacao intocado). AC2 ✓ (nome atual > vínculo > null com motivo, provado por Q5 e M7/M8 do @dev). AC3 ✓ (rota por funil; campanhas = funnel_stages do funil; campos expert/opcoes/campanhas/naoCadastrados/semFunil/semOferta; guest segue getProjectAccess, provado por Q4). AC4 ✓ (as 3 leituras filtram vendas e Meta pelo mesmo conjunto, provado por Q1/Q2/Q6/Q7; guarda do [] nos 3 leitores; reembolso lido sobre a planilha inteira). AC5 ✓ (5 motivos + detalhe; só linhas pagas). AC6 ✓ (12 requisições, inclusive a rota pública do Inácio; o arquivo não é regenerado — o teste só faz readFileSync — e foi reproduzido contra o código de antes). AC7 ✓. AC8 ✓. AC9 ✓ (eslint 0 nos arquivos tocados de api e shared; tsc shared e api EXIT 0 pelo binário direto; vitest igual à baseline).'
  no_regressions: 'Sem filtro, a resposta não ganha chave nova e a Nomenclatura não é consultada (há teste para isso). O AC6 foi provado nos dois sentidos. public-perpetual-metrics.ts, mapa-de-campanhas.ts, meta-db-source.ts e nomenclatura-legado.ts não mudaram.'
  performance: 'Com filtro, cada leitura de vendas faz +2 consultas indexadas (ids da etapa e nomes) e usa o mapaDeDimensoes, que tem cache de 60 s; a planilha continua no cache de 30 s. A rota funil-oferta faz 5 consultas pequenas. A horária lê os ids da etapa duas vezes, o que é desprezível. Sem filtro, o custo é zero.'
  security: 'project_id entra no predicado de nomes, gasto e expert (asserido no SQL renderizado); o dicionário é filtrado por expert_id; o funil é verificado por (id, project_id); guest segue a mesma regra das rotas vizinhas (Q4). Sem PII: foraDoFiltro só tem contagens e somas. A pendência 4 do @po (guest ver os códigos do dicionário) continua com o Danilo e não bloqueia.'
  documentation: 'Cabeçalhos dos módulos explicam a regra (três passos, lista vazia, "tudo separado", PO-07). A story traz o R3 medido em produção, a conferência READ ONLY, as decisões autônomas e as 21 mutações.'
  api_contract: 'SIM — API_CONTRACT_VERSION 19 → 20 com a linha de histórico (rota funil-oferta; parâmetros funil/oferta; eco filtro/foraDoFiltro; aditiva; packages/mcp não afetado). Um bump só para o par 29.79+29.80. A main já tem ou terá o 20 por outra story do lote de 23/09: a renumeração para o próximo número no merge é do @devops (PO-13). Não é FAIL.'

