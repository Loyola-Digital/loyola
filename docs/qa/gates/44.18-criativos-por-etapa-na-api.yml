  - id: QA-4418-06
    severity: low
    category: docs
    title: "A story fixa `llms.txt:220` em seis pontos e a linha virou 226 depois da própria edição"
    file: docs/stories/44.18.criativos-por-etapa-na-api.md
    story: "44.18"
    reproduced: true
    blocking: false
    description: >
      O @po corrigiu as referências em 29/08 (`payload:684`→`694`,
      `llms.txt:144`→`220`) e as duas estavam certas **naquele instante**. A
      entrega do @dev acrescentou 6 linhas acima da frase, e ela é hoje a
      `:226`. As seções narrativas da story falam no presente
      ("`llms.txt:220` continua listando…"), então leem como afirmação atual.

      Conferi as demais referências, uma a uma, e o saldo é bom:
      `payload:694` ✅ (`criativos,`) · `shared:1026-1041` ✅ (a interface
      inteira) · `shared:1061` ✅ (`normalizarNomeDeCriativo`) · `shared:1076`
      ✅ (`agruparCriativos`) · `meta-ad-daily:27` ✅ · `:68` ✅ (o comentário
      do imposto, exato) · `:30-33` ✅ · `public-meta:130` ✅ · `:168` ✅ ·
      `:87-91` ✅ · `inacio-panorama-diario.md:121` ✅.

      Duas ficaram a ±1–3 linhas, sem prejuízo do sentido:
      `public-meta:297-300` (o bloco é `:298-301`) e `meta-ad-daily:126-128`
      (aponta o começo do `return`; o `round` por dia é a `:130`).

      É a terceira story seguida em que referência de linha envelhece dentro do
      próprio ciclo — já existe memória do @po sobre isso
      (`feedback_line_refs_drift.md`).
    suggestedFix: >
      Onde a referência precisa sobreviver, ancorar por conteúdo em vez de por
      número ("a frase **Etapa primeiro** em `docs/llms.txt`"). Em referência
      histórica, marcar o instante ("`:220` **antes desta entrega**").

acs:
  AC0: >
    DECIDIDA E BEM FUNDAMENTADA — a decisão (A) foi reverificada, não aceita.
    Os cinco campos são mesmo alcançáveis: CPM é conta (fórmula idêntica nas
    duas réguas), e Connect Rate, purchases/CPA/ROAS, campanha/adset e
    thumbnail/permalink existem em `deriveMetrics`/`/creatives`, a uma junção
    por `adId` de distância. O argumento de custo também procede: a tool corta
    em 200 e não tem `offset`, prova de que artefato MCP deriva sem dono.
  AC1: "DESCARTADA pela AC0 — nada a revisar. O registro de que ela não era executável (CriativoBruto tem 6 campos) confere: `meta-ad-daily.ts:123-140` devolve `adId, adName, spend, impressions, linkClicks, views3s, p75` e descarta o resto do `accumulate`."
  AC2: "DESCARTADA — mas o aprendizado migrou para a A4.2 item 4, e **é verdadeiro**. Conferido nos dois arquivos (ver `evidenciasDaRevisao`)."
  AC3: "DESCARTADA — o aprendizado migrou para a A4.2 item 3, e está correto: `/cadeia-cac` agrupa por nome normalizado (`shared:1076`), `/creatives` responde por `adId`. A instrução 'expandir `adIds[]` antes de somar' é suficiente para a CONTAGEM. Não cobre a escala das taxas — QA-4418-02."
  A4.1: >
    ENTREGUE — `cadeia-cac` entrou na lista e a frase agora diz, na mesma
    sentença, que criativos da etapa vêm dali. A ordem impossível acabou:
    antes a família não oferecia criativo nenhum. Ressalva de nome em
    QA-4418-04 (low).
  A4.2: >
    ENTREGUE COM RESSALVA — os 4 pontos exigidos estão lá, na ordem, e os
    quatro são verdadeiros. O 5º ponto que o @dev acrescentou (CPM é conta;
    `roas`/`cpa` de lá são de PIXEL) **não é escopo extra**: as Dev Notes da
    própria story obrigam a rotular o ROAS como de pixel na receita, e a
    afirmação é coerente com `llms.txt:230`. Aprovado. Faltam a armadilha de
    escala (QA-4418-02) e o aviso de truncamento (QA-4418-03).
  A4.3: >
    ENTREGUE COM DEFEITO DE INSERÇÃO — a receita está no guia, mais completa
    que a do `llms.txt` (tem o aviso de truncamento). Mas o bloco quebrou a
    tabela onde foi inserido: QA-4418-01.
  A4.4: >
    ENTREGUE — a decisão está datada, atribuída (44.18, AC0, 2026-08-29) e
    nomeia `get_stage_creative_performance` explicitamente, o que faz a busca
    de quem for reabrir cair na resposta. O `llms.txt:145` reforça no outro
    arquivo ("não existe rota de criativo por etapa — não peça uma"). Cumpre o
    fim da AC.
    ⚠️ O item do DoD "nenhuma menção a `get_stage_creative_performance`" está
    tecnicamente violado pela letra e cumprido pelo espírito: a menção é uma
    **negação nomeada**, que é o que torna a decisão localizável. Considerado
    conforme.

