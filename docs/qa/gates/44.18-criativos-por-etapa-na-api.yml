issues:
  - id: QA-4418-01
    severity: medium
    category: docs
    title: "O bloco novo foi inserido DENTRO de uma tabela markdown — a terceira linha ficou órfã"
    file: docs/guides/mcp-inacio-integracao.md:145-161
    story: "44.18 (A4.3, A4.4)"
    reproduced: true
    blocking: false
    description: >
      A tabela "Conclusão do laudo | O campo que responde" tem três linhas. O
      `#### Criativos da etapa: use os dois feeds, por junção` foi inserido
      entre a **segunda** (`:144`) e a **terceira** (`:161`), com 16 linhas de
      texto, título `####`, lista numerada e dois parágrafos em negrito no meio.

      Resultado: a linha `| Pedido de print da tela, duas vezes | o payload
      responde sozinho |` deixou de pertencer a qualquer tabela. Sem cabeçalho
      nem separador acima dela, o renderizador (GitHub incluso) a imprime como
      **texto literal com pipes**, não como linha de tabela.

      A perda é pequena em bytes e específica em endereço: some justamente uma
      das três conclusões erradas do laudo que este guia existe para catalogar
      — e some do documento que a story escreveu para ser confiável.

      Não é discutível nem depende de renderizador: um bloco de nível `####`
      encerra a tabela onde aparece.
    suggestedFix: >
      Mover o bloco inteiro (`:146` a `:160`) para **depois** da linha `:161`,
      antes do parágrafo "Recompor por fora não é só retrabalho". A tabela volta
      a ter as três linhas e o bloco não muda de sentido — ele já é uma seção
      autônoma, com título próprio.

  - id: QA-4418-02
    severity: medium
    category: correctness
    title: "A receita blinda `spend` contra centavos e deixa `ctr`/`cpc`/`connectRate` desprotegidos contra ~100× — os três existem nos dois feeds com o MESMO nome"
    file: docs/llms.txt:145-150
    story: "44.18 (A4.2, A4.3)"
    reproduced: true
    blocking: false
    description: >
      A receita manda cruzar `/cadeia-cac` com `/creatives` por `adId` e avisa
      sobre duas armadilhas: a unidade da LINHA (Ad Name × adId) e o
      arredondamento do `spend`. Falta a terceira, e ela é a de maior
      magnitude.

      Os dois feeds expõem campos **homônimos** com escala e definição
      diferentes:

        campo         /cadeia-cac (criativos)          /creatives
        ctr           div(linkClicks, impressions)     (clicks/impressions)*100
                      decimal · clique no LINK         percentual · clique TOTAL
        cpc           div(spend, linkClicks)           spend / clicks
                      por clique no LINK               por clique TOTAL
        connectRate   div(lpViews, linkClicks)         (lpViews/linkClicks)*100
                      decimal                          percentual

      Referências: `shared/cadeia-cac.ts:1108,1109` e `:260`;
      `public-meta.ts:138,139,168`. A escala decimal do `/cadeia-cac` está
      travada em teste — `cadeia-cac-criativos.test.ts:37` afirma
      `ctr ≈ 1500/101000` e `toBeLessThan(0.02)`. O `llms.txt:114` declara
      `unidadeDasTaxas: "decimal"` — mas **só dentro da seção da cadeia**; a
      seção do `/creatives` (`:46-50`) não declara unidade nenhuma.

      O consumidor é um agente que obedece literalmente. Ele acabou de ser
      instruído a buscar a linha do `/creatives` — que traz `ctr`, `cpc` e
      `spend` junto com o que ele foi buscar. A receita diz explicitamente
      qual `spend` vale. Sobre `ctr` e `cpc` ela silencia, e o valor de lá é
      ~100× o daqui, sobre outro numerador.

      **É desproporcional avisar sobre centavos e calar sobre 100×** — e é
      exatamente a classe de defeito que o Epic 44 existe para impedir: duas
      réguas para a mesma métrica. O precedente citado na própria story é o
      `connectRate` que ficou 18 a 35 p.p. errado por mais de um ano.
    suggestedFix: >
      Um item a mais na receita (llms.txt e guia), no mesmo tom dos outros:
      "⚠️ **`ctr`, `cpc` e `connectRate` existem nos dois, e não são o mesmo
      número.** Aqui as taxas são **decimais** (`unidadeDasTaxas`) e usam
      clique no LINK; no `/creatives` vêm **×100** e o `ctr`/`cpc` usam cliques
      TOTAIS — o comparável de lá é `ctrLink`/`cpcLink`. Cite sempre os desta
      resposta; do outro feed tome só o que aqui não existe."

  - id: QA-4418-03
    severity: medium
    category: completeness
    title: "O aviso de truncamento está no guia e NÃO está no `llms.txt` — e o `llms.txt` nem documenta que `truncated` existe"
    file: docs/llms.txt:145-150
    story: "44.18 (A4.2 × A4.3)"
    reproduced: true
    blocking: false
    description: >
      A A4.3 (guia, `:158`) traz o aviso: a tool corta em 200, não expõe
      `offset`, e "declare a limitação em vez de tratar o recorte como
      completo". A A4.2 (`llms.txt`) — que é o contrato que o agente carrega em
      execução — **não traz nada disso**.

      E o `llms.txt` piora a lacuna por conta própria, em drift herdado da
      Story 43.4: `:48` documenta `limit (1–200, default 50)` e `:49` descreve
      a resposta como `{ projectId, range, campaignId, orderBy, partial,
      lastSyncedAt, count, creatives }` — **sem `total`, `returned`, `offset`
      nem `truncated`**, que a rota devolve desde a 43.4
      (`public-meta.ts:415-419`).

      Encadeando: o agente lê a receita nova, chama
      `get_creative_performance(projectId)` — sem `limit`, porque a receita não
      manda passar um; sem `campaignId`, porque o passo 1 lhe disse que
      `adIds[]` substitui filtrar campanha —, recebe os **50 primeiros por
      spend do PROJETO INTEIRO**, intersecta com `adIds[]` e trata o resultado
      como o conjunto da etapa. Não há nada na doc que o mande olhar
      `truncated`, porque a doc não diz que esse campo existe.

      **É o modo de falha que a story existe para matar**: um feed de projeto
      parcial sendo tratado como completo para uma etapa. A informação que
      evita isso foi escrita — no arquivo que o agente não lê em execução.
    suggestedFix: >
      Duas correções pequenas, ambas em `docs/llms.txt`:
      (1) levar o ⚠️ do guia para o passo 2 da receita, acrescentando o que
      falta ali também: **peça `limit` no máximo (200 pela tool) e/ou filtre por
      `campaignId`, usando o bloco `campanhas` da própria etapa** — isso reduz
      o feed ao recorte e torna o truncamento improvável; se ainda vier
      `truncated: true`, declare a limitação;
      (2) corrigir `:49` para incluir `total`, `returned`, `offset` e
      `truncated` na forma da resposta. O drift é da 43.4, não desta story, mas
      é dele que a receita nova depende.

  - id: QA-4418-04
    severity: low
    category: docs
    title: "`cadeia-cac` na lista da família `get_stage_*` não compõe o nome real da tool (`get_stage_cadeia_cac`)"
    file: docs/llms.txt:226
    story: "44.18 (A4.1)"
    reproduced: true
    blocking: false
    description: >
      A hipótese de que a A4.1 trocaria uma ordem impossível por outra foi
      investigada e **não se confirma**, mas sobra uma aresta.

      A tool real é `get_stage_cadeia_cac` (`packages/mcp/src/tools.ts:203`),
      com underscore. A frase corrigida cita `cadeia-cac`, com hífen. Quem
      concatenar `get_stage_` + o item da lista chega a
      `get_stage_cadeia-cac`, que não existe.

      **Por que não é bloqueante:** a lista já usava apelido de ROTA para os
      quatro itens anteriores — `stage-daily`, `leads-summary`, `survey`,
      `sales-daily` — e nenhum deles é nome de tool (`get_stage_daily`,
      `get_stage_leads_summary`, ...). O item novo segue a convenção que já
      estava lá. E o próprio `llms.txt:266` mapeia
      `get_stage_cadeia_cac(projectId, stageId, from?, to?)` → a rota, no bloco
      de tools do fim do arquivo. O agente tem como resolver, e a lista de
      tools do cliente MCP resolve sozinha.

      Fica registrado porque o custo de remover a ambiguidade é uma palavra,
      e o público desta frase é justamente quem não questiona a fonte.
    suggestedFix: >
      Citar o nome real na frase: "…, `sales-daily` e **`cadeia-cac`
      (`get_stage_cadeia_cac`)**". Ou, se preferir uniformidade, nomear as
      cinco tools de verdade — mas aí é edição além da AC4 e vale como story
      própria.

