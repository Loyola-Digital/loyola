  **Débito aberto, não bloqueante.** QA-4418-01, 02 e 03 são três edições de
  uma a duas linhas cada, todas em `docs/`, todas com o texto sugerido pronto
  acima. Cabem numa passada do @dev nesta mesma branch, antes do PR — é o
  momento mais barato, porque depois viram story.

  QA-4418-04 e 06 ficam como débito conhecido (low). QA-4418-05 é escrituração
  do @dev na story.

  ⚠️ Se as três medium NÃO forem corrigidas antes do merge, a doc entra em
  produção instruindo uma junção que pode produzir CTR ~100× errado sem
  nenhum aviso, num arquivo cujo consumidor declarado não questiona a fonte.
  A recomendação é corrigir agora.
