summary: >
  **A afirmação mais perigosa da story é verdadeira.** O ponto que eu vim
  derrubar — "os dois feeds arredondam `spend` em pontos diferentes" — se
  sustenta linha a linha: `meta-ad-daily.ts:130` faz
  `dias.reduce((s, d) => s + (round(d.spend) ?? 0), 0)` (arredonda POR DIA e
  soma), enquanto `/creatives` acumula os N dias do período num único
  `MetricAgg` por `adId` (`public-meta.ts:315-345`) e arredonda **uma vez** em
  `deriveMetrics` (`public-meta.ts:130`). Se isso fosse falso, a doc estaria
  proibindo somar por um motivo inexistente — era o pior defeito possível aqui,
  e não é o caso.

  Conferi as demais afirmações técnicas novas contra o código, não contra a
  story: `adIds: string[]` existe em `CriativoDaAba`
  (`shared/cadeia-cac.ts:1031`) e é literalmente `itens.map((x) => x.adId)` do
  grupo (`:1105`) — é o conjunto de `adId` da etapa, não uma aproximação. A
  junção entrega mesmo tudo o que a receita promete: `cpm`, `connectRate`,
  `purchases`, `cpa`, `roas` saem de `deriveMetrics`
  (`public-meta.ts:143,168,136,145,146`); `campaignId/campaignName/adsetId/
  adsetName`, `creative` (thumbnail), `igPermalinkUrl` e `adPermalinkUrl` saem
  do `map` de `/creatives` (`public-meta.ts:361-386`). E
  `cpm = spend ÷ impressions × 1000` é exatamente a fórmula das DUAS réguas
  (`cadeia-cac.ts:257` e `public-meta.ts:143`), na escala certa: `spend` em BRL
  já tributado ÷ impressões.

  **Nenhuma afirmação nova é falsa.** O que segura o gate são três lacunas do
  que a receita NÃO diz — e o público é um agente que obedece literalmente.

  A mais séria é o QA-4418-02: a receita blinda o `spend` contra uma
  divergência de **centavos** e deixa `ctr`/`cpc`/`connectRate` — que existem
  nos dois feeds **com o mesmo nome** — desprotegidos contra uma divergência de
  **~100× e de definição**. O `criativos.ctr` do `/cadeia-cac` é
  `div(linkClicks, impressions)`, decimal e por clique no LINK
  (`shared/cadeia-cac.ts:1108`, travado em teste: ≈0,0149); o `/creatives.ctr`
  é `(clicks / impressions) * 100`, percentual e por clique TOTAL
  (`public-meta.ts:138`). O comparável de lá chama-se `ctrLink`/`cpcLink`. A
  receita manda cruzar os dois feeds e não diz uma palavra sobre isso.

  Some-se o QA-4418-01 — o bloco novo do guia foi inserido **dentro de uma
  tabela markdown**, órfãando a terceira linha — e o QA-4418-03 — o aviso de
  truncamento existe no guia e **não existe no `llms.txt`**, que é o artefato
  que o agente lê em execução.

  Nada disso é FAIL: a AC4 está materialmente entregue e nenhuma frase mente.
  Mas numa story cujo produto É a confiabilidade do texto, três correções de
  uma linha cada ficam registradas antes de fechar.

