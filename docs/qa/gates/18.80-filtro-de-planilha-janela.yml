# ─────────────────────────────────────────────────────────────
# Achados
# ─────────────────────────────────────────────────────────────
achados:
  - id: QA-1880-01
    severidade: MEDIA
    estado: CORRIGIDO_NO_GATE
    titulo: "O @dev mudou o FIM da janela também, sem declarar — e a suíte protegia isso só fora do CI"

    o_que_mudou: >
      A versão antiga fazia `today.setHours(23,59,59,999)` em hora LOCAL e
      depois `.toISOString()` em UTC. Em fuso negativo isso empurra o fim da
      janela para o dia seguinte. A story fala só do INÍCIO.

    medido: |
      Mesmo instante (08/09 13:00 local), as duas versões:

        TZ=America/Sao_Paulo   ANTIGO: 01/09 .. 09/09   NOVO: fim em 08/09  ⚠️
        TZ=UTC                 ANTIGO: 01/09 .. 08/09   NOVO: fim em 08/09
        TZ=Asia/Tokyo          ANTIGO: 31/08 .. 08/09   NOVO: fim em 08/09

      O código antigo dependia do fuso nas DUAS pontas. Em Tóquio até o início
      escorregava.

    impacto_hoje: >
      TEÓRICO. Medi as 13 planilhas: **zero linhas com data futura**. Então a
      medição da T1 (8 dias efetivos) vale, e o número do aviso está certo.

    o_que_torna_isto_MEDIA_e_nao_BAIXA: |
      A mutação que reintroduz o `.toISOString()` no fim da janela derrubava:

        TZ=America/Sao_Paulo    8 testes
        TZ=UTC                  0 testes   ← e o GitHub Actions roda em UTC

      Ou seja: quem reintroduzisse o defeito veria **CI verde**. A proteção
      existia, mas não no lugar onde é consultada. Só quem rodasse local, num
      fuso negativo, veria vermelho.

    correcao_aplicada: >
      `vitest.config.ts` do web passa a fixar `env: { TZ: "America/Sao_Paulo" }`
      — o fuso do NAVEGADOR do usuário, que é de onde `new Date()` vem no
      código sob teste. Depois disso a mesma mutação derruba 8 testes em
      qualquer runner (UTC, Tóquio e BRT verificados), e a suíte completa segue
      em 1.117/1.117 nos dois fusos.

    por_que_nao_devolvi_para_o_dev: >
      A mudança em si está CERTA — incluir "amanhã" numa janela de 7 dias é
      defeito. O que faltava era declaração e trava. Ambas cabiam no gate, e
      devolver custaria um ciclo para uma linha de config.

  - id: QA-1880-02
    severidade: BAIXA
    estado: CORRIGIDO_NO_GATE
    titulo: "A story e o aviso falam só do início da janela"
    correcao_aplicada: >
      Acrescentado nos dois que o FIM também mudou, e que o efeito é teórico
      hoje (nenhuma planilha tem data futura). Sem isso, quem investigar uma
      divergência futura de data-limite não encontra o registro.

