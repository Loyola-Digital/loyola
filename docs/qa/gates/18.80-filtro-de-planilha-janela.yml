notas:
  - >
    ⚠️ **O aviso é obrigatório e ainda não foi enviado.** 10 casos acima de 5%,
    e o pior deles é o `dg-pg04` em 7 dias: 6 leads exibidos onde havia 1. Base
    pequena exagera o efeito, e é em base pequena que "está barato, escala" se
    decide rápido.
  - >
    O padrão que se repete nesta leva inteira: o gate encontra o que o
    implementador mudou **além do declarado**, não o que ele fez errado. Aqui
    a mudança era correta e não estava escrita — e a trava dela vivia num fuso
    que o CI não usa.
