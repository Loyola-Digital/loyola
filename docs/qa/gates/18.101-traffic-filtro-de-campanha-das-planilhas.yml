top_issues:
  - id: 'REQ-001'
    severity: low
    status: 'aceito como risco documentado'
    finding: >-
      Um valor só de dígitos, mesmo curto (por exemplo `2026`), conta como id pelo AC1. Se não for o id de uma
      campanha da etapa, a linha sai do recorte, e uma tag só numérica seria descartada como se fosse "outra
      campanha". O caso tem teste próprio (`recorte-de-campanha-18101.test.ts`, "valor só de dígitos é id pelo AC1,
      mesmo curto") e está registrado no Dev Agent Record. A T0 (i) não achou nenhuma linha assim nas planilhas de vendas.
    recommendation: >-
      Aceito sem mudança. A implementação segue o texto do AC1 (id = "só dígitos"). Criar um corte por tamanho
      seria uma regra que nenhum AC pede (Artigo IV). Os ids da Meta têm 15 a 18 dígitos, mas há ids numéricos de
      outro tamanho cadastrados no projeto (`52577008819383`, com 14), então qualquer limite seria chute. Se uma
      tag só numérica aparecer numa planilha de vendas, abrir story com o @po.
  - id: 'REQ-002'
    severity: low
    status: 'aberto (sem bloqueio)'
    finding: >-
      O conjunto de ids da etapa vem só de `funnel.campaigns` (Meta), como o AC1 manda. Os
      `googleAdsCampaigns` da etapa ficam de fora. Se uma planilha de vendas trouxer em `utm_campaign` o id
      numérico de uma campanha Google Ads da própria etapa, essa linha sai do recorte. Hoje não há caso: a T0 (i)
      identificou a origem de cada id descartado (campanhas de outro funil, ou id sem cadastro), e o repositório
      não tem template `{campaignid}` para o Google Ads.
    recommendation: 'Se vendas vindas do Google Ads com id em `utm_campaign` aparecerem, levar ao @po a inclusão de `googleAdsCampaigns[].id` no conjunto. Pode ser feito como ADAPT da mesma função.'
  - id: 'MNT-001'
    severity: low
    status: 'aberto (cosmético)'
    finding: >-
      As cópias recortadas (`salesSheetData` e `fallbackData` em `use-crossed-funnel-metrics.ts`) trocam `rows`,
      mas mantêm o `totalRows` da planilha inteira. Nenhum leitor do hook usa `totalRows` (conferido por grep), então
      hoje não há efeito.
    recommendation: 'Se algum leitor passar a usar `totalRows`, recalcular o valor na cópia.'
  - id: 'TEST-WEB-INHERITED'
    severity: low
    status: 'herdado'
    finding: 'O vitest do web roda em `node` e não monta hook. A ligação no hook é provada por testes que leem o fonte (padrão do repo, igual ao da 18.100), e a composição recorte → janela → agregador é testada com as funções reais.'

