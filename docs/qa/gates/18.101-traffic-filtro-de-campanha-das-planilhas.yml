story_title: 'Filtro de campanha da planilha de vendas no hook de métricas cruzadas — o filtro por nome descarta tudo, e o cache compartilhado esconde isso'
gate: PASS
status_reason: 'O recorte de campanha saiu do servidor e foi para o web, por uma função pura num módulo folha do shared (`passaNoRecorteDasCampanhas`), que tira só a linha com id de outra campanha. `useFunnelSpreadsheetData` perdeu o parâmetro `campaignNames`, então toda leitura da planilha usa a mesma URL e a mesma chave. Suítes, tsc, lint, `next build`, cinco provas por reversão e o check 8 foram conferidos pelo QA. A queda 43 → 37 e 68 → 64 do AC3 foi aprovada pelo gestor; o AC7 fica para depois do deploy, como a story prevê.'
