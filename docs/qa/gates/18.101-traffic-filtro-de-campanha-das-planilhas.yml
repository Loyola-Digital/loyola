  - 'AC7/T0 (v)/T5: ler no navegador o "Distribuição de Compradores (Hot/Cold)" e o card de vendas da `fz-l2-jun-26 › Captação Paga` antes e depois do deploy, com print na PR (etapa, período e filtro anotados). Esperado: nenhum número muda, porque as 169 linhas da planilha passam na regra (T0 (v)) e a etapa usa `stageBuyers`/`stageSalesData`. É pendência conhecida, não defeito.'

coverage:
  AC1: 'PASS. `passaNoRecorteDasCampanhas(utmCampaign, campanhas)` em `packages/shared/src/utm-value.ts`, módulo folha sem import. Aplica as regras 1 a 5 na ordem: etapa sem campanhas passa; vazio passa; id por `normalizeNumericId(semPrefixoDeId("utm_campaign", v))` (REUSE) passa só se for da etapa; nome da etapa com `trim` passa; tag e texto passam. Campanha com `id` vazio não entra no conjunto. Reexport no `index.ts`; o web importa por subpath.'
  AC2: 'PASS. `campaignNames` saiu de `useFunnelSpreadsheetData` (3 parâmetros, URL sem query, chave `dataKey(id)` igual a `chaveDosDadosDaPlanilha`, invalidações `:84`/`:100` sem mudança). As duas chamadas do hook não mandam filtro. O fio da 18.100 (`:53-58`) foi invertido e `:31-37` está intacto. O comentário de `use-planilhas-de-leads.ts` foi atualizado. Único outro chamador, `leads-by-utm-table.tsx:141`, já usava 3 argumentos; nenhum mock em teste usa o 4º.'
  AC3: 'PASS. A planilha de vendas é recortada em memória antes de `filterSheetRowsByDays` e de `aggregateHotColdByUtmTerm`. Teste com resultado exato (hot 3, cold 2, outros 3; saem exatamente as 2 linhas de id de outra campanha). A T0 traz 43 → 37 e 68 → 64, só por id de outra campanha, e o gestor aprovou as duas quedas em 2026-10-29. As demais etapas ficam 0 → 0; `totalVendas` fica 0 → 0 (defeito à parte, fora do escopo).'
  AC4: 'PASS. Arquivo novo com 37 testes, mais o fio invertido. O @dev fez as três reversões obrigatórias (13, 7 e 2 vermelhos). O QA refez as três e mais duas (14, 8, 2, 2 e 1 vermelhos) e restaurou os arquivos. O teste da função do shared fica no vitest do web, por subpath, porque o shared não tem runner (opção prevista no AC4).'
  AC5: 'PASS. (a) As planilhas de leads não são recortadas (teste: exatamente 2 aplicações da regra; nenhum `leadsDaEtapa.data.rows.filter`). (b) Os leitores sem filtro não mudaram de código. (c) O fallback aplica a mesma regra (teste de fio).'
  AC6: 'PASS. `git diff origin/main..HEAD -- packages/api` está vazio; `contract.ts` sem diff; `API_CONTRACT_VERSION` = 64. A rota `/data` segue aceitando `campaignName`.'
  AC7: 'PENDENTE. Validação visual depois do deploy (pendência documentada, não defeito).'

quality_checks:
  code_review: 'OK. A função é pequena, documentada com a tabela de casos e reaproveita `semPrefixoDeId`/`normalizeNumericId`. No hook, o recorte fica em dois `useMemo` que dependem de `funnel.campaigns`. Na página da etapa esse valor é `stage.campaigns`, que vem do React Query e tem referência estável. A regra 3 (nome) ficou explícita mesmo devolvendo o mesmo que a regra 4, decisão registrada para a regra não depender de uma mudança futura na tag. Observações REQ-001, REQ-002 e MNT-001, todas low.'
  unit_tests: 'OK. Testes da story: 47/47 (37 novos e 10 do fio da 18.100). Web 178 arquivos, 2647/2647 com `--testTimeout=60000`. API 5451/5461 (as 10 falhas são as da linha de base, ver no_regressions).'
  acceptance_criteria: 'AC1 a AC6 OK. AC7 fica para depois do deploy.'
  no_regressions: 'OK. As falhas da API são exatamente as 10 conhecidas: funnel-stages-lead-inputs 3, instagram-routes 1, instagram 1, projects 3, schema 2. São os mesmos números da linha de base registrada no gate da 18.100 (5451/5461), e nesta rodada não houve nenhum timeout na API. Nenhum arquivo de `packages/api` está no diff. No web, com o timeout padrão de 5 s, houve 1 falha: `dados-diarios-lyrio.test.ts`, um teste de propriedade com 3.000 receitas que levou 5,17 s. O arquivo não foi tocado e não importa nada do diff, e o mesmo timeout já aparecia nos gates anteriores. Com timeout longo, 2647/2647. Nenhum arquivo tocado pela story estourou o tempo.'
  performance: 'OK. Continua sendo uma busca por planilha: o hook e o `LeadsByUtmTable` passam a dividir de propósito a mesma entrada de cache. O recorte é O(linhas × campanhas da etapa), com poucas campanhas por etapa e centenas de linhas.'
  security: 'OK. Nenhuma rota, parâmetro ou consulta nova. A regex `^\d+$` é ancorada e não tem quantificador aninhado (sem risco de ReDoS). Nenhum dado pessoal em log ou teste. A T0 registra só ids de campanha.'
  documentation: 'OK. Os módulos e o hook têm comentários com referência à story. O Dev Agent Record traz a T0, as reversões, os resultados, as decisões e a limitação. A File List confere com o diff (8 arquivos).'
  api_contract: 'OK (check 8). Nenhuma rota, parâmetro, campo de resposta ou snapshot novo: `git diff origin/main..HEAD -- packages/api` está vazio e `packages/shared/src/contract.ts` também. `API_CONTRACT_VERSION` = 64 na branch e na `origin/main` `5a1a07d1`. O `dist` do shared, carregado pelo índice no Node puro, exporta `passaNoRecorteDasCampanhas` e a versão 64. Sem bump, como a story declara.'

