summary: >
  **O código está certo, e não está certo por sorte.** A mudança é de uma linha
  de montagem, e as duas armadilhas que o @po barrou no gate da story foram
  evitadas *e* travadas em teste — verifiquei as duas por injeção de defeito,
  não por leitura:

  1. `ABAS_DE_DADOS.unshift(ANALISE_MVP)` no escopo do módulo (vazaria a aba
     para lançamento) → **3 testes falham**, entre eles o dedicado
     ("lançamento: a Análise MVP NÃO vaza para Dados");
  2. o mesmo `unshift` DENTRO da função (acumularia uma cópia a cada render)
     → **5 testes falham**, entre eles o dedicado ("montar duas vezes não
     duplica a Análise MVP").

  Ou seja: os dois testes que existem para essas falhas de fato as pegam. Não
  são testes decorativos. A reversão completa declarada pelo @dev também bate:
  **5 falhas**, os mesmos 5 que ele listou. Árvore restaurada por cópia do
  original, `shasum` idêntico e `git status --short` limpo em `packages/`.

  **O efeito colateral F3 está travado nos dois sentidos**, que é o ponto: o
  teste não só fixa `abaPadraoDoGrupo(dados) === "analise-mvp"` no perpétuo,
  fixa também `=== "surveys"` no lançamento. Sem a segunda metade, um retorno
  acidental do `[ANALISE_MVP, ...]` para incondicional passaria despercebido.
  E confirmei que o efeito chega mesmo à tela: `stage-tabs-nav.tsx:99-101`
  chama `abaPadraoDoGrupo(grupo)` no clique do pai sem aba própria.

  **Nenhum dos três testes consertados foi enfraquecido.** Dois foram
  fortalecidos (o de Meta Ads ganhou a asserção de `ehGrupoExpansivel`; o de
  `abaPadraoDoGrupo` ganhou o caso de lançamento), e o do contrato de URL
  manteve o mesmo `toEqual` sobre array ordenado de 14 valores — não virou
  `toContain` nem conjunto, que é a degradação típica de quem reescreve
  asserção até ficar verde.

  **O contrato de URL sobrevive — provado, não presumido.** Escrevi um teste
  descartável e rodei: `resolverAbaAtiva(menuPerpétuo, "analise-mvp")` devolve
  `"analise-mvp"` e `grupoDaAba(menuPerpétuo, "analise-mvp")` devolve `"dados"`
  — os dois concordam, então um `?tab=analise-mvp` compartilhado antes abre a
  aba e abre o submenu certo. Também conferi que o CONJUNTO de `value` do
  perpétuo é idêntico ao de antes da 46.2 (14 valores, ordenados e comparados),
  o que preserva por construção a paridade 1:1 com os `TabsContent` de
  `page.tsx` estabelecida no gate da 46.1. Registro, porém, que **nenhum teste
  commitado afirma esse comportamento** — ver QA-452-05.

  **O que segura o PASS não é um defeito de código: é o DoD.** A própria story
  elevou a validação visual a "entregável principal, não a formalidade final",
  e ela **não foi executada**. Esta é a segunda story seguida do Epic 46 que
  chega ao gate sem tela — e a 46.1 provou, com esta própria story como
  consequência, que é a tela que acha o que o teste não alcança. Some-se a isso
  o resíduo da redução de escopo: título, § Story, § Valor de negócio, duas
  linhas da tabela de Riscos e a § Nota de processo ainda afirmam que a aba
  "ninguém achou" — exatamente o que o dono do produto desmentiu ("eu a vi, mas
  no grupo errado"). Nada disso é bloqueante. Nada disso é PASS.

