issues:
  - id: QA-452-01
    severity: medium
    category: definition-of-done
    title: "A validação visual (AC4) não foi executada — e esta story declarou que ela é o entregável principal"
    file: "docs/stories/46.2.submenu-visivel-e-analise-mvp-em-dados.md (§ Definition of Done, T6)"
    story: "46.2 (AC4)"
    reproduced: false
    blocking: false
    description: >
      O @dev declarou honestamente que não a executou (exige login). O problema
      não é a omissão, é a reincidência: **é a segunda story seguida do Epic 46
      a chegar ao gate sem tela**, e esta story existe *porque* a validação
      visual da 46.1 encontrou algo que nenhum teste alcançava. A própria 46.2
      escreveu no DoD: "desta vez ela é o entregável principal, não a
      formalidade final".

      O que o teste unitário prova é a árvore como dado. O que ele não alcança:
      se a Análise MVP é notada dentro de um grupo de nove itens que rola
      horizontalmente no mobile; se o `Meta Ads TESTE` — agora o único submenu
      de um filho que resta em todo o app — é notado por quem não sabe que ele
      existe (o item que a AC4 chama de "caso comum, não borda"); e se o grupo
      Meta Ads em perpétuo, agora sem seta, parece uma aba comum de verdade.
    suggestedFix: >
      Não há conserto de código. É executar o roteiro.
    verificarNaValidacaoVisual: >
      **(a) Perpétuo** — abrir uma etapa: o grupo "Meta Ads" NÃO tem `▾` e não
      abre segunda linha; clicar em "Dados" abre a segunda linha começando por
      "Análise MVP", e é nela que a tela cai (ver QA-452-02).
      **(b) Lançamento com captação paga** — "Meta Ads" tem `▾` e a segunda
      linha traz "Meta Ads TESTE"; clicar em "Dados" abre em "Pesquisas".
      **(c) Grupo Dados com 9 filhos** — a linha continua legível e rola no
      mobile sem quebrar em duas.
      **(d) Herdado da 46.1 (QA-451-01, medium, ainda aberto)** — etapa A →
      clicar "NPS" → trocar para a etapa B pela sidebar. Se a tela continuar em
      NPS com a URL sem `?tab=`, o achado da 46.1 procede. São 30 segundos e
      resolve um medium que está em produção.

  - id: QA-452-02
    severity: low
    category: mudanca-de-comportamento
    title: "Clicar em \"Dados\" no perpétuo passa a abrir a Análise MVP — declarado, aceito e travado, mas com um custo que ninguém escreveu"
    file: packages/web/lib/utils/menu-de-abas.ts:181
    story: "46.2 (AC1, achado F3 do @po)"
    reproduced: true
    blocking: false
    description: >
      **A mudança é aceitável** e não é surpresa: o @po a levantou (F3), a
      aceitou por [AUTO-DECISION], o @dev a declarou no Dev Record e a travou em
      teste nos dois funis. Confirmei que ela chega à tela —
      `stage-tabs-nav.tsx:99-101`, `else if (!ativo) onChange(abaPadraoDoGrupo(
      grupo))`. Julgo a decisão coerente: o dono pediu a aba em Dados, e pôr uma
      análise atrás de oito fontes a esconderia de novo.

      O que não está escrito em lugar nenhum é a **consequência de montagem**:
      quem clica em "Dados" para chegar a "Planilhas" agora monta primeiro o
      `<PerpetualMvpAnalysis>` (`page.tsx:689-695`), que consome hooks de config
      e de vendas. Antes montava "Pesquisas". O `TabsContent` do Radix desmonta
      o inativo, então é uma requisição que não acontecia e passa a acontecer em
      todo primeiro clique em Dados no perpétuo.

      `low` porque é um painel interno, o custo é de uma montagem, e a reversão
      é de uma linha (mover `ANALISE_MVP` para depois de `surveys`, ou dar um
      `proprio` explícito ao grupo).
    suggestedFix: >
      Nenhuma ação nesta story. Se a validação visual mostrar que o operador
      entra em "Dados" majoritariamente para buscar planilha/pesquisa, inverter
      a posição é trivial — e o teste de `abaPadraoDoGrupo` já está lá para
      registrar a nova decisão.

  - id: QA-452-03
    severity: low
    category: ux
    title: "Consequência não declarada da AC2: no perpétuo a Análise MVP sai da tela inicial da etapa"
    file: packages/web/lib/utils/menu-de-abas.ts:170
    story: "46.2 (AC2)"
    reproduced: true
    blocking: false
    description: >
      A AC2 documenta que "Meta Ads deixa de ter submenu". O que ela não liga é
      o outro lado disso: a aba padrão da etapa perpétua é `meta-ads`, e o
      submenu **só renderiza para o grupo ativo**. Antes da 46.2, quem abria uma
      etapa perpétua via a segunda linha com "Análise MVP" já na tela inicial,
      sem clique — foi assim que o dono do produto a viu. Depois da 46.2, a tela
      inicial não tem segunda linha nenhuma; a Análise MVP passa a exigir um
      clique em "Dados".

      Isto **é o que o dono pediu** e não é defeito. Registro porque nenhum
      documento da story faz essa conexão, e porque ela inverte a premissa
      original ("a aba não era vista") — agora ela é, literalmente, menos
      visível do que era, compensada pelo QA-452-02 fazer o clique em "Dados"
      cair direto nela.
    suggestedFix: >
      Nenhuma. É item de confirmação na validação visual (QA-452-01, roteiro a).

  - id: QA-452-04
    severity: low
    category: documentacao
    title: "Afirmações órfãs que a redução de escopo deixou para trás — a story ainda diz que ninguém achou a aba"
    file: "docs/stories/46.2.submenu-visivel-e-analise-mvp-em-dados.md"
    story: "46.2"
    reproduced: true
    blocking: false
    description: >
      O bloco de esclarecimento no topo é honesto e marca o que está preservado
      como registro histórico. Mas cinco trechos **fora** desse bloco continuam
      afirmando a premissa desmentida, e um sexto aponta para uma task
      cancelada:

      - **Título** — "O submenu que ninguém viu". O dono viu ("eu a vi, mas no
        grupo errado").
      - **§ Story, `:73-75`** — "quero enxergar que existe um submenu e o que
        tem nele, para que as abas não fiquem inalcançáveis". A story entregue é
        "quero a Análise MVP no grupo Dados". O § Story não foi reescrito.
      - **§ Valor de negócio, `:67`** — "Uma aba que existe e ninguém acha…".
      - **§ Riscos, `:213`** — a mitigação cita "AC3 proíbe empurrar o conteúdo
        para baixo da dobra"; a AC3 saiu do escopo.
      - **§ Riscos, `:215`** — a mitigação cita "T2 e AC5 — o comentário da
        29.35"; a T2 foi cancelada pelo próprio @po (F1) e o comentário da 29.35
        não existe mais. A linha ficou apontando para o que a F1 removeu.
      - **§ Nota de processo, `:224`** — "a primeira coisa que a tela mostrou foi
        uma aba que ninguém achava".
      - **§ Gate do PO, `:286`** — "A AC3 fica no escopo de qualquer forma".
        Histórico, mas lido como declaração viva.

      E um desalinho de rastreabilidade: **T1b está `[ ]`** embora os três
      testes que ela pede estejam atualizados no commit `2ae39408` (conferi no
      diff). Os itens de DoD também estão todos `[ ]` embora quatro dos cinco
      gates tenham sido executados (dois deles reconferidos por mim).

      Não corrigi nada disso: título, § Story, ACs, Tasks e DoD são território
      do @po/@sm, não do @qa.
    suggestedFix: >
      @po ou @sm: reescrever § Story e § Valor de negócio para o escopo real
      (mover de grupo), remover as duas mitigações órfãs da tabela de Riscos, e
      marcar T1b. O título pode ficar como está se a intenção for preservar a
      narrativa — mas então vale uma nota, porque hoje ele contradiz o bloco de
      esclarecimento que está logo abaixo dele.

  - id: QA-452-05
    severity: low
    category: teste
    title: "O contrato `?tab=analise-mvp` está correto, mas nenhum teste commitado o afirma — a asserção que parece cobri-lo é tautológica"
    file: packages/web/lib/utils/menu-de-abas.test.ts:220-228
    story: "46.2 (AC1, risco declarado)"
    reproduced: true
    blocking: false
    description: >
      A tabela de Riscos promete "o `value` não muda (AC1); teste trava". O que
      trava é a **presença** do value: o `toEqual` sobre os 14 valores
      ordenados (`:239-254`) quebra se `analise-mvp` sumir ou for renomeado.
      Isso é real e é a metade que importa.

      A outra metade — que `?tab=analise-mvp` de fato **resolve para a aba** e
      que o submenu aberto é o de Dados — não é afirmada por teste nenhum. O
      candidato natural, "nunca devolve uma aba que o menu não renderiza"
      (`:220-228`), inclui `"analise-mvp"` na lista de pedidos, mas a asserção é
      `expect(existentes).toContain(resolverAbaAtiva(menu, pedido))` — que passa
      igualmente se a função cair no fallback `"meta-ads"`. Para esse value, a
      asserção não pode falhar de forma útil.

      Provei por probe descartável que o comportamento está correto hoje
      (`resolverAbaAtiva → "analise-mvp"`, `grupoDaAba → "dados"`), então não há
      defeito — há uma promessa da story que a suíte não cumpre. É primo do
      QA-451-03, que já registrou fraqueza no mesmo teste.
    suggestedFix: >
      Duas linhas no bloco `resolverAbaAtiva`, com o menu do perpétuo:
      `expect(resolverAbaAtiva(menuPerpetuo, "analise-mvp")).toBe("analise-mvp")`
      e `expect(grupoDaAba(menuPerpetuo, "analise-mvp")?.id).toBe("dados")`. A
      segunda é a que protege o deep-link de abrir o submenu errado.

  - id: QA-452-06
    severity: low
    category: documentacao
    title: "O docblock de `montarMenuDeAbas` não acompanhou a AC5 — ainda apresenta `analise-mvp` ao lado de `meta-ads-teste` como se fossem irmãos"
    file: packages/web/lib/utils/menu-de-abas.ts:163-167
    story: "46.2 (AC5)"
    reproduced: true
    blocking: false
    description: >
      **A AC5 está atendida no essencial**, e bem: o docblock de `ANALISE_MVP`
      (`:90-96`) diz onde ela mora agora, por quê, e fecha com "se você veio
      'consertar' isto de volta, não é engano" — que é literalmente o que a AC5
      pediu. O comentário da montagem (`:172-178`) registra as duas armadilhas.

      O que ficou é o docblock da própria `montarMenuDeAbas`: "As três condições
      preservam, sem mudança de regra, o que o `page.tsx` fazia com `&&` inline:
      `analise-mvp` só no perpétuo, `meta-ads-teste` só em lançamento de
      captação paga, `cadeia-cac` só quando a família não é `null`". A frase
      continua **verdadeira sobre elegibilidade** — nada ali mudou —, mas é o
      único lugar do arquivo que descreve a árvore, e lê as duas primeiras
      condições em paralelo como se ambas ainda produzissem filhos de Meta Ads.
      É exatamente o leitor que a AC5 quer proteger.

      Não há README nem doc separado descrevendo a árvore (`grep` em `docs/`:
      só as stories 46.1 e 46.2, que são registro histórico e não se editam).
    suggestedFix: >
      Uma frase: "`analise-mvp` só no perpétuo — e desde a 46.2 ela compõe o
      grupo **Dados**, não o Meta Ads".

