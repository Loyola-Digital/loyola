  ambiente: 'banco com `default_transaction_read_only = on`; Google só leitura; loader e motor de 63c23f64; script scratchpad/qa4911/t0qa.mts'
  estado: 'debriefing_configs com 19 colunas (0162 não aplicada) e 0 linhas. 0162 livre na main e nas branches remotas (só esta branch a usa).'
  respondentes: 'Normalização própria do QA (trim + lowercase): principal 1.272, alunos 356, nas duas 23, união 1.605 = 1.272 + 356 − 23. Linhas lidas 1.669 − 0 vazias − 64 duplicadas = 1.605 (a conta fecha nos 3 cenários).'
  sem_marca: 'A97 B264 C463 D781; A+B 361/1.605 = 22,49%; 64 duplicadas, todas sem data; lacuna DESEMPATE_SEM_PESQUISA_DE_CAPTACAO presente'
  marca_principal: 'A96 B256 C464 D789; A+B 352/1.605 = 21,93%; 27 decididas pela marca; sem lacuna — bate com o relato e com o DATA-002 da 49.4'
  marca_alunos: 'Prova cruzada do QA: dá EXATAMENTE o "sem marca" (361/781), com dimensões e faixa idênticas e 23 decididas pela marca. Hoje a posição favorece a "Alunos" (ordem alfabética da aba), e a marca inverte isso só quando aponta a principal.'
  serie_real: 'n = 1 (PG04): faixa e renda são série; profissao e funcionarios dão AUSENTE_NO_LANCAMENTO_DE_COMPARACAO; payload legado ≡ lista de 1, sem `serieHistorica`. n = 2 [PG04, PG05]: renda é PRESENTE_EM_TODOS; faixa dá AUSENTE_EM_LANCAMENTO_DA_LISTA [PG05]; profissao e funcionarios dão AUSENTE [PG04]. n = 3 [PG04, PG05, PG03]: tudo COMPARACAO_SEM_PESQUISA com lancamentosSemPesquisa [PG03]. Composição com nome, posição e principal. O cross-launch é o da principal: igual ao de n = 1, e muda quando a lista é invertida.'

