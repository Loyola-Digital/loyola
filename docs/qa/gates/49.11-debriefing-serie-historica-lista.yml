auto_decisions_avaliadas:
  get_lista_gravada: 'ACEITA. O AC5(e) é explícito, e o formulário precisa do órfão para riscá-lo. Ressalva CONTRACT-001: o mesmo nome `lancamentosComparacao` quer dizer "gravada" no GET e "efetiva" no contrato do gerador.'
  composicao_so_com_2: 'ACEITA. É o único jeito de cumprir ao mesmo tempo o AC8(d) e o AC8(g) (n = 1 idêntico). Com 1 item, a 49.6 tira o nome do `crossLaunch.funnelIdAnterior` e da config.'
  campos_opcionais: 'ACEITA. Toda leitura passa por `comparacoesDe` e `comparacoesRemovidasDe` (fallback para a forma da 49.1). Carregador, PUT e `valoresDaLinha` sempre preenchem. O risco de um produtor novo esquecer o campo fica coberto pelo fallback, que tem o mesmo significado.'
  n1_com_2_contadores: 'ACEITA. O AC10 exige `duplicadasSemData`, e o teste retira só esses 2 campos antes do byte a byte.'
  marca_na_PesquisaInput: 'ACEITA. É equivalente à marca por linha, e o motor continua sem nome de aba.'
  mesmo_dia_e_empate: 'ACEITA. É o texto do AC10(d) ("empate ou sem data").'

nota_para_o_po:
  - 'No PG02, o `survey_type` SEPARA as duas pesquisas da Captação Paga: `Pesquisa-Captação` = paid, `Pesquisa-Captação - Alunos` = organic (conferido em produção). A premissa da decisão "survey_type não separa as duas" NÃO vale nesse caso. A decisão "por config, nunca por nome" continua de pé, porque `survey_type` diz o canal (pago/orgânico) e não o papel "captação". Registre a premissa corrigida no Change Log da story e na 49.6.'
  - 'Os dados reais do DG mostram que, com a lista [PG04, PG05, PG03], nenhuma dimensão vira série: o PG03 não tem pesquisa conectada e o PG05 não tem a faixa. É útil para o dono antes de montar a config do DG.'

