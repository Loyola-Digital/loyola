status_reason: 'O gate cobre os AC1–AC6, AC8 e AC10–AC12. O AC7 e o AC9 foram transferidos à 49.6. A migration 0162 é aditiva e foi provada em PGlite pelo QA: 19 → 21 colunas, reaplicada 21, rollback 19, reaplicada 21. A linha da 49.1 fica byte a byte igual e não há UPDATE nem DROP fora de comentário. As 20 mutações do QA morrem (20/20), entre elas as 6 pedidas. As suítes da story dão 252/252 (1 timeout de carga, que passa isolado). Na regressão da API, as falhas são as 12 pré-existentes em 5 arquivos, mais 4 timeouts de carga que passam isolados. `tsc` da API e do shared e `eslint` estão limpos. O T0 em produção (só leitura) foi reproduzido de forma independente: 1.272 + 356 − 23 = 1.605; com a marca simulada, A+B 352/1.605 = 21,93% e D 789; sem marca, 361 (22,49%) e 781. Com n = 1, o payload sai idêntico entre a entrada legada e a lista de 1, também com dados reais. Não resta medium nem high. CONDIÇÕES DE MERGE: (1) o @devops aplica a 0162 à mão em produção e cola a prova do information_schema (21 colunas); sem ela, o GET e o PUT da config dão 500. (2) A versão do contrato: quem mergear depois da 41.12A usa 32.'
