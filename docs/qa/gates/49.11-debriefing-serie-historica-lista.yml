  3_lint_typecheck: 'PASS. `tsc --noEmit` com o binário direto: api 0 erros, shared 0 erros. `eslint` nos 10 arquivos do diff da API: exit 0. O web não muda (só a constante do contrato) e o QA não refez o next build do web: vale o do @dev.'
  4_security_pii: 'PASS. Nenhum "@" nos 5 payloads do T0. As fixtures são sintéticas. A rota mantém o escopo de projeto/funil, e cada item da lista é conferido como funil DO MESMO projeto (sem IDOR entre projetos).'
  5_performance: 'PASS. Sem chamada à Meta. A principal não é relida: com n = 3, só 1 leitura nova de planilha (a do PG05; o PG03 não tem pesquisa). O nome do funil só é consultado com 2+ itens. O teto de 10 itens está no zod e no service.'
  6_regression: 'PASS. Com n = 1, as suítes da 49.1 e da 49.4 passam sem edição de asserção (só acréscimos, listados no Dev Agent Record). O golden do motor da main passa byte a byte, fora os 2 contadores do AC10. Em produção, PG02 × PG04 sai igual pela entrada legada e pela lista de 1. A 0162 não muda a premissa de nenhuma linha, e uma linha [X] lida depois da migração vale [X].'
  7_docs: 'PASS. O Dev Agent Record traz o T0, a prova da migration, as AUTO-DECISIONs, as 15 mutações do @dev, o File List e o Change Log. A 0162 tem o rollback e a prova no topo.'
  8_api_contract: 'PASS COM CONDIÇÃO. `API_CONTRACT_VERSION` vai de 30 a 31, com linha de histórico. A main segue em 30, e a 41.12A também sobe para 31. Quem mergear depois renumera para 32 e acrescenta a linha (CONTRACT-002). É aditivo: o PUT continua aceitando o campo antigo e o GET continua devolvendo `lancamentoComparacaoFunnelId`. Nenhum consumidor no web nem no mcp.'

