top_issues:
  - id: 'TEST-001'
    severity: medium
    status: 'aberto — recomendado antes do merge'
    finding: >-
      A unicidade do nome em `aplicarLeadsDaPlanilha` (o caminho do Desempenho de Criativos, que é a tela do
      chamado) não tem teste. Trocar `chaveDoNomeSeUnico(criativo.adName, nomesUnicos)` por
      `criativo.adName.trim().toLowerCase()` deixa todas as suítes verdes. O AC6 pede os casos-limite "web e API",
      mas o (j) da web só passa por `enrichWithPaidLeads`. No Desempenho, os grupos vêm da rota agrupados com
      `trim()` sem baixar a caixa. Dois criativos `AD01` e `ad01` fariam a linha `ad01` só com o nome contar nos
      dois, e o total da tabela ficaria inflado. O caso é raro (P-2: só 1 de 20 etapas tem nome no `content`),
      mas é exatamente a armadilha que o PO incluiu no AC1.
    recommendation: >-
      Teste de uma asserção em `leads-pelo-nome-do-anuncio-18102.test.ts`: `aplicarLeadsDaPlanilha` com
      `[daApi("AD01", ["1"]), daApi("ad01", ["2"])]` e uma linha `ad01` só com o nome deve dar `[0, 0]`. Se
      quiser, outro com a linha pelo ID `2` dando `[0, 1]`. Depois, repetir a M2: precisa cair.
  - id: 'REL-001'
    severity: low
    status: 'aberto (sem efeito hoje)'
    finding: >-
      `diag-leads-por-nome-18102.ts` faz `pool.query("SET default_transaction_read_only = on")`, mas o SET vale
      só para a conexão do pool que executou a consulta. As consultas seguintes (inclusive as do drizzle em
      `buscarPlanilhasDeLeads`) podem cair em outra conexão. O script só faz SELECT, então nada foi escrito.
      Mas a garantia de "somente leitura" anunciada no cabeçalho vem do código, não da sessão.
    recommendation: 'Passar a opção na criação do pool: `new Pool({ connectionString, options: "-c default_transaction_read_only=on" })`, e tirar o `SET`.'
  - id: 'OPS-001'
    severity: low
    status: 'pendente (operação, previsto na story)'
    finding: 'AC8: conferir na tela depois do deploy (Desempenho e Top Criativos do `bbe-m1-out26` batendo com a T0). A primeira abertura depois do deploy é mais lenta, porque o cache v8 começa vazio.'
    recommendation: '@dev ou o gestor registra os números da tela no Dev Agent Record depois do deploy.'
  - id: 'OPS-002'
    severity: low
    status: 'recomendação ao gestor'
    finding: 'Os anúncios do `bbe-m1-out26` continuam com `utm_content={{ad.name}}`. A 18.102 corrige a coluna Leads, mas temperatura, faturamento por e-mail do lead e a tabela de LPs continuam dependendo do ID (fora do escopo, item 4).'
    recommendation: 'Trocar para `utm_content={{ad.id}}` no Gerenciador. A P-1 (tabela de LPs) segue como story separada.'
  - id: 'TEST-API-INHERITED'
    severity: low
    status: 'herdado'
    finding: 'A rota é testada por leitura do fonte (padrão do repo, 18.89/18.100). A unicidade na rota está protegida por uma expressão específica do argumento (M6/M7 caem), não por execução da rota.'

