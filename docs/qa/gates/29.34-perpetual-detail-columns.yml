issues:
  - id: QA-03
    status: RESOLVIDO em 46dc774
    severity: high
    category: correctness
    description: >-
      TRUNCAMENTO SILENCIOSO. A rota /ad-creatives faz
      `adIds.split(",").filter(Boolean).slice(0, 50)` — descarta tudo além do
      50º ad_id, sem avisar o chamador. O frontend envia a lista inteira e não
      sabe que foi cortada.

      Consequência: num Detalhamento "Por Criativo" com mais de 50 linhas — comum
      numa conta ativa — os criativos além do 50º exibem "—" em Tipo e Link. O
      gestor lê isso como "a Meta não tem esse dado", quando o real é "pedimos
      só os 50 primeiros". Os ACs 5 e 6 passam na letra, porque ambos
      especificam "—" para dado ausente; o que eles não previram é que a ausência
      seria fabricada por nós.

      A limitação é PRÉ-EXISTENTE do endpoint (Story 8.1), não introduzida aqui.
      Mas a 29.34 é o primeiro consumidor que a expõe numa tabela de N linhas —
      antes disso o limite não incomodava ninguém.
    recommendation: >-
      Mínimo antes do merge: tornar o corte VISÍVEL. O backend devolve quantos
      recebeu e quantos processou; a tabela exibe algo como "Tipo/Link
      resolvidos para os 50 criativos de maior investimento". Como as linhas já
      são ordenáveis por investimento, cortar pelos 50 maiores é defensável — o
      que não é defensável é cortar sem dizer.

      Alternativa maior (fora desta story): paginar o lote em chunks de 50 no
      backend, respeitando o rate limit.
    blocking: false

  - id: QA-04
    status: RESOLVIDO em 46dc774
    severity: medium
    category: efficiency
    description: >-
      O frontend envia todos os ad_ids na query string, sem limite. Com 200
      criativos a URL passa de ~3.400 caracteres. O backend corta em 50 DEPOIS
      de receber, então o excedente trafega para ser descartado — e proxies com
      limite de 2.048 caracteres na URL podem truncar no meio de um id,
      produzindo um id inválido no fim da lista.
    recommendation: >-
      Limitar no frontend antes de montar a query, alinhado ao que o backend
      aceita. Resolve junto com QA-03 se o corte passar a ser explícito.
    blocking: false

  - id: QA-06
    status: ABERTO
    severity: low
    category: robustness
    description: >-
      Em `creativeAdIds`, o `.filter(Boolean)` roda DEPOIS do `.slice(0, 50)`.
      Se alguma das 50 linhas de maior investimento tiver `representativeAdId`
      vazio, ela é descartada e o lote sai com menos de 50 — capacidade
      desperdiçada, e um criativo que caberia fica sem Tipo/Link.
    recommendation: >-
      Filtrar antes de fatiar. Na prática `representativeAdId` vem de
      `topSpender.campaignId`, sempre preenchido em dados da Meta, então o caso
      é raro. Nit de robustez, não defeito observável hoje.
    blocking: false

  - id: QA-05
    severity: medium
    category: tests
    description: >-
      Segunda story consecutiva mexendo em margem e agrupamento sem teste
      executável. Especificamente sem cobertura: (a) `margin` e `marginPct`
      derivando da mesma variável; (b) `topSpender` escolhendo o maior
      investimento e não members[0]; (c) alinhamento header × switch de
      ordenação. Os três são verificáveis em teste puro, sem DOM.
    recommendation: >-
      Reforça QA-01 da 29.33. Ao instalar vitest na 29.35, cobrir estes três
      casos além do alinhamento de colunas.
    blocking: false

waived: []

notes: >-
  CONCERNS, não PASS, por QA-03: a feature entrega dado incompleto sem sinalizar,
  e o modo de falha é o pior tipo — silencioso e indistinguível de dado ausente
  legítimo.

  Não é FAIL porque nada quebra, a degradação é graciosa, o limite é herdado do
  endpoint e a correção mínima (tornar o corte visível) é pequena e não exige
  rediscutir a implementação. Mas deve entrar ANTES do merge: o custo de
  descobrir isso em produção é um gestor concluindo que metade dos criativos não
  tem link.

  Registro do que a implementação fez de melhor: expor `margin` em
  deriveDetailMetrics em vez de recalcular na tela. Isso torna a divergência
  entre Margem e Margem % estruturalmente impossível, em vez de depender de
  quem escreve a próxima tela lembrar da regra.

