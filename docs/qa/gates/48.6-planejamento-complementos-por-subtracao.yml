  - id: 'TEST-001'
    severity: medium
    status: resolved
    finding: 'O teste diferencial (AC2) afirma `investMetaFrio === 8 000` e `margemMetaFrio === 5 000` — os dois únicos complementos que fazem ruído com o apêndice A (0,4 / 0,8 / 0,75 / 0,25). Os outros cinco (`metaMargemOrganicos`, `investGoogle`, `investGoogleFrio`, `margemGoogleAds`, `margemGoogleFrio`) fecham por acaso com esses dados: revertidos um a um à fórmula `(1 − %) × total`, a suíte passa **23/23** em cada caso. E a asserção "as sete identidades `parte + complemento === total`" NÃO é diferencial — com a fórmula antiga, 5 das 7 identidades também fecham (o `a + (1 − p)·a` arredonda de volta para `a` na maioria dos casos). Um "simplify" que restaurasse a multiplicação em qualquer um dos cinco passaria pelo gate.'
    suggested_action: 'RESOLVIDO em d849179b: fixture `100 000 / 0,45 / 0,3 / 0,45 / 250 000 / 0,8` (achado por busca — o candidato do gate, `0,7/0,9/0,7/0,7`, ainda deixava `margemGoogleFrio` passar num revert isolado) + `complemento === total − parte` e o valor redondo por complemento. QA re-mutou os cinco que passavam: **2 falhas cada**; os sete de volta: 3 falhas.'
  - id: 'REQ-001'
    severity: low
    status: resolved
    finding: 'A AC2 promete "sete identidades exatas `parte + complemento === total`" como prova. A propriedade que a subtração garante é `complemento === total − parte`; a soma de volta ao total é consequência quase sempre verdadeira nos DOIS lados (velho e novo), então como prova ela é decorativa. Não é defeito de código — é a redação do AC apontando para a asserção errada.'
    suggested_action: 'RESOLVIDO em d849179b: AC2 reescrita — a prova é `complemento === total − parte`; a identidade fica como invariante declarada.'

