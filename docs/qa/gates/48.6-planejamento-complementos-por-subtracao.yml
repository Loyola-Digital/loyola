status_reason: 'Correção certa e mínima (sete linhas, diff conferido; suítes das 48.1–48.5 intactas), mas o teste protege só dois dos sete complementos: com o apêndice A, cinco deles "fecham por acaso" — o QA reverteu cada um dos cinco à fórmula antiga e a suíte passou 23/23 em todos. A própria validação do @po previu isso ("o ruído depende dos dados") e o teste não usou um dado que o produza. Fix: um segundo fixture em que os sete diferem e a asserção que distingue de verdade (`complemento === total − parte`, exata). Re-gate depois.'
